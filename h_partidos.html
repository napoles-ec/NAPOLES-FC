<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Nápoles F.C. · Partidos</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --gold: #EAB308;
      --bg-dark: #020617;
      --glass-bg: rgba(30, 41, 59, 0.45);
      --card-bg: rgba(15, 23, 42, 0.55);
    }

    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg-dark) 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0 0 90px 0;
      margin: 0;
    }
    .font-outfit { font-family: 'Outfit', sans-serif; }

    /* Skeleton */
    .skeleton-shimmer {
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Glass */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
    }

    /* Tarjeta de partido (para próximos) */
    .partido-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .partido-card:active { transform: scale(0.97); background: rgba(30,41,59,0.6); }

    /* Tarjeta para resultados (victoria/derrota) */
    .resultado-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .resultado-card:active { transform: scale(0.97); background: rgba(30,41,59,0.6); }

    .badge-estado {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .badge-proximo { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.25); }

    .btn-filtro {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(30,41,59,0.4);
      color: #94a3b8;
      transition: all 0.2s;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-filtro:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }
    .btn-filtro.activo {
      background: var(--gold);
      color: #020617;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(234,179,8,0.25);
    }

    /* Scroll horizontal */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .scroll-x { scrollbar-width: none; -ms-overflow-style: none; }

    /* Layout columnas */
    .col-victorias { border-right: 1px solid rgba(255,255,255,0.05); }

    /* badges de resultado */
    .badge-victoria { color: #34d399; font-weight: 800; }
    .badge-derrota { color: #f87171; font-weight: 800; }
    .badge-empate { color: #fbbf24; font-weight: 800; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(2,6,23,0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(6px + env(safe-area-inset-bottom,0px)) 0;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      transition: all 0.2s;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      gap: 2px;
    }
    .bottom-nav .nav-item .material-symbols-outlined { font-size: 1.4rem; }
    .bottom-nav .nav-item:active { transform: scale(0.92); }
    .bottom-nav .nav-item.active { color: var(--gold); }

    #toast {
      position: fixed;
      bottom: 85px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(234,179,8,0.3);
      border-radius: 9999px;
      padding: 10px 24px;
      color: #fef08a;
      font-weight: 600;
      font-size: 0.8rem;
      z-index: 2000;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .partido-card { padding: 10px 8px; }
      .resultado-card { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<!-- SKELETON -->
<div class="skeleton-wrapper p-4 pt-8" id="skeletonLoader">
  <div class="max-w-md mx-auto space-y-6">
    <div class="skeleton-shimmer h-8 w-1/2 rounded-lg"></div>
    <div class="skeleton-shimmer h-10 rounded-full w-full"></div>
    <div class="flex gap-3">
      <div class="skeleton-shimmer h-24 flex-1 rounded-2xl"></div>
      <div class="skeleton-shimmer h-24 flex-1 rounded-2xl"></div>
    </div>
    <div class="flex gap-3">
      <div class="skeleton-shimmer h-48 w-1/2 rounded-2xl"></div>
      <div class="skeleton-shimmer h-48 w-1/2 rounded-2xl"></div>
    </div>
  </div>
</div>

<!-- CONTENIDO -->
<div id="dynamicContent" style="display:none;"></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- NAV -->
<div class="bottom-nav">
  <a href="perfil.html" class="nav-item"><span class="material-symbols-outlined">account_circle</span><span>Perfil</span></a>
  <a href="alineacion.html" class="nav-item"><span class="material-symbols-outlined">group</span><span>Alineación</span></a>
  <a href="h_valores.html" class="nav-item"><span class="material-symbols-outlined">payments</span><span>Valores</span></a>
  <a href="h_partidos.html" class="nav-item active"><span class="material-symbols-outlined">sports_soccer</span><span>Partidos</span></a>
  <button class="nav-item" onclick="actualizar()"><span class="material-symbols-outlined">sync</span><span>Actualizar</span></button>
</div>

<script>
// ==================== CONFIG ====================
const URL_GAS = "https://script.google.com/macros/s/AKfycbz8Kw2wNXFNaO3YOyrNykzscm_3vDMK0sXz7kYPEUUf-I1L_Ikht8U5uzHXhgWcEYnv/exec";

// ==================== HELPERS ====================
function mostrarToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function formatearFecha(f) {
  if (!f) return '-';
  try { const d = new Date(f); if (isNaN(d.getTime())) return f; return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }); } catch(e){ return f; }
}

function formatearHora(h) {
  if (!h) return '--:--';
  let s = String(h).trim();
  if (s.includes(':')) { const p = s.split(':'); return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0'); }
  const n = parseInt(h);
  if (!isNaN(n)) return String(n).padStart(2,'0')+':00';
  return s.substring(0,5)||'--:--';
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseResultado(str) {
  if (!str || str === 'VS') return { home: null, away: null, valid: false };
  const clean = String(str).trim().replace(/\s/g,'');
  if (clean.includes('-')) {
    const parts = clean.split('-');
    if (parts.length === 2) {
      const h = parseInt(parts[0],10), a = parseInt(parts[1],10);
      if (!isNaN(h) && !isNaN(a)) return { home: h, away: a, valid: true };
    }
  }
  return { home: null, away: null, valid: false };
}

function determinarResultado(partido) {
  if (partido.estado !== 'FINALIZADO') return null;
  const p = parseResultado(partido.resultado);
  if (!p.valid) return null;
  if (p.home > p.away) return 'VICTORIA';
  if (p.home < p.away) return 'DERROTA';
  return 'EMPATE';
}

// ==================== CARGAR ====================
async function cargarPartidos() {
  try {
    const resp = await fetch(`${URL_GAS}?action=getPartidos&t=${Date.now()}`);
    const data = await resp.json();
    if (data.success && data.data) renderizarPartidos(data.data);
    else throw new Error(data.error || 'No se pudieron cargar');
  } catch(e) {
    console.error(e);
    mostrarToast('❌ Error al cargar');
    document.getElementById('skeletonLoader').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';
    document.getElementById('dynamicContent').innerHTML = `
      <div class="max-w-md mx-auto p-8 text-center text-red-400">
        <span class="material-symbols-outlined text-6xl opacity-60">error</span>
        <p class="mt-4 font-bold text-lg">${e.message}</p>
        <button onclick="cargarPartidos()" class="mt-6 bg-yellow-500 text-black px-6 py-2.5 rounded-xl font-bold text-xs uppercase">Reintentar</button>
      </div>
    `;
  }
}

// ==================== RENDER ====================
let todosLosPartidos = [];
let campeonatoActual = 'todos';
let campeonatosUnicos = [];

function renderizarPartidos(partidos) {
  todosLosPartidos = partidos;
  const camps = new Set();
  partidos.forEach(p => { const n = (p.campeonato || '').trim(); if (n) camps.add(n); });
  campeonatosUnicos = Array.from(camps).sort();
  if (campeonatosUnicos.length === 0) campeonatosUnicos.push('Sin campeonato');
  aplicarFiltro();
}

function aplicarFiltro() {
  const container = document.getElementById('dynamicContent');
  let filtrados = todosLosPartidos;

  if (campeonatoActual !== 'todos') {
    filtrados = filtrados.filter(p => (p.campeonato || '').trim().toUpperCase() === campeonatoActual.toUpperCase());
  }

  // Separar: PRÓXIMOS (estado = PRÓXIMO)
  const proximos = filtrados.filter(p => (p.estado || '').toUpperCase() === 'PRÓXIMO');
  const finalizados = filtrados.filter(p => (p.estado || '').toUpperCase() === 'FINALIZADO');

  // Clasificar finalizados: victorias, derrotas, empates
  const victorias = [];
  const derrotas = [];
  const empates = [];
  finalizados.forEach(p => {
    const outcome = determinarResultado(p);
    if (outcome === 'VICTORIA') victorias.push(p);
    else if (outcome === 'DERROTA') derrotas.push(p);
    else if (outcome === 'EMPATE') empates.push(p);
  });

  // Ordenar por fecha (más reciente primero)
  const ordenar = (arr) => arr.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  ordenar(proximos);
  ordenar(victorias);
  ordenar(derrotas);
  ordenar(empates);

  // ===== CONSTRUIR HTML =====
  let html = `
    <div class="max-w-md mx-auto p-4 pt-6">
      <header class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-2xl font-outfit font-black tracking-tight">Partidos</h1>
          <p class="text-xs text-yellow-500/90 font-semibold tracking-wider uppercase mt-0.5">${campeonatoActual === 'todos' ? 'Todos los torneos' : campeonatoActual}</p>
        </div>
        <button class="flex items-center gap-1.5 text-xs font-bold text-yellow-500 bg-yellow-500/10 border border-yellow-500/20 px-3 py-1.5 rounded-xl active:scale-95" onclick="window.location.href='perfil.html'">
          <span class="material-symbols-outlined text-sm">arrow_back</span> Volver
        </button>
      </header>

      <!-- FILTROS -->
      <div class="flex gap-2 mb-4 overflow-x-auto pb-2 -mx-4 px-4 scroll-x">
        <button class="btn-filtro ${campeonatoActual === 'todos' ? 'activo' : ''}" onclick="cambiarFiltro('todos')">📋 Todos</button>
        ${campeonatosUnicos.map(c => `
          <button class="btn-filtro ${campeonatoActual === c ? 'activo' : ''}" onclick="cambiarFiltro('${c}')">🏆 ${c}</button>
        `).join('')}
      </div>

      <!-- PRÓXIMOS (1x1 horizontal) -->
      <div class="mb-5">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-yellow-500 text-base">upcoming</span>
          <h3 class="text-xs font-black uppercase tracking-[0.2em] text-slate-300">Próximos</h3>
        </div>
        ${proximos.length === 0 ? `
          <div class="text-slate-500 text-xs text-center py-4 bg-slate-800/20 rounded-2xl border border-white/5">No hay partidos próximos</div>
        ` : `
          <div class="flex gap-3 overflow-x-auto pb-1 scroll-x">
            ${proximos.map(p => {
              const fecha = formatearFecha(p.fecha);
              const hora = formatearHora(p.hora);
              const rival = escapeHtml(p.rival || 'Sin rival');
              const lugar = escapeHtml(p.lugar || '');
              return `
                <div class="partido-card min-w-[140px] max-w-[180px] flex-shrink-0 border-l-4 border-yellow-500">
                  <div class="flex items-center justify-between gap-1">
                    <span class="badge-estado badge-proximo">🔥 Próximo</span>
                    <span class="text-[9px] text-slate-400 whitespace-nowrap">${fecha}</span>
                  </div>
                  <span class="text-sm font-bold text-white truncate">vs ${rival}</span>
                  <div class="flex items-center gap-2 text-[10px] text-slate-400">
                    <span class="flex items-center gap-0.5"><span class="material-symbols-outlined text-xs text-slate-500">schedule</span> ${hora}</span>
                    ${lugar ? `<span class="truncate">${lugar}</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>

      <!-- GANADOS vs DERROTAS (dos columnas) -->
      <div class="flex gap-3">
        <!-- Columna izquierda: VICTORIAS + EMPATES -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 mb-2">
            <span class="material-symbols-outlined text-emerald-400 text-sm">emoji_events</span>
            <h3 class="text-[10px] font-black uppercase tracking-[0.15em] text-emerald-400">Victorias</h3>
            <span class="text-[9px] text-emerald-400/60 font-bold ml-auto">${victorias.length}</span>
          </div>
          <div class="space-y-2">
            ${victorias.length === 0 ? `
              <div class="text-slate-500 text-[10px] text-center py-6 bg-slate-800/20 rounded-xl border border-white/5">Sin victorias</div>
            ` : victorias.map(p => {
              const fecha = formatearFecha(p.fecha);
              const rival = escapeHtml(p.rival || 'Sin rival');
              const parsed = parseResultado(p.resultado);
              return `
                <div class="resultado-card border-l-3 border-emerald-400/60">
                  <div>
                    <span class="text-xs font-bold text-white truncate block">vs ${rival}</span>
                    <span class="text-[9px] text-slate-400">${fecha}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-base font-black text-emerald-400">${parsed.home} - ${parsed.away}</span>
                    <div class="badge-victoria text-[8px] font-black uppercase tracking-wider">🏆 Victoria</div>
                  </div>
                </div>
              `;
            }).join('')}
            ${empates.length > 0 ? `
              <div class="mt-3 pt-2 border-t border-white/5">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="material-symbols-outlined text-amber-400 text-sm">handshake</span>
                  <h3 class="text-[10px] font-black uppercase tracking-[0.15em] text-amber-400">Empates</h3>
                  <span class="text-[9px] text-amber-400/60 font-bold ml-auto">${empates.length}</span>
                </div>
                ${empates.map(p => {
                  const fecha = formatearFecha(p.fecha);
                  const rival = escapeHtml(p.rival || 'Sin rival');
                  const parsed = parseResultado(p.resultado);
                  return `
                    <div class="resultado-card border-l-3 border-amber-400/60">
                      <div>
                        <span class="text-xs font-bold text-white truncate block">vs ${rival}</span>
                        <span class="text-[9px] text-slate-400">${fecha}</span>
                      </div>
                      <div class="text-right">
                        <span class="text-base font-black text-amber-400">${parsed.home} - ${parsed.away}</span>
                        <div class="badge-empate text-[8px] font-black uppercase tracking-wider">🤝 Empate</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Columna derecha: DERROTAS -->
        <div class="flex-1 min-w-0 col-derrotas">
          <div class="flex items-center gap-1.5 mb-2">
            <span class="material-symbols-outlined text-red-400 text-sm">sports_score</span>
            <h3 class="text-[10px] font-black uppercase tracking-[0.15em] text-red-400">Derrotas</h3>
            <span class="text-[9px] text-red-400/60 font-bold ml-auto">${derrotas.length}</span>
          </div>
          <div class="space-y-2">
            ${derrotas.length === 0 ? `
              <div class="text-slate-500 text-[10px] text-center py-6 bg-slate-800/20 rounded-xl border border-white/5">Sin derrotas</div>
            ` : derrotas.map(p => {
              const fecha = formatearFecha(p.fecha);
              const rival = escapeHtml(p.rival || 'Sin rival');
              const parsed = parseResultado(p.resultado);
              return `
                <div class="resultado-card border-l-3 border-red-400/60">
                  <div>
                    <span class="text-xs font-bold text-white truncate block">vs ${rival}</span>
                    <span class="text-[9px] text-slate-400">${fecha}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-base font-black text-red-400">${parsed.home} - ${parsed.away}</span>
                    <div class="badge-derrota text-[8px] font-black uppercase tracking-wider">❌ Derrota</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- Si no hay ningún partido -->
      ${proximos.length === 0 && victorias.length === 0 && derrotas.length === 0 && empates.length === 0 ? `
        <div class="glass-card p-10 text-center text-slate-500 mt-6">
          <span class="material-symbols-outlined text-5xl text-yellow-500/20">sports_soccer</span>
          <p class="mt-3 font-semibold text-sm">No hay partidos para este campeonato</p>
        </div>
      ` : ''}
    </div>
  `;

  container.innerHTML = html;
  document.getElementById('skeletonLoader').style.display = 'none';
  document.getElementById('dynamicContent').style.display = 'block';
}

// ==================== CAMBIAR FILTRO ====================
function cambiarFiltro(campeonato) {
  campeonatoActual = campeonato;
  aplicarFiltro();
}

// ==================== ACTUALIZAR ====================
async function actualizar() {
  const btn = document.querySelector('.bottom-nav .nav-item:last-child');
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-yellow-500">sync</span><span>Cargando</span>';
    btn.style.pointerEvents = 'none';
  }
  await cargarPartidos();
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined">sync</span><span>Actualizar</span>';
    btn.style.pointerEvents = 'auto';
  }
  mostrarToast('✅ Sincronizado');
}

// ==================== INICIO ====================
document.addEventListener('DOMContentLoaded', cargarPartidos);
</script>
</body>
</html>
