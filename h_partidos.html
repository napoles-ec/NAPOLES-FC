<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Nápoles F.C. · Partidos</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --gold: #EAB308;
      --gold-dim: rgba(234, 179, 8, 0.15);
      --bg-dark: #020617;
      --glass-bg: rgba(30, 41, 59, 0.45);
      --glass-border: rgba(255, 255, 255, 0.06);
      --card-bg: rgba(15, 23, 42, 0.55);
    }

    * { box-sizing: border-box; }
    
    body {
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg-dark) 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 90px;
      margin: 0;
    }
    
    .font-outfit { font-family: 'Outfit', sans-serif; }

    /* Skeleton */
    .skeleton-shimmer {
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Glass */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
    }

    /* Tarjeta de partido */
    .partido-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .partido-card:active { transform: scale(0.98); background: rgba(30, 41, 59, 0.6); }

    .border-victoria { border-left: 5px solid #10b981; }
    .border-derrota { border-left: 5px solid #ef4444; }
    .border-empate { border-left: 5px solid #f59e0b; }
    .border-proximo { border-left: 5px solid var(--gold); background: linear-gradient(90deg, rgba(234,179,8,0.04) 0%, var(--card-bg) 100%); }
    .border-pendiente { border-left: 5px solid #64748b; }

    /* Badges */
    .badge-estado {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 10px;
      border-radius: 9999px;
    }
    .badge-finalizado { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
    .badge-proximo { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.25); }
    .badge-pendiente { background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }

    /* Botones de filtro */
    .btn-filtro {
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(30, 41, 59, 0.4);
      color: #94a3b8;
      transition: all 0.2s;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-filtro:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }
    .btn-filtro.activo {
      background: var(--gold);
      color: #020617;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
    }

    /* Estadísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-item {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .stat-item .numero {
      font-size: 1.5rem;
      font-weight: 900;
      font-family: 'Outfit', sans-serif;
      line-height: 1.2;
      color: #fff;
    }
    .stat-item .etiqueta {
      font-size: 0.5rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-top: 2px;
    }
    .stat-item .etiqueta.gold { color: var(--gold); }
    .stat-item .etiqueta.green { color: #34d399; }
    .stat-item .etiqueta.red { color: #f87171; }
    .stat-item .etiqueta.blue { color: #60a5fa; }

    /* Navegación inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(6px + env(safe-area-inset-bottom, 0px)) 0;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      transition: all 0.2s;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      gap: 2px;
    }
    .bottom-nav .nav-item .material-symbols-outlined { font-size: 1.4rem; }
    .bottom-nav .nav-item:active { transform: scale(0.92); }
    .bottom-nav .nav-item.active { color: var(--gold); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 85px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 9999px;
      padding: 10px 24px;
      color: #fef08a;
      font-weight: 600;
      font-size: 0.8rem;
      z-index: 2000;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Scroll suave */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat-item .numero { font-size: 1.2rem; }
      .stat-item { padding: 6px 2px; }
    }
  </style>
</head>
<body>

<div class="skeleton-wrapper p-4 pt-8" id="skeletonLoader">
  <div class="max-w-md mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <div class="skeleton-shimmer h-8 w-1/2 rounded-lg"></div>
      <div class="skeleton-shimmer h-8 w-16 rounded-full"></div>
    </div>
    <div class="skeleton-shimmer h-10 rounded-full w-full"></div>
    <div class="skeleton-shimmer h-24 rounded-2xl"></div>
    <div class="space-y-4">
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
    </div>
  </div>
</div>

<div id="dynamicContent" style="display:none;"></div>

<div id="toast"></div>

<div class="bottom-nav">
  <a href="perfil.html" class="nav-item" title="Perfil">
    <span class="material-symbols-outlined">account_circle</span>
    <span>Perfil</span>
  </a>
  <a href="alineacion.html" class="nav-item" title="Alineación">
    <span class="material-symbols-outlined">group</span>
    <span>Alineación</span>
  </a>
  <a href="h_valores.html" class="nav-item" title="Historial Valores">
    <span class="material-symbols-outlined">payments</span>
    <span>Valores</span>
  </a>
  <a href="h_partidos.html" class="nav-item active" title="Partidos">
    <span class="material-symbols-outlined">sports_soccer</span>
    <span>Partidos</span>
  </a>
  <button class="nav-item" onclick="actualizar()" title="Actualizar">
    <span class="material-symbols-outlined">sync</span>
    <span>Actualizar</span>
  </button>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
const URL_GAS = "https://script.google.com/macros/s/AKfycbz8Kw2wNXFNaO3YOyrNykzscm_3vDMK0sXz7kYPEUUf-I1L_Ikht8U5uzHXhgWcEYnv/exec";

// ==================== FUNCIONES AUXILIARES ====================
function mostrarToast(mensaje) {
  const toast = document.getElementById('toast');
  toast.textContent = mensaje;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2200);
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '-';
  try {
    const d = new Date(fechaStr);
    if (isNaN(d.getTime())) return fechaStr;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch(e) { return fechaStr; }
}

function formatearHora(hora) {
  if (!hora) return '--:--';
  let h = String(hora).trim();
  if (h.indexOf(':') !== -1) {
    const p = h.split(':');
    return p[0].padStart(2,'0') + ':' + p[1].padStart(2,'0');
  }
  const num = parseInt(h);
  if (!isNaN(num)) return String(num).padStart(2,'0') + ':00';
  return h.substring(0,5) || '--:--';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseResultado(str) {
  if (!str || str === 'VS') return { home: null, away: null, valid: false };
  const clean = String(str).trim().replace(/\s/g, '');
  if (clean.includes('-')) {
    const parts = clean.split('-');
    if (parts.length === 2) {
      const h = parseInt(parts[0], 10);
      const a = parseInt(parts[1], 10);
      if (!isNaN(h) && !isNaN(a)) return { home: h, away: a, valid: true };
    }
  }
  return { home: null, away: null, valid: false };
}

function determinarResultado(partido) {
  if (partido.estado !== 'FINALIZADO') return null;
  const p = parseResultado(partido.resultado);
  if (!p.valid) return null;
  if (p.home > p.away) return 'VICTORIA';
  if (p.home < p.away) return 'DERROTA';
  return 'EMPATE';
}

// ==================== CARGAR PARTIDOS ====================
async function cargarPartidos() {
  try {
    const url = `${URL_GAS}?action=getPartidos&t=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.success && data.data) {
      renderizarPartidos(data.data);
    } else {
      throw new Error(data.error || 'No se pudieron cargar los partidos');
    }
  } catch(e) {
    console.error(e);
    mostrarToast('❌ Error al cargar datos');
    document.getElementById('skeletonLoader').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';
    document.getElementById('dynamicContent').innerHTML = `
      <div class="max-w-md mx-auto p-8 text-center text-red-400">
        <span class="material-symbols-outlined text-6xl opacity-60">error</span>
        <p class="mt-4 font-bold text-lg">${e.message}</p>
        <button onclick="cargarPartidos()" class="mt-6 bg-yellow-500 text-black px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition active:scale-95">Reintentar</button>
      </div>
    `;
  }
}

// ==================== RENDERIZAR PARTIDOS ====================
let todosLosPartidos = [];
let campeonatoActual = 'todos';
let campeonatosUnicos = [];

function renderizarPartidos(partidos) {
  todosLosPartidos = partidos;
  // Extraer campeonatos únicos (limpiando espacios y mayúsculas)
  const camps = new Set();
  partidos.forEach(p => {
    const nombre = (p.campeonato || '').trim();
    if (nombre) camps.add(nombre);
  });
  campeonatosUnicos = Array.from(camps).sort();
  // Si no hay campeonatos, agregar uno por defecto
  if (campeonatosUnicos.length === 0) campeonatosUnicos.push('Sin campeonato');
  
  aplicarFiltro();
}

function aplicarFiltro() {
  const container = document.getElementById('dynamicContent');
  let filtrados = todosLosPartidos;

  if (campeonatoActual !== 'todos') {
    // Comparación insensible a mayúsculas/minúsculas y espacios
    filtrados = filtrados.filter(p => {
      const camp = (p.campeonato || '').trim().toUpperCase();
      return camp === campeonatoActual.toUpperCase();
    });
  }

  filtrados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  // ===== CALCULAR ESTADÍSTICAS =====
  const total = filtrados.length;
  let victorias = 0, derrotas = 0, empates = 0;
  let golesFavor = 0, golesContra = 0;

  filtrados.forEach(p => {
    if (p.estado === 'FINALIZADO') {
      const parsed = parseResultado(p.resultado);
      if (parsed.valid) {
        golesFavor += parsed.home;
        golesContra += parsed.away;
        const outcome = determinarResultado(p);
        if (outcome === 'VICTORIA') victorias++;
        else if (outcome === 'DERROTA') derrotas++;
        else if (outcome === 'EMPATE') empates++;
      }
    }
  });
  const diferencia = golesFavor - golesContra;

  // ===== CONSTRUIR HTML =====
  let html = `
    <div class="max-w-md mx-auto p-4 pt-6">
      <header class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-2xl font-outfit font-black tracking-tight">Partidos</h1>
          <p class="text-xs text-yellow-500/90 font-semibold tracking-wider uppercase mt-0.5">${campeonatoActual === 'todos' ? 'Todos los torneos' : campeonatoActual}</p>
        </div>
        <button class="flex items-center gap-1.5 text-xs font-bold text-yellow-500 bg-yellow-500/10 border border-yellow-500/20 px-3 py-1.5 rounded-xl active:scale-95 transition" onclick="window.location.href='perfil.html'">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          Volver
        </button>
      </header>

      <!-- FILTROS DINÁMICOS -->
      <div class="flex gap-2 mb-5 overflow-x-auto pb-2 -mx-4 px-4 scrollbar-none">
        <button class="btn-filtro ${campeonatoActual === 'todos' ? 'activo' : ''}" onclick="cambiarFiltro('todos')">📋 Todos</button>
        ${campeonatosUnicos.map(c => `
          <button class="btn-filtro ${campeonatoActual === c ? 'activo' : ''}" onclick="cambiarFiltro('${c}')">🏆 ${c}</button>
        `).join('')}
      </div>

      <!-- ESTADÍSTICAS -->
      <div class="glass-card p-4 mb-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-yellow-500 text-base">insights</span>
          <h3 class="text-xs font-black uppercase tracking-[0.2em] text-slate-300">Estadísticas del equipo</h3>
        </div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="numero">${total}</div>
            <div class="etiqueta">Partidos</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#34d399;">${victorias}</div>
            <div class="etiqueta green">Victorias</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#f87171;">${derrotas}</div>
            <div class="etiqueta red">Derrotas</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#fbbf24;">${empates}</div>
            <div class="etiqueta" style="color:#fbbf24;">Empates</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#60a5fa;">${golesFavor}</div>
            <div class="etiqueta blue">Goles a favor</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#f87171;">${golesContra}</div>
            <div class="etiqueta red">Goles en contra</div>
          </div>
        </div>
        <div class="flex justify-between items-center mt-3 pt-2 border-t border-white/5">
          <span class="text-[9px] font-bold uppercase text-slate-500 tracking-wider">Diferencia de goles</span>
          <span class="text-lg font-black font-outfit ${diferencia >= 0 ? 'text-emerald-400' : 'text-red-400'}">${diferencia >= 0 ? '+' : ''}${diferencia}</span>
        </div>
      </div>

      <!-- LISTA DE PARTIDOS -->
      <div class="space-y-3.5">
  `;

  if (filtrados.length === 0) {
    html += `
        <div class="glass-card p-10 text-center text-slate-500">
          <span class="material-symbols-outlined text-5xl text-yellow-500/20">sports_soccer</span>
          <p class="mt-3 font-semibold text-sm">No hay registros para este campeonato</p>
        </div>
    `;
  } else {
    filtrados.forEach(p => {
      const fecha = formatearFecha(p.fecha);
      const hora = formatearHora(p.hora);
      const rival = escapeHtml(p.rival || 'Sin rival');
      const lugar = escapeHtml(p.lugar || 'LIGA SANTA RITA');
      const estado = (p.estado || 'PENDIENTE').toUpperCase();
      const resultado = p.resultado || 'VS';
      const campeonato = escapeHtml(p.campeonato || 'Sin campeonato');

      let badgeEstado = '';
      let borderClase = 'border-pendiente';
      
      if (estado === 'FINALIZADO') {
        badgeEstado = `<span class="badge-estado badge-finalizado">✅ Fin</span>`;
      } else if (estado === 'PRÓXIMO') {
        badgeEstado = `<span class="badge-estado badge-proximo">🔥 Próximo</span>`;
        borderClase = 'border-proximo';
      } else {
        badgeEstado = `<span class="badge-estado badge-pendiente">⏳ Pendiente</span>`;
      }

      let resultadoHTML = '';
      const outcome = determinarResultado(p);
      const parsed = parseResultado(resultado);

      if (estado === 'FINALIZADO' && parsed.valid) {
        let claseTexto = '';
        let etiquetaResultado = '';
        
        if (outcome === 'VICTORIA') {
          claseTexto = 'text-emerald-400';
          borderClase = 'border-victoria';
          etiquetaResultado = 'VICTORIA';
        } else if (outcome === 'DERROTA') {
          claseTexto = 'text-red-400';
          borderClase = 'border-derrota';
          etiquetaResultado = 'DERROTA';
        } else if (outcome === 'EMPATE') {
          claseTexto = 'text-amber-400';
          borderClase = 'border-empate';
          etiquetaResultado = 'EMPATE';
        }
        
        resultadoHTML = `
          <div class="text-right">
            <span class="text-2xl font-black font-outfit tracking-tight ${claseTexto}">${parsed.home} - ${parsed.away}</span>
            <p class="text-[9px] font-extrabold tracking-wide ${claseTexto} opacity-90 mt-0.5">${etiquetaResultado}</p>
          </div>
        `;
      } else {
        resultadoHTML = `
          <div class="bg-slate-800/60 px-3 py-1 rounded-xl border border-slate-700/50">
            <span class="text-slate-400 text-xs font-black tracking-widest">${resultado}</span>
          </div>
        `;
      }

      html += `
        <div class="partido-card ${borderClase}">
          <div class="flex items-start justify-between gap-2">
            <div class="space-y-1.5 flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                ${badgeEstado}
                <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider truncate max-w-[140px]">${campeonato}</span>
              </div>
              <h3 class="text-base font-bold text-white truncate">vs ${rival}</h3>
              <div class="flex items-center gap-3 text-[11px] text-slate-400 font-medium">
                <span class="flex items-center gap-0.5"><span class="material-symbols-outlined text-xs text-slate-500">schedule</span> ${hora}</span>
                <span class="flex items-center gap-0.5 truncate"><span class="material-symbols-outlined text-xs text-slate-500">location_on</span> ${lugar}</span>
              </div>
            </div>
            <div class="flex flex-col items-end justify-between h-full space-y-2 min-w-[70px]">
              <span class="text-[10px] font-semibold text-slate-400/90 whitespace-nowrap">${fecha}</span>
              ${resultadoHTML}
            </div>
          </div>
        </div>
      `;
    });
  }

  html += `
      </div>
    </div>
  `;

  container.innerHTML = html;
  document.getElementById('skeletonLoader').style.display = 'none';
  document.getElementById('dynamicContent').style.display = 'block';
}

// ==================== CAMBIAR FILTRO ====================
function cambiarFiltro(campeonato) {
  campeonatoActual = campeonato;
  aplicarFiltro();
}

// ==================== ACTUALIZAR ====================
async function actualizar() {
  const btn = document.querySelector('.bottom-nav .nav-item:last-child');
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-yellow-500">sync</span><span>Cargando</span>';
    btn.style.pointerEvents = 'none';
  }
  await cargarPartidos();
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined">sync</span><span>Actualizar</span>';
    btn.style.pointerEvents = 'auto';
  }
  mostrarToast('✅ Sincronizado correctamente');
}

// ==================== INICIALIZACIÓN ====================
document.addEventListener('DOMContentLoaded', () => {
  cargarPartidos();
});
</script>

</body>
</html>
