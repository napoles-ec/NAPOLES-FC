<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Nápoles F.C. · Partidos</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --gold: #eab308;
      --gold-soft: #fde68a;
      --gold-dim: rgba(234, 179, 8, 0.15);
      --bg-dark: #020617;
      --glass-bg: rgba(30, 41, 59, 0.42);
      --glass-border: rgba(255, 255, 255, 0.06);
      --card-bg: rgba(15, 23, 42, 0.55);
      --win: #34d399;
      --loss: #f87171;
      --draw: #fbbf24;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(234, 179, 8, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 100% 20%, rgba(96, 165, 250, 0.06) 0%, transparent 45%),
        radial-gradient(circle at top, #0f172a 0%, var(--bg-dark) 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 90px;
      margin: 0;
    }

    .font-outfit { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Skeleton */
    .skeleton-shimmer {
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Glass */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
    }

    .section-eyebrow {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ----- TARJETA PRÓXIMO PARTIDO CON NEON GIRATORIO ----- */
    .neon-card {
      position: relative;
      background:
        radial-gradient(circle at 80% -10%, rgba(234,179,8,0.12) 0%, transparent 55%),
        var(--card-bg);
      border-radius: 24px;
      padding: 22px 16px;
      border: 2px solid transparent;
      overflow: hidden;
    }
    .neon-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 24px;
      padding: 2px;
      background: conic-gradient(from 0deg, #facc15, #eab308, #ca8a04, #facc15, #eab308, #ca8a04, #facc15);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: girarNeon 4s linear infinite;
      pointer-events: none;
    }
    @keyframes girarNeon {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .neon-card .neon-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .neon-card .neon-badge {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    .neon-card .rival {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .neon-card .fecha-hora {
      font-size: 0.7rem;
      color: #94a3b8;
      display: flex;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .neon-card .lugar {
      font-size: 0.65rem;
      color: #64748b;
    }

    /* Tarjeta de partido normal (para ganados/perdidos) */
    .partido-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .partido-card:active { transform: scale(0.98); background: rgba(30, 41, 59, 0.6); }
    .partido-card.pc-win { border-left-color: var(--win); }
    .partido-card.pc-loss { border-left-color: var(--loss); }

    .partido-card .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .partido-card .info .rival {
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .partido-card .info .fecha {
      font-size: 0.6rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .partido-card .marcador {
      font-weight: 800;
      font-size: 1.2rem;
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
    }
    .marcador-victoria { color: var(--win); }
    .marcador-derrota { color: var(--loss); }
    .marcador-empate { color: var(--draw); }

    /* Badge de empate (dentro de columna de ganados) */
    .badge-empate {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      font-size: 0.5rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(251, 191, 36, 0.2);
      margin-left: 4px;
    }

    /* Columnas */
    .columna-partidos {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .columna-partidos .titulo-columna {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-bottom: 4px;
      border-bottom: 2px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .titulo-ganados { color: var(--win); border-bottom-color: rgba(52, 211, 153, 0.2); }
    .titulo-perdidos { color: var(--loss); border-bottom-color: rgba(248, 113, 113, 0.2); }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .stat-item {
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 7px 2px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .stat-item .numero {
      font-size: 1.3rem;
      font-weight: 900;
      font-family: 'Outfit', sans-serif;
      line-height: 1.1;
      color: #fff;
    }
    .stat-item .etiqueta {
      font-size: 0.45rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-top: 1px;
    }

    /* ----- EVOLUCIÓN / ESTADÍSTICAS ----- */
    .evo-card { padding: 16px; }
    .forma-row { display: flex; gap: 6px; align-items: center; }
    .forma-chip {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      font-weight: 800;
      color: #020617;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .forma-chip.fc-win { background: var(--win); }
    .forma-chip.fc-loss { background: var(--loss); }
    .forma-chip.fc-draw { background: var(--draw); }
    .forma-chip.fc-latest { box-shadow: 0 0 0 2px var(--gold-soft), 0 2px 8px rgba(234,179,8,0.5); }

    .evo-chart-wrap { position: relative; margin-top: 14px; }
    .evo-chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
    .evo-pt {
      transition: r 0.15s ease;
    }
    .evo-legend {
      display: flex; align-items: center; gap: 14px;
      font-size: 0.58rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #94a3b8; margin-top: 10px;
    }
    .evo-legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }

    .racha-summary {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    /* Filtros */
    .btn-filtro {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(30, 41, 59, 0.4);
      color: #94a3b8;
      transition: all 0.2s;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-filtro:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }
    .btn-filtro.activo {
      background: var(--gold);
      color: #020617;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
    }

    /* Navegación inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 calc(6px + env(safe-area-inset-bottom, 0px)) 0;
      z-index: 100;
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      transition: all 0.2s;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      gap: 2px;
    }
    .bottom-nav .nav-item .material-symbols-outlined { font-size: 1.4rem; }
    .bottom-nav .nav-item:active { transform: scale(0.92); }
    .bottom-nav .nav-item.active { color: var(--gold); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 85px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 9999px;
      padding: 10px 24px;
      color: #fef08a;
      font-weight: 600;
      font-size: 0.8rem;
      z-index: 2000;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: rise-in 0.45s cubic-bezier(0.16,1,0.3,1) both; }

    @media (prefers-reduced-motion: reduce) {
      .neon-card::before, .rise-in { animation: none !important; }
      * { transition-duration: 0.01ms !important; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .stat-item .numero { font-size: 1.1rem; }
      .stat-item { padding: 4px 2px; }
      .neon-card .rival { font-size: 1.1rem; }
      .partido-card .marcador { font-size: 1rem; }
      .columna-partidos .titulo-columna { font-size: 0.55rem; }
    }
  </style>
</head>
<body>

<div class="skeleton-wrapper p-4 pt-8" id="skeletonLoader">
  <div class="max-w-md mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <div class="skeleton-shimmer h-8 w-1/2 rounded-lg"></div>
      <div class="skeleton-shimmer h-8 w-16 rounded-full"></div>
    </div>
    <div class="skeleton-shimmer h-10 rounded-full w-full"></div>
    <div class="skeleton-shimmer h-20 rounded-2xl"></div>
    <div class="skeleton-shimmer h-16 rounded-2xl"></div>
    <div class="skeleton-shimmer h-32 rounded-2xl"></div>
    <div class="grid grid-cols-2 gap-4">
      <div class="skeleton-shimmer h-40 rounded-2xl"></div>
      <div class="skeleton-shimmer h-40 rounded-2xl"></div>
    </div>
  </div>
</div>

<div id="dynamicContent" style="display:none;"></div>

<div id="toast"></div>

<div class="bottom-nav">
  <a href="perfil.html" class="nav-item" title="Perfil">
    <span class="material-symbols-outlined">account_circle</span>

  </a>
  <a href="alineacion.html" class="nav-item" title="Alineación">
    <span class="material-symbols-outlined">group</span>

  <a href="h_valores.html" class="nav-item" title="Historial Valores">
    <span class="material-symbols-outlined">payments</span>
    <span>Valores</span>

  <a href="h_partidos.html" class="nav-item active" title="Partidos">
    <span class="material-symbols-outlined">sports_soccer</span>

  <button class="nav-item" onclick="actualizar()" title="Actualizar">
    <span class="material-symbols-outlined">sync</span>

<script>
// ==================== CONFIGURACIÓN ====================
// ⚠️ REEMPLAZA ESTA URL POR LA DE TU SCRIPT DE GAS ⚠️
const URL_GAS = "https://script.google.com/macros/s/AKfycbz8Kw2wNXFNaO3YOyrNykzscm_3vDMK0sXz7kYPEUUf-I1L_Ikht8U5uzHXhgWcEYnv/exec";

// ==================== FUNCIONES AUXILIARES ====================
function mostrarToast(mensaje) {
  const toast = document.getElementById('toast');
  toast.textContent = mensaje;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2200);
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '-';
  try {
    const d = new Date(fechaStr);
    if (isNaN(d.getTime())) return fechaStr;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch(e) { return fechaStr; }
}

function formatearFechaCorta(fechaStr) {
  if (!fechaStr) return '-';
  try {
    const d = new Date(fechaStr);
    if (isNaN(d.getTime())) return fechaStr;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
  } catch(e) { return fechaStr; }
}

function formatearHora(hora) {
  if (!hora) return '--:--';
  let h = String(hora).trim();
  if (h.indexOf(':') !== -1) {
    const p = h.split(':');
    return p[0].padStart(2,'0') + ':' + p[1].padStart(2,'0');
  }
  const num = parseInt(h);
  if (!isNaN(num)) return String(num).padStart(2,'0') + ':00';
  return h.substring(0,5) || '--:--';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseResultado(str) {
  if (!str || str === 'VS') return { home: null, away: null, valid: false };
  const clean = String(str).trim().replace(/\s/g, '');
  if (clean.includes('-')) {
    const parts = clean.split('-');
    if (parts.length === 2) {
      const h = parseInt(parts[0], 10);
      const a = parseInt(parts[1], 10);
      if (!isNaN(h) && !isNaN(a)) return { home: h, away: a, valid: true };
    }
  }
  return { home: null, away: null, valid: false };
}

function determinarResultado(partido) {
  if (partido.estado !== 'FINALIZADO') return null;
  const p = parseResultado(partido.resultado);
  if (!p.valid) return null;
  if (p.home > p.away) return 'VICTORIA';
  if (p.home < p.away) return 'DERROTA';
  return 'EMPATE';
}

// ==================== CARGAR PARTIDOS ====================
async function cargarPartidos() {
  try {
    const url = `${URL_GAS}?action=getPartidos&t=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.success && data.data) {
      renderizarPartidos(data.data);
    } else {
      throw new Error(data.error || 'No se pudieron cargar los partidos');
    }
  } catch(e) {
    console.error(e);
    mostrarToast('❌ Error al cargar datos');
    document.getElementById('skeletonLoader').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';
    document.getElementById('dynamicContent').innerHTML = `
      <div class="max-w-md mx-auto p-8 text-center text-red-400">
        <span class="material-symbols-outlined text-6xl opacity-60">error</span>
        <p class="mt-4 font-bold text-lg">${e.message}</p>
        <button onclick="cargarPartidos()" class="mt-6 bg-yellow-500 text-black px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition active:scale-95">Reintentar</button>
      </div>
    `;
  }
}

// ==================== RENDERIZAR (con 1x1, ganados/perdidos) ====================
let todosLosPartidos = [];
let campeonatoActual = 'todos';
let campeonatosUnicos = [];

function renderizarPartidos(partidos) {
  todosLosPartidos = partidos;
  const camps = new Set();
  partidos.forEach(p => {
    const nombre = (p.campeonato || '').trim();
    if (nombre) camps.add(nombre);
  });
  campeonatosUnicos = Array.from(camps).sort();
  if (campeonatosUnicos.length === 0) campeonatosUnicos.push('Sin campeonato');
  aplicarFiltro();
}

// ==================== GRÁFICO DE EVOLUCIÓN (SVG, datos reales) ====================
function construirEvolucionHtml(finalizadosCronologico) {
  if (finalizadosCronologico.length === 0) {
    return `
      <div class="glass-card evo-card mb-5">
        <div class="section-eyebrow"><span class="material-symbols-outlined text-sm">monitoring</span>Evolución del equipo</div>
        <p class="text-xs text-slate-500 text-center py-6">Aún no hay partidos finalizados para mostrar la evolución.</p>
      </div>
    `;
  }

  // ---- Racha reciente (últimos 6, orden cronológico, más reciente a la derecha) ----
  const ultimos = finalizadosCronologico.slice(-6);
  const formaHtml = ultimos.map((item, i) => {
    const esUltimo = i === ultimos.length - 1;
    const cls = item.resultado === 'VICTORIA' ? 'fc-win' : item.resultado === 'DERROTA' ? 'fc-loss' : 'fc-draw';
    const letra = item.resultado === 'VICTORIA' ? 'V' : item.resultado === 'DERROTA' ? 'D' : 'E';
    return `<span class="forma-chip ${cls} ${esUltimo ? 'fc-latest' : ''}" title="${escapeHtml(item.rival || '')} · ${formatearFechaCorta(item.fecha)}">${letra}</span>`;
  }).join('<span style="width:2px;"></span>');

  const victoriasRecientes = ultimos.filter(i => i.resultado === 'VICTORIA').length;
  const puntosRecientes = ultimos.reduce((acc, i) => acc + (i.resultado === 'VICTORIA' ? 3 : i.resultado === 'EMPATE' ? 1 : 0), 0);

  // ---- Serie acumulada de puntos ----
  let acumPuntos = 0;
  const serie = finalizadosCronologico.map(item => {
    acumPuntos += item.resultado === 'VICTORIA' ? 3 : item.resultado === 'EMPATE' ? 1 : 0;
    return acumPuntos;
  });
  const maxPts = Math.max(...serie, 1);
  const n = serie.length;

  const W = 300, H = 92, PAD = 6;
  const coordX = i => n === 1 ? W / 2 : PAD + (i / (n - 1)) * (W - PAD * 2);
  const coordY = v => H - PAD - (v / maxPts) * (H - PAD * 2 - 8);

  const puntos = serie.map((v, i) => `${coordX(i)},${coordY(v)}`).join(' ');
  const areaPath = `M${PAD},${H} L${puntos.split(' ').map(p => p).join(' L')} L${coordX(n-1)},${H} Z`;

  const dots = serie.map((v, i) => {
    const item = finalizadosCronologico[i];
    const color = item.resultado === 'VICTORIA' ? 'var(--win)' : item.resultado === 'DERROTA' ? 'var(--loss)' : 'var(--draw)';
    return `<circle class="evo-pt" cx="${coordX(i)}" cy="${coordY(v)}" r="${i === n - 1 ? 4 : 2.5}" fill="${color}" stroke="#020617" stroke-width="1.5"><title>${escapeHtml(item.rival || '')} · ${formatearFechaCorta(item.fecha)}</title></circle>`;
  }).join('');

  return `
    <div class="glass-card evo-card mb-5 rise-in">
      <div class="flex items-center justify-between">
        <div class="section-eyebrow"><span class="material-symbols-outlined text-sm">monitoring</span>Evolución del equipo</div>
        <span class="racha-summary">últimos ${ultimos.length}: ${victoriasRecientes}V · +${puntosRecientes}pts</span>
      </div>

      <div class="forma-row mt-3">${formaHtml}</div>

      <div class="evo-chart-wrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="evoFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${areaPath}" fill="url(#evoFill)" />
          <polyline points="${puntos}" fill="none" stroke="#eab308" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          ${dots}
        </svg>
      </div>

      <div class="evo-legend">
        <span><span class="dot" style="background:var(--win);"></span>Victoria</span>
        <span><span class="dot" style="background:var(--draw);"></span>Empate</span>
        <span><span class="dot" style="background:var(--loss);"></span>Derrota</span>
        <span class="ml-auto font-mono">pts. acumulados</span>
      </div>
    </div>
  `;
}

function aplicarFiltro() {
  const container = document.getElementById('dynamicContent');
  let filtrados = todosLosPartidos;

  if (campeonatoActual !== 'todos') {
    filtrados = filtrados.filter(p => {
      const camp = (p.campeonato || '').trim().toUpperCase();
      return camp === campeonatoActual.toUpperCase();
    });
  }

  // Separar: próximo (estado PRÓXIMO) y finalizados
  const proximo = filtrados.find(p => (p.estado || '').toUpperCase() === 'PRÓXIMO');
  const finalizados = filtrados.filter(p => (p.estado || '').toUpperCase() === 'FINALIZADO');

  // Clasificar finalizados
  const ganados = [];
  const perdidos = [];
  const empates = [];

  finalizados.forEach(p => {
    const res = determinarResultado(p);
    if (res === 'VICTORIA') ganados.push(p);
    else if (res === 'DERROTA') perdidos.push(p);
    else if (res === 'EMPATE') empates.push(p);
  });

  // Ordenar por fecha (más reciente primero) para las columnas
  ganados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  perdidos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  empates.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  // Orden cronológico ascendente (para la evolución)
  const finalizadosCronologico = finalizados
    .filter(p => determinarResultado(p) !== null)
    .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
    .map(p => ({ fecha: p.fecha, rival: p.rival, resultado: determinarResultado(p) }));

  // ===== ESTADÍSTICAS =====
  const total = filtrados.length;
  const victorias = ganados.length;
  const derrotas = perdidos.length;
  const empatesCount = empates.length;
  let golesFavor = 0, golesContra = 0;
  filtrados.forEach(p => {
    if (p.estado === 'FINALIZADO') {
      const parsed = parseResultado(p.resultado);
      if (parsed.valid) {
        golesFavor += parsed.home;
        golesContra += parsed.away;
      }
    }
  });
  const diferencia = golesFavor - golesContra;

  // ===== CONSTRUIR HTML =====
  let html = `
    <div class="max-w-md mx-auto p-4 pt-6">
      <header class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-2xl font-outfit font-black tracking-tight">Partidos</h1>
          <p class="text-xs text-yellow-500/90 font-semibold tracking-wider uppercase mt-0.5">${campeonatoActual === 'todos' ? 'Todos los torneos' : campeonatoActual}</p>
        </div>
        <button class="flex items-center gap-1.5 text-xs font-bold text-yellow-500 bg-yellow-500/10 border border-yellow-500/20 px-3 py-1.5 rounded-xl active:scale-95 transition" onclick="window.location.href='perfil.html'">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          Volver
        </button>
      </header>

      <!-- FILTROS -->
      <div class="flex gap-2 mb-4 overflow-x-auto pb-2 -mx-4 px-4 scrollbar-none">
        <button class="btn-filtro ${campeonatoActual === 'todos' ? 'activo' : ''}" onclick="cambiarFiltro('todos')">📋 Todos</button>
        ${campeonatosUnicos.map(c => `
          <button class="btn-filtro ${campeonatoActual === c ? 'activo' : ''}" onclick="cambiarFiltro('${c}')">🏆 ${c}</button>
        `).join('')}
      </div>

      <!-- ESTADÍSTICAS COMPACTAS -->
      <div class="glass-card p-3 mb-4">
        <div class="stats-grid">
          <div class="stat-item">
            <div class="numero">${total}</div>
            <div class="etiqueta">Partidos</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#34d399;">${victorias}</div>
            <div class="etiqueta" style="color:#34d399;">Ganados</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#f87171;">${derrotas}</div>
            <div class="etiqueta" style="color:#f87171;">Perdidos</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#fbbf24;">${empatesCount}</div>
            <div class="etiqueta" style="color:#fbbf24;">Empates</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#60a5fa;">${golesFavor}</div>
            <div class="etiqueta" style="color:#60a5fa;">GF</div>
          </div>
          <div class="stat-item">
            <div class="numero" style="color:#f87171;">${golesContra}</div>
            <div class="etiqueta" style="color:#f87171;">GC</div>
          </div>
        </div>
        <div class="flex justify-between items-center mt-2 pt-2 border-t border-white/5">
          <span class="text-[8px] font-bold uppercase text-slate-500 tracking-wider">Diferencia</span>
          <span class="text-base font-black font-outfit ${diferencia >= 0 ? 'text-emerald-400' : 'text-red-400'}">${diferencia >= 0 ? '+' : ''}${diferencia}</span>
        </div>
      </div>
  `;

  // ===== PRÓXIMO PARTIDO (1x1 con NEON) =====
  if (proximo) {
    const fecha = formatearFecha(proximo.fecha);
    const hora = formatearHora(proximo.hora);
    const rival = escapeHtml(proximo.rival || 'Sin rival');
    const lugar = escapeHtml(proximo.lugar || 'LIGA SANTA RITA');

    html += `
      <div class="neon-card mb-5 rise-in">
        <div class="neon-content">
          <span class="neon-badge">🔥 Próximo encuentro</span>
          <span class="rival">vs ${rival}</span>
          <div class="fecha-hora">
            <span>${fecha}</span>
            <span>•</span>
            <span>${hora}</span>
          </div>
          <span class="lugar">${lugar}</span>
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="glass-card p-4 text-center text-slate-500 mb-5">
        <span class="material-symbols-outlined text-3xl text-yellow-500/20">event_available</span>
        <p class="text-sm font-semibold mt-1">No hay partidos próximos</p>
      </div>
    `;
  }

  // ===== EVOLUCIÓN / ESTADÍSTICAS REALES =====
  html += construirEvolucionHtml(finalizadosCronologico);

  // ===== DOS COLUMNAS: GANADOS / PERDIDOS =====
  html += `
    <div class="grid grid-cols-2 gap-4">
      <!-- COLUMNA GANADOS -->
      <div class="columna-partidos">
        <div class="titulo-columna titulo-ganados">
          <span class="material-symbols-outlined text-sm">emoji_events</span>
          Ganados (${ganados.length + empates.length})
        </div>
        ${ganados.length === 0 && empates.length === 0 ? `<p class="text-xs text-slate-500 text-center py-3">Sin victorias ni empates</p>` : ''}
        ${ganados.map(p => {
          const fecha = formatearFecha(p.fecha);
          const rival = escapeHtml(p.rival || 'Sin rival');
          const parsed = parseResultado(p.resultado);
          return `
            <div class="partido-card pc-win">
              <div class="info">
                <span class="rival">${rival}</span>
                <span class="fecha">${fecha}</span>
              </div>
              <span class="marcador marcador-victoria">${parsed.home} - ${parsed.away}</span>
            </div>
          `;
        }).join('')}
        ${empates.map(p => {
          const fecha = formatearFecha(p.fecha);
          const rival = escapeHtml(p.rival || 'Sin rival');
          const parsed = parseResultado(p.resultado);
          return `
            <div class="partido-card">
              <div class="info">
                <span class="rival">${rival} <span class="badge-empate">Empate</span></span>
                <span class="fecha">${fecha}</span>
              </div>
              <span class="marcador marcador-empate">${parsed.home} - ${parsed.away}</span>
            </div>
          `;
        }).join('')}
      </div>

      <!-- COLUMNA PERDIDOS -->
      <div class="columna-partidos">
        <div class="titulo-columna titulo-perdidos">
          <span class="material-symbols-outlined text-sm">sentiment_dissatisfied</span>
          Perdidos (${perdidos.length})
        </div>
        ${perdidos.length === 0 ? `<p class="text-xs text-slate-500 text-center py-3">Sin derrotas</p>` : ''}
        ${perdidos.map(p => {
          const fecha = formatearFecha(p.fecha);
          const rival = escapeHtml(p.rival || 'Sin rival');
          const parsed = parseResultado(p.resultado);
          return `
            <div class="partido-card pc-loss">
              <div class="info">
                <span class="rival">${rival}</span>
                <span class="fecha">${fecha}</span>
              </div>
              <span class="marcador marcador-derrota">${parsed.home} - ${parsed.away}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  html += `
    </div>
  `;

  container.innerHTML = html;
  document.getElementById('skeletonLoader').style.display = 'none';
  document.getElementById('dynamicContent').style.display = 'block';
}

// ==================== CAMBIAR FILTRO ====================
function cambiarFiltro(campeonato) {
  campeonatoActual = campeonato;
  aplicarFiltro();
}

// ==================== ACTUALIZAR ====================
async function actualizar() {
  const btn = document.querySelector('.bottom-nav .nav-item:last-child');
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-yellow-500">sync</span><span>Cargando</span>';
    btn.style.pointerEvents = 'none';
  }
  await cargarPartidos();
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined">sync</span><span>Actualizar</span>';
    btn.style.pointerEvents = 'auto';
  }
  mostrarToast('✅ Sincronizado correctamente');
}

// ==================== INICIALIZACIÓN ====================
document.addEventListener('DOMContentLoaded', () => {
  cargarPartidos();
});
</script>

</body>
</html>
