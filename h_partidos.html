<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Nápoles F.C. · Partidos del Equipo</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #E9C349;
      --gold-dim: rgba(233, 195, 73, 0.15);
      --bg-dark-start: #020617;
      --bg-dark-end: #0f172a;
      --glass-bg: rgba(30, 41, 59, 0.35);
      --glass-border: rgba(233, 195, 73, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, var(--bg-dark-start) 0%, var(--bg-dark-end) 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0 0 80px 0;
      margin: 0;
    }
    .font-outfit { font-family: 'Outfit', sans-serif; }

    .skeleton-wrapper { padding: 20px; }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 0.5px solid var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .partido-card {
      background: rgba(2, 6, 23, 0.4);
      border-radius: 20px;
      padding: 16px;
      border: 0.5px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }
    .partido-card:active { transform: scale(0.99); background: rgba(30, 41, 59, 0.4); }

    .badge-estado {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 12px;
      border-radius: 20px;
    }
    .badge-finalizado { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
    .badge-proximo { background: rgba(233, 195, 73, 0.15); color: var(--gold); border: 1px solid rgba(233,195,73,0.2); }
    .badge-pendiente { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }

    .resultado-victoria { color: #10b981; font-weight: 800; }
    .resultado-derrota { color: #ef4444; font-weight: 800; }
    .resultado-empate { color: #fbbf24; font-weight: 800; }

    .btn-filtro {
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-filtro:hover { background: rgba(255,255,255,0.04); }
    .btn-filtro.activo {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      box-shadow: 0 4px 15px rgba(233, 195, 73, 0.2);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      border-top: 0.5px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
      z-index: 100;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 12px;
      color: #64748b;
      transition: all 0.2s;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.5rem;
      gap: 1px;
      min-width: 44px;
      border: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .bottom-nav .nav-item .material-symbols-outlined { font-size: 1.3rem; transition: all 0.2s; }
    .bottom-nav .nav-item:hover { color: #94a3b8; }
    .bottom-nav .nav-item:active { transform: scale(0.9); }
    .bottom-nav .nav-item.active { color: var(--gold); }
    .bottom-nav .nav-item .nav-label { font-size: 0.4rem; letter-spacing: 0.1em; font-weight: 800; }

    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(233, 195, 73, 0.25);
      border-radius: 30px;
      padding: 8px 20px;
      color: var(--gold);
      font-weight: 700;
      font-size: 0.8rem;
      z-index: 2000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: none;
      white-space: nowrap;
      max-width: 90%;
    }
    #toast.show { display: block; animation: toastAnim 2.5s ease forwards; }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    @media (max-width: 480px) {
      .partido-card { padding: 12px; }
      .btn-filtro { font-size: 0.55rem; padding: 6px 12px; }
    }
  </style>
</head>
<body>

<!-- SKELETON -->
<div class="skeleton-wrapper" id="skeletonLoader">
  <div class="max-w-md mx-auto space-y-6">
    <div class="skeleton-shimmer h-16 rounded-2xl"></div>
    <div class="skeleton-shimmer h-12 rounded-full"></div>
    <div class="space-y-4">
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
      <div class="skeleton-shimmer h-28 rounded-2xl"></div>
    </div>
  </div>
</div>

<!-- CONTENIDO DINÁMICO -->
<div id="dynamicContent" style="display:none;"></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- BARRA NAVEGACIÓN INFERIOR -->
<div class="bottom-nav">
  <a href="perfil.html" class="nav-item" title="Perfil">
    <span class="material-symbols-outlined">account_circle</span>
    <span class="nav-label">Perfil</span>
  </a>
  <a href="alineacion.html" class="nav-item" title="Alineación">
    <span class="material-symbols-outlined">group</span>
    <span class="nav-label">Alineación</span>
  </a>
  <a href="h_valores.html" class="nav-item" title="Historial Valores">
    <span class="material-symbols-outlined">payments</span>
    <span class="nav-label">Valores</span>
  </a>
  <a href="h_partidos.html" class="nav-item active" title="Partidos">
    <span class="material-symbols-outlined">sports_soccer</span>
    <span class="nav-label">Partidos</span>
  </a>
  <button class="nav-item" onclick="actualizar()" title="Actualizar">
    <span class="material-symbols-outlined">sync</span>
    <span class="nav-label">Actualizar</span>
  </button>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
// ⚠️ CAMBIA ESTA URL POR LA DE TU SCRIPT DE GAS ⚠️
const URL_GAS = "https://script.google.com/macros/s/AKfycbz8Kw2wNXFNaO3YOyrNykzscm_3vDMK0sXz7kYPEUUf-I1L_Ikht8U5uzHXhgWcEYnv/exec";

// ==================== FUNCIONES AUXILIARES ====================
function mostrarToast(mensaje) {
  const toast = document.getElementById('toast');
  toast.textContent = mensaje;
  toast.className = 'show';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.className = ''; }, 2500);
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '-';
  try {
    const d = new Date(fechaStr);
    if (isNaN(d.getTime())) return fechaStr;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch(e) { return fechaStr; }
}

function formatearHora(hora) {
  if (!hora) return '--:--';
  let h = String(hora).trim();
  if (h.indexOf(':') !== -1) {
    const p = h.split(':');
    return p[0].padStart(2,'0') + ':' + p[1].padStart(2,'0');
  }
  const num = parseInt(h);
  if (!isNaN(num)) return String(num).padStart(2,'0') + ':00';
  return h.substring(0,5) || '--:--';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ==================== OBTENER RESULTADO ====================
function parseResultado(str) {
  if (!str || str === 'VS') return { home: null, away: null, valid: false };
  const clean = String(str).trim().replace(/\s/g, '');
  if (clean.includes('-')) {
    const parts = clean.split('-');
    if (parts.length === 2) {
      const h = parseInt(parts[0], 10);
      const a = parseInt(parts[1], 10);
      if (!isNaN(h) && !isNaN(a)) return { home: h, away: a, valid: true };
    }
  }
  return { home: null, away: null, valid: false };
}

function determinarResultado(partido) {
  if (partido.estado !== 'FINALIZADO') return null;
  const p = parseResultado(partido.resultado);
  if (!p.valid) return null;
  if (p.home > p.away) return 'VICTORIA';
  if (p.home < p.away) return 'DERROTA';
  return 'EMPATE';
}

// ==================== CARGAR PARTIDOS ====================
async function cargarPartidos() {
  try {
    const url = `${URL_GAS}?action=getPartidos&t=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.success && data.data) {
      renderizarPartidos(data.data);
    } else {
      throw new Error(data.error || 'No se pudieron cargar los partidos');
    }
  } catch(e) {
    console.error(e);
    mostrarToast('❌ Error: ' + e.message);
    document.getElementById('skeletonLoader').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';
    document.getElementById('dynamicContent').innerHTML = `
      <div class="max-w-md mx-auto p-6 text-center text-red-400">
        <span class="material-symbols-outlined text-5xl">error</span>
        <p class="mt-4 font-bold">${e.message}</p>
        <button onclick="cargarPartidos()" class="mt-6 bg-gold text-black px-6 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest">Reintentar</button>
      </div>
    `;
  }
}

// ==================== RENDERIZAR PARTIDOS ====================
let todosLosPartidos = [];
let campeonatoActual = 'todos';

function renderizarPartidos(partidos) {
  todosLosPartidos = partidos;
  aplicarFiltro();
}

function aplicarFiltro() {
  const container = document.getElementById('dynamicContent');
  let filtrados = todosLosPartidos;

  // Filtrar por campeonato
  if (campeonatoActual !== 'todos') {
    filtrados = filtrados.filter(p => (p.campeonato || '').toUpperCase() === campeonatoActual.toUpperCase());
  }

  // Ordenar: primero los más recientes (por fecha)
  filtrados.sort((a, b) => {
    const fa = new Date(a.fecha);
    const fb = new Date(b.fecha);
    return fb - fa;
  });

  if (filtrados.length === 0) {
    container.innerHTML = `
      <div class="max-w-md mx-auto p-6 pb-24">
        <header class="text-center pt-6 pb-6">
          <h1 class="text-2xl font-black text-white tracking-tight uppercase font-outfit flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-gold" style="font-size:28px;">sports_soccer</span>
            Partidos del Equipo
          </h1>
          <p class="text-[10px] text-gold font-bold uppercase tracking-[0.3em] mt-1">${campeonatoActual === 'todos' ? 'Todos los campeonatos' : campeonatoActual}</p>
        </header>
        <div class="flex gap-2 mb-6 flex-wrap justify-center">
          ${crearBotonesFiltro()}
        </div>
        <div class="glass-card p-8 text-center text-gray-500">
          <span class="material-symbols-outlined text-5xl text-gold/20">sports_soccer</span>
          <p class="mt-4 font-bold">No hay partidos para este campeonato</p>
        </div>
      </div>
    `;
    return;
  }

  let html = `
    <div class="max-w-md mx-auto p-6 pb-24">
      <header class="text-center pt-6 pb-6">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-black text-white tracking-tight uppercase font-outfit flex items-center gap-2">
            <span class="material-symbols-outlined text-gold" style="font-size:28px;">sports_soccer</span>
            Partidos
          </h1>
          <button class="btn-action" onclick="window.location.href='perfil.html'">
            <span class="material-symbols-outlined text-gold" style="font-size:18px;">arrow_back</span>
            Volver
          </button>
        </div>
        <p class="text-[10px] text-gold font-bold uppercase tracking-[0.3em] mt-1">${campeonatoActual === 'todos' ? 'Todos los campeonatos' : campeonatoActual}</p>
      </header>

      <div class="flex gap-2 mb-6 flex-wrap justify-center">
        ${crearBotonesFiltro()}
      </div>

      <div class="space-y-4">
  `;

  filtrados.forEach(p => {
    const fecha = formatearFecha(p.fecha);
    const hora = formatearHora(p.hora);
    const rival = escapeHtml(p.rival || 'Sin rival');
    const lugar = escapeHtml(p.lugar || 'LIGA SANTA RITA');
    const estado = (p.estado || 'PENDIENTE').toUpperCase();
    const resultado = p.resultado || 'VS';
    const campeonato = escapeHtml(p.campeonato || 'Sin campeonato');

    let badgeEstado = '';
    if (estado === 'FINALIZADO') badgeEstado = `<span class="badge-estado badge-finalizado">✅ Finalizado</span>`;
    else if (estado === 'PRÓXIMO') badgeEstado = `<span class="badge-estado badge-proximo">🔥 Próximo</span>`;
    else badgeEstado = `<span class="badge-estado badge-pendiente">⏳ Pendiente</span>`;

    let resultadoHTML = '';
    let badgeResultado = '';
    const outcome = determinarResultado(p);
    const parsed = parseResultado(resultado);

    if (estado === 'FINALIZADO' && parsed.valid) {
      let clase = '';
      let texto = '';
      if (outcome === 'VICTORIA') {
        clase = 'resultado-victoria';
        texto = '🏆 VICTORIA';
        badgeResultado = `<span class="text-[9px] font-bold bg-green-100/10 text-green-400 border border-green-400/20 px-2 py-0.5 rounded-full">${texto}</span>`;
      } else if (outcome === 'DERROTA') {
        clase = 'resultado-derrota';
        texto = '❌ DERROTA';
        badgeResultado = `<span class="text-[9px] font-bold bg-red-100/10 text-red-400 border border-red-400/20 px-2 py-0.5 rounded-full">${texto}</span>`;
      } else if (outcome === 'EMPATE') {
        clase = 'resultado-empate';
        texto = '🤝 EMPATE';
        badgeResultado = `<span class="text-[9px] font-bold bg-amber-100/10 text-amber-400 border border-amber-400/20 px-2 py-0.5 rounded-full">${texto}</span>`;
      }
      resultadoHTML = `
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black ${clase}">${parsed.home} - ${parsed.away}</span>
          ${badgeResultado}
        </div>
      `;
    } else {
      resultadoHTML = `<span class="text-gray-400 text-xl font-light">${resultado}</span>`;
    }

    html += `
      <div class="partido-card">
        <div class="flex justify-between items-start gap-2 flex-wrap">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              ${badgeEstado}
              <span class="text-[9px] text-gold/70 font-bold uppercase tracking-wider">${campeonato}</span>
            </div>
            <div class="flex items-center gap-3 mt-1">
              <span class="text-sm font-bold text-white">⚽ vs ${rival}</span>
            </div>
          </div>
          <span class="text-[10px] text-gray-400"><span class="material-symbols-outlined text-[14px]">event</span> ${fecha}</span>
        </div>

        <div class="flex items-center justify-between mt-2 flex-wrap gap-2">
          <div class="flex items-center gap-3 text-xs text-gray-400">
            <span><span class="material-symbols-outlined text-[14px]">schedule</span> ${hora}</span>
            <span><span class="material-symbols-outlined text-[14px]">location_on</span> ${lugar}</span>
          </div>
          ${resultadoHTML}
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;

  container.innerHTML = html;
  document.getElementById('skeletonLoader').style.display = 'none';
  document.getElementById('dynamicContent').style.display = 'block';
}

function crearBotonesFiltro() {
  const campeonatos = ['todos', 'CAMPEONATO SANTA RITA', 'COPA SANTA RITA'];
  const labels = {
    'todos': '📋 Todos',
    'CAMPEONATO SANTA RITA': '🏆 Santa Rita',
    'COPA SANTA RITA': '🏆 Copa Santa Rita'
  };
  return campeonatos.map(c => `
    <button class="btn-filtro ${c === campeonatoActual ? 'activo' : ''}" data-campeonato="${c}" onclick="cambiarFiltro('${c}')">
      ${labels[c] || c}
    </button>
  `).join('');
}

function cambiarFiltro(campeonato) {
  campeonatoActual = campeonato;
  aplicarFiltro();
}

// ==================== ACTUALIZAR ====================
async function actualizar() {
  const btn = document.querySelector('.bottom-nav .nav-item:last-child');
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> <span class="nav-label">Cargando...</span>';
    btn.disabled = true;
  }
  await cargarPartidos();
  if (btn) {
    btn.innerHTML = '<span class="material-symbols-outlined">sync</span> <span class="nav-label">Actualizar</span>';
    btn.disabled = false;
  }
  mostrarToast('✅ Datos actualizados');
}

// ==================== INICIALIZACIÓN ====================
document.addEventListener('DOMContentLoaded', () => {
  cargarPartidos();
});
</script>

</body>
</html>
