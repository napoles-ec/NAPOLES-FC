<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EA Sports FC - Nápoles F.C. | Partidos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', sans-serif;
  background: #0a0c15;
  color: #ffffff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Fondo estilo FIFA */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 20% 50%, rgba(22, 163, 74, 0.15) 0%, rgba(10, 12, 21, 0) 60%),
              radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.1) 0%, rgba(10, 12, 21, 0) 50%);
  pointer-events: none;
  z-index: 0;
}

/* Animaciones */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes glowPulse {
  0%, 100% {
    box-shadow: 0 0 5px rgba(22, 163, 74, 0.5);
  }
  50% {
    box-shadow: 0 0 20px rgba(22, 163, 74, 0.8);
  }
}

.loading-spinner {
  width: 60px;
  height: 60px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #16a34a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px auto;
}

/* Topbar estilo FIFA */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 12, 21, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.admin-info h1 {
  font-size: 1.4rem;
  font-weight: 900;
  background: linear-gradient(135deg, #16a34a, #4ade80, #22c55e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.admin-info p {
  font-size: .75rem;
  color: #6b7280;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(135deg, #16a34a, #059669);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 900;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(22,163,74,0.3);
  border: 1px solid rgba(255,255,255,0.1);
}

.avatar:hover {
  transform: rotate(180deg) scale(1.05);
  box-shadow: 0 8px 25px rgba(22,163,74,0.5);
}

/* Contenedor de partidos */
.matches {
  padding: 24px 20px 100px;
  max-width: 750px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* Tarjeta de partido - estilo FIFA Ultimate Team */
.match-card {
  background: linear-gradient(135deg, rgba(20, 24, 36, 0.95), rgba(15, 18, 28, 0.98));
  backdrop-filter: blur(10px);
  border-radius: 28px;
  padding: 20px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeInUp 0.5s ease;
  position: relative;
  overflow: hidden;
}

.match-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #16a34a, #4ade80, #22c55e);
  opacity: 0;
  transition: opacity 0.3s;
}

.match-card:hover {
  transform: translateY(-5px);
  border-color: rgba(34, 197, 94, 0.3);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(34, 197, 94, 0.1);
}

.match-card:hover::before {
  opacity: 1;
}

/* Cabecera de la tarjeta */
.match-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}

.match-date {
  background: rgba(22, 163, 74, 0.15);
  color: #4ade80;
  padding: 6px 14px;
  border-radius: 40px;
  font-size: .75rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(74, 222, 128, 0.2);
  backdrop-filter: blur(4px);
}

.status {
  padding: 6px 14px;
  border-radius: 40px;
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.status.FINALIZADO { 
  background: linear-gradient(135deg, #16a34a, #059669);
  color: #fff;
  box-shadow: 0 2px 10px rgba(22,163,74,0.4);
}
.status.PRÓXIMO { 
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  box-shadow: 0 2px 10px rgba(37,99,235,0.4);
}
.status.PENDIENTE { 
  background: linear-gradient(135deg, #ea580c, #c2410c);
  color: #fff;
  box-shadow: 0 2px 10px rgba(234,88,12,0.4);
}

/* Equipos - estilo marcador FIFA */
.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 15px;
}

.team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 38%;
}

.team-logo {
  width: 85px;
  height: 85px;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.3rem;
  font-weight: 900;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.team-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
  border-radius: 28px;
}

.team-logo:hover {
  transform: scale(1.05);
}

.home {
  background: linear-gradient(135deg, #1e40af, #3b82f6);
  box-shadow: 0 8px 20px rgba(59,130,246,0.3);
}

.away {
  background: linear-gradient(135deg, #9a3412, #ea580c);
  box-shadow: 0 8px 20px rgba(234,88,12,0.3);
}

.team h3 {
  font-size: 0.9rem;
  font-weight: 800;
  text-align: center;
  color: #e5e7eb;
}

.score {
  font-size: 2.2rem;
  font-weight: 900;
  background: linear-gradient(135deg, #ffffff, #d1d5db);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding: 0 12px;
  letter-spacing: 2px;
}

/* Información del partido */
.match-info {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
  gap: 12px;
}

.info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #9ca3af;
  font-size: .8rem;
  background: rgba(255,255,255,0.03);
  padding: 6px 14px;
  border-radius: 30px;
  transition: all 0.2s;
}

.info-item:hover {
  background: rgba(255,255,255,0.08);
  color: #e5e7eb;
  transform: translateY(-2px);
}

.info-item .material-symbols-outlined {
  font-size: 18px;
  color: #4ade80;
}

/* Botones de acción */
.card-actions {
  display: flex;
  gap: 14px;
  margin-top: 20px;
  justify-content: flex-end;
}

.btn-edit, .btn-delete {
  padding: 8px 22px;
  border-radius: 40px;
  border: none;
  font-weight: 700;
  font-size: 0.75rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-edit {
  background: rgba(59, 130, 246, 0.15);
  color: #60a5fa;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.btn-edit:hover {
  background: rgba(59, 130, 246, 0.3);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.2);
}

.btn-delete {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.btn-delete:hover {
  background: rgba(239, 68, 68, 0.3);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(239,68,68,0.2);
}

/* Botón flotante + */
.fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 70px;
  height: 70px;
  border: none;
  border-radius: 35px;
  background: linear-gradient(135deg, #16a34a, #059669);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(22,163,74,0.5);
  transition: all 0.3s ease;
  z-index: 200;
  animation: glowPulse 2s infinite;
}

.fab:hover {
  transform: scale(1.1) rotate(90deg);
  box-shadow: 0 15px 40px rgba(22,163,74,0.7);
}

.fab .material-symbols-outlined {
  font-size: 36px;
}

/* Modal estilo FIFA */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  animation: fadeInUp 0.3s ease;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: linear-gradient(135deg, #141824, #0f121c);
  border-radius: 40px;
  width: 90%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 32px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  animation: slideIn 0.3s ease;
}

.modal-content h2 {
  margin-bottom: 28px;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #16a34a, #4ade80);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
}

.modal-content input,
.modal-content select {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  transition: all 0.2s;
  background: rgba(0,0,0,0.4);
  color: #fff;
}

.modal-content input:focus,
.modal-content select:focus {
  outline: none;
  border-color: #16a34a;
  background: rgba(0,0,0,0.6);
  box-shadow: 0 0 0 3px rgba(22,163,74,0.2);
}

.modal-content input::placeholder {
  color: #6b7280;
}

.modal-content label {
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 8px;
  display: block;
  color: #9ca3af;
  letter-spacing: 0.5px;
}

.modal-actions {
  display: flex;
  gap: 15px;
  justify-content: flex-end;
  margin-top: 28px;
}

.modal-actions button {
  padding: 12px 28px;
  border-radius: 40px;
  border: none;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-save {
  background: linear-gradient(135deg, #16a34a, #059669);
  color: white;
  box-shadow: 0 4px 15px rgba(22,163,74,0.3);
}

.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(22,163,74,0.5);
}

.btn-save:disabled {
  opacity: 0.5;
  transform: none;
}

.btn-cancel {
  background: rgba(255,255,255,0.08);
  color: #9ca3af;
  border: 1px solid rgba(255,255,255,0.1);
}

.btn-cancel:hover {
  background: rgba(255,255,255,0.15);
  transform: translateY(-2px);
}

/* Loading y empty state */
.loading-container {
  text-align: center;
  padding: 80px 20px;
}

.loading-text {
  color: #9ca3af;
  font-size: 0.9rem;
  margin-top: 20px;
  animation: pulse 1.5s ease infinite;
}

.empty-state {
  text-align: center;
  padding: 80px 20px;
}

.empty-state .material-symbols-outlined {
  font-size: 80px;
  color: #374151;
  margin-bottom: 20px;
  opacity: 0.5;
}

.empty-state p {
  color: #6b7280;
  font-size: 1rem;
}

.empty-state p:first-of-type {
  font-size: 1.2rem;
  margin-bottom: 8px;
}

.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  padding: 12px 24px;
  border-radius: 40px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 300;
  animation: fadeInUp 0.3s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

/* Scrollbar personalizado */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: #0a0c15;
}

::-webkit-scrollbar-thumb {
  background: #16a34a;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #22c55e;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <div class="admin-info">
      <h1>EA SPORTS FC™</h1>
      <p>NÁPOLES F.C. | TEMPORADA 2026</p>
    </div>
  </div>
  <div class="avatar" id="btnRefrescar">
    <span class="material-symbols-outlined">refresh</span>
  </div>
</header>

<section class="matches" id="matchesContainer">
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando calendario de partidos...</div>
  </div>
</section>

<button class="fab" id="btnAgregar">
  <span class="material-symbols-outlined">add</span>
</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">📋 NUEVO PARTIDO</h2>
    
    <label>📅 FECHA</label>
    <input type="date" id="inputFecha">
    
    <label>⏰ HORA</label>
    <input type="time" id="inputHora">
    
    <label>⚽ RIVAL</label>
    <select id="selectRival">
      <option value="">Cargando rivales...</option>
    </select>
    
    <label>🏟️ ESTADIO</label>
    <select id="selectLugar">
      <option value="LIGA SANTA RITA - Cancha 1">🏟️ LIGA SANTA RITA - Cancha 1</option>
      <option value="LIGA SANTA RITA - Cancha 2">🏟️ LIGA SANTA RITA - Cancha 2</option>
    </select>
    
    <label>📊 RESULTADO</label>
    <input type="text" id="inputResultado" placeholder="Ej: 3-1 | VS" value="VS">
    
    <label>🏁 ESTADO</label>
    <select id="selectEstado">
      <option value="PENDIENTE">⏳ PENDIENTE</option>
      <option value="PRÓXIMO">🔥 PRÓXIMO</option>
      <option value="FINALIZADO">✅ FINALIZADO</option>
    </select>
    
    <label>📝 VOCALÍA</label>
    <input type="text" id="inputVocalia" placeholder="Ej: 17, 18, o nombre">
    
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelar">CANCELAR</button>
      <button class="btn-save" id="btnGuardar">GUARDAR</button>
    </div>
  </div>
</div>

<script>
// =========================================
// CONFIGURACIÓN
// =========================================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbza40_ottQVRrEWyQyhnNLmNM3p6jiI0Ca0SAHzuT047AuSQD_f397AF1wKcUYcIYm3/exec';

let rivalesList = [];
let partidosList = [];
let editandoId = null;
let editandoFila = null;
let guardando = false;

// =========================================
// FUNCIONES DE API
// =========================================
async function cargarDatosGET(accion) {
  try {
    const url = `${WEBAPP_URL}?accion=${accion}&t=${Date.now()}`;
    const response = await fetch(url);
    const data = await response.json();
    return data;
  } catch(error) {
    console.error(`Error cargando ${accion}:`, error);
    return null;
  }
}

async function enviarDatosPOST(accion, datos) {
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, ...datos })
    });
    return { success: true };
  } catch(error) {
    console.error('Error en POST:', error);
    return { success: false, error: error.message };
  }
}

async function cargarRivales() {
  const data = await cargarDatosGET('getRivales');
  if (data && data.success && data.data && data.data.length > 0) {
    rivalesList = data.data;
  } else {
    rivalesList = [
      { nombre: 'IDEAL' }, { nombre: 'BARZA' }, { nombre: 'SAN MARTIN' },
      { nombre: 'INDEPENDIENTE' }, { nombre: 'VODKILA' }, { nombre: 'CHELSEA' },
      { nombre: 'JUVENTUD DE AMERICA' }, { nombre: 'JUVENTUS' }, 
      { nombre: 'LEONES' }, { nombre: 'FRANCO CANADIENSE' }
    ];
  }
  
  const select = document.getElementById('selectRival');
  select.innerHTML = '<option value="">🔽 SELECCIONA UN RIVAL</option>';
  rivalesList.forEach(rival => {
    const option = document.createElement('option');
    option.value = rival.nombre;
    option.textContent = rival.nombre;
    select.appendChild(option);
  });
}

async function cargarPartidos() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = `
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Cargando partidos...</div>
    </div>
  `;
  
  const data = await cargarDatosGET('getPartidos');
  if (data && data.success && data.data) {
    partidosList = data.data;
    renderPartidos();
  } else {
    container.innerHTML = `
      <div class="empty-state">
        <span class="material-symbols-outlined">sports_soccer</span>
        <p>⚽ NO HAY PARTIDOS PROGRAMADOS</p>
        <p style="font-size: 0.8rem; margin-top: 8px;">Presiona el botón + para agregar un nuevo partido</p>
      </div>
    `;
    partidosList = [];
  }
}

// Formatear hora correctamente
function formatearHora(horaStr) {
  if (!horaStr) return '--:--';
  
  let horaString = String(horaStr);
  
  // Si ya viene en formato HH:MM
  if (horaString.match(/^([0-1][0-9]|2[0-3]):[0-5][0-9]$/)) {
    return horaString;
  }
  
  // Si viene con segundos HH:MM:SS
  if (horaString.includes(':') && !horaString.includes('T')) {
    const partes = horaString.split(':');
    if (partes.length >= 2) {
      return `${partes[0].padStart(2, '0')}:${partes[1].padStart(2, '0')}`;
    }
  }
  
  // Si es string con formato ISO (1899-12-30T20:00:00.000Z)
  if (horaString.includes('T')) {
    try {
      const fecha = new Date(horaString);
      if (!isNaN(fecha.getTime())) {
        const horas = fecha.getUTCHours().toString().padStart(2, '0');
        const minutos = fecha.getUTCMinutes().toString().padStart(2, '0');
        return `${horas}:${minutos}`;
      }
    } catch(e) {}
  }
  
  // Si es número (formato Excel)
  if (typeof horaStr === 'number') {
    const totalMinutos = Math.round(horaStr * 1440);
    const horas = Math.floor(totalMinutos / 60);
    const minutos = totalMinutos % 60;
    return `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}`;
  }
  
  return '--:--';
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return 'Fecha por definir';
  try {
    const fecha = new Date(fechaStr);
    return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) {
    return fechaStr;
  }
}

function renderPartidos() {
  const container = document.getElementById('matchesContainer');
  if (!partidosList || partidosList.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="material-symbols-outlined">sports_soccer</span>
        <p>⚽ NO HAY PARTIDOS PROGRAMADOS</p>
        <p style="font-size: 0.8rem; margin-top: 8px;">Presiona el botón + para agregar un nuevo partido</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = '';
  partidosList.forEach(partido => {
    const fechaFormateada = formatearFecha(partido.fecha);
    const horaFormateada = formatearHora(partido.hora);
    const resultado = partido.resultado || 'VS';
    const estado = partido.estado || 'PENDIENTE';
    const abrevRival = partido.rival ? partido.rival.substring(0, 3).toUpperCase() : 'RIV';
    
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-top">
        <div class="match-date">${fechaFormateada}</div>
        <div class="status ${estado}">${estado}</div>
      </div>
      <div class="teams">
        <div class="team">
          <div class="team-logo home">NFC</div>
          <h3>${partido.local || 'NAPOLES F.C.'}</h3>
        </div>
        <div class="score">${resultado}</div>
        <div class="team">
          <div class="team-logo away">${abrevRival}</div>
          <h3>${partido.rival || 'Rival'}</h3>
        </div>
      </div>
      <div class="match-info">
        <div class="info-item">
          <span class="material-symbols-outlined">schedule</span>
          <span>${horaFormateada}</span>
        </div>
        <div class="info-item">
          <span class="material-symbols-outlined">location_on</span>
          <span>${partido.lugar || 'LIGA SANTA RITA'}</span>
        </div>
        ${partido.vocalia ? `<div class="info-item"><span class="material-symbols-outlined">assignment</span><span>VOCALÍA ${partido.vocalia}</span></div>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-edit" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">edit</span> EDITAR
        </button>
        <button class="btn-delete" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">delete</span> ELIMINAR
        </button>
      </div>
    `;
    container.appendChild(card);
  });
  
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const fila = parseInt(btn.dataset.fila);
      abrirModalEditar(id, fila);
    });
  });
  
  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const fila = parseInt(btn.dataset.fila);
      if (confirm('¿Seguro que deseas eliminar este partido?')) {
        eliminarPartido(fila);
      }
    });
  });
}

function abrirModalNuevo() {
  editandoId = null;
  editandoFila = null;
  document.getElementById('modalTitle').textContent = '📋 NUEVO PARTIDO';
  document.getElementById('inputFecha').value = '';
  document.getElementById('inputHora').value = '';
  document.getElementById('selectRival').value = '';
  document.getElementById('selectLugar').value = 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = 'VS';
  document.getElementById('selectEstado').value = 'PENDIENTE';
  document.getElementById('inputVocalia').value = '';
  document.getElementById('modal').classList.add('active');
}

function abrirModalEditar(id, fila) {
  const partido = partidosList.find(p => p.id === id);
  if (!partido) return;
  
  editandoId = id;
  editandoFila = fila;
  document.getElementById('modalTitle').textContent = '✏️ EDITAR PARTIDO';
  document.getElementById('inputFecha').value = partido.fecha || '';
  document.getElementById('inputHora').value = partido.hora || '';
  document.getElementById('selectRival').value = partido.rival || '';
  document.getElementById('selectLugar').value = partido.lugar || 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = partido.resultado || 'VS';
  document.getElementById('selectEstado').value = partido.estado || 'PENDIENTE';
  document.getElementById('inputVocalia').value = partido.vocalia || '';
  document.getElementById('modal').classList.add('active');
}

async function guardarPartido() {
  if (guardando) {
    mostrarToast('⏳ Ya se está guardando, espera...');
    return;
  }
  
  const partido = {
    fecha: document.getElementById('inputFecha').value,
    hora: document.getElementById('inputHora').value,
    rival: document.getElementById('selectRival').value,
    local: 'NAPOLES F.C.',
    lugar: document.getElementById('selectLugar').value,
    resultado: document.getElementById('inputResultado').value || 'VS',
    estado: document.getElementById('selectEstado').value,
    vocalia: document.getElementById('inputVocalia').value
  };
  
  if (!partido.rival) {
    alert('Selecciona un rival');
    return;
  }
  
  guardando = true;
  const btnGuardar = document.getElementById('btnGuardar');
  const textoOriginal = btnGuardar.textContent;
  btnGuardar.textContent = '⏳ GUARDANDO...';
  btnGuardar.disabled = true;
  
  try {
    if (editandoFila !== null) {
      partido.fila = editandoFila;
      await enviarDatosPOST('actualizar', { partido });
    } else {
      await enviarDatosPOST('agregar', { partido });
    }
    
    cerrarModal();
    mostrarToast('✅ Partido guardado correctamente');
    setTimeout(() => cargarPartidos(), 1000);
  } catch (error) {
    mostrarToast('❌ Error al guardar');
  } finally {
    setTimeout(() => {
      btnGuardar.textContent = textoOriginal;
      btnGuardar.disabled = false;
      guardando = false;
    }, 1000);
  }
}

async function eliminarPartido(fila) {
  if (guardando) {
    mostrarToast('⏳ Espera a que termine la operación actual');
    return;
  }
  
  guardando = true;
  await enviarDatosPOST('eliminar', { fila });
  mostrarToast('🗑️ Partido eliminado');
  setTimeout(() => {
    cargarPartidos();
    guardando = false;
  }, 1000);
}

function mostrarToast(mensaje) {
  let toast = document.querySelector('.toast');
  if (toast) toast.remove();
  toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = mensaje;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('active');
}
