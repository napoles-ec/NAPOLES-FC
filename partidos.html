<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partidos - Nápoles F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f3f6fb;
  color: #111827;
  min-height: 100vh;
  overflow-x: hidden;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #e5e7eb;
  border-top-color: #16a34a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px auto;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid #e5e7eb;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.admin-info h1 {
  font-size: 1.1rem;
  font-weight: 800;
}

.admin-info p {
  font-size: .85rem;
  color: #6b7280;
  margin-top: 2px;
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: linear-gradient(135deg, #16a34a, #4ade80);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s;
}

.avatar:hover {
  transform: rotate(180deg);
}

.matches {
  padding: 20px 18px 40px;
}

.match-card {
  background: #fff;
  border-radius: 26px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(15,23,42,.05);
  transition: all 0.2s ease;
  animation: fadeInUp 0.4s ease;
}

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.match-date {
  background: #ecfdf5;
  color: #16a34a;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 700;
}

.status {
  background: #111827;
  color: #fff;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 700;
}

.status.FINALIZADO { background: #16a34a; }
.status.PRÓXIMO { background: #2563eb; }
.status.PENDIENTE { background: #ea580c; }

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 40%;
}

.team-logo {
  width: 70px;
  height: 70px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.1rem;
  font-weight: 800;
}

.home {
  background: linear-gradient(135deg, #2563eb, #60a5fa);
}

.away {
  background: linear-gradient(135deg, #ea580c, #fb923c);
}

.team h3 {
  font-size: 0.9rem;
  font-weight: 800;
  text-align: center;
}

.score {
  font-size: 1.8rem;
  font-weight: 900;
  color: #111827;
}

.match-info {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 16px;
  border-top: 1px solid #e5e7eb;
}

.info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #6b7280;
  font-size: .85rem;
}

.info-item .material-symbols-outlined {
  font-size: 20px;
}

.card-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  justify-content: flex-end;
}

.btn-edit, .btn-delete {
  padding: 8px 16px;
  border-radius: 30px;
  border: none;
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-edit {
  background: #e0e7ff;
  color: #2563eb;
}

.btn-edit:hover {
  background: #c7d2fe;
}

.btn-delete {
  background: #fee2e2;
  color: #dc2626;
}

.btn-delete:hover {
  background: #fecaca;
}

.fab {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 64px;
  height: 64px;
  border: none;
  border-radius: 22px;
  background: linear-gradient(135deg, #16a34a, #4ade80);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 15px 35px rgba(22,163,74,.35);
  z-index: 200;
}

.fab .material-symbols-outlined {
  font-size: 34px;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 32px;
  width: 90%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
}

.modal-content h2 {
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.modal-content input,
.modal-content select {
  width: 100%;
  padding: 12px;
  margin-bottom: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}

.modal-content label {
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 4px;
  display: block;
  color: #374151;
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 20px;
}

.modal-actions button {
  padding: 12px 24px;
  border-radius: 30px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.btn-save {
  background: #16a34a;
  color: white;
}

.btn-cancel {
  background: #e5e7eb;
  color: #374151;
}

.loading-container {
  text-align: center;
  padding: 60px 20px;
}

.loading-text {
  color: #6b7280;
  font-size: 0.9rem;
  margin-top: 16px;
  animation: pulse 1.5s ease infinite;
}

.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.85rem;
  z-index: 300;
  animation: fadeInUp 0.3s ease;
}

@media(min-width: 700px) {
  .matches {
    max-width: 700px;
    margin: auto;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <div class="admin-info">
      <h1>Partidos</h1>
      <p>Nápoles F.C.</p>
    </div>
  </div>
  <div class="avatar" id="btnRefrescar">
    <span class="material-symbols-outlined">refresh</span>
  </div>
</header>

<section class="matches" id="matchesContainer">
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando partidos y rivales...</div>
  </div>
</section>

<button class="fab" id="btnAgregar">
  <span class="material-symbols-outlined">add</span>
</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Nuevo Partido</h2>
    
    <label>📅 Fecha</label>
    <input type="date" id="inputFecha">
    
    <label>⏰ Hora</label>
    <input type="time" id="inputHora">
    
    <label>⚽ Rival</label>
    <select id="selectRival">
      <option value="">Cargando rivales...</option>
    </select>
    
    <label>🏟️ Lugar</label>
    <select id="selectLugar">
      <option value="LIGA SANTA RITA - Cancha 1">LIGA SANTA RITA - Cancha 1</option>
      <option value="LIGA SANTA RITA - Cancha 2">LIGA SANTA RITA - Cancha 2</option>
    </select>
    
    <label>📊 Resultado</label>
    <input type="text" id="inputResultado" placeholder="Ej: 3-1 | VS" value="VS">
    
    <label>🏁 Estado</label>
    <select id="selectEstado">
      <option value="PENDIENTE">⏳ PENDIENTE</option>
      <option value="PRÓXIMO">🔥 PRÓXIMO</option>
      <option value="FINALIZADO">✅ FINALIZADO</option>
    </select>
    
    <label>📝 Vocalía</label>
    <input type="text" id="inputVocalia" placeholder="Vocalía asignada">
    
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelar">Cancelar</button>
      <button class="btn-save" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<script>
// =========================================
// CONFIGURACIÓN
// =========================================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyzcYqHxUClX9M9QNOarHrQ_bShfJA-kRSzDrCMpj41ABt19ysfP53Bg9bQLgvtELgN/exec';

let rivalesList = [];
let partidosList = [];
let editandoId = null;
let editandoFila = null;

// =========================================
// FUNCIONES DE API
// =========================================
async function cargarDatosGET(accion) {
  try {
    const url = `${WEBAPP_URL}?accion=${accion}&t=${Date.now()}`;
    const response = await fetch(url);
    const data = await response.json();
    return data;
  } catch(error) {
    console.error(`Error cargando ${accion}:`, error);
    return null;
  }
}

async function enviarDatosPOST(accion, datos) {
  try {
    const response = await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, ...datos })
    });
    return { success: true };
  } catch(error) {
    console.error('Error en POST:', error);
    return { success: false, error: error.message };
  }
}

async function cargarRivales() {
  const data = await cargarDatosGET('getRivales');
  if (data && data.success && data.data && data.data.length > 0) {
    rivalesList = data.data;
  } else {
    rivalesList = [
      { nombre: 'IDEAL' }, { nombre: 'BARZA' }, { nombre: 'SAN MARTIN' },
      { nombre: 'INDEPENDIENTE' }, { nombre: 'VODKILA' }, { nombre: 'CHELSEA' },
      { nombre: 'JUVENTUD DE AMERICA' }, { nombre: 'JUVENTUS' }, 
      { nombre: 'LEONES' }, { nombre: 'FRANCO CANADIENSE' }
    ];
  }
  
  const select = document.getElementById('selectRival');
  select.innerHTML = '<option value="">Selecciona un rival...</option>';
  rivalesList.forEach(rival => {
    const option = document.createElement('option');
    option.value = rival.nombre;
    option.textContent = rival.nombre;
    select.appendChild(option);
  });
}

async function cargarPartidos() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = `
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Cargando partidos...</div>
    </div>
  `;
  
  const data = await cargarDatosGET('getPartidos');
  if (data && data.success && data.data) {
    partidosList = data.data;
    renderPartidos();
  } else {
    container.innerHTML = '<div class="loading-container"><div class="loading-text">📋 No hay partidos programados</div></div>';
    partidosList = [];
  }
}

function renderPartidos() {
  const container = document.getElementById('matchesContainer');
  if (!partidosList || partidosList.length === 0) {
    container.innerHTML = '<div class="loading-container"><div class="loading-text">📋 No hay partidos programados</div></div>';
    return;
  }
  
  container.innerHTML = '';
  partidosList.forEach(partido => {
    const fechaFormateada = formatearFecha(partido.fecha);
    const resultado = partido.resultado || 'VS';
    const estado = partido.estado || 'PENDIENTE';
    const abrevRival = partido.rival ? partido.rival.substring(0, 3).toUpperCase() : 'RIV';
    
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-top">
        <div class="match-date">${fechaFormateada}</div>
        <div class="status ${estado}">${estado}</div>
      </div>
      <div class="teams">
        <div class="team">
          <div class="team-logo home">NFC</div>
          <h3>${partido.local || 'NAPOLES F.C.'}</h3>
        </div>
        <div class="score">${resultado}</div>
        <div class="team">
          <div class="team-logo away">${abrevRival}</div>
          <h3>${partido.rival || 'Rival'}</h3>
        </div>
      </div>
      <div class="match-info">
        <div class="info-item">
          <span class="material-symbols-outlined">schedule</span>
          <span>${partido.hora || '--:--'}</span>
        </div>
        <div class="info-item">
          <span class="material-symbols-outlined">location_on</span>
          <span>${partido.lugar || 'LIGA SANTA RITA'}</span>
        </div>
      </div>
      ${partido.vocalia ? `<div class="info-item"><span class="material-symbols-outlined">assignment</span><span>Vocalía: ${partido.vocalia}</span></div>` : ''}
      <div class="card-actions">
        <button class="btn-edit" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">edit</span> Editar
        </button>
        <button class="btn-delete" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">delete</span> Eliminar
        </button>
      </div>
    `;
    container.appendChild(card);
  });
  
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const fila = parseInt(btn.dataset.fila);
      abrirModalEditar(id, fila);
    });
  });
  
  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const fila = parseInt(btn.dataset.fila);
      if (confirm('¿Eliminar este partido?')) {
        eliminarPartido(fila);
      }
    });
  });
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return 'Fecha por definir';
  try {
    const fecha = new Date(fechaStr);
    return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) {
    return fechaStr;
  }
}

function abrirModalNuevo() {
  editandoId = null;
  editandoFila = null;
  document.getElementById('modalTitle').textContent = 'Nuevo Partido';
  document.getElementById('inputFecha').value = '';
  document.getElementById('inputHora').value = '';
  document.getElementById('selectRival').value = '';
  document.getElementById('selectLugar').value = 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = 'VS';
  document.getElementById('selectEstado').value = 'PENDIENTE';
  document.getElementById('inputVocalia').value = '';
  document.getElementById('modal').classList.add('active');
}

function abrirModalEditar(id, fila) {
  const partido = partidosList.find(p => p.id === id);
  if (!partido) return;
  
  editandoId = id;
  editandoFila = fila;
  document.getElementById('modalTitle').textContent = 'Editar Partido';
  document.getElementById('inputFecha').value = partido.fecha || '';
  document.getElementById('inputHora').value = partido.hora || '';
  document.getElementById('selectRival').value = partido.rival || '';
  document.getElementById('selectLugar').value = partido.lugar || 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = partido.resultado || 'VS';
  document.getElementById('selectEstado').value = partido.estado || 'PENDIENTE';
  document.getElementById('inputVocalia').value = partido.vocalia || '';
  document.getElementById('modal').classList.add('active');
}

async function guardarPartido() {
  const partido = {
    fecha: document.getElementById('inputFecha').value,
    hora: document.getElementById('inputHora').value,
    rival: document.getElementById('selectRival').value,
    local: 'NAPOLES F.C.',
    lugar: document.getElementById('selectLugar').value,
    resultado: document.getElementById('inputResultado').value || 'VS',
    estado: document.getElementById('selectEstado').value,
    vocalia: document.getElementById('inputVocalia').value
  };
  
  if (!partido.rival) {
    alert('Selecciona un rival');
    return;
  }
  
  let res;
  if (editandoFila !== null) {
    partido.fila = editandoFila;
    res = await enviarDatosPOST('actualizar', { partido });
  } else {
    res = await enviarDatosPOST('agregar', { partido });
  }
  
  cerrarModal();
  mostrarToast('✅ Partido guardado. Recargando...');
  setTimeout(() => cargarPartidos(), 1000);
}

async function eliminarPartido(fila) {
  await enviarDatosPOST('eliminar', { fila });
  mostrarToast('🗑️ Partido eliminado. Recargando...');
  setTimeout(() => cargarPartidos(), 1000);
}

function mostrarToast(mensaje) {
  let toast = document.querySelector('.toast');
  if (toast) toast.remove();
  toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = mensaje;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('active');
}

// =========================================
// VALIDAR ADMIN
// =========================================
if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// =========================================
// INICIALIZAR
// =========================================
document.addEventListener('DOMContentLoaded', async () => {
  await cargarRivales();
  await cargarPartidos();
  
  document.getElementById('btnAgregar').addEventListener('click', abrirModalNuevo);
  document.getElementById('btnRefrescar').addEventListener('click', () => cargarPartidos());
  document.getElementById('btnGuardar').addEventListener('click', guardarPartido);
  document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) cerrarModal();
  });
});
</script>
</body>
</html>
