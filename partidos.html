<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partidos - Nápoles F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #f3f6fb 0%, #e8eef5 100%);
  color: #111827;
  min-height: 100vh;
  overflow-x: hidden;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #e5e7eb;
  border-top-color: #16a34a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px auto;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(229,231,235,0.5);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.admin-info h1 {
  font-size: 1.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #16a34a, #059669);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.admin-info p {
  font-size: .8rem;
  color: #6b7280;
  margin-top: 2px;
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 20px;
  background: linear-gradient(135deg, #16a34a, #4ade80);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(22,163,74,0.3);
}

.avatar:hover {
  transform: rotate(180deg) scale(1.05);
  box-shadow: 0 6px 16px rgba(22,163,74,0.4);
}

.matches {
  padding: 20px 18px 40px;
}

.match-card {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 28px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.02);
  transition: all 0.3s ease;
  animation: fadeInUp 0.5s ease;
  border: 1px solid rgba(255,255,255,0.5);
}

.match-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 32px rgba(0,0,0,0.1);
}

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.match-date {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  color: #059669;
  padding: 8px 16px;
  border-radius: 40px;
  font-size: .8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.match-date::before {
  content: "📅";
  font-size: 0.9rem;
}

.status {
  padding: 8px 16px;
  border-radius: 40px;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.status.FINALIZADO { 
  background: linear-gradient(135deg, #16a34a, #059669);
  color: #fff;
  box-shadow: 0 2px 8px rgba(22,163,74,0.3);
}
.status.PRÓXIMO { 
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
}
.status.PENDIENTE { 
  background: linear-gradient(135deg, #ea580c, #c2410c);

  box-shadow: 0 2px 8px rgba(234,88,12,0.3);
}

.teams {
  display: flex;
  align-items: center;

  margin-bottom: 24px;
  gap: 15px;
}

.team {
  display: flex;

  align-items: center;

  width: 40%;
}

.team-logo {
  width: 75px;
  height: 75px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 1.2rem;
  font-weight: 800;
  transition: transform 0.3s ease;
}

.team-logo:hover {
  transform: scale(1.05);
}

.home {
  background: linear-gradient(135deg, #2563eb, #3b82f6);

}

}

.match-info {

  justify-content: space-around;
  margin-top: 16px;

.info-item {

  gap: 8px;

  padding: 6px 14px;

}

.info-item:hover {
  background: #f3f4f6;
  transform: translateY(-2px);
}

.info-item .material-symbols-outlined {

}

.card-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: flex-end;
}

.btn-edit, .btn-delete {
  padding: 8px 20px;
  border-radius: 40px;
  border: none;
  font-weight: 600;
  font-size: 0.8rem;

  align-items: center;

}

.btn-edit {

}

.btn-edit:hover {
  background: #c7d2fe;

}

.btn-delete {

}

.btn-delete:hover {
  background: #fecaca;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(220,38,38,0.2);
}

.fab {

  height: 64px;

  align-items: center;

  cursor: pointer;

.fab:hover {

}

.fab .material-symbols-outlined {

}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  animation: fadeInUp 0.3s ease;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 36px;
  width: 90%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 28px;
  animation: slideIn 0.3s ease;
  box-shadow: 0 32px 64px rgba(0,0,0,0.2);
}

.modal-content h2 {
  margin-bottom: 24px;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #16a34a, #059669);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.modal-content input,
.modal-content select {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  border: 2px solid #e5e7eb;
  border-radius: 20px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  transition: all 0.2s;
  background: #f9fafb;
}

.modal-content input:focus,
.modal-content select:focus {
  outline: none;
  border-color: #16a34a;
  background: white;
  box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
}

.modal-content label {
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
  color: #374151;
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 24px;
}

.modal-actions button {
  padding: 12px 28px;
  border-radius: 40px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-save {
  background: linear-gradient(135deg, #16a34a, #059669);
  color: white;
  box-shadow: 0 4px 12px rgba(22,163,74,0.3);
}

.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(22,163,74,0.4);
}

.btn-save:disabled {
  opacity: 0.6;
  transform: none;
}

.btn-cancel {
  background: #f3f4f6;
  color: #374151;
}

.btn-cancel:hover {
  background: #e5e7eb;
  transform: translateY(-2px);
}

.loading-container {
  text-align: center;
  padding: 80px 20px;
}

.loading-text {
  color: #6b7280;
  font-size: 0.9rem;
  margin-top: 20px;
  animation: pulse 1.5s ease infinite;
}

.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  padding: 12px 24px;
  border-radius: 40px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 300;
  animation: fadeInUp 0.3s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-state .material-symbols-outlined {
  font-size: 64px;
  color: #cbd5e1;
  margin-bottom: 16px;
}

.empty-state p {
  color: #94a3b8;
  font-size: 1rem;
}

.vocalia-badge {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: white;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-left: 8px;
}

@media(min-width: 700px) {
  .matches {
    max-width: 700px;
    margin: auto;
  }
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #f1f1f1;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: #c1c1c1;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #a1a1a1;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <div class="admin-info">
      <h1>⚽ Partidos</h1>
      <p>Nápoles F.C. | Temporada 2026</p>
    </div>
  </div>
  <div class="avatar" id="btnRefrescar">
    <span class="material-symbols-outlined">refresh</span>
  </div>
</header>

<section class="matches" id="matchesContainer">
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando partidos y rivales...</div>
  </div>
</section>

<button class="fab" id="btnAgregar">
  <span class="material-symbols-outlined">add</span>
</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">📅 Nuevo Partido</h2>
    
    <label>📅 Fecha</label>
    <input type="date" id="inputFecha">
    
    <label>⏰ Hora</label>
    <input type="time" id="inputHora">
    
    <label>⚽ Rival</label>
    <select id="selectRival">
      <option value="">Cargando rivales...</option>
    </select>
    
    <label>🏟️ Lugar</label>
    <select id="selectLugar">
      <option value="LIGA SANTA RITA - Cancha 1">🏟️ LIGA SANTA RITA - Cancha 1</option>
      <option value="LIGA SANTA RITA - Cancha 2">🏟️ LIGA SANTA RITA - Cancha 2</option>
    </select>
    
    <label>📊 Resultado</label>
    <input type="text" id="inputResultado" placeholder="Ej: 3-1 | VS" value="VS">
    
    <label>🏁 Estado</label>
    <select id="selectEstado">
      <option value="PENDIENTE">⏳ PENDIENTE</option>
      <option value="PRÓXIMO">🔥 PRÓXIMO</option>
      <option value="FINALIZADO">✅ FINALIZADO</option>
    </select>
    
    <label>📝 Vocalía</label>
    <input type="text" id="inputVocalia" placeholder="Ej: 17, 18, o nombre">
    
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelar">Cancelar</button>
      <button class="btn-save" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<script>
// =========================================
// CONFIGURACIÓN
// =========================================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyzcYqHxUClX9M9QNOarHrQ_bShfJA-kRSzDrCMpj41ABt19ysfP53Bg9bQLgvtELgN/exec';

let rivalesList = [];
let partidosList = [];
let editandoId = null;
let editandoFila = null;
let guardando = false;

// =========================================
// FUNCIONES DE API
// =========================================
async function cargarDatosGET(accion) {
  try {
    const url = `${WEBAPP_URL}?accion=${accion}&t=${Date.now()}`;
    const response = await fetch(url);
    const data = await response.json();
    return data;
  } catch(error) {
    console.error(`Error cargando ${accion}:`, error);
    return null;
  }
}

async function enviarDatosPOST(accion, datos) {
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, ...datos })
    });
    return { success: true };
  } catch(error) {
    console.error('Error en POST:', error);
    return { success: false, error: error.message };
  }
}

async function cargarRivales() {
  const data = await cargarDatosGET('getRivales');
  if (data && data.success && data.data && data.data.length > 0) {
    rivalesList = data.data;
  } else {
    rivalesList = [
      { nombre: 'IDEAL' }, { nombre: 'BARZA' }, { nombre: 'SAN MARTIN' },
      { nombre: 'INDEPENDIENTE' }, { nombre: 'VODKILA' }, { nombre: 'CHELSEA' },
      { nombre: 'JUVENTUD DE AMERICA' }, { nombre: 'JUVENTUS' }, 
      { nombre: 'LEONES' }, { nombre: 'FRANCO CANADIENSE' }
    ];
  }
  
  const select = document.getElementById('selectRival');
  select.innerHTML = '<option value="">🔽 Selecciona un rival...</option>';
  rivalesList.forEach(rival => {
    const option = document.createElement('option');
    option.value = rival.nombre;
    option.textContent = rival.nombre;
    select.appendChild(option);
  });
}

async function cargarPartidos() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = `
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Cargando partidos...</div>
    </div>
  `;
  
  const data = await cargarDatosGET('getPartidos');
  if (data && data.success && data.data) {
    partidosList = data.data;
    renderPartidos();
  } else {
    container.innerHTML = `
      <div class="empty-state">
        <span class="material-symbols-outlined">sports_soccer</span>
        <p>📋 No hay partidos programados</p>
        <p style="font-size: 0.8rem; margin-top: 8px;">Presiona el botón + para agregar</p>
      </div>
    `;
    partidosList = [];
  }
}

// =========================================
// FUNCIÓN CORREGIDA PARA FORMATEAR HORA
// =========================================
function formatearHora(horaStr) {
  if (!horaStr) return '--:--';
  
  // Si ya viene en formato HH:MM (ej: "12:00", "20:30")
  if (typeof horaStr === 'string' && horaStr.match(/^([0-1][0-9]|2[0-3]):[0-5][0-9]$/)) {
    return horaStr;
  }
  
  // Si es un número (fecha de Excel/Google Sheets)
  if (typeof horaStr === 'number') {
    // Excel/Sheet guarda horas como fracción de día
    // 0.5 = 12:00, 0.25 = 06:00, etc.
    const totalSegundos = Math.round(horaStr * 86400);
    const horas = Math.floor(totalSegundos / 3600);
    const minutos = Math.floor((totalSegundos % 3600) / 60);
    return `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}`;
  }
  
  // Si es string con formato ISO (ej: "1899-12-30T12:00:00.000Z")
  if (typeof horaStr === 'string' && horaStr.includes('T')) {
    try {
      const fecha = new Date(horaStr);
      if (!isNaN(fecha.getTime())) {
        return fecha.toLocaleTimeString('es-ES', { 
          hour: '2-digit', 
          minute: '2-digit', 
          hour12: false 
        });
      }
    } catch(e) {}
  }
  
  // Si es string con formato "HH:MM:SS"
  if (typeof horaStr === 'string' && horaStr.includes(':')) {
    const partes = horaStr.split(':');
    if (partes.length >= 2) {
      return `${partes[0].padStart(2, '0')}:${partes[1].padStart(2, '0')}`;
    }
  }
  
  return horaStr.toString().substring(0, 5) || '--:--';
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return 'Fecha por definir';
  try {
    const fecha = new Date(fechaStr);
    return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) {
    return fechaStr;
  }
}

function renderPartidos() {
  const container = document.getElementById('matchesContainer');
  if (!partidosList || partidosList.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="material-symbols-outlined">sports_soccer</span>
        <p>📋 No hay partidos programados</p>
        <p style="font-size: 0.8rem; margin-top: 8px;">Presiona el botón + para agregar</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = '';
  partidosList.forEach(partido => {
    const fechaFormateada = formatearFecha(partido.fecha);
    const horaFormateada = formatearHora(partido.hora);
    const resultado = partido.resultado || 'VS';
    const estado = partido.estado || 'PENDIENTE';
    const abrevRival = partido.rival ? partido.rival.substring(0, 3).toUpperCase() : 'RIV';
    
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-top">
        <div class="match-date">${fechaFormateada}</div>
        <div class="status ${estado}">${estado}</div>
      </div>
      <div class="teams">
        <div class="team">
          <div class="team-logo home">NFC</div>
          <h3>${partido.local || 'NAPOLES F.C.'}</h3>
        </div>
        <div class="score">${resultado}</div>
        <div class="team">
          <div class="team-logo away">${abrevRival}</div>
          <h3>${partido.rival || 'Rival'}</h3>
        </div>
      </div>
      <div class="match-info">
        <div class="info-item">
          <span class="material-symbols-outlined">schedule</span>
          <span>${horaFormateada}</span>
        </div>
        <div class="info-item">
          <span class="material-symbols-outlined">location_on</span>
          <span>${partido.lugar || 'LIGA SANTA RITA'}</span>
        </div>
        ${partido.vocalia ? `<div class="info-item"><span class="material-symbols-outlined">assignment</span><span>Vocalía: ${partido.vocalia}</span></div>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-edit" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">edit</span> Editar
        </button>
        <button class="btn-delete" data-id="${partido.id}" data-fila="${partido.fila}">
          <span class="material-symbols-outlined">delete</span> Eliminar
        </button>
      </div>
    `;
    container.appendChild(card);
  });
  
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const fila = parseInt(btn.dataset.fila);
      abrirModalEditar(id, fila);
    });
  });
  
  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const fila = parseInt(btn.dataset.fila);
      if (confirm('¿Eliminar este partido?')) {
        eliminarPartido(fila);
      }
    });
  });
}

function abrirModalNuevo() {
  editandoId = null;
  editandoFila = null;
  document.getElementById('modalTitle').textContent = '📅 Nuevo Partido';
  document.getElementById('inputFecha').value = '';
  document.getElementById('inputHora').value = '';
  document.getElementById('selectRival').value = '';
  document.getElementById('selectLugar').value = 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = 'VS';
  document.getElementById('selectEstado').value = 'PENDIENTE';
  document.getElementById('inputVocalia').value = '';
  document.getElementById('modal').classList.add('active');
}

function abrirModalEditar(id, fila) {
  const partido = partidosList.find(p => p.id === id);
  if (!partido) return;
  
  editandoId = id;
  editandoFila = fila;
  document.getElementById('modalTitle').textContent = '✏️ Editar Partido';
  document.getElementById('inputFecha').value = partido.fecha || '';
  document.getElementById('inputHora').value = partido.hora || '';
  document.getElementById('selectRival').value = partido.rival || '';
  document.getElementById('selectLugar').value = partido.lugar || 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = partido.resultado || 'VS';
  document.getElementById('selectEstado').value = partido.estado || 'PENDIENTE';
  document.getElementById('inputVocalia').value = partido.vocalia || '';
  document.getElementById('modal').classList.add('active');
}

async function guardarPartido() {
  if (guardando) {
    mostrarToast('⏳ Ya se está guardando, espera...');
    return;
  }
  
  const partido = {
    fecha: document.getElementById('inputFecha').value,
    hora: document.getElementById('inputHora').value,
    rival: document.getElementById('selectRival').value,
    local: 'NAPOLES F.C.',
    lugar: document.getElementById('selectLugar').value,
    resultado: document.getElementById('inputResultado').value || 'VS',
    estado: document.getElementById('selectEstado').value,
    vocalia: document.getElementById('inputVocalia').value
  };
  
  if (!partido.rival) {
    alert('Selecciona un rival');
    return;
  }
  
  guardando = true;
  const btnGuardar = document.getElementById('btnGuardar');
  const textoOriginal = btnGuardar.textContent;
  btnGuardar.textContent = '⏳ Guardando...';
  btnGuardar.disabled = true;
  
  try {
    if (editandoFila !== null) {
      partido.fila = editandoFila;
      await enviarDatosPOST('actualizar', { partido });
    } else {
      await enviarDatosPOST('agregar', { partido });
    }
    
    cerrarModal();
    mostrarToast('✅ Partido guardado correctamente');
    setTimeout(() => cargarPartidos(), 1000);
  } catch (error) {
    mostrarToast('❌ Error al guardar');
  } finally {
    setTimeout(() => {
      btnGuardar.textContent = textoOriginal;
      btnGuardar.disabled = false;
      guardando = false;
    }, 1000);
  }
}

async function eliminarPartido(fila) {
  if (guardando) {
    mostrarToast('⏳ Espera a que termine la operación actual');
    return;
  }
  
  guardando = true;
  await enviarDatosPOST('eliminar', { fila });
  mostrarToast('🗑️ Partido eliminado');
  setTimeout(() => {
    cargarPartidos();
    guardando = false;
  }, 1000);
}

function mostrarToast(mensaje) {
  let toast = document.querySelector('.toast');
  if (toast) toast.remove();
  toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = mensaje;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('active');
}

// =========================================
// VALIDAR ADMIN
// =========================================
if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// =========================================
// INICIALIZAR
// =========================================
document.addEventListener('DOMContentLoaded', async () => {
  await cargarRivales();
  await cargarPartidos();
  
  document.getElementById('btnAgregar').addEventListener('click', abrirModalNuevo);
  document.getElementById('btnRefrescar').addEventListener('click', () => cargarPartidos());
  document.getElementById('btnGuardar').addEventListener('click', guardarPartido);
  document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) cerrarModal();
  });
});
</script>
