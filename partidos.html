<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-start: #fff5f7;
    --bg-end: #fce4ec;
    --card-bg: rgba(255, 255, 255, 0.75);
    --card-border: rgba(255, 105, 180, 0.2);
    --primary: #ec407a;
    --primary-light: #f8bbd0;
    --primary-dark: #c2185b;
    --text-primary: #4a4a4a;
    --text-secondary: #7a7a7a;
    --shadow: 0 8px 30px rgba(233, 30, 99, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .glass-panel {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 0.5px solid var(--card-border);
    box-shadow: var(--shadow);
    border-radius: 24px;
  }

  .pink-border-top {
    border-top: 2px solid var(--primary);
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }

  .btn-pink {
    background: var(--primary);
    color: white;
    transition: all 0.2s;
  }
  .btn-pink:hover { background: var(--primary-dark); transform: scale(1.02); }
  .btn-outline-pink {
    border: 1.5px solid var(--primary);
    color: var(--primary);
    background: transparent;
    transition: all 0.2s;
  }
  .btn-outline-pink:hover { background: var(--primary-light); }

  .status-fit { color: #2e7d32; background: #e8f5e9; padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
  .status-upcoming { color: #c2185b; background: #fce4ec; padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
  .status-pending { color: #e65100; background: #fff3e0; padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }

  .match-card {
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .match-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(233, 30, 99, 0.12);
  }

  .fab {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 30px;
    background: linear-gradient(135deg, #ec407a, #c2185b);
    color: white;
    border: none;
    box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
    cursor: pointer;
    transition: all 0.3s;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 35px rgba(233, 30, 99, 0.5); }
  .fab .material-symbols-outlined { font-size: 32px; }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    border-top: 0.5px solid rgba(233, 30, 99, 0.15);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 100;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
  }
  .bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 12px;
    border-radius: 16px;
    color: #b0b0b0;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.5rem;
    gap: 2px;
    min-width: 56px;
    border: none;
    background: transparent;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .bottom-nav .nav-item .material-symbols-outlined { font-size: 24px; transition: all 0.2s; }
  .bottom-nav .nav-item:hover { color: var(--primary); }
  .bottom-nav .nav-item:active { transform: scale(0.92); }
  .bottom-nav .nav-item.active { color: var(--primary); }
  .bottom-nav .nav-item.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content {
    background: white;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 32px;
    padding: 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.1);
    border: 1px solid rgba(233, 30, 99, 0.1);
  }
  .modal-content h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-content label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }
  .modal-content input, .modal-content select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1.5px solid #f0e0e5;
    background: #fafafa;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    margin-bottom: 14px;
    transition: all 0.2s;
    color: var(--text-primary);
  }
  .modal-content input:focus, .modal-content select:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(50,50,50,0.9);
    color: white;
    padding: 10px 24px;
    border-radius: 30px;
    font-weight: 600;
    z-index: 300;
    backdrop-filter: blur(4px);
    font-size: 0.8rem;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    animation: toastAnim 2.5s ease forwards;
    pointer-events: none;
  }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  .loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #f0e0e5;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
  }
  .empty-state .material-symbols-outlined { font-size: 48px; color: var(--primary-light); margin-bottom: 12px; }

  @media (max-width: 480px) {
    .modal-content { padding: 20px; }
    .bottom-nav .nav-item { min-width: 44px; padding: 2px 6px; }
    .bottom-nav .nav-item .material-symbols-outlined { font-size: 20px; }
  }
</style>
</head>

<script>
// ================= CONFIGURACIÓN =================
// ⚠️ CAMBIA ESTA URL POR LA DE TU SCRIPT PUBLICADO ⚠️
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzM8SB4u4Owa1ubdjUqNTuRN2Y5syNJrrnkiw4NcTTKxaH9pMftMhACYmMaVRjJxmMl/exec';

let rivalesList = [];
let partidosList = [];
let editandoId = null;
let editandoFila = null;
let guardando = false;

// ================= HELPER =================
function parseResultado(str) {
  if (!str || str === 'VS') return { home: null, away: null, valid: false };
  let clean = str.toString().trim().replace(/\s/g, '');
  if (clean.includes('-')) {
    let parts = clean.split('-');
    if (parts.length === 2) {
      let h = parseInt(parts[0], 10);
      let a = parseInt(parts[1], 10);
      if (!isNaN(h) && !isNaN(a)) return { home: h, away: a, valid: true };
    }
  }
  return { home: null, away: null, valid: false };
}

function determinarResultado(str, estado) {
  if (estado !== 'FINALIZADO') return null;
  const p = parseResultado(str);
  if (!p.valid) return null;
  if (p.home > p.away) return 'VICTORIA';
  if (p.home < p.away) return 'DERROTA';
  return 'EMPATE';
}

// ================= API =================
async function cargarDatosGET(accion, params = {}) {
  try {
    let url = `${WEBAPP_URL}?accion=${accion}&t=${Date.now()}`;
    for (let k in params) { if (params[k]) url += `&${k}=${encodeURIComponent(params[k])}`; }
    const resp = await fetch(url);
    return await resp.json();
  } catch(e) { console.error(e); return null; }
}

async function enviarDatosPOST(accion, datos) {
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, ...datos })
    });
    return { success: true };
  } catch(e) { console.error(e); return { success: false, error: e.message }; }
}

// ================= RIVALES =================
async function cargarRivales(campeonato) {
  const select = document.getElementById('selectRival');
  select.innerHTML = '<option value="">Cargando...</option>';
  select.disabled = true;
  const data = await cargarDatosGET('getRivales', { campeonato: campeonato || '' });
  if (data && data.success && data.data && data.data.length) {
    rivalesList = data.data;
    select.innerHTML = '<option value="">🔽 Selecciona rival</option>';
    rivalesList.forEach(r => {
      let opt = document.createElement('option');
      opt.value = r.nombre;
      opt.textContent = r.nombre;
      select.appendChild(opt);
    });
  } else {
    select.innerHTML = '<option value="">No hay rivales para este campeonato</option>';
  }
  select.disabled = false;
}

// ================= PARTIDOS =================
async function cargarPartidos() {
  const container = document.getElementById('matchContainer');
  container.innerHTML = `<div class="col-span-2 text-center py-12"><div class="loading-spinner mx-auto"></div><p class="text-pink-400 text-sm mt-2">Cargando encuentros...</p></div>`;
  const data = await cargarDatosGET('getPartidos');
  if (data && data.success && data.data) {
    partidosList = data.data;
    renderPartidos(partidosList);
  } else {
    container.innerHTML = `<div class="col-span-2 empty-state"><span class="material-symbols-outlined">sports_soccer</span><p>No hay partidos registrados</p><p class="text-xs opacity-60 mt-1">Presiona + para crear uno nuevo</p></div>`;
    partidosList = [];
  }
  actualizarEstadisticas();
}

function actualizarEstadisticas() {
  let total = partidosList.length;
  let victorias = 0, goles = 0;
  partidosList.forEach(p => {
    if (p.estado === 'FINALIZADO') {
      const r = parseResultado(p.resultado);
      if (r.valid) { goles += r.home; if (r.home > r.away) victorias++; }
    }
  });
  document.getElementById('totalPartidos').textContent = total;
  document.getElementById('totalVictorias').textContent = victorias;
  document.getElementById('totalGoles').textContent = goles;
}

function formatearFecha(f) {
  if (!f) return 'Sin fecha';
  try { const d = new Date(f); return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' }); }
  catch(e) { return f; }
}
function formatearHora(h) {
  if (!h) return '--:--';
  let raw = String(h);
  if (raw.includes(':')) { let seg = raw.split(':'); if (seg.length >= 2) return `${seg[0].padStart(2,'0')}:${seg[1].padStart(2,'0')}`; }
  if (typeof h === 'number') { let totalSec = Math.round(h * 86400); let hh = Math.floor(totalSec / 3600); let mm = Math.floor((totalSec % 3600) / 60); return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`; }
  if (raw.match(/^([0-1][0-9]|2[0-3]):[0-5][0-9]$/)) return raw;
  return raw.substring(0,5) || '--:--';
}

function renderPartidos(lista) {
  const container = document.getElementById('matchContainer');
  if (!lista.length) {
    container.innerHTML = `<div class="col-span-2 empty-state"><span class="material-symbols-outlined">sports_soccer</span><p>No hay partidos registrados</p><p class="text-xs opacity-60 mt-1">Presiona + para crear uno nuevo</p></div>`;
    return;
  }
  container.innerHTML = '';
  lista.forEach(partido => {
    const fecha = formatearFecha(partido.fecha);
    const hora = formatearHora(partido.hora);
    const estado = partido.estado || 'PENDIENTE';
    const rival = partido.rival || 'Desconocido';
    const resultado = partido.resultado || 'VS';
    const outcome = determinarResultado(resultado, estado);
    const parsed = parseResultado(resultado);
    const esFinalizado = estado === 'FINALIZADO';

    let statusBadge = '';
    if (estado === 'FINALIZADO') statusBadge = `<span class="status-fit">✅ Finalizado</span>`;
    else if (estado === 'PRÓXIMO') statusBadge = `<span class="status-upcoming">🔥 Próximo</span>`;
    else statusBadge = `<span class="status-pending">⏳ Pendiente</span>`;

    let scoreHTML = '';
    if (esFinalizado && parsed.valid) {
      let homeColor = 'text-pink-700', awayColor = 'text-pink-700';
      if (outcome === 'VICTORIA') { homeColor = 'text-green-600'; awayColor = 'text-gray-400'; }
      else if (outcome === 'DERROTA') { homeColor = 'text-gray-400'; awayColor = 'text-red-500'; }
      else if (outcome === 'EMPATE') { homeColor = 'text-amber-500'; awayColor = 'text-amber-500'; }
      scoreHTML = `
        <div class="flex items-baseline gap-1">
          <span class="font-bold text-2xl ${homeColor}">${parsed.home}</span>
          <span class="text-gray-300 text-xl">-</span>
          <span class="font-bold text-2xl ${awayColor}">${parsed.away}</span>
        </div>
        <span class="text-[9px] font-bold uppercase tracking-wider ${outcome === 'VICTORIA' ? 'text-green-600' : outcome === 'DERROTA' ? 'text-red-500' : 'text-amber-500'}">${outcome}</span>
      `;
    } else {
      scoreHTML = `<span class="text-gray-300 text-2xl font-light">${resultado === 'VS' ? 'VS' : resultado}</span>`;
    }

    const card = document.createElement('div');
    card.className = 'glass-panel match-card p-4 flex flex-col gap-3';
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div class="flex flex-col gap-1">
          <div class="flex items-center gap-2 flex-wrap">
            ${statusBadge}
            <span class="text-[10px] text-pink-400 font-bold uppercase tracking-wider">${partido.campeonato || ''}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-pink-600">${fecha}</span>
            <span class="text-xs text-gray-400">${hora}</span>
          </div>
        </div>
        <div class="flex gap-1">
          <button class="p-1.5 rounded-lg hover:bg-pink-50 text-pink-300 hover:text-pink-600 transition-colors ${esFinalizado ? 'opacity-40 cursor-not-allowed' : ''}" ${esFinalizado ? 'disabled' : ''} onclick="abrirEditar(${partido.id}, ${partido.fila})">
            <span class="material-symbols-outlined text-sm">edit</span>
          </button>
          <button class="p-1.5 rounded-lg hover:bg-pink-50 text-pink-300 hover:text-red-500 transition-colors ${esFinalizado ? 'opacity-40 cursor-not-allowed' : ''}" ${esFinalizado ? 'disabled' : ''} onclick="eliminarPartido(${partido.fila})">
            <span class="material-symbols-outlined text-sm">delete</span>
          </button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-4">
        <div class="flex flex-col items-center gap-1 flex-1">
          <div class="w-14 h-14 rounded-full bg-pink-50 flex items-center justify-center border border-pink-200 text-pink-600 font-bold text-lg">⚡</div>
          <span class="text-xs font-bold text-center uppercase tracking-wider">Napoles</span>
        </div>
        <div class="flex flex-col items-center gap-0">
          ${scoreHTML}
        </div>
        <div class="flex flex-col items-center gap-1 flex-1">
          <div class="w-14 h-14 rounded-full bg-gray-50 flex items-center justify-center border border-gray-200 text-gray-500 font-bold text-lg">${rival.substring(0,2).toUpperCase()}</div>
          <span class="text-xs font-bold text-center uppercase tracking-wider">${rival}</span>
        </div>
      </div>
      <div class="text-[10px] text-gray-400 flex items-center gap-3 border-t border-pink-100 pt-2 mt-1">
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">location_on</span> ${partido.lugar || 'LIGA SANTA RITA'}</span>
        ${partido.vocalia ? `<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">assignment_ind</span> ${partido.vocalia}</span>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}

// ================= FILTROS =================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => { b.style.background = 'transparent'; b.style.color = 'var(--text-secondary)'; b.style.borderColor = '#f0e0e5'; });
    this.style.background = 'var(--primary-light)';
    this.style.color = 'var(--primary)';
    this.style.borderColor = 'var(--primary)';
    const filter = this.dataset.filter;
    let filtered = partidosList;
    if (filter === 'proximo') filtered = partidosList.filter(p => p.estado === 'PRÓXIMO');
    else if (filter === 'finalizado') filtered = partidosList.filter(p => p.estado === 'FINALIZADO');
    else if (filter === 'pendiente') filtered = partidosList.filter(p => p.estado === 'PENDIENTE');
    renderPartidos(filtered);
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  const term = this.value.toLowerCase().trim();
  const filtered = partidosList.filter(p => (p.rival || '').toLowerCase().includes(term));
  renderPartidos(filtered);
});

// ================= MODAL =================
function abrirModalNuevo() {
  editandoId = null; editandoFila = null;
  document.getElementById('modalTitle').innerHTML = '<span class="material-symbols-outlined" style="color:var(--primary);">add_circle</span> Nuevo Partido';
  document.getElementById('matchForm').reset();
  document.getElementById('inputResultado').value = 'VS';
  document.getElementById('selectEstado').value = 'PENDIENTE';
  document.getElementById('selectRival').innerHTML = '<option value="">Selecciona un campeonato</option>';
  document.getElementById('selectRival').disabled = true;
  const campeonato = document.getElementById('selectCampeonato').value;
  cargarRivales(campeonato);
  document.getElementById('matchModal').classList.add('active');
}

function abrirEditar(id, fila) {
  const partido = partidosList.find(p => p.id === id);
  if (!partido) return;
  if (partido.estado === 'FINALIZADO') { mostrarToast('⛔ No se puede editar un partido finalizado'); return; }
  editandoId = id; editandoFila = fila;
  document.getElementById('modalTitle').innerHTML = '<span class="material-symbols-outlined" style="color:var(--primary);">edit_note</span> Editar Partido';
  document.getElementById('inputFecha').value = partido.fecha || '';
  document.getElementById('inputHora').value = partido.hora || '';
  document.getElementById('selectCampeonato').value = partido.campeonato || 'CAMPEONATO SANTA RITA';
  document.getElementById('selectLugar').value = partido.lugar || 'LIGA SANTA RITA - Cancha 1';
  document.getElementById('inputResultado').value = partido.resultado || 'VS';
  document.getElementById('selectEstado').value = partido.estado || 'PENDIENTE';
  document.getElementById('inputVocalia').value = partido.vocalia || '';
  const campeonato = partido.campeonato || 'CAMPEONATO SANTA RITA';
  cargarRivales(campeonato).then(() => {
    document.getElementById('selectRival').value = partido.rival || '';
  });
  document.getElementById('matchModal').classList.add('active');
}

function cerrarModal() {
  document.getElementById('matchModal').classList.remove('active');
}

document.getElementById('selectCampeonato').addEventListener('change', function() {
  if (document.getElementById('matchModal').classList.contains('active')) {
    cargarRivales(this.value);
    document.getElementById('selectRival').value = '';
  }
});

// ================= GUARDAR =================
document.getElementById('matchForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (guardando) { mostrarToast('⏳ Procesando...'); return; }
  const partido = {
    fecha: document.getElementById('inputFecha').value,
    hora: document.getElementById('inputHora').value,
    rival: document.getElementById('selectRival').value,
    local: 'NAPOLES F.C.',
    lugar: document.getElementById('selectLugar').value,
    resultado: document.getElementById('inputResultado').value.trim() || 'VS',
    estado: document.getElementById('selectEstado').value,
    vocalia: document.getElementById('inputVocalia').value,
    campeonato: document.getElementById('selectCampeonato').value
  };
  if (!partido.rival) { alert('Selecciona un rival'); return; }
  guardando = true;
  const btn = this.querySelector('button[type="submit"]');
  const orig = btn.textContent;
  btn.textContent = 'Guardando...';
  btn.disabled = true;
  try {
    if (editandoFila !== null) {
      partido.fila = editandoFila;
      await enviarDatosPOST('actualizar', { partido });
    } else {
      await enviarDatosPOST('agregar', { partido });
    }
    cerrarModal();
    mostrarToast('✅ Partido guardado');
    setTimeout(() => cargarPartidos(), 500);
  } catch(e) { mostrarToast('❌ Error'); }
  finally {
    btn.textContent = orig;
    btn.disabled = false;
    guardando = false;
  }
});

// ================= ELIMINAR =================
async function eliminarPartido(fila) {
  const partido = partidosList.find(p => p.fila === fila);
  if (partido && partido.estado === 'FINALIZADO') {
    mostrarToast('⛔ No se puede eliminar un partido finalizado');
    return;
  }
  if (!confirm('🗑️ ¿Eliminar este partido?')) return;
  if (guardando) { mostrarToast('⏳ Espera...'); return; }
  guardando = true;
  await enviarDatosPOST('eliminar', { fila });
  mostrarToast('🗑️ Partido eliminado');
  setTimeout(() => { cargarPartidos(); guardando = false; }, 500);
}

// ================= TOAST =================
function mostrarToast(msg) {
  let t = document.querySelector('.toast');
  if (t) t.remove();
  t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ================= ADMIN CHECK =================
if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// ================= INICIO =================
document.addEventListener('DOMContentLoaded', async function() {
  await cargarPartidos();
  document.getElementById('btnAgregar').addEventListener('click', abrirModalNuevo);
  document.getElementById('matchModal').addEventListener('click', function(e) {
    if (e.target === this) cerrarModal();
  });
  // Precargar rivales para el campeonato por defecto
  const def = document.getElementById('selectCampeonato').value;
  await cargarRivales(def);
});
</script>
