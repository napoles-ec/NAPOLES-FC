<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>Nápoles F.C. - Acceso</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#38bdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#00d2ff;--primary-dark:#008f9b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#020c1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;position:relative;overflow-x:hidden;overflow-y:auto}
body::before,body::after{content:'';position:fixed;width:950px;height:950px;border-radius:50%;filter:blur(130px);opacity:.85;z-index:0;animation:moveGlow 14s infinite ease-in-out;pointer-events:none}
body::before{background:radial-gradient(circle,rgba(0,210,255,.95) 0%,rgba(0,140,255,.55) 40%,transparent 75%);top:-340px;left:-260px}
body::after{background:radial-gradient(circle,rgba(111,0,255,.95) 0%,rgba(168,85,247,.55) 40%,transparent 75%);bottom:-340px;right:-260px;animation-delay:7s}
@keyframes moveGlow{0%{transform:translate(0,0) scale(1) rotate(0)}25%{transform:translate(120px,60px) scale(1.15) rotate(90)}50%{transform:translate(-90px,120px) scale(.9) rotate(180)}75%{transform:translate(80px,-90px) scale(1.08) rotate(270)}100%{transform:translate(0,0) scale(1) rotate(360)}}
.login-card{width:100%;max-width:430px;background:rgba(10,18,35,.76);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(0,210,255,.45);border-radius:34px;padding:42px 30px;box-shadow:0 0 35px rgba(0,210,255,.22),0 18px 45px rgba(0,0,0,.65);position:relative;z-index:2;transition:.45s}
.login-card.admin-mode{background:rgba(38,16,60,.84);border:1px solid rgba(168,85,247,.95);box-shadow:0 0 45px rgba(168,85,247,.55),0 18px 45px rgba(0,0,0,.75)}
.login-card.admin-mode .logo-area h1{background:linear-gradient(to right,#fff,#d8b4fe,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-card.admin-mode .logo-area p,.login-card.admin-mode a{color:#f3e8ff}
.login-card.admin-mode label{color:#d8b4fe}
.login-card.admin-mode input{border:2px solid rgba(168,85,247,.4);background:rgba(55,25,80,.78);box-shadow:0 0 18px rgba(168,85,247,.2)}
.login-card.admin-mode input:focus{border-color:#c084fc;box-shadow:0 0 25px rgba(168,85,247,.45)}
.login-card.admin-mode .btn-submit,.login-card.admin-mode #manualDownloadBtn{background:linear-gradient(135deg,#6d28d9,#a855f7);box-shadow:0 10px 25px rgba(168,85,247,.35)}
.logo-area{text-align:center;margin-bottom:38px}
.logo-area h1{font-size:2rem;font-weight:800;background:linear-gradient(to right,#fff,var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.logo-area p{opacity:.92;font-size:1rem;font-weight:700;color:#d7f7ff;letter-spacing:1px}
.input-group{margin-bottom:28px}
.input-group label{display:block;margin-bottom:12px;color:var(--primary);font-size:.82rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
input{width:100%;min-height:62px;border-radius:18px;border:2px solid rgba(255,255,255,.06);background:rgba(15,23,42,.7);color:#fff;font-size:1.2rem;font-weight:700;padding:0 18px;text-align:center;outline:none;transition:.35s}
input:focus{border-color:var(--primary);background:rgba(15,23,42,.92);box-shadow:0 0 18px rgba(0,210,255,.35)}
.btn-submit{width:100%;height:58px;border:none;border-radius:18px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;font-size:1rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:12px;transition:.35s}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,210,255,.35)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.error-message{display:none;margin-top:20px;padding:14px;border-radius:14px;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.35);color:#fecaca;text-align:center;font-size:.88rem;font-weight:600}
.footer-links{width:100%;margin-top:34px}
.footer-links a{color:#FFD700;font-weight:800;text-decoration:none}
#manualDownloadBtn{padding:14px 24px;border-radius:999px;border:none;background:linear-gradient(135deg,#00d2ff,#008f9b);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 10px 25px rgba(0,210,255,.25);margin-bottom:12px}
#manualDownloadBtn:hover{transform:translateY(-2px)}
.footer-version{text-align:center;margin-top:20px;font-size:0.7rem;opacity:0.6;color:#ccc}
.security-note{text-align:center;margin-top:15px;font-size:0.65rem;color:#a0aec0}
.update-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:2px solid #D4AF37;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;z-index:1001;box-shadow:0 4px 15px rgba(0,0,0,0.3);transform:translateY(-100%);transition:transform 0.3s ease}
.update-banner.show{transform:translateY(0)}
.update-banner button{background:#D4AF37;border:none;padding:6px 18px;border-radius:40px;font-weight:bold;color:#000;cursor:pointer}
@media(max-width:480px){.login-card{padding:32px 22px}.logo-area h1{font-size:1.7rem}input{min-height:56px;font-size:1.1rem}.btn-submit{height:54px}}
</style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="logo-area"><h1>NÁPOLES F.C.</h1><p>Acceso de Jugadores PRO</p></div>
  <form id="formLogin">
    <div class="input-group"><label>Ingresa tus credenciales</label><input type="text" id="loginCedula" placeholder="Cédula o clave admin" autocomplete="off" required></div>
    <button type="submit" id="btnLogin" class="btn-submit" disabled>Ingresa al Vestuario</button>
  </form>
  <div id="errorMsg" class="error-message"></div>
  <div class="footer-links">
    <p style="margin-top:30px;margin-bottom:24px;text-align:center;">¿No tienes cuenta? <a href="./index.html">REGÍSTRATE ✨</a></p>
    <div style="display:flex;justify-content:center;"><button id="manualDownloadBtn" type="button">📲 INSTALAR APP</button></div>
    <div class="footer-version" id="versionInfo"></div>
    <div class="security-note">🔒 Datos encriptados • Conexión segura • By Corporación 360</div>
  </div>
</div>
<div id="updateBanner" class="update-banner"><p><i class="fa-solid fa-arrow-rotate-right"></i> Nueva versión disponible. Actualiza para obtener las últimas mejoras.</p><button id="updateBtn">Actualizar ahora</button></div>

<script src="./config.js"></script>
<script>
// ==================== VERSIÓN ====================
(async function() {
  try {
    const res = await fetch('./sw.js');
    const txt = await res.text();
    const match = txt.match(/CACHE_NAME\s*=\s*['"](?:napoles-)?v?([\d\.]+)['"]/);
    const version = match ? 'v' + match[1] : 'v1.0.47';
    document.getElementById('versionInfo').innerHTML = `<span>${version}</span><span> • </span><span>By Corporación 360</span>`;
  } catch(e) {
    document.getElementById('versionInfo').innerHTML = `<span>v1.0.47</span><span> • </span><span>By Corporación 360</span>`;
  }
})();

// ==================== INSTALACIÓN PWA ====================
let deferredPrompt = null;
const installBtn = document.getElementById('manualDownloadBtn');

// Capturar el evento beforeinstallprompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('✅ beforeinstallprompt CAPTURADO. La app es instalable.');
  installBtn.textContent = '📲 INSTALAR APP (LISTO)';
  installBtn.style.background = "linear-gradient(135deg, #059669, #10b981)";
});

// Acción del botón de instalación
installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      console.log('Usuario aceptó la instalación');
    } else {
      console.log('Usuario rechazó la instalación');
    }
    deferredPrompt = null;
    installBtn.textContent = '📲 INSTALAR APP';
    installBtn.style.background = "linear-gradient(135deg, #00d2ff, #008f9b)";
  } else {
    alert('🔧 Instalación automática no disponible.\n\nPara instalar, abre el menú del navegador (tres puntos) y selecciona "Instalar aplicación".\nSi no ves la opción, asegúrate de interactuar con la página y esperar unos segundos.');
  }
});

// ==================== SERVICE WORKER Y ACTUALIZACIONES ====================
let waitingWorker = null;
function showUpdateBanner() { document.getElementById('updateBanner').classList.add('show'); }
function updateApp() { if (waitingWorker) { waitingWorker.postMessage({ action: 'skipWaiting' }); } window.location.reload(); }

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(registration => {
      console.log('✅ Service Worker registrado', registration);
      if (registration.waiting) {
        waitingWorker = registration.waiting;
        showUpdateBanner();
      }
      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            waitingWorker = newWorker;
            showUpdateBanner();
          }
        });
      });
    })
    .catch(err => console.error('❌ Error al registrar SW:', err));

  // Forzar claim del SW si es necesario (para que tome control rápidamente)
  navigator.serviceWorker.ready.then(registration => {
    if (registration.active && !navigator.serviceWorker.controller) {
      window.location.reload();
    }
  });
}
document.getElementById('updateBtn').addEventListener('click', updateApp);

// ==================== LOGIN (sin cambios) ====================
const form = document.getElementById('formLogin');
const cedula = document.getElementById('loginCedula');
const btn = document.getElementById('btnLogin');
const errorDiv = document.getElementById('errorMsg');
const loginCard = document.getElementById('loginCard');

function mostrarError(msg){ errorDiv.textContent=msg; errorDiv.style.display='block'; setTimeout(()=>errorDiv.style.display='none',5000); }
cedula.addEventListener('input',()=>{ let val=cedula.value.trim(); btn.disabled=!val; loginCard.classList.toggle('admin-mode',val.includes('Gata')); });
form.addEventListener('submit', async(e)=>{
  e.preventDefault();
  let valor=cedula.value.trim();
  if(!navigator.onLine) return mostrarError('📡 Sin conexión');
  if(typeof CONFIG==='undefined' || !CONFIG.URL_GAS) return mostrarError('❌ Error de configuración');
  btn.disabled=true; btn.textContent='CONECTANDO...';
  try{
    if(valor==='GataFiera54321'){
      let params=new URLSearchParams(); params.append('action','loginAdmin'); params.append('clave',valor);
      let res=await fetch(CONFIG.URL_GAS,{method:'POST',mode:'cors',body:params}); let data=await res.json();
      if(data.success && data.acceso){ localStorage.setItem('admin_activo','true'); window.location='./admin.html'; return; }
      mostrarError('❌ Clave admin incorrecta'); return;
    }
    if(!/^\d{10}$/.test(valor)){ mostrarError('❌ Ingresa una cédula válida (10 dígitos) o la clave admin'); return; }
    let params=new URLSearchParams(); params.append('action','validarRegistro'); params.append('cedula',valor);
    let res=await fetch(CONFIG.URL_GAS,{method:'POST',mode:'cors',body:params}); let data=await res.json();
    if(data.success && data.cedulaExiste && data.estado==='APROBADO'){
      localStorage.setItem('jugador_actual',JSON.stringify(data.datosJugador)); localStorage.setItem('userCedula',valor);
      window.location='./perfil.html'; return;
    }
    if(data.success && data.cedulaExiste) mostrarError(`⏳ Estado actual: ${data.estado}`);
    else if(data.success && !data.cedulaExiste) mostrarError('❌ Jugador no encontrado');
    else mostrarError(data.error||'⚠️ Error inesperado');
  }catch(e){ mostrarError('🔌 Error de conexión'); }
  finally{ btn.disabled=false; btn.textContent='Ingresa al Vestuario'; }
});
</script>
</body>
</html>
