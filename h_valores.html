<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="#020617" name="theme-color"/>
    <title>Nápoles F.C. - Historial de Valores</title>
    <link href="./favicon.ico" rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;family=Inter:wght@300;400;500;600;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <style>
        :root {
            --brand-gold: #E9C349;
            --bg-dark-start: #020617;
            --bg-dark-end: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(233, 195, 73, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --status-success: #10b981;
            --status-error: #ef4444;
        }

        body { 
            background: linear-gradient(180deg, var(--bg-dark-start) 0%, var(--bg-dark-end) 100%);
            color: var(--text-primary); 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 0 0 80px 0;
        }

        h1, h2, h3, .font-outfit { font-family: 'Outfit', sans-serif; }

        /* SKELETON LOADER */
        .skeleton-wrapper { padding: 24px; }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 0.5px solid var(--glass-border);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .payment-focus-card {
            box-shadow: 0 0 40px -10px rgba(233, 195, 73, 0.2), 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(233, 195, 73, 0.3);
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.08); }

        .btn-primary {
            background: var(--brand-gold);
            color: #000;
            padding: 18px;
            border-radius: 20px;
            font-weight: 800;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 8px 25px rgba(233, 195, 73, 0.25);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-gold { color: var(--brand-gold); }
        .bg-gold { background-color: var(--brand-gold); }

        /* PROGRESS BARS - SLEEK & GLOW */
        .progress-bar-container {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 100px;
            height: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--brand-gold);
            box-shadow: 0 0 12px rgba(233, 195, 73, 0.6);
            border-radius: 100px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ESTADO DE PAGOS */
        .estado-pagado-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .estado-pendiente-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* REGISTRO ITEM (TARJETA) */
        .registro-item {
            background: rgba(2, 6, 23, 0.3);
            border-radius: 16px;
            padding: 14px 16px;
            border: 0.5px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }
        .registro-item:active {
            background: rgba(30, 41, 59, 0.3);
            transform: scale(0.99);
        }

        /* BARRA INFERIOR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(16px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 100;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            border-radius: 12px;
            color: #64748b;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.55rem;
            gap: 2px;
            min-width: 44px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .bottom-nav .nav-item i { font-size: 1.2rem; transition: all 0.2s; }
        .bottom-nav .nav-item:hover { color: #94a3b8; }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item.active { color: var(--brand-gold); }
        .bottom-nav .nav-item .nav-label { font-size: 0.45rem; letter-spacing: 0.1em; }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(233, 195, 73, 0.3);
            border-radius: 30px;
            padding: 10px 24px;
            color: var(--brand-gold);
            font-weight: 700;
            font-size: 0.8rem;
            z-index: 2000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            display: none;
            white-space: nowrap;
            max-width: 90%;
        }
        #toast.show {
            display: block;
            animation: toastAnim 2.5s ease forwards;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        @media (max-width: 480px) {
            .btn-action { font-size: 0.65rem; padding: 10px 14px; }
            .btn-action span.material-symbols-outlined { font-size: 1rem; }
            .bottom-nav .nav-item i { font-size: 1rem; }
            .bottom-nav .nav-item { min-width: 36px; padding: 2px 6px; }
            .bottom-nav .nav-item .nav-label { font-size: 0.4rem; }
        }
    </style>
</head>
<body>

    <!-- SKELETON LOADER -->
    <div class="skeleton-wrapper" id="skeletonLoader">
        <div class="max-w-md mx-auto space-y-8">
            <div class="flex flex-col items-center gap-4 py-12">
                <div class="skeleton-shimmer w-48 h-12 rounded-xl"></div>
                <div class="skeleton-shimmer w-32 h-3 rounded-lg"></div>
            </div>
            <div class="skeleton-shimmer h-64 rounded-[32px]"></div>
            <div class="skeleton-shimmer h-48 rounded-[32px]"></div>
            <div class="space-y-4">
                <div class="skeleton-shimmer h-20 rounded-2xl"></div>
                <div class="skeleton-shimmer h-20 rounded-2xl"></div>
                <div class="skeleton-shimmer h-20 rounded-2xl"></div>
            </div>
        </div>
    </div>

    <!-- CONTENIDO DINÁMICO -->
    <div id="dynamicContent"></div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- MODALES (copiados del diseño élite) -->
    <div class="fixed inset-0 modal-bg z-[1000] hidden flex items-center justify-center p-6" id="reportModal">
        <div class="bg-[#0f172a] w-full max-w-sm rounded-[32px] p-8 border border-white/5 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-6 flex items-center gap-3 font-outfit">
                <span class="material-symbols-outlined text-gold">report</span> REPORTAR
            </h3>
            <textarea class="w-full bg-[#020617] border border-white/10 rounded-2xl p-4 text-white placeholder:text-gray-600 focus:border-gold/50 outline-none transition-all" id="reportText" placeholder="¿Qué sucede en el campo?" rows="4"></textarea>
            <div class="flex gap-4 mt-8">
                <button class="flex-1 py-4 text-gray-500 font-bold text-xs uppercase tracking-widest" onclick="cerrarReporte()">Cerrar</button>
                <button class="flex-1 py-4 bg-gold text-black rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-gold/20" onclick="enviarReporte()">Enviar</button>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 modal-bg z-[1000] hidden flex items-center justify-center p-6" id="bankModal">
        <div class="bg-[#0f172a] w-full max-w-sm rounded-[32px] p-8 border border-white/5 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-8 flex items-center gap-3 font-outfit">
                <span class="material-symbols-outlined text-gold">payments</span> PAGO ELITE
            </h3>
            <div class="space-y-4">
                <div class="bg-[#020617] p-5 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-gray-500 mb-1 font-bold uppercase tracking-widest">Banco</p>
                    <p class="font-extrabold text-white text-lg">Banco Pichincha</p>
                </div>
                <div class="bg-[#020617] p-5 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-gray-500 mb-1 font-bold uppercase tracking-widest">Beneficiario</p>
                    <p class="font-extrabold text-white text-lg">Darwin Muñoz</p>
                </div>
                <div class="bg-[#020617] p-5 rounded-2xl border border-gold/20 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-500 mb-1 font-bold uppercase tracking-widest">Cuenta de Ahorros</p>
                        <p class="text-2xl font-black text-gold font-outfit" id="cuentaBancaria">2209100265</p>
                    </div>
                    <button class="bg-gold/10 p-3 rounded-xl transition-all active:scale-90" id="copyAccountBtn">
                        <span class="material-symbols-outlined text-gold">content_copy</span>
                    </button>
                </div>
            </div>
            <button class="w-full mt-8 py-5 bg-white/5 border border-white/10 text-white font-bold rounded-2xl uppercase tracking-widest text-xs" onclick="cerrarBankModal()">Cerrar</button>
        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <div class="bottom-nav">
        <a href="perfil.html" class="nav-item" title="Perfil">
            <i class="fa-regular fa-user"></i>
            <span class="nav-label">Perfil</span>
        </a>
        <a href="alineacion.html" class="nav-item" title="Alineación">
            <i class="fa-regular fa-people-arrows"></i>
            <span class="nav-label">Alineación</span>
        </a>
        <a href="h_valores.html" class="nav-item active" title="Historial Valores">
            <i class="fa-regular fa-clock-rotate-left"></i>
            <span class="nav-label">Valores</span>
        </a>
        <a href="estadisticas.html" class="nav-item" title="Historial Partidos">
            <i class="fa-regular fa-futbol"></i>
            <span class="nav-label">Partidos</span>
        </a>
        <button class="nav-item" onclick="actualizar()" title="Actualizar">
            <i class="fa-solid fa-rotate"></i>
            <span class="nav-label">Actualizar</span>
        </button>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        // ⚠️ CAMBIA ESTA URL POR LA DE TU SCRIPT DE GAS ⚠️
        const URL_GAS = "https://script.google.com/macros/s/AKfycbxiT2brF1A0tr-LSy3wSy_rO3mjpQQTMD7a2O6Mgw5auAjfFwTkBUnBSEnEARbteL7Z/exec";

        // ==================== OBTENER CÉDULA ====================
        let jugadorSesion = null;
        try {
            jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
        } catch(e) {
            console.warn(e);
        }
        if (!jugadorSesion || !jugadorSesion.cedula) {
            window.location.href = 'login.html';
        }
        const cedula = jugadorSesion.cedula;

        // ==================== FUNCIONES MODALES ====================
        function abrirBankModal() { 
            document.getElementById('bankModal').classList.remove('hidden'); 
            document.getElementById('bankModal').classList.add('flex'); 
        }
        function cerrarBankModal() { 
            document.getElementById('bankModal').classList.add('hidden'); 
            document.getElementById('bankModal').classList.remove('flex'); 
        }
        function abrirReporte() { 
            document.getElementById('reportModal').classList.remove('hidden'); 
            document.getElementById('reportModal').classList.add('flex'); 
        }
        function cerrarReporte() { 
            document.getElementById('reportModal').classList.add('hidden'); 
            document.getElementById('reportModal').classList.remove('flex'); 
        }
        function enviarReporte() {
            const text = document.getElementById('reportText').value.trim();
            if (text) {
                alert('Incidencia registrada en el panel táctico.');
                cerrarReporte();
                document.getElementById('reportText').value = '';
            } else {
                alert('Escribe una descripción antes de enviar.');
            }
        }

        // ==================== COPIAR CUENTA ====================
        document.addEventListener('click', function(e) {
            if (e.target.closest('#copyAccountBtn')) {
                const cuenta = document.getElementById('cuentaBancaria').innerText;
                navigator.clipboard.writeText(cuenta).then(() => {
                    const icon = document.querySelector('#copyAccountBtn .material-symbols-outlined');
                    icon.innerText = 'done_all';
                    icon.classList.add('text-emerald-400');
                    setTimeout(() => {
                        icon.innerText = 'content_copy';
                        icon.classList.remove('text-emerald-400');
                    }, 2000);
                });
            }
        });

        // ==================== TOAST ====================
        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.className = '';
            }, 2500);
        }

        // ==================== FORMATEADORES ====================
        function formatearFecha(fecha) {
            if (!fecha) return '-';
            try {
                const d = new Date(fecha);
                if (isNaN(d.getTime())) return fecha;
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch(e) {
                return fecha;
            }
        }

        function formatearNumero(valor) {
            return Number(valor).toFixed(2);
        }

        // ==================== RENDERIZAR PANEL ====================
        function renderizarPanel(data) {
            const container = document.getElementById('dynamicContent');
            const totalPagado = data.totalPagado || 0;
            const totalPendiente = data.totalPendiente || 0;
            const registros = data.registros || [];
            const totalRegistros = registros.length;

            let registrosHTML = '';
            if (totalRegistros === 0) {
                registrosHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <span class="material-symbols-outlined text-5xl text-gold/20">inbox</span>
                        <p class="mt-4 text-sm font-bold uppercase tracking-widest">Sin registros</p>
                    </div>
                `;
            } else {
                registros.forEach(r => {
                    const estado = (r.estado || '').toUpperCase();
                    const esPagado = estado === 'PAGADO' || parseFloat(r.saldo) === 0;
                    const badgeClass = esPagado ? 'estado-pagado-badge' : 'estado-pendiente-badge';
                    const estadoLabel = esPagado ? 'PAGADO' : 'PENDIENTE';

                    registrosHTML += `
                        <div class="registro-item">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="text-[13px] font-black text-white font-outfit">${r.concepto || 'Sin concepto'}</div>
                                    <div class="flex items-center gap-3 mt-1 text-[10px] text-gray-500 font-bold uppercase tracking-wider">
                                        <span>ID #${r.id || '-'}</span>
                                        <span class="text-white/10">|</span>
                                        <span>${formatearFecha(r.fechaVencimiento)}</span>
                                    </div>
                                </div>
                                <span class="${badgeClass}">${estadoLabel}</span>
                            </div>
                            <div class="flex justify-between items-center mt-2 text-[12px] font-black">
                                <div class="flex gap-4">
                                    <span class="text-white/50">Total: <span class="text-white">$${formatearNumero(r.valorTotal)}</span></span>
                                    <span class="text-emerald-400">Pagado: $${formatearNumero(r.valorPagado)}</span>
                                    <span class="text-red-400">Saldo: $${formatearNumero(r.saldo)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            // Porcentaje de progreso de pago
            const totalGeneral = totalPagado + totalPendiente;
            const porcentajePagado = totalGeneral > 0 ? (totalPagado / totalGeneral) * 100 : 0;

            container.innerHTML = `
                <div class="max-w-md mx-auto p-6 pb-24">

                    <!-- HEADER -->
                    <header class="text-center pt-8 pb-6">
                        <div class="flex flex-col items-center">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-3xl filter drop-shadow-[0_0_10px_rgba(233,195,73,0.5)]">⚽</span>
                                <h1 class="text-4xl font-black text-white tracking-tighter uppercase font-outfit italic">NÁPOLES F.C.</h1>
                            </div>
                            <p class="text-[10px] text-gold font-bold uppercase tracking-[0.4em]">Historial de Valores</p>
                        </div>
                    </header>

                    <!-- BOTONES DE ACCIÓN (Reportar, Compartir, Ficha) -->
                    <div class="flex justify-between gap-3 mb-8 overflow-x-auto pb-2 scrollbar-hide">
                        <button class="btn-action flex-1 flex-shrink-0 justify-center" onclick="abrirReporte()">
                            <span class="material-symbols-outlined text-gold text-lg">flag</span> 
                            <span>Reportar</span>
                        </button>
                        <button class="btn-action flex-1 flex-shrink-0 justify-center" onclick="compartirPerfil()">
                            <span class="material-symbols-outlined text-gold text-lg">ios_share</span>
                            <span>Compartir</span>
                        </button>
                        <button class="btn-action flex-1 flex-shrink-0 justify-center" onclick="window.print()">
                            <span class="material-symbols-outlined text-gold text-lg">description</span>
                            <span>Ficha</span>
                        </button>
                    </div>

                    <!-- CENTRO DE PAGOS (Resumen) -->
                    <div class="glass-card payment-focus-card p-8 mb-10 relative overflow-hidden">
                        <div class="absolute -top-12 -right-12 w-48 h-48 bg-gold/5 rounded-full blur-3xl"></div>
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-center gap-3">
                                <div class="bg-gold/10 p-2 rounded-xl border border-gold/20">
                                    <span class="material-symbols-outlined text-gold text-2xl">account_balance_wallet</span>
                                </div>
                                <h3 class="text-lg font-black text-white uppercase tracking-[0.1em] font-outfit">CENTRO DE PAGOS</h3>
                            </div>
                            <span class="flex h-2 w-2 rounded-full bg-gold animate-pulse"></span>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-[#020617]/50 p-5 rounded-2xl border border-white/5">
                                <p class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Total Pagado</p>
                                <p class="text-3xl font-black text-emerald-400 font-outfit">$${totalPagado.toFixed(2)}</p>
                            </div>
                            <div class="bg-[#020617]/50 p-5 rounded-2xl border border-gold/10">
                                <p class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Saldo Pendiente</p>
                                <p class="text-3xl font-black text-red-500 font-outfit">$${totalPendiente.toFixed(2)}</p>
                            </div>
                        </div>

                        <!-- BARRA DE PROGRESO DE PAGO -->
                        <div class="mb-6">
                            <div class="flex justify-between text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-2">
                                <span>Progreso de pago</span>
                                <span>${porcentajePagado.toFixed(0)}%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${porcentajePagado}%"></div>
                            </div>
                        </div>

                        <button class="btn-primary flex items-center justify-center gap-3 active:scale-[0.98] transition-transform" onclick="abrirBankModal()">
                            <span class="material-symbols-outlined text-black font-bold">payments</span> 
                            <span class="text-xs tracking-widest">PAGAR AHORA</span>
                        </button>
                    </div>

                    <!-- LISTA DE REGISTROS -->
                    <div class="glass-card p-6 mb-10">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-gold text-xl">list_alt</span>
                                <h3 class="text-xs font-black text-white uppercase tracking-[0.2em] font-outfit">Registros</h3>
                            </div>
                            <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${totalRegistros} items</span>
                        </div>
                        <div class="space-y-4">
                            ${registrosHTML}
                        </div>
                    </div>

                    <!-- BOTÓN VOLVER (opcional) -->
                    <div class="text-center">
                        <a href="perfil.html" class="text-white/20 hover:text-gold/40 text-[10px] font-black uppercase tracking-[0.5em] transition-all">
                            ← Volver al Perfil
                        </a>
                    </div>

                </div>
            `;

            // Ocultar skeleton
            document.getElementById('skeletonLoader').style.display = 'none';
        }

        // ==================== COMPARTIR PERFIL ====================
        function compartirPerfil() {
            if (navigator.share) {
                navigator.share({
                    title: 'NÁPOLES F.C. - Historial de Valores',
                    text: `Mi historial de pagos en el panel élite. Total pagado: $${totalPagado}, Pendiente: $${totalPendiente}`,
                    url: window.location.href
                });
            } else {
                mostrarToast('📋 Copia el enlace para compartir');
            }
        }

        // ==================== CARGAR HISTORIAL ====================
        async function cargarHistorial() {
            const skeleton = document.getElementById('skeletonLoader');
            skeleton.style.display = 'block';

            try {
                const url = `${URL_GAS}?action=getHistorialValores&cedula=${encodeURIComponent(cedula)}&t=${Date.now()}`;
                const resp = await fetch(url);
                const data = await resp.json();

                if (data.success && data.data) {
                    const registros = data.data;
                    // Calcular totales
                    let totalPagado = 0;
                    let totalPendiente = 0;
                    registros.forEach(r => {
                        const estado = (r.estado || '').toUpperCase();
                        const saldo = parseFloat(r.saldo) || 0;
                        const pagado = parseFloat(r.valorPagado) || 0;
                        if (estado === 'PAGADO' || saldo === 0) {
                            totalPagado += pagado;
                        } else {
                            totalPendiente += saldo;
                        }
                    });

                    renderizarPanel({
                        totalPagado: totalPagado,
                        totalPendiente: totalPendiente,
                        registros: registros
                    });
                } else {
                    throw new Error(data.error || 'Error al cargar historial');
                }
            } catch(e) {
                console.error(e);
                mostrarToast('❌ Error: ' + e.message);
                document.getElementById('skeletonLoader').style.display = 'none';
                document.getElementById('dynamicContent').innerHTML = `
                    <div class="max-w-md mx-auto p-6 text-center text-red-400">
                        <span class="material-symbols-outlined text-5xl">error</span>
                        <p class="mt-4 font-bold">${e.message}</p>
                        <button onclick="cargarHistorial()" class="mt-6 btn-primary text-xs">Reintentar</button>
                    </div>
                `;
            }
        }

        // ==================== ACTUALIZAR ====================
        async function actualizar() {
            const btn = document.querySelector('.bottom-nav .nav-item:last-child');
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span class="nav-label">Cargando...</span>';
                btn.disabled = true;
            }
            await cargarHistorial();
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-rotate"></i> <span class="nav-label">Actualizar</span>';
                btn.disabled = false;
            }
            mostrarToast('✅ Datos actualizados');
        }

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', () => {
            cargarHistorial();
        });
    </script>

</body>
</html>
