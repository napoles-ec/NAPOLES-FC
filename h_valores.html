<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" name="viewport"/>
    <meta name="theme-color" content="#ADFF2F">
    <title>Nápoles F.C. - Historial de Valores</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ========== ESTILOS GENERALES ========== */
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top, #111a33 0%, #060912 100%);
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 12px 12px 75px 12px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ========== CABECERA ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 8px 0 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            color: #D4AF37;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        .header h1 img {
            height: 32px;
        }
        .header .btn-back {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 30px;
            padding: 6px 14px;
            color: #FFD700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }
        .header .btn-back:hover {
            background: rgba(212, 175, 55, 0.25);
        }
        .header .btn-back:active {
            transform: scale(0.95);
        }

        /* ========== TARJETAS DE RESUMEN ========== */
        .summary-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .summary-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .summary-card .value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }
        .summary-card .value.pagado { color: #2ecc71; }
        .summary-card .value.pendiente { color: #f39c12; }
        .summary-card .icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
            display: block;
        }

        /* ========== TARJETA PRINCIPAL ========== */
        .card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .card-header h2 {
            color: #D4AF37;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-header .badge-count {
            background: rgba(212, 175, 55, 0.15);
            color: #D4AF37;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        /* ========== LISTA DE REGISTROS (TARJETAS) ========== */
        .registro-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid rgba(212, 175, 55, 0.2);
            transition: background 0.2s;
        }
        .registro-item:active {
            background: rgba(255, 255, 255, 0.06);
        }
        .registro-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .registro-item .concepto {
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            flex: 1;
        }
        .registro-item .estado-badge {
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .estado-pagado-badge {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }
        .estado-pendiente-badge {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }
        .registro-item .detalles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .registro-item .detalles span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .registro-item .detalles .monto-total {
            color: #fff;
            font-weight: 600;
        }
        .registro-item .detalles .monto-pagado {
            color: #2ecc71;
        }
        .registro-item .detalles .monto-saldo {
            color: #f39c12;
        }
        .registro-item .id-label {
            font-size: 0.55rem;
            color: #64748b;
            background: rgba(255,255,255,0.05);
            padding: 1px 8px;
            border-radius: 12px;
        }

        /* ========== SIN REGISTROS ========== */
        .sin-registros {
            text-align: center;
            padding: 30px 15px;
            color: #94a3b8;
        }
        .sin-registros i {
            font-size: 2.5rem;
            color: #D4AF37;
            opacity: 0.5;
        }
        .sin-registros p {
            margin-top: 10px;
            font-size: 0.85rem;
        }

        /* ========== CARGANDO ========== */
        .loading {
            text-align: center;
            padding: 40px 0;
        }
        .loading i {
            font-size: 2.5rem;
            color: #D4AF37;
            animation: spin 1s linear infinite;
        }
        .loading p {
            margin-top: 12px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== TOAST ========== */
        #toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid #D4AF37;
            border-radius: 30px;
            padding: 8px 20px;
            color: #D4AF37;
            font-weight: 600;
            font-size: 0.8rem;
            z-index: 2000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            display: none;
            white-space: nowrap;
            max-width: 90%;
        }
        #toast.show {
            display: block;
            animation: toastAnim 2.5s ease forwards;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* ========== BARRA DE NAVEGACIÓN INFERIOR ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 env(safe-area-inset-bottom, 6px) 0;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 10px;
            color: #64748b;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.5rem;
            gap: 1px;
            min-width: 44px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .nav-item i {
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .bottom-nav .nav-item:hover { color: #94a3b8; }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item.active { color: #D4AF37; }
        .bottom-nav .nav-item .nav-label {
            font-size: 0.45rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        @media (max-width: 400px) {
            body { padding: 8px 8px 70px 8px; }
            .header h1 { font-size: 1rem; }
            .header h1 img { height: 26px; }
            .summary-card .value { font-size: 1.1rem; }
            .registro-item .concepto { font-size: 0.75rem; }
            .registro-item .detalles { font-size: 0.6rem; gap: 6px; }
            .bottom-nav .nav-item i { font-size: 1rem; }
            .bottom-nav .nav-item { min-width: 36px; padding: 2px 4px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">

            <!-- ===== CABECERA ===== -->
            <div class="header">
                <h1><img src="./imagen/logo/napoles_fc.png" alt="Logo"> Historial</h1>
                <a href="perfil.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            </div>

            <!-- ===== RESUMEN ===== -->
            <div id="summary" style="display:none;">
                <div class="summary-cards">
                    <div class="summary-card">
                        <span class="icon">✅</span>
                        <div class="label">Total Pagado</div>
                        <div class="value pagado" id="totalPagado">$0.00</div>
                    </div>
                    <div class="summary-card">
                        <span class="icon">⏳</span>
                        <div class="label">Total Pendiente</div>
                        <div class="value pendiente" id="totalPendiente">$0.00</div>
                    </div>
                </div>
            </div>

            <!-- ===== CARGANDO ===== -->
            <div id="loading" class="loading">
                <i class="fa-solid fa-spinner"></i>
                <p>Cargando historial...</p>
            </div>

            <!-- ===== CONTENIDO ===== -->
            <div id="content" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-list-ul"></i> Registros</h2>
                        <span class="badge-count" id="totalRegistros">0</span>
                    </div>
                    <div id="lista-registros">
                        <!-- Se llena con JS -->
                    </div>
                    <div id="sin-registros" class="sin-registros" style="display: none;">
                        <i class="fa-solid fa-inbox"></i>
                        <p>No se encontraron registros de valores para este jugador.</p>
                    </div>
                </div>
            </div>

            <!-- ===== TOAST ===== -->
            <div id="toast"></div>
        </div>
    </div>

    <!-- ===== BARRA DE NAVEGACIÓN INFERIOR ===== -->
    <div class="bottom-nav">
        <a href="perfil.html" class="nav-item" title="Perfil">
            <i class="fa-solid fa-user"></i>
            <span class="nav-label">Perfil</span>
        </a>
        <a href="alineacion.html" class="nav-item" title="Alineación">
            <i class="fa-solid fa-people-arrows"></i>
            <span class="nav-label">Alineación</span>
        </a>
        <a href="h_valores.html" class="nav-item active" title="Historial Valores">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span class="nav-label">Valores</span>
        </a>
        <a href="estadisticas.html" class="nav-item" title="Historial Partidos">
            <i class="fa-solid fa-futbol"></i>
            <span class="nav-label">Partidos</span>
        </a>
        <button class="nav-item" onclick="actualizar()" title="Actualizar">
            <i class="fa-solid fa-rotate"></i>
            <span class="nav-label">Actualizar</span>
        </button>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        // ⚠️ CAMBIA ESTA URL POR LA DE TU SCRIPT DE GAS ⚠️
        const URL_GAS = "https://script.google.com/macros/s/AKfycbxiT2brF1A0tr-LSy3wSy_rO3mjpQQTMD7a2O6Mgw5auAjfFwTkBUnBSEnEARbteL7Z/exec";

        // ==================== OBTENER CÉDULA ====================
        let jugadorSesion = null;
        try {
            jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
        } catch(e) {
            console.warn(e);
        }
        if (!jugadorSesion || !jugadorSesion.cedula) {
            window.location.href = 'login.html';
        }
        const cedula = jugadorSesion.cedula;

        // ==================== FUNCIONES ====================
        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.className = '';
            }, 2500);
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            try {
                const d = new Date(fecha);
                if (isNaN(d.getTime())) return fecha;
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch(e) {
                return fecha;
            }
        }

        function formatearNumero(valor) {
            return Number(valor).toFixed(2);
        }

        // ==================== CARGAR HISTORIAL ====================
        async function cargarHistorial() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const summary = document.getElementById('summary');
            const lista = document.getElementById('lista-registros');
            const sinRegistros = document.getElementById('sin-registros');
            const totalRegistros = document.getElementById('totalRegistros');

            loading.style.display = 'block';
            content.style.display = 'none';
            summary.style.display = 'none';

            try {
                const url = `${URL_GAS}?action=getHistorialValores&cedula=${encodeURIComponent(cedula)}&t=${Date.now()}`;
                const resp = await fetch(url);
                const data = await resp.json();

                if (data.success && data.data) {
                    const registros = data.data;
                    lista.innerHTML = '';
                    sinRegistros.style.display = 'none';

                    // Calcular totales
                    let totalPagado = 0;
                    let totalPendiente = 0;
                    registros.forEach(r => {
                        const estado = (r.estado || '').toUpperCase();
                        const saldo = parseFloat(r.saldo) || 0;
                        const pagado = parseFloat(r.valorPagado) || 0;
                        if (estado === 'PAGADO' || saldo === 0) {
                            totalPagado += pagado;
                        } else {
                            totalPendiente += saldo;
                        }
                    });

                    // Actualizar resumen
                    document.getElementById('totalPagado').textContent = '$' + totalPagado.toFixed(2);
                    document.getElementById('totalPendiente').textContent = '$' + totalPendiente.toFixed(2);
                    summary.style.display = 'block';

                    if (registros.length === 0) {
                        sinRegistros.style.display = 'block';
                        totalRegistros.textContent = '0';
                    } else {
                        totalRegistros.textContent = registros.length;
                        registros.forEach(r => {
                            const estado = (r.estado || '').toUpperCase();
                            const esPagado = estado === 'PAGADO' || parseFloat(r.saldo) === 0;
                            const badgeClass = esPagado ? 'estado-pagado-badge' : 'estado-pendiente-badge';
                            const estadoLabel = esPagado ? 'PAGADO' : 'PENDIENTE';

                            const div = document.createElement('div');
                            div.className = 'registro-item';
                            div.innerHTML = `
                                <div class="row">
                                    <span class="concepto">${r.concepto || 'Sin concepto'}</span>
                                    <span class="estado-badge ${badgeClass}">${estadoLabel}</span>
                                </div>
                                <div class="detalles">
                                    <span class="id-label">#${r.id || '-'}</span>
                                    <span><i class="fa-regular fa-calendar"></i> ${formatearFecha(r.fechaVencimiento)}</span>
                                    <span class="monto-total">$${formatearNumero(r.valorTotal)}</span>
                                    <span class="monto-pagado">P: $${formatearNumero(r.valorPagado)}</span>
                                    <span class="monto-saldo">S: $${formatearNumero(r.saldo)}</span>
                                </div>
                            `;
                            lista.appendChild(div);
                        });
                    }
                    loading.style.display = 'none';
                    content.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Error al cargar historial');
                }
            } catch(e) {
                console.error(e);
                mostrarToast('❌ Error: ' + e.message);
                loading.style.display = 'none';
                content.style.display = 'block';
                lista.innerHTML = `<div style="text-align:center; padding:20px; color:#e74c3c; font-size:0.85rem;"><i class="fa-solid fa-circle-exclamation"></i> ${e.message}</div>`;
            }
        }

        // ==================== ACTUALIZAR ====================
        async function actualizar() {
            const btn = document.querySelector('.bottom-nav .nav-item:last-child');
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span class="nav-label">Cargando...</span>';
                btn.disabled = true;
            }
            await cargarHistorial();
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-rotate"></i> <span class="nav-label">Actualizar</span>';
                btn.disabled = false;
            }
            mostrarToast('✅ Datos actualizados');
        }

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', () => {
            cargarHistorial();
        });
    </script>
</body>
</html>
