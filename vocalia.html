<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Vocalía | Nápoles FC</title>
    
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c3aed",
                        "primary-container": "#c084fc",
                        "secondary": "#565e74",
                        "secondary-container": "#e2e8f0",
                        "surface": "#faf9f6",
                        "surface-dim": "#dbdad7",
                        "surface-container": "#efeeeb",
                        "surface-container-high": "#e9e8e5",
                        "surface-container-low": "#f4f3f1",
                        "on-surface": "#0f172a",
                        "on-surface-variant": "#64748b",
                        "outline-variant": "#cbd5e1",
                        "error": "#ef4444",
                        "error-container": "#fee2e2",
                    },
                    fontFamily: {
                        "headline-md": ["Outfit", "sans-serif"],
                        "headline-lg": ["Outfit", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                    }
                }
            }
        }
    </script>
    
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .athletic-bg {
            background: #f8fafc;
        }
        .stat-card-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); }
        .stat-card-error { background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%); }
        
        .player-selected {
            border: 2px solid #7c3aed !important;
            background: rgba(124, 58, 237, 0.03) !important;
        }
        .toast-notify {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .deuda-item-concepto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            padding: 4px 8px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 3px;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .shimmer-card { height: 180px; background: rgba(255,255,255,0.8); border-radius: 16px; position: relative; overflow: hidden; }
        .shimmer-card::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%); animation: loadingShimmer 1.5s infinite;
        }
        @keyframes loadingShimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="athletic-bg font-body-md text-on-surface min-h-screen pb-24">

<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 flex justify-between items-center px-4 h-14 shadow-sm">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-2xl font-bold">sports_soccer</span>
        <h1 class="text-base font-headline-md font-black tracking-tighter text-on-surface">VOCALÍA | NÁPOLES FC</h1>
    </div>
    <button id="btn-refresh" class="w-8 h-8 bg-slate-100 text-on-surface rounded-xl flex items-center justify-center active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-lg">refresh</span>
    </button>
</header>

<main class="pt-18 px-3 max-w-7xl mx-auto space-y-4">
    <!-- Resumen de saldos rápido para móvil -->
    <section class="grid grid-cols-2 gap-2">
        <div class="stat-card-gradient p-3.5 rounded-xl text-white relative overflow-hidden shadow-sm">
            <p class="text-[9px] uppercase tracking-wider opacity-70 font-bold">Caja Recaudada</p>
            <h2 class="text-lg font-headline-lg font-black mt-0.5" id="total-recaudado">$0.00</h2>
            <button id="btn-ver-historial" class="text-[9px] bg-white/10 px-2 py-0.5 rounded-md mt-1.5 flex items-center gap-0.5">
                Ver historial
            </button>
        </div>

        <div class="stat-card-error p-3.5 rounded-xl text-white relative overflow-hidden shadow-sm">
            <p class="text-[9px] uppercase tracking-wider opacity-70 font-bold">Por Recuperar</p>
            <h2 class="text-lg font-headline-lg font-black mt-0.5" id="total-pendiente-global">$0.00</h2>
            <span class="text-[9px] text-red-200 block mt-2 font-medium" id="deudores-contador">0 Jugadores con deuda</span>
        </div>
    </section>

    <!-- Barra de búsqueda rápida y Abono Colectivo -->
    <section class="glass-card p-2.5 rounded-xl flex gap-2 items-center">
        <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
            <input class="w-full pl-8 pr-2 py-1.5 bg-slate-100 border-none rounded-lg text-xs placeholder:text-slate-400 font-medium focus:ring-1 focus:ring-primary/20" id="busqueda" placeholder="Buscar jugador...">
        </div>
        <button id="btn-pago-multiple" class="px-3 py-1.5 bg-primary text-white text-xs font-bold rounded-lg shadow-sm active:scale-95 transition-all flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">groups</span>
            Grupal
        </button>
    </section>

    <!-- Grid optimizado para móvil: 2 Columnas fijas en Celular (2x4) y 4 Columnas en Escritorio -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5" id="lista-jugadores">
        <div class="shimmer-card"></div>
        <div class="shimmer-card"></div>
        <div class="shimmer-card"></div>
        <div class="shimmer-card"></div>
    </div>
</main>

<!-- Modal Registro Pago -->
<div id="modalPago" class="fixed inset-0 z-[60] hidden items-center justify-center p-3">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="cerrarModalPago()"></div>
    <div class="relative bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-xl border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-sm font-headline-md font-black text-on-surface" id="modal-titulo">Registrar Abono</h3>
            <button class="p-1 hover:bg-slate-100 rounded-full" onclick="cerrarModalPago()">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <div class="p-4 space-y-3">
            <div id="jugadores-seleccionados-resumen" class="text-[11px] bg-primary/5 border border-primary/10 p-2 rounded-lg font-medium text-primary hidden"></div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant mb-1">Concepto del Pago</label>
                <select id="conceptoPago" class="w-full p-2 bg-slate-100 rounded-lg border-none text-xs font-medium focus:ring-1 focus:ring-primary/20">
                    <option value="vocalia">Vocalía</option>
                    <option value="multas">Multas</option>
                    <option value="tarjeta_amarilla">Tarjeta Amarilla</option>
                    <option value="tarjeta_roja">Tarjeta Roja</option>
                    <option value="uniformes">Uniformes</option>
                    <option value="inscripcion">Inscripción</option>
                    <option value="inauguracion">Inauguración</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant mb-1">Monto Recibido ($)</label>
                <input type="number" id="montoPago" step="0.01" class="w-full p-2 bg-slate-100 rounded-lg border-none text-xs font-semibold focus:ring-1 focus:ring-primary/20" placeholder="0.00">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant mb-1">Referencia (Opcional)</label>
                <input type="text" id="transaccionPago" class="w-full p-2 bg-slate-100 rounded-lg border-none text-xs font-medium focus:ring-1 focus:ring-primary/20" placeholder="Ej. Depósito, Efectivo">
            </div>
        </div>
        <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
            <button class="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-lg" onclick="cerrarModalPago()">Cancelar</button>
            <button id="btn-confirmar-pago" class="px-4 py-1.5 bg-primary text-white text-xs font-bold rounded-lg shadow-sm">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal Historial -->
<div id="modalHistorial" class="fixed inset-0 z-[60] hidden items-center justify-center p-3">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="cerrarModalHistorial()"></div>
    <div class="relative bg-white w-full max-w-md max-h-[75vh] rounded-2xl overflow-hidden flex flex-col shadow-xl">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-sm font-headline-md font-black text-on-surface">Historial de Caja</h3>
            <button class="p-1 hover:bg-slate-100 rounded-full" onclick="cerrarModalHistorial()">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <div class="p-4 overflow-y-auto scrollbar-hide space-y-2" id="historial-contenido"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLcpH5z2x_EjRPaPu6gI_lLokWkVxsKLgBz-HHCVX7_OhKAFU1LVfZ67bh9DCbn9L6/exec";

    let jugadoresData = [];
    let selectedPlayers = new Set();
    let modoPagoMultiple = false;
    let busquedaTexto = "";

    const CONCEPTOS = ["vocalia", "multas", "tarjeta_amarilla", "tarjeta_roja", "uniformes", "inscripcion", "inauguracion"];
    const NOMBRES = { vocalia:"Vocalía", multas:"Multas", tarjeta_amarilla:"T. Amarilla", tarjeta_roja:"T. Roja", uniformes:"Uniformes", inscripcion:"Inscripción", inauguracion:"Inauguración" };

    function formatMoney(v) { return new Intl.NumberFormat('es-EC', { style:'currency', currency:'USD' }).format(v); }
    
    function toast(msg, type='info') {
        let t = document.createElement('div');
        t.className = 'toast-notify';
        t.innerHTML = `<span>${type==='error'?'❌':'📋'}</span> ${msg}`;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(),2500);
    }

    // Fuerza la conversión limpia a número flotante para evitar que textos vacíos rompan la lógica
    function parseValue(val) {
        if (val === undefined || val === null || val === "") return 0;
        let p = parseFloat(val);
        return isNaN(p) ? 0 : p;
    }

    function deudaTotal(j) {
        let suma = 0;
        for(let c of CONCEPTOS) {
            suma += parseValue(j.deudas?.[c]);
        }
        let cred = parseValue(j.credito);
        return Math.max(0, suma - cred);
    }

    async function cargarDatos() {
        const container = document.getElementById('lista-jugadores');
        container.innerHTML = '<div class="shimmer-card"></div><div class="shimmer-card"></div><div class="shimmer-card"></div><div class="shimmer-card"></div>';
        try {
            const res = await fetch(`${API_URL}?action=getVocaliaData&nocache=${Date.now()}`);
            const data = await res.json();
            if(data.success) {
                jugadoresData = data.deudores;
                
                let totalPendienteGlobal = 0;
                let deudoresContador = 0;
                
                for(let j of jugadoresData) { 
                    let d = deudaTotal(j); 
                    totalPendienteGlobal += d; 
                    if(d > 0) deudoresContador++; 
                }
                
                document.getElementById('total-pendiente-global').innerText = formatMoney(totalPendienteGlobal);
                document.getElementById('deudores-contador').innerText = `${deudoresContador} Jugadores con saldo`;
                
                const hist = await fetch(`${API_URL}?action=getHistorialVocalia&nocache=${Date.now()}`);
                const histData = await hist.json();
                let recaudado = 0;
                if(histData.success && histData.historial) recaudado = histData.historial.reduce((s,i)=>s+parseValue(i.monto),0);
                document.getElementById('total-recaudado').innerText = formatMoney(recaudado);
                
                renderizarJugadores();
            } else throw new Error(data.error);
        } catch(e) {
            container.innerHTML = `<div class="col-span-full py-8 text-center text-xs font-bold text-error bg-red-50 border border-red-200 rounded-xl">❌ Error de sincronización</div>`;
            toast("Error al conectar con la base de datos","error");
        }
    }

    function renderizarJugadores() {
        const container = document.getElementById('lista-jugadores');
        let lista = jugadoresData;
        
        if(busquedaTexto) {
            lista = jugadoresData.filter(j => (j.nombreCompleto || j.nombreCamiseta || "").toLowerCase().includes(busquedaTexto.toLowerCase()));
        }

        if(!lista.length) {
            container.innerHTML = '<div class="col-span-full py-8 text-center text-xs font-semibold text-slate-400">No hay coincidencias.</div>';
            return;
        }

        let html = '';
        for(let j of lista) {
            const deudaTot = deudaTotal(j);
            const selec = selectedPlayers.has(j.cedula);
            
            let desgloseHtml = '';
            for(let c of CONCEPTOS) {
                let val = parseValue(j.deudas?.[c]);
                // Si el valor es mayor a cero se muestra normal; si está en cero se atenúa para no confundir
                desgloseHtml += `
                    <div class="deuda-item-concepto ${val > 0 ? 'bg-amber-50/70 border-l-2 border-amber-500' : 'opacity-40'}">
                        <span class="font-medium text-slate-600">${NOMBRES[c]}</span>
                        <span class="font-bold text-slate-900">${formatMoney(val)}</span>
                    </div>`;
            }
            
            if(parseValue(j.credito) > 0) {
                desgloseHtml += `<div class="deuda-item-concepto bg-emerald-50 text-emerald-700"><span>A favor</span><span class="font-bold">${formatMoney(j.credito)}</span></div>`;
            }
            
            html += `
                <div class="bg-white p-3 rounded-xl shadow-sm border ${selec ? 'player-selected' : 'border-slate-100'} flex flex-col justify-between transition-all" onclick="toggleSelect('${j.cedula}')">
                    <div>
                        <!-- Fila Superior: Dorsal e Info Básica -->
                        <div class="flex items-start justify-between gap-1 mb-2">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <div class="w-6 h-6 shrink-0 bg-slate-100 rounded-md flex items-center justify-center text-on-surface font-black text-[10px] border border-slate-200">${j.dorsal || '?'}</div>
                                <h4 class="font-bold text-[11px] text-on-surface truncate">${escapeHtml(j.nombreCamiseta || j.nombreCompleto)}</h4>
                            </div>
                            <input type="checkbox" class="w-3.5 h-3.5 rounded border-slate-300 text-primary accent-primary" ${selec ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${j.cedula}')">
                        </div>
                        
                        <!-- Saldo Total Destacado -->
                        <div class="mb-2 bg-slate-50 p-1.5 rounded-lg text-center border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Deuda Total</p>
                            <p class="text-xs font-black ${deudaTot > 0 ? 'text-error' : 'text-emerald-600'}">${formatMoney(deudaTot)}</p>
                        </div>
                        
                        <!-- Desglose por conceptos -->
                        <div class="space-y-0.5">
                            ${desgloseHtml}
                        </div>
                    </div>
                    
                    <!-- Botón de abono directo en tarjeta -->
                    <button class="w-full mt-2.5 py-1 bg-slate-100 hover:bg-primary/10 rounded-lg text-[10px] font-bold text-primary flex items-center justify-center gap-0.5 transition-colors" onclick="event.stopPropagation(); abrirModalPagoIndividual('${j.cedula}')">
                        <span class="material-symbols-outlined text-xs">add_card</span> Abonar
                    </button>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function toggleSelect(cedula) {
        if(selectedPlayers.has(cedula)) selectedPlayers.delete(cedula);
        else selectedPlayers.add(cedula);
        renderizarJugadores();
    }

    function abrirModalPagoIndividual(cedula) {
        modoPagoMultiple = false;
        let jug = jugadoresData.find(j=>j.cedula===cedula);
        if(!jug) return;
        document.getElementById('modal-titulo').innerText = `Abonar a ${jug.nombreCamiseta || jug.nombreCompleto}`;
        document.getElementById('jugadores-seleccionados-resumen').classList.add('hidden');
        document.getElementById('btn-confirmar-pago').setAttribute('data-cedula', cedula);
        limpiarFormPago();
        mostrarModal();
    }

    function abrirModalMultiple() {
        if(selectedPlayers.size===0) { toast("Selecciona casilleros primero","error"); return; }
        modoPagoMultiple = true;
        let nombres = Array.from(selectedPlayers).map(c=>{let j=jugadoresData.find(j=>j.cedula===c); return j?(j.nombreCamiseta||j.nombreCompleto):c;}).join(', ');
        document.getElementById('modal-titulo').innerText = `Abono Grupal (${selectedPlayers.size})`;
        const resEl = document.getElementById('jugadores-seleccionados-resumen');
        resEl.classList.remove('hidden');
        resEl.innerHTML = `<p class="truncate">Destinatarios: ${nombres}</p>`;
        document.getElementById('btn-confirmar-pago').removeAttribute('data-cedula');
        limpiarFormPago();
        mostrarModal();
    }

    function limpiarFormPago() {
        document.getElementById('montoPago').value = '';
        document.getElementById('transaccionPago').value = '';
    }

    function mostrarModal() {
        document.getElementById('modalPago').classList.remove('hidden');
        document.getElementById('modalPago').classList.add('flex');
    }

    async function confirmarPago() {
        let monto = parseFloat(document.getElementById('montoPago').value);
        if(isNaN(monto) || monto<=0) { toast("Monto inválido","error"); return; }
        const concepto = document.getElementById('conceptoPago').value;
        const transaccion = document.getElementById('transaccionPago').value.trim() || "REF_MOVIL";
        
        if(!modoPagoMultiple) {
            let cedula = document.getElementById('btn-confirmar-pago').getAttribute('data-cedula');
            try {
                let res = await fetch(`${API_URL}?action=registrarPagoVocalia&cedula=${cedula}&monto=${monto}&concepto=${concepto}&transaccion=${encodeURIComponent(transaccion)}`);
                let data = await res.json();
                if(data.success) { toast(`Pago asentado`); cerrarModalPago(); cargarDatos(); }
                else throw new Error(data.error);
            } catch(e) { toast(e.message,"error"); }
        } else {
            let ok=0;
            for(let ced of selectedPlayers) {
                try {
                    let res = await fetch(`${API_URL}?action=registrarPagoVocalia&cedula=${ced}&monto=${monto}&concepto=${concepto}&transaccion=${encodeURIComponent(transaccion)}`);
                    let data = await res.json();
                    if(data.success) ok++;
                } catch(e){}
            }
            toast(`Procesados ${ok} abonos`);
            cerrarModalPago();
            selectedPlayers.clear();
            cargarDatos();
        }
    }

    async function abrirHistorial() {
        const modal = document.getElementById('modalHistorial');
        const cont = document.getElementById('historial-contenido');
        cont.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">Cargando transacciones...</div>';
        modal.classList.remove('hidden'); modal.classList.add('flex');
        try {
            let res = await fetch(`${API_URL}?action=getHistorialVocalia&nocache=${Date.now()}`);
            let data = await res.json();
            if(data.success && data.historial?.length) {
                let html = '<div class="space-y-1.5">';
                for(let it of data.historial) {
                    let fecha = new Date(it.fecha).toLocaleString('es-EC', {day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit'});
                    html += `
                    <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-[11px] flex justify-between items-center gap-2">
                        <div>
                            <strong class="text-slate-800 block">${escapeHtml(it.jugador)}</strong>
                            <span class="text-slate-400 text-[10px]">${fecha} &bull; ${it.transaccion||'Manual'}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-primary block">${formatMoney(it.monto)}</span>
                            <span class="text-[9px] text-slate-400">Resta: ${formatMoney(it.deudaRestante)}</span>
                        </div>
                    </div>`;
                }
                html += '</div>';
                cont.innerHTML = html;
            } else cont.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">Sin transacciones registradas.</div>';
        } catch(e) { cont.innerHTML = `<div class="text-center py-4 text-xs text-error font-bold">Error al cargar historial</div>`; }
    }

    function cerrarModalPago() { document.getElementById('modalPago').classList.add('hidden'); document.getElementById('modalPago').classList.remove('flex'); }
    function cerrarModalHistorial() { document.getElementById('modalHistorial').classList.add('hidden'); document.getElementById('modalHistorial').classList.remove('flex'); }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    document.getElementById('btn-refresh').addEventListener('click', cargarDatos);
    document.getElementById('btn-ver-historial').addEventListener('click', abrirHistorial);
    document.getElementById('btn-pago-multiple').addEventListener('click', abrirModalMultiple);
    document.getElementById('btn-confirmar-pago').addEventListener('click', confirmarPago);
    document.getElementById('busqueda').addEventListener('input', (e)=>{ busquedaTexto=e.target.value; renderizarJugadores(); });
    
    window.cerrarModalPago = cerrarModalPago;
    window.cerrarModalHistorial = cerrarModalHistorial;
    cargarDatos();
</script>
</body>
</html>

```
