<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Vocalía & Deudas | Nápoles FC</title>
    
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c3aed",
                        "on-surface": "#0f172a",
                        "on-surface-variant": "#64748b",
                        "error": "#ef4444"
                    },
                    fontFamily: { "headline-md": ["Outfit", "sans-serif"], "body-md": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid #e2e8f0; }
        .player-selected { border: 2px solid #7c3aed !important; background: #f5f3ff !important; }
        .deuda-item {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.68rem; padding: 4px 6px; background: #f8fafc; border-radius: 6px; margin-bottom: 2px;
        }
        .toast-notify {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 8px 16px; border-radius: 20px;
            z-index: 2000; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body class="bg-slate-50 font-body-md text-on-surface min-h-screen pb-16">

<header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 flex justify-between items-center px-3 h-12 shadow-sm">
    <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined text-primary text-xl font-bold">payments</span>
        <h1 class="text-xs font-headline-md font-black tracking-tight text-on-surface">CONTROL DE VALORES | NÁPOLES FC</h1>
    </div>
    <button id="btn-refresh" class="w-7 h-7 bg-slate-100 rounded-lg flex items-center justify-center active:scale-95">
        <span class="material-symbols-outlined text-base">refresh</span>
    </button>
</header>

<main class="pt-14 px-2 max-w-7xl mx-auto space-y-3">
    
    <!-- === CARDS DE RESUMEN (INCLUYE CONTADOR SOLICITADO) === -->
    <section class="grid grid-cols-3 gap-1.5">
        <div class="bg-slate-900 p-2.5 rounded-xl text-white shadow-sm flex flex-col justify-between">
            <p class="text-[7.5px] uppercase tracking-wider opacity-60 font-bold">Recaudado</p>
            <h2 class="text-xs font-headline-md font-black mt-1" id="total-recaudado">$0.00</h2>
            <button id="btn-ver-historial" class="text-[7px] bg-white/10 px-1 py-0.5 rounded w-max mt-1">Historial</button>
        </div>
        
        <div class="bg-red-950 p-2.5 rounded-xl text-white shadow-sm border border-red-900 flex flex-col justify-between">
            <p class="text-[7.5px] uppercase tracking-wider opacity-60 font-bold font-headline-md text-red-300">Total Pendiente</p>
            <h2 class="text-xs font-headline-md font-black text-red-400 mt-1" id="total-pendiente-global">$0.00</h2>
            <span class="text-[7px] text-red-200 block truncate mt-1">Cartera de deudas</span>
        </div>

        <!-- INDICATOR CARD SOLICITADO: Muestra cuántos jugadores tienen valores pendientes -->
        <div class="bg-gradient-to-br from-purple-600 to-indigo-800 p-2.5 rounded-xl text-white shadow-sm flex flex-col justify-between border border-purple-500">
            <p class="text-[7.5px] uppercase tracking-wider opacity-90 font-black">Con Deuda</p>
            <div class="flex items-baseline gap-1 mt-0.5">
                <h2 class="text-lg font-headline-md font-black tracking-tight" id="deudores-contador">0</h2>
                <span class="text-[8px] opacity-75 font-medium">Jugadores</span>
            </div>
            <span class="text-[7px] text-purple-200 block font-bold truncate">Por Regularizar</span>
        </div>
    </section>

    <!-- Buscador e Interfaz de filtros -->
    <section class="glass-card p-2 rounded-xl flex gap-1.5 items-center">
        <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs">search</span>
            <input class="w-full pl-6 pr-2 py-1 bg-slate-100 border-none rounded-md text-[11px] font-medium focus:ring-1 focus:ring-primary/20" id="busqueda" placeholder="Filtrar jugador por nombre...">
        </div>
        <button id="btn-pago-multiple" class="px-2.5 py-1 bg-primary text-white text-[11px] font-bold rounded-md flex items-center gap-0.5 shadow-sm">
            <span class="material-symbols-outlined text-xs">groups</span> Cobro Grupal
        </button>
    </section>

    <!-- Listado Dinámico en Doble Columna -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-1.5" id="lista-jugadores">
        <div class="p-6 text-center text-xs text-slate-400 col-span-full">Esperando respuesta del servidor unificado...</div>
    </div>
</main>

<!-- Modal de Abonos -->
<div id="modalPago" class="fixed inset-0 z-[60] hidden items-center justify-center p-3">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs" onclick="cerrarModalPago()"></div>
    <div class="relative bg-white w-full max-w-xs rounded-xl overflow-hidden shadow-xl border border-slate-200">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-xs font-bold text-on-surface" id="modal-titulo">Procesar Abono</h3>
            <button class="p-1" onclick="cerrarModalPago()"><span class="material-symbols-outlined text-sm">close</span></button>
        </div>
        <div class="p-3 space-y-2.5">
            <div id="jugadores-seleccionados-resumen" class="text-[10px] bg-purple-50 text-primary p-2 rounded border border-purple-100 hidden"></div>
            
            <div id="wrapper-concepto-seleccion">
                <label class="block text-[9px] font-bold text-slate-500 mb-0.5">Concepto Pendiente Específico</label>
                <select id="conceptoPago" class="w-full p-1.5 bg-slate-100 rounded text-xs border-none font-medium text-slate-700"></select>
            </div>

            <div>
                <label class="block text-[9px] font-bold text-slate-500 mb-0.5">Monto de Pago ($)</label>
                <input type="number" id="montoPago" step="0.01" class="w-full p-1.5 bg-slate-100 rounded text-xs font-bold border-none" placeholder="0.00">
            </div>
            <div>
                <label class="block text-[9px] font-bold text-slate-500 mb-0.5">Referencia de Transacción</label>
                <input type="text" id="transaccionPago" class="w-full p-1.5 bg-slate-100 rounded text-xs border-none" placeholder="Ej. Depósito, Efectivo Caja">
            </div>
        </div>
        <div class="p-2 bg-slate-50 border-t border-slate-100 flex justify-end gap-1.5">
            <button class="px-2.5 py-1 text-[11px] text-slate-500 font-bold" onclick="cerrarModalPago()">Cancelar</button>
            <button id="btn-confirmar-pago" class="px-3 py-1 bg-primary text-white text-[11px] font-bold rounded">Aplicar</button>
        </div>
    </div>
</div>

<!-- Modal Historial -->
<div id="modalHistorial" class="fixed inset-0 z-[60] hidden items-center justify-center p-3">
    <div class="absolute inset-0 bg-slate-900/40" onclick="cerrarModalHistorial()"></div>
    <div class="relative bg-white w-full max-w-xs max-h-[70vh] rounded-xl overflow-hidden flex flex-col shadow-xl">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-xs font-bold">Transacciones Recientes</h3>
            <button class="p-1" onclick="cerrarModalHistorial()"><span class="material-symbols-outlined text-sm">close</span></button>
        </div>
        <div class="p-3 overflow-y-auto space-y-1.5" id="historial-contenido"></div>
    </div>
</div>

<script>
    // REEMPLAZAR CON TU URL REAL DE IMPLEMENTACIÓN (DEBE TERMINAR EN /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbz62_ZoxSjv-7urjwpiAOcY8dB6GPAr7n3tAxZzK1bsNgIwJeeIiNg2vPmCTVyj3YoI/exec";

    let jugadoresData = [];
    let selectedPlayers = new Set();
    let modoPagoMultiple = false;
    let busquedaTexto = "";

    function formatMoney(v) { return new Intl.NumberFormat('es-EC', { style:'currency', currency:'USD' }).format(v); }
    function toast(msg, type='info') {
        let t = document.createElement('div'); t.className = 'toast-notify';
        t.innerHTML = `<span>${type==='error'?'❌':'📋'}</span> ${msg}`;
        document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
    }

    async function cargarDatos() {
        const container = document.getElementById('lista-jugadores');
        container.innerHTML = '<div class="p-6 text-center text-xs text-slate-400 col-span-full">Sincronizando balances pendientes...</div>';
        try {
            const res = await fetch(`${API_URL}?action=getVocaliaData&nocache=${Date.now()}`);
            const data = await res.json();
            if(data.success) {
                jugadoresData = data.deudores;
                document.getElementById('total-pendiente-global').innerText = formatMoney(data.totalDeuda);
                document.getElementById('deudores-contador').innerText = data.cantidadDeudores;
                
                const hist = await fetch(`${API_URL}?action=getHistorialVocalia&nocache=${Date.now()}`);
                const histData = await hist.json();
                let recaudado = 0;
                if(histData.success && histData.historial) recaudado = histData.historial.reduce((s,i)=>s+parseFloat(i.monto),0);
                document.getElementById('total-recaudado').innerText = formatMoney(recaudado);
                
                renderizarJugadores();
            } else throw new Error(data.error);
        } catch(e) {
            container.innerHTML = `<div class="col-span-full py-4 text-center text-xs font-bold text-error bg-red-50 rounded-lg">Error de red: ${e.message}</div>`;
        }
    }

    function renderizarJugadores() {
        const container = document.getElementById('lista-jugadores');
        let lista = jugadoresData;
        
        if(busquedaTexto) {
            lista = jugadoresData.filter(j => 
                (j.nombreCompleto || "").toLowerCase().includes(busquedaTexto.toLowerCase()) ||
                (j.nombreCamiseta || "").toLowerCase().includes(busquedaTexto.toLowerCase())
            );
        }

        if(!lista.length) {
            container.innerHTML = '<div class="col-span-full py-4 text-center text-xs text-slate-400">Sin deudas de cobranza pendientes.</div>';
            return;
        }

        let html = '';
        for(let j of lista) {
            const selec = selectedPlayers.has(j.cedula);
            
            let desgloseHtml = '';
            j.detallesPendientes.forEach(d => {
                desgloseHtml += `
                    <div class="deuda-item">
                        <span class="text-slate-500 font-medium truncate max-w-[70px]">${d.concepto}</span>
                        <strong class="text-red-600 font-bold">${formatMoney(d.saldoPendiente)}</strong>
                    </div>`;
            });

            html += `
                <div class="bg-white p-2 rounded-xl shadow-xs border transition-all ${selec ? 'player-selected' : 'border-slate-200'}" onclick="toggleSelect('${j.cedula}')">
                    <div class="flex items-center justify-between gap-1 mb-1">
                        <div class="flex items-center gap-1 truncate">
                            <span class="text-[8px] bg-slate-900 text-white px-1 py-0.2 rounded font-black">${j.dorsal || '--'}</span>
                            <h4 class="font-bold text-[10px] text-slate-900 truncate">${escapeHtml(j.nombreCamiseta)}</h4>
                        </div>
                        <input type="checkbox" class="w-3 h-3 rounded text-primary focus:ring-0" ${selec ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${j.cedula}')">
                    </div>
                    
                    <div class="space-y-0.5 mt-1.5">
                        ${desgloseHtml}
                    </div>

                    <div class="mt-2 pt-1 border-t border-dashed border-slate-200 flex justify-between items-center text-[9px]">
                        <span class="text-slate-400 font-bold uppercase">Neto:</span>
                        <span class="font-black text-purple-700 text-xs">${formatMoney(j.totalPendiente)}</span>
                    </div>
                    
                    <button class="w-full mt-2 py-1 bg-purple-50 hover:bg-purple-100 rounded text-[9px] font-bold text-primary flex items-center justify-center gap-0.5" onclick="event.stopPropagation(); abrirModalPagoIndividual('${j.cedula}')">
                        <span class="material-symbols-outlined text-[10px]">add_card</span> Cobrar
                    </button>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function toggleSelect(cedula) {
        if(selectedPlayers.has(cedula)) selectedPlayers.delete(cedula);
        else selectedPlayers.add(cedula);
        renderizarJugadores();
    }

    function abrirModalPagoIndividual(cedula) {
        modoPagoMultiple = false;
        let jug = jugadoresData.find(j=>j.cedula===cedula);
        if(!jug) return;
        
        document.getElementById('modal-titulo').innerText = `Abonar a ${jug.nombreCamiseta}`;
        document.getElementById('jugadores-seleccionados-resumen').classList.add('hidden');
        document.getElementById('wrapper-concepto-seleccion').classList.remove('hidden');
        document.getElementById('btn-confirmar-pago').setAttribute('data-cedula', cedula);
        
        const selectConcepto = document.getElementById('conceptoPago');
        selectConcepto.innerHTML = '';
        jug.detallesPendientes.forEach(d => {
            selectConcepto.innerHTML += `<option value="${d.concepto}">${d.concepto} (${formatMoney(d.saldoPendiente)})</option>`;
        });
        
        limpiarFormPago(); mostrarModal();
    }

    function abrirModalMultiple() {
        if(selectedPlayers.size===0) { toast("Por favor seleccione deudores en la lista","error"); return; }
        modoPagoMultiple = true;
        let nombres = Array.from(selectedPlayers).map(c=>{let j=jugadoresData.find(j=>j.cedula===c); return j?j.nombreCamiseta:c;}).join(', ');
        
        document.getElementById('modal-titulo').innerText = `Cobro Colectivo Directo`;
        const resEl = document.getElementById('jugadores-seleccionados-resumen');
        resEl.classList.remove('hidden'); resEl.innerHTML = `<p class="truncate font-medium">Aplicar pago a: ${nombres}</p>`;
        document.getElementById('wrapper-concepto-seleccion').classList.add('hidden'); 
        document.getElementById('btn-confirmar-pago').removeAttribute('data-cedula');
        
        limpiarFormPago(); mostrarModal();
    }

    function limpiarFormPago() { document.getElementById('montoPago').value = ''; document.getElementById('transaccionPago').value = ''; }
    function mostrarModal() { document.getElementById('modalPago').classList.remove('hidden'); document.getElementById('modalPago').classList.add('flex'); }

    async function confirmarPago() {
        let monto = parseFloat(document.getElementById('montoPago').value);
        if(isNaN(monto) || monto<=0) { toast("Monto ingresado no es válido","error"); return; }
        const transaccion = document.getElementById('transaccionPago').value.trim() || "EFECTIVO";
        
        if(!modoPagoMultiple) {
            let cedula = document.getElementById('btn-confirmar-pago').getAttribute('data-cedula');
            let concepto = document.getElementById('conceptoPago').value;
            try {
                let res = await fetch(`${API_URL}?action=registrarPagoVocalia&cedula=${cedula}&monto=${monto}&concepto=${encodeURIComponent(concepto)}&transaccion=${encodeURIComponent(transaccion)}`);
                let data = await res.json();
                if(data.success) { toast(`¡Pago registrado con éxito!`); cerrarModalPago(); cargarDatos(); }
                else throw new Error(data.error);
            } catch(e) { toast(e.message,"error"); }
        } else {
            let listCeds = Array.from(selectedPlayers);
            toast(`Procesando cola de cobros en paralelo...`);
            let completados = 0;
            for(let ced of listCeds) {
                try {
                    let res = await fetch(`${API_URL}?action=registrarPagoVocalia&cedula=${ced}&monto=${monto}&transaccion=${encodeURIComponent(transaccion)}`);
                    let data = await res.json(); if(data.success) completados++;
                } catch(e){}
            }
            toast(`Finalizado: ${completados} abonos guardados con éxito`);
            cerrarModalPago(); selectedPlayers.clear(); cargarDatos();
        }
    }

    async function abrirHistorial() {
        const modal = document.getElementById('modalHistorial');
        const cont = document.getElementById('historial-contenido');
        cont.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">Leyendo base histórica de cobros...</div>';
        modal.classList.remove('hidden'); modal.classList.add('flex');
        try {
            let res = await fetch(`${API_URL}?action=getHistorialVocalia&nocache=${Date.now()}`);
            let data = await res.json();
            if(data.success && data.historial?.length) {
                let html = '';
                for(let it of data.historial) {
                    let f = it.fecha ? it.fecha.split('T')[0] : 'S/F';
                    html += `
                    <div class="p-2 bg-slate-50 rounded border text-[10px] flex justify-between items-center">
                        <div>
                            <strong class="text-slate-800 block uppercase">${escapeHtml(it.jugador)}</strong>
                            <span class="text-slate-400 text-[8px]">${escapeHtml(it.transaccion)} - ${f}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-emerald-600 block">+ ${formatMoney(it.monto)}</span>
                            <span class="text-[8px] text-slate-400">Saldo: ${formatMoney(it.deudaRestante)}</span>
                        </div>
                    </div>`;
                }
                cont.innerHTML = html;
            } else cont.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">Sin movimientos financieros aún.</div>';
        } catch(e) { cont.innerHTML = `<div class="text-center py-4 text-xs text-error">Error al obtener historial</div>`; }
    }

    function cerrarModalPago() { document.getElementById('modalPago').classList.add('hidden'); document.getElementById('modalPago').classList.remove('flex'); }
    function cerrarModalHistorial() { document.getElementById('modalHistorial').classList.add('hidden'); document.getElementById('modalHistorial').classList.remove('flex'); }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    document.getElementById('btn-refresh').addEventListener('click', cargarDatos);
    document.getElementById('btn-ver-historial').addEventListener('click', abrirHistorial);
    document.getElementById('btn-pago-multiple').addEventListener('click', abrirModalMultiple);
    document.getElementById('btn-confirmar-pago').addEventListener('click', confirmarPago);
    document.getElementById('busqueda').addEventListener('input', (e)=>{ busquedaTexto=e.target.value; renderizarJugadores(); });
    
    window.cerrarModalPago = cerrarModalPago;
    window.cerrarModalHistorial = cerrarModalHistorial;
    cargarDatos();
</script>
</body>
</html>
