<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vocalía - Nápoles F.C.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --vocalia-dark: #7c2d12;
            --vocalia-light: #f97316;
            --success: #10b981;
            --danger: #ef4444;
            --slate-dark: #0f172a;
            --muted: #6b7280;
            --bg: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #faf7ff 45%, #f5f3ff 100%);
            min-height: 100vh;
            padding-bottom: 60px;
        }
        .wave-bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
        .wave { position: absolute; width: 220%; height: 280px; left: -60%; border-radius: 45%; opacity: .18; filter: blur(8px); }
        .wave1 { background: linear-gradient(90deg, #f97316, #facc15, #e9d5ff); bottom: -140px; animation: waveMove 18s linear infinite; }
        .wave2 { background: linear-gradient(90deg, #ea580c, #fdba74, #ede9fe); bottom: -170px; opacity: .12; animation: waveMoveReverse 26s linear infinite; }
        .wave3 { background: linear-gradient(90deg, #c084fc, #f3e8ff, #ffffff); bottom: -200px; opacity: .08; animation: waveMove 34s linear infinite; }
        @keyframes waveMove { 0% { transform: translateX(0) rotate(0deg); } 100% { transform: translateX(-12%) rotate(360deg); } }
        @keyframes waveMoveReverse { 0% { transform: translateX(0) rotate(0deg); } 100% { transform: translateX(12%) rotate(-360deg); } }
        .topbar {
            position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.75); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(245,158,11,0.2); padding: 16px 18px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .admin-info h1 { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 900; color: var(--vocalia-dark); }
        .admin-info p { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; box-shadow: 0 8px 18px rgba(249,115,22,0.3); }
        .hero { padding: 22px 18px 10px; max-width: 700px; margin: auto; }
        .hero-card { background: linear-gradient(135deg, #ea580c, #7c2d12); border-radius: 28px; padding: 26px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 20px 35px rgba(124,45,18,0.3); }
        .hero-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        .dashboard { padding: 20px 18px 40px; max-width: 700px; margin: auto; }
        .summary-card { background: white; border-radius: 28px; padding: 20px; margin-bottom: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #fed7aa; }
        .stats-grid { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .stat-item { flex: 1; text-align: center; background: #fff7ed; border-radius: 20px; padding: 16px; }
        .stat-number { font-size: 2rem; font-weight: 900; font-family: 'Outfit', sans-serif; color: #ea580c; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }
        .section-title { font-size: 1.2rem; font-weight: 800; margin: 20px 0 16px 0; color: #7c2d12; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
        .deuda-list { display: flex; flex-direction: column; gap: 12px; }
        .deuda-item { background: white; border-radius: 24px; padding: 14px 16px; border: 1px solid #ffe4cc; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .deuda-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .dorsal-badge { background: #f97316; color: white; border-radius: 30px; padding: 4px 12px; font-weight: bold; font-size: 0.75rem; }
        .nombre-jugador { font-weight: 800; color: #111827; }
        .deuda-monto { background: #fee2e2; color: #dc2626; border-radius: 40px; padding: 4px 12px; font-weight: 800; font-size: 0.85rem; }
        .btn-pago { background: #f97316; border: none; padding: 6px 16px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-pago:hover { background: #ea580c; transform: scale(0.96); }
        .btn-refresh { background: #7c2d12; border: none; padding: 8px 18px; border-radius: 40px; color: white; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-container { background: white; width: 90%; max-width: 400px; border-radius: 28px; padding: 24px; transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.open .modal-container { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #fed7aa; border-radius: 16px; outline: none; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; z-index: 2000; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .empty-state { text-align: center; padding: 40px; color: var(--muted); }
        @media (max-width: 600px) { .deuda-item { flex-direction: column; align-items: flex-start; } .stats-grid { flex-direction: column; } }
    </style>
</head>
<body>
<div class="wave-bg"><div class="wave wave1"></div><div class="wave wave2"></div><div class="wave wave3"></div></div>

<header class="topbar">
    <div class="admin-info"><h1>🎙️ Vocalía Nápoles FC</h1><p>Gestión de cuotas y compromisos</p></div>
    <div class="avatar"><i class="fa-solid fa-gavel"></i></div>
</header>

<section class="hero">
    <div class="hero-card">
        <h2>Control de Deudas</h2>
        <p>Administra los pagos de vocalía, registra abonos y mantén la cartera al día.</p>
    </div>
</section>

<section class="dashboard">
    <div class="summary-card" id="resumenContainer">
        <div class="stats-grid">
            <div class="stat-item"><div class="stat-number" id="totalDeuda">-</div><div class="stat-label">Deuda Total</div></div>
            <div class="stat-item"><div class="stat-number" id="cantidadDeudores">-</div><div class="stat-label">Jugadores con Deuda</div></div>
            <div class="stat-item"><div class="stat-number" id="totalRecaudado">-</div><div class="stat-label">Total Recaudado</div></div>
        </div>
    </div>

    <div class="section-title">
        <span><i class="fa-solid fa-list-ul"></i> Jugadores con Deuda de Vocalía</span>
        <button class="btn-refresh" id="btnRefresh"><i class="fa-solid fa-arrows-rotate"></i> Actualizar</button>
    </div>
    <div id="deudoresList" class="deuda-list">
        <div class="empty-state">Cargando datos...</div>
    </div>
</section>

<div id="modalPago" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fa-solid fa-money-bill-wave"></i> Registrar Pago</h3>
            <button class="btn-close-modal" onclick="cerrarModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <div class="form-group">
            <label>Jugador: <strong id="modalJugadorNombre"></strong></label>
            <label>Deuda actual: <strong id="modalDeudaActual"></strong></label>
        </div>
        <div class="form-group">
            <label>Monto a pagar ($)</label>
            <input type="number" id="montoPago" step="0.01" class="form-control" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>N° de transacción (opcional)</label>
            <input type="text" id="transaccionPago" class="form-control" placeholder="Referencia">
        </div>
        <button id="confirmarPago" class="btn-pago" style="width:100%; justify-content:center;">Registrar Pago</button>
    </div>
</div>

<script>
    // ============ CONFIGURACIÓN ============
    // 🔴 REEMPLAZA ESTA URL CON LA DE TU WEB APP (la misma que usas en finanzas.js)
    const API_URL = "https://script.google.com/macros/s/AKfycbxLMp_cT5ftzdFc5hGuZITfIgKhdUQRZGMkeMBlIMv0j6CSVEpkwrgcdes8ZlJQG_ML/exec";
    
    // Si usas un archivo config.js externo, descomenta la siguiente línea y comenta la de arriba
    // const API_URL = CONFIG.URL_GAS;
    
    // ============ VALIDACIÓN DE LOGIN ============
    if(localStorage.getItem('admin_activo') !== 'true') {
        window.location.href = './login.html';
    }
    
    // ============ VARIABLES GLOBALES ============
    let jugadoresData = [];
    let jugadorSeleccionado = null;
    
    // ============ UTILIDADES ============
    const formatearMoneda = (v) => new Intl.NumberFormat('es-EC', { style: 'currency', currency: 'USD' }).format(v);
    
    function mostrarToast(mensaje, tipo='info') {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span>${tipo === 'error' ? '❌' : '✅'}</span> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // ============ CARGA DE DATOS ============
    async function cargarDatos() {
        const contenedor = document.getElementById('deudoresList');
        contenedor.innerHTML = '<div class="empty-state">Cargando...</div>';
        try {
            const res = await fetch(`${API_URL}?action=getVocaliaData&nocache=${Date.now()}`);
            const data = await res.json();
            if(data.success) {
                jugadoresData = data.deudores;
                document.getElementById('totalDeuda').innerText = formatearMoneda(data.totalDeuda);
                document.getElementById('cantidadDeudores').innerText = data.cantidadDeudores;
                document.getElementById('totalRecaudado').innerText = formatearMoneda(data.totalRecaudado);
                renderizarDeudores(jugadoresData);
            } else {
                throw new Error(data.error);
            }
        } catch(e) {
            console.error(e);
            contenedor.innerHTML = `<div class="empty-state">❌ Error al cargar datos: ${e.message}</div>`;
            mostrarToast("Error de conexión", "error");
        }
    }
    
    function renderizarDeudores(deudores) {
        const contenedor = document.getElementById('deudoresList');
        if(!deudores || deudores.length === 0) {
            contenedor.innerHTML = '<div class="empty-state">🎉 No hay jugadores con deuda de vocalía.</div>';
            return;
        }
        let html = '';
        for(let j of deudores) {
            html += `
                <div class="deuda-item">
                    <div class="deuda-info">
                        <span class="dorsal-badge">#${j.dorsal || '?'}</span>
                        <span class="nombre-jugador">${escapeHtml(j.nombreCamiseta || j.nombreCompleto)}</span>
                        <span class="deuda-monto">${formatearMoneda(j.deuda)}</span>
                    </div>
                    <button class="btn-pago" data-cedula="${j.cedula}" data-nombre="${escapeHtml(j.nombreCompleto)}" data-deuda="${j.deuda}">
                        <i class="fa-solid fa-hand-holding-usd"></i> Registrar Pago
                    </button>
                </div>
            `;
        }
        contenedor.innerHTML = html;
        
        document.querySelectorAll('.btn-pago').forEach(btn => {
            btn.addEventListener('click', () => {
                jugadorSeleccionado = {
                    cedula: btn.dataset.cedula,
                    nombre: btn.dataset.nombre,
                    deuda: parseFloat(btn.dataset.deuda)
                };
                document.getElementById('modalJugadorNombre').innerText = jugadorSeleccionado.nombre;
                document.getElementById('modalDeudaActual').innerText = formatearMoneda(jugadorSeleccionado.deuda);
                document.getElementById('montoPago').value = '';
                document.getElementById('transaccionPago').value = '';
                document.getElementById('modalPago').classList.add('open');
            });
        });
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    // ============ REGISTRAR PAGO ============
    async function confirmarPago() {
        let monto = parseFloat(document.getElementById('montoPago').value);
        if(isNaN(monto) || monto <= 0) {
            mostrarToast("Ingrese un monto válido", "error");
            return;
        }
        if(monto > jugadorSeleccionado.deuda) {
            mostrarToast("El monto no puede superar la deuda actual", "error");
            return;
        }
        const transaccion = document.getElementById('transaccionPago').value.trim() || "SIN REFERENCIA";
        const cerrar = () => document.getElementById('modalPago').classList.remove('open');
        try {
            const res = await fetch(`${API_URL}?action=registrarPagoVocalia&cedula=${jugadorSeleccionado.cedula}&monto=${monto}&transaccion=${encodeURIComponent(transaccion)}`);
            const data = await res.json();
            if(data.success) {
                mostrarToast(`Pago de ${formatearMoneda(monto)} registrado correctamente`, "success");
                cerrar();
                cargarDatos();
            } else {
                throw new Error(data.error);
            }
        } catch(e) {
            mostrarToast(e.message, "error");
        }
    }
    
    function cerrarModal() {
        document.getElementById('modalPago').classList.remove('open');
    }
    
    // ============ EVENTOS ============
    document.getElementById('btnRefresh').addEventListener('click', cargarDatos);
    document.getElementById('confirmarPago').addEventListener('click', confirmarPago);
    window.addEventListener('click', (e) => { 
        if(e.target.classList.contains('modal-overlay')) cerrarModal(); 
    });
    
    // Iniciar
    cargarDatos();
</script>
</body>
</html>
