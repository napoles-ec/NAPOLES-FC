<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" name="viewport"/>
    <title>Nápoles FC · Táctica Elite Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "napoles-blue": "#0092d4",
                        "napoles-blue-deep": "#00588a",
                        "napoles-dark": "#030711",
                        "napoles-panel": "#0a1526",
                        "gold-accent": "#d4af37",
                        "gold-soft": "#f0cf70"
                    },
                    fontFamily: {
                        "headline": ["Outfit", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        :root{
            --blue: #0092d4;
            --blue-deep: #00588a;
            --blue-glow: rgba(0, 146, 212, 0.38);
            --gold: #d4af37;
            --gold-soft: #f0cf70;
            --void: #030711;
            --panel: #0a1526;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--void);
            background-image:
                radial-gradient(circle at 50% -10%, rgba(0, 146, 212, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 100% 15%, rgba(212, 175, 55, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 0% 90%, rgba(0, 146, 212, 0.08) 0%, transparent 45%);
            font-family: 'Inter', sans-serif;
            touch-action: pan-y pinch-zoom;
        }

        .tabular { font-variant-numeric: tabular-nums; }

        /* ===================== HEADER ===================== */
        .crest {
            background: linear-gradient(155deg, var(--blue) 0%, var(--blue-deep) 100%);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 6px 16px -4px rgba(0,146,212,0.55);
        }
        .header-hairline {
            background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
            opacity: 0.4;
        }

        /* ===================== MATCH TICKET ===================== */
        .match-ticket {
            background:
                radial-gradient(circle at 100% 0%, rgba(0,146,212,0.14) 0%, transparent 60%),
                linear-gradient(150deg, rgba(10,21,38,0.95) 0%, rgba(3,7,17,0.98) 100%);
            border: 1px solid rgba(255,255,255,0.07);
            position: relative;
            overflow: hidden;
        }
        .match-ticket::after {
            content: '';
            position: absolute;
            top: 8px; bottom: 8px; right: 92px;
            width: 1px;
            background-image: linear-gradient(180deg, transparent, rgba(255,255,255,0.14) 8px, rgba(255,255,255,0.14) calc(100% - 8px), transparent);
            background-size: 1px 8px;
        }
        .live-dot {
            box-shadow: 0 0 0 0 rgba(0,146,212,0.6);
            animation: livepulse 1.8s ease-out infinite;
        }
        @keyframes livepulse {
            0% { box-shadow: 0 0 0 0 rgba(0,146,212,0.55); }
            70% { box-shadow: 0 0 0 7px rgba(0,146,212,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,146,212,0); }
        }
        .stat-pill {
            background: linear-gradient(180deg, rgba(0,146,212,0.14) 0%, transparent 100%);
            border: 1px solid rgba(0,146,212,0.35);
        }

        /* ===================== PITCH ===================== */
        .pitch-perspective { perspective: 1100px; }
        .pitch-surface {
            transform: rotateX(11deg);
            transform-origin: center bottom;
            background:
                repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 60px),
                repeating-linear-gradient(180deg, #0b2416 0px, #0b2416 34px, #103019 34px, #103019 68px);
            border: 2px solid rgba(255,255,255,0.14);
            box-shadow:
                0 0 50px var(--blue-glow),
                0 34px 80px -14px rgba(0,0,0,0.92),
                inset 0 0 70px rgba(0,0,0,0.65);
            aspect-ratio: 3.4/4.6;
        }
        .pitch-surface::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% -25%, rgba(255,255,255,0.14) 0%, transparent 55%);
            pointer-events: none;
            z-index: 2;
        }
        .pitch-vignette {
            position: absolute; inset: 0;
            box-shadow: inset 0 0 90px 20px rgba(0,0,0,0.55);
            pointer-events: none; z-index: 3;
        }

        .pitch-line { position: absolute; border-color: rgba(255,255,255,0.32); pointer-events: none; }
        .pitch-outline { inset: 12px; border: 1.5px solid rgba(255,255,255,0.28); }
        .pitch-halfway { top: 50%; left: 12px; right: 12px; height: 1.5px; background: rgba(255,255,255,0.28); }
        .pitch-center-circle {
            top: 50%; left: 50%; width: 84px; height: 84px;
            transform: translate(-50%,-50%);
            border: 1.5px solid rgba(255,255,255,0.28); border-radius: 50%;
        }
        .pitch-center-spot { top: 50%; left: 50%; width: 5px; height: 5px; transform: translate(-50%,-50%); background: rgba(255,255,255,0.35); border-radius: 50%; }
        .pitch-box-top { top: 12px; left: 50%; width: 58%; height: 60px; transform: translateX(-50%); border: 1.5px solid rgba(255,255,255,0.28); border-top: none; }
        .pitch-box-top-small { top: 12px; left: 50%; width: 30%; height: 26px; transform: translateX(-50%); border: 1.5px solid rgba(255,255,255,0.24); border-top: none; }
        .pitch-box-bottom { bottom: 12px; left: 50%; width: 58%; height: 60px; transform: translateX(-50%); border: 1.5px solid rgba(255,255,255,0.28); border-bottom: none; }
        .pitch-box-bottom-small { bottom: 12px; left: 50%; width: 30%; height: 26px; transform: translateX(-50%); border: 1.5px solid rgba(255,255,255,0.24); border-bottom: none; }
        .pitch-corner { width: 16px; height: 16px; border: 1.5px solid rgba(255,255,255,0.24); border-radius: 50%; }
        .pitch-corner-tl { top: 6px; left: 6px; clip-path: inset(0 0 50% 50%); }
        .pitch-corner-tr { top: 6px; right: 6px; clip-path: inset(0 50% 50% 0); }
        .pitch-corner-bl { bottom: 6px; left: 6px; clip-path: inset(50% 0 0 50%); }
        .pitch-corner-br { bottom: 6px; right: 6px; clip-path: inset(50% 50% 0 0); }

        /* ===================== FORMATION SWITCHER ===================== */
        .formation-dock {
            background: linear-gradient(180deg, rgba(10,21,38,0.9), rgba(3,7,17,0.9));
            border: 1px solid rgba(255,255,255,0.06);
        }
        .formation-btn { transition: color .2s ease, background .2s ease, box-shadow .2s ease; }
        .formation-btn.is-active {
            background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
            color: #fff;
            box-shadow: 0 6px 16px -4px rgba(0,146,212,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset;
        }
        .formation-btn:not(.is-active) { color: #7c8ba1; }
        .formation-btn:not(.is-active):hover { color: #e5edf5; }

        /* ===================== JERSEY / PLAYER TOKEN ===================== */
        .football-shirt {
            position: relative;
            width: 40px;
            height: 38px;
            background: linear-gradient(160deg, #00a3e8 0%, var(--blue) 45%, var(--blue-deep) 100%);
            clip-path: polygon(30% 0%, 42% 8%, 50% 14%, 58% 8%, 70% 0%, 100% 22%, 84% 38%, 76% 32%, 76% 100%, 24% 100%, 24% 32%, 16% 38%, 0% 22%);
            box-shadow: 0 5px 10px rgba(0,0,0,0.45);
            will-change: transform;
        }
        .football-shirt::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(115deg, rgba(255,255,255,0.32) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.18) 100%);
            clip-path: inherit;
            pointer-events: none;
        }
        .football-shirt::after {
            content: '';
            position: absolute;
            left: 24%; right: 24%; top: 0; height: 3px;
            background: var(--gold);
            border-radius: 0 0 3px 3px;
        }
        .shirt-number {
            position: relative; z-index: 4;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 12px;
            color: var(--gold-soft);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            margin-top: 3px;
        }
        /* legacy hook kept for JS-generated markup */
        .shirt-neck { display: none; }

        /* Jugador en cancha */
        .player-node {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
            z-index: 20;
            cursor: grab;
            user-select: none;
        }
        .player-node:active { cursor: grabbing; z-index: 100; }
        .player-node:active .football-shirt { transform: scale(1.16) translateY(-2px); box-shadow: 0 14px 26px rgba(0,0,0,0.65), 0 0 0 2px var(--gold); }

        .player-tag {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            color: #f1f5f9;
            background: rgba(3,7,17,0.88);
            padding: 2px 7px;
            border-radius: 6px;
            margin-top: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .player-badges {
            position: absolute; top: -8px; right: -14px;
            background: rgba(3,7,17,0.92);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 7px;
            padding: 1px 4px;
            display: flex; align-items: center; gap: 2px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.45);
            z-index: 30;
            transform: scale(0.92);
            font-family: 'JetBrains Mono', monospace;
        }

        .dragging-touch-shirt {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.96;
            transform: scale(1.22);
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.55));
        }

        .drop-over {
            border-color: var(--blue) !important;
            box-shadow: 0 0 0 2px var(--blue), 0 0 44px var(--blue-glow), inset 0 0 40px rgba(0,0,0,0.6) !important;
        }

        /* ===================== BENCH ===================== */
        .bench-side-scroller::-webkit-scrollbar { display: none; }
        .bench-collapsed { transform: translateY(calc(100% - 56px)); }
        .bench-expanded { transform: translateY(0); }
        .bench-card {
            background: linear-gradient(165deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            transition: border-color .2s ease, transform .15s ease, background .2s ease;
        }
        .bench-card:hover { border-color: rgba(0,146,212,0.45); background: rgba(0,146,212,0.05); }
        .bench-card:active { transform: scale(0.95); }
        .bench-card .football-shirt { width: 32px; height: 30px; }
        .bench-card .shirt-number { font-size: 10px; }
        .bench-empty {
            border: 1.5px dashed rgba(255,255,255,0.14);
            border-radius: 14px;
        }

        /* ===================== FAB STACK ===================== */
        .fab-ghost {
            background: rgba(10,21,38,0.82);
            border: 1px solid rgba(255,255,255,0.09);
            backdrop-filter: blur(10px);
        }
        .fab-save {
            background: linear-gradient(155deg, var(--gold-soft) 0%, var(--gold) 55%, #a8801f 100%);
            box-shadow: 0 10px 22px -6px rgba(212,175,55,0.55), 0 0 0 1px rgba(255,255,255,0.25) inset;
        }

        /* Focus states for accessibility */
        button:focus-visible {
            outline: 2px solid var(--gold-soft);
            outline-offset: 2px;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .rise-in { animation: rise-in 0.5s cubic-bezier(0.16,1,0.3,1) both; }

        @media (prefers-reduced-motion: reduce) {
            .live-dot, .rise-in { animation: none !important; }
            * { transition-duration: 0.01ms !important; }
        }
    </style>
</head>

        </div>

<div class="fixed top-16 w-full h-px header-hairline z-40"></div>

<main class="pt-20 pb-40 px-4 max-w-md mx-auto">
    <div class="match-ticket rounded-2xl p-4 mb-5 shadow-2xl rise-in">
        <div class="flex justify-between items-center">
            <div class="pr-4">
                <p class="text-[9px] font-mono tracking-[0.2em] text-gold-soft uppercase mb-1">Próximo partido</p>

            <div class="pitch-line pitch-box-bottom-small"></div>
            <div class="pitch-line pitch-corner pitch-corner-tl"></div>

    <!-- Selectores de Formación -->
    <div class="formation-dock flex justify-center gap-2 p-1.5 rounded-xl backdrop-blur-md shadow-xl rise-in" style="animation-delay: .16s;">
        <button class="formation-btn is-active flex-1 py-2 px-3 rounded-lg text-xs font-bold tracking-wide active:scale-95" onclick="aplicarFormacion('4-1-3-2', this)">4-1-3-2</button>
        <button class="formation-btn flex-1 py-2 px-3 rounded-lg text-xs font-bold tracking-wide active:scale-95" onclick="aplicarFormacion('4-4-2', this)">4-4-2</button>
        <button class="formation-btn flex-1 py-2 px-3 rounded-lg text-xs font-bold tracking-wide active:scale-95" onclick="aplicarFormacion('3-5-2', this)">3-5-2</button>

<div class="fixed bottom-36 right-4 flex flex-col gap-3 z-50">
    <button class="fab-ghost w-11 h-11 rounded-full flex items-center justify-center text-slate-400 hover:text-white shadow-lg transition-all active:rotate-180" onclick="location.reload()" aria-label="Reiniciar">
        <span class="material-symbols-outlined text-[20px]">restart_alt</span>

<section id="bench-section" class="fixed bottom-0 left-0 w-full z-40 bg-gradient-to-b from-slate-950 via-slate-950/95 to-slate-950 border-t border-white/10 pt-4 rounded-t-[24px] bench-expanded transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] shadow-[0_-15px_40px_rgba(0,0,0,0.8)]">
    <div class="px-6 flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
            <h3 class="font-headline font-semibold text-xs tracking-wider uppercase text-slate-400">Banca de Suplentes</h3>
            <span class="text-[10px] font-mono font-bold text-gold-soft bg-gold-accent/10 px-2 py-0.5 rounded-full border border-gold-accent/20 tabular" id="suplentes-count">0</span>
        </div>
        <div class="w-12 h-1 bg-white/10 rounded-full"></div>
    </div>
    <div id="bench-list" class="bench-side-scroller flex gap-3.5 overflow-x-auto px-6 pb-5 pt-1"></div>
</section>

<script>
    // ================= CONFIGURACIÓN DINÁMICA =================
    const API_URL = "https://script.google.com/macros/s/AKfycbwSCHPZe3W6TK1LlISviUW7do0jSKswSPJCanxRQJ0nEVWrrwbZvL_nLGfk8VYyyAJt/exec"; // <-- REEMPLAZA CON TU URL

    let fechaPartido = '';
    let rivalPartido = '';
    let jugadoresConfirmados = [];
    let jugadoresEnCampo = [];
    let jugadoresEnBanca = [];
    let dragActive = false, dragType = null, dragIndex = -1, dragJugador = null, clone = null;

    const pitchContainer = document.getElementById('pitch-container');
    const formationContainer = document.getElementById('formation-container');
    const benchListDiv = document.getElementById('bench-list');
    const suplentesSpan = document.getElementById('suplentes-count');
    const campoCountSpan = document.getElementById('jugadores-campo-count');
    const benchSection = document.getElementById('bench-section');
    const toggleBtn = document.getElementById('toggle-bench-btn');
    const rivalSpan = document.getElementById('rival-partido');
    const fechaSpan = document.getElementById('fecha-partido');
    let benchCollapsed = false;

    toggleBtn.addEventListener('click', () => {
        benchCollapsed = !benchCollapsed;
        if (benchCollapsed) {
            benchSection.classList.remove('bench-expanded');
            benchSection.classList.add('bench-collapsed');
            toggleBtn.querySelector('span').innerText = 'keyboard_arrow_up';
        } else {
            benchSection.classList.remove('bench-collapsed');
            benchSection.classList.add('bench-expanded');
            toggleBtn.querySelector('span').innerText = 'keyboard_arrow_down';
        }
    });

    // ================= OBTENER PARTIDO PRÓXIMO =================
    async function obtenerProximoPartido() {
        try {
            const params = new URLSearchParams({ action: 'getProximoPartido', t: Date.now() });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.partido) {
                fechaPartido = data.partido.fecha;
                rivalPartido = data.partido.rival;
                // Actualizar UI
                rivalSpan.textContent = rivalPartido;
                fechaSpan.textContent = fechaPartido;
                return true;
            } else {
                throw new Error('No se encontró partido próximo.');
            }
        } catch (err) {
            console.error('Error al obtener partido próximo:', err);
            rivalSpan.textContent = '❌ Sin partido próximo';
            fechaSpan.textContent = '---';
            alert('No hay partido con estado PRÓXIMO en la programación.');
            return false;
        }
    }

    // ================= CARGAR JUGADORES PARA ESE PARTIDO =================
    async function cargarJugadores() {
        if (!fechaPartido || !rivalPartido) return;
        try {
            const params = new URLSearchParams({
                action: 'getPartidoHombres',
                fecha: fechaPartido,
                rival: rivalPartido,
                t: Date.now()
            });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.jugadores && data.jugadores.length) {
                jugadoresConfirmados = data.jugadores.map(j => ({
                    id: j.cedula,
                    name: j.nombre,
                    number: j.dorsal || '--',
                    goles: j.goles || 0,
                    amarillas: j.amarillas || 0,
                    rojas: j.rojas || 0
                }));
            } else {
                throw new Error('No se encontraron jugadores confirmados para este partido.');
            }
            // Inicializar: todos en banca
            jugadoresEnCampo = [];
            jugadoresEnBanca = [...jugadoresConfirmados];
            renderizarCampo();
            renderizarBanca();
            actualizarContadores();
            // Cargar última alineación guardada para este partido
            await cargarUltimaAlineacion();
        } catch (err) {
            console.error(err);
            alert('Error al cargar jugadores: ' + err.message);
        }
    }

    // ================= GUARDAR ALINEACIÓN =================
    async function guardarAlineacionEnCloud() {
        if (!fechaPartido || !rivalPartido) {
            alert('No hay partido próximo para guardar.');
            return;
        }
        const dataToSend = {
            action: 'guardarAlineacion',
            fecha: fechaPartido,
            rival: rivalPartido,
            alineacion: jugadoresEnCampo.map(item => ({
                id: item.jugador.id,
                nombre: item.jugador.name,
                dorsal: item.jugador.number,
                x: item.x,
                y: item.y
            }))
        };
        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSend)
            });
            alert("✅ Alineación guardada en la nube");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        } catch (err) {
            alert("⚠️ Guardado localmente en el dispositivo");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        }
    }

    // ================= CARGAR ÚLTIMA ALINEACIÓN GUARDADA =================
    async function cargarUltimaAlineacion() {
        if (!fechaPartido || !rivalPartido) return;
        try {
            const params = new URLSearchParams({
                action: 'getUltimaAlineacion',
                fecha: fechaPartido,
                rival: rivalPartido,
                t: Date.now()
            });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.alineacion && data.alineacion.length) {
                const nuevosCampo = [];
                for (let a of data.alineacion) {
                    const jug = jugadoresConfirmados.find(j => j.id === a.id);
                    if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                }
                if (nuevosCampo.length) {
                    jugadoresEnCampo = nuevosCampo;
                    const idsCampo = new Set(jugadoresEnCampo.map(i => i.jugador.id));
                    jugadoresEnBanca = jugadoresConfirmados.filter(j => !idsCampo.has(j.id));
                    renderizarCampo();
                    renderizarBanca();
                    actualizarContadores();
                }
            } else {
                // Si no hay en la nube, intentar con localStorage
                const local = localStorage.getItem('alineacion_napoles_backup');
                if (local) {
                    const backup = JSON.parse(local);
                    const nuevosCampo = [];
                    for (let a of backup) {
                        const jug = jugadoresConfirmados.find(j => j.id === a.id);
                        if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                    }
                    if (nuevosCampo.length) {
                        jugadoresEnCampo = nuevosCampo;
                        jugadoresEnBanca = jugadoresConfirmados.filter(j => !new Set(jugadoresEnCampo.map(i=>i.jugador.id)).has(j.id));
                        renderizarCampo();
                        renderizarBanca();
                        actualizarContadores();
                    }
                }
            }
        } catch(e) { console.warn('Error al cargar alineación guardada:', e); }
    }

    // ================= FUNCIONES DE RENDERIZADO =================
    function renderizarCampo() {
        formationContainer.innerHTML = '';
        jugadoresEnCampo.forEach((item, idx) => {
            const node = document.createElement('div');
            node.className = 'player-node flex flex-col items-center justify-center';
            node.style.left = `${item.x}%`;
            node.style.top = `${item.y}%`;

            let badgesHtml = '';
            if (item.jugador.goles > 0 || item.jugador.amarillas > 0 || item.jugador.rojas > 0) {
                badgesHtml = `
                    <div class="player-badges">
                        ${item.jugador.goles > 0 ? `<span class="text-[9px] font-bold text-white">⚽${item.jugador.goles}</span>` : ''}
                        ${item.jugador.amarillas > 0 ? `<span class="text-[9px]">🟨</span>` : ''}
                        ${item.jugador.rojas > 0 ? `<span class="text-[9px]">🟥</span>` : ''}
                    </div>
                `;
            }

            node.innerHTML = `
                <div class="relative">
                    <div class="football-shirt flex items-center justify-center">
                        <span class="shirt-number">${item.jugador.number}</span>
                    </div>
                    ${badgesHtml}
                </div>
                <p class="player-tag">${item.jugador.name.split(' ')[0]}</p>
            `;

            node.addEventListener('touchstart', (e) => iniciarArrastre(e, 'campo', idx, item.jugador), {passive: false});
            node.addEventListener('mousedown', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            formationContainer.appendChild(node);
        });
    }

    function renderizarBanca() {
        benchListDiv.innerHTML = '';
        suplentesSpan.innerText = `${jugadoresEnBanca.length}`;
        if (jugadoresEnBanca.length === 0) {
            benchListDiv.innerHTML = '<div class="bench-empty text-slate-500 text-xs py-5 text-center w-full font-medium">Banca vacía · Todos en cancha</div>';
            return;
        }
        jugadoresEnBanca.forEach(j => {
            const card = document.createElement('div');
            card.className = 'bench-card flex-shrink-0 w-20 h-24 rounded-xl flex flex-col items-center justify-center p-2 cursor-grab';
            card.innerHTML = `
                <div class="football-shirt flex items-center justify-center mb-1">
                    <span class="shirt-number">${j.number}</span>
                </div>
                <p class="font-semibold text-[10px] text-slate-200 truncate w-16 text-center">${j.name.split(' ')[0]}</p>
                <span class="text-[8px] font-mono text-slate-400 mt-0.5">${j.goles > 0 ? '⚽ ' + j.goles : 'Suplente'}</span>
            `;
            card.addEventListener('touchstart', (e) => iniciarArrastre(e, 'banca', -1, j), {passive: false});
            card.addEventListener('mousedown', (e) => iniciarArrastre(e, 'banca', -1, j));
            benchListDiv.appendChild(card);
        });
    }

    function actualizarContadores() {
        campoCountSpan.innerText = jugadoresEnCampo.length;
        suplentesSpan.innerText = jugadoresEnBanca.length;
    }

    // ================= FUNCIONES DE ARRASTRE =================
    function iniciarArrastre(e, type, idx, jugador) {
        if (e.cancelable) e.preventDefault();
        dragActive = true; dragType = type; dragIndex = idx; dragJugador = jugador;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;

        clone = document.createElement('div');
        clone.className = 'dragging-touch-shirt';
        clone.innerHTML = `
            <div class="football-shirt flex items-center justify-center">
                <span class="shirt-number">${jugador.number}</span>
            </div>
        `;
        clone.style.left = `${cx - 20}px`;
        clone.style.top = `${cy - 17}px`;
        document.body.appendChild(clone);

        document.addEventListener('touchmove', onMove, {passive: false});
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchend', onEnd);
        document.addEventListener('mouseup', onEnd);
    }

    function onMove(e) {
        if (!dragActive) return;
        if (e.cancelable) e.preventDefault();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        if (clone) { clone.style.left = `${cx - 20}px`; clone.style.top = `${cy - 17}px`; }

        const rect = pitchContainer.getBoundingClientRect();
        if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) pitchContainer.classList.add('drop-over');
        else pitchContainer.classList.remove('drop-over');
    }

    function onEnd(e) {
        if (!dragActive) return;
        dragActive = false;
        if (clone) clone.remove();
        pitchContainer.classList.remove('drop-over');

        let cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        let cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const rect = pitchContainer.getBoundingClientRect();
        const dentro = cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom;

        if (dragType === 'banca' && dentro) {
            let x = ((cx - rect.left) / rect.width) * 100;
            let y = ((cy - rect.top) / rect.height) * 100;
            agregarAlCampo(dragJugador, Math.min(100, Math.max(0, x)), Math.min(100, Math.max(0, y)));
        } else if (dragType === 'campo') {
            if (dentro) {
                let x = ((cx - rect.left) / rect.width) * 100;
                let y = ((cy - rect.top) / rect.height) * 100;
                moverEnCampo(dragIndex, Math.min(100, Math.max(0, x)), Math.min(100, Math.max(0, y)));
            } else {
                eliminarDelCampo(dragIndex);
            }
        }
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchend', onEnd);
        document.removeEventListener('mouseup', onEnd);
    }

    function agregarAlCampo(jugador, x, y) {
        if (jugadoresEnCampo.some(i => i.jugador.id === jugador.id)) return;
        jugadoresEnCampo.push({ jugador, x, y });
        jugadoresEnBanca = jugadoresEnBanca.filter(j => j.id !== jugador.id);
        renderizarCampo(); renderizarBanca(); actualizarContadores();
    }

    function moverEnCampo(idx, x, y) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            jugadoresEnCampo[idx].x = x; jugadoresEnCampo[idx].y = y;
            renderizarCampo();
        }
    }

    function eliminarDelCampo(idx) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            const jug = jugadoresEnCampo[idx].jugador;
            jugadoresEnCampo.splice(idx, 1);
            jugadoresEnBanca.push(jug);
            renderizarCampo(); renderizarBanca(); actualizarContadores();
        }
    }

    // ================= FORMACIONES =================
    function aplicarFormacion(tipo, btnEl) {
        const formaciones = {
            '4-1-3-2': [
                {x:50, y:88}, {x:18, y:70}, {x:38, y:75}, {x:62, y:75}, {x:82, y:70},
                {x:50, y:58}, {x:22, y:38}, {x:50, y:43}, {x:78, y:38},
                {x:35, y:15}, {x:65, y:15}
            ],
            '4-4-2': [{x:50,y:88},{x:80,y:70},{x:62,y:72},{x:38,y:72},{x:20,y:70},{x:76,y:52},{x:58,y:54},{x:42,y:54},{x:24,y:52},{x:58,y:28},{x:42,y:28}],
            '3-5-2': [{x:50,y:88},{x:70,y:72},{x:50,y:76},{x:30,y:72},{x:86,y:56},{x:68,y:52},{x:50,y:56},{x:32,y:52},{x:14,y:56},{x:60,y:28},{x:40,y:28}]
        };
        const posiciones = formaciones[tipo];
        if (!posiciones) return;
        const jugadoresActuales = jugadoresEnCampo.map(i => i.jugador);
        if (jugadoresActuales.length !== posiciones.length) {
            alert(`La formación ${tipo} necesita ${posiciones.length} jugadores en el campo. Tienes ${jugadoresActuales.length}.`);
            return;
        }
        jugadoresEnCampo = jugadoresActuales.map((jug, idx) => ({ jugador: jug, x: posiciones[idx].x, y: posiciones[idx].y }));
        renderizarCampo(); actualizarContadores();

        if (btnEl) {
            document.querySelectorAll('.formation-btn').forEach(b => b.classList.remove('is-active'));
            btnEl.classList.add('is-active');
        }
    }

    // ================= INICIALIZACIÓN =================
    document.getElementById('guardar-alineacion-btn').addEventListener('click', guardarAlineacionEnCloud);

    (async function init() {
        const ok = await obtenerProximoPartido();
        if (ok) {
            await cargarJugadores();
        }
    })();
</script>
