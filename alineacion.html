<!DOCTYPE html>

<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#9d4300",
              "primary-container": "#f97316",
              "surface": "#faf9f6",
              "background": "#0d1c2f"
            },
            fontFamily: { "headline-md": ["Outfit"], "body-md": ["Inter"] }
          }
        }

<style>
        body {
            background-color: #04090f;
            background-image: radial-gradient(circle at 50% 50%, rgba(249,115,22,0.05) 0%, transparent 50%),
                              linear-gradient(rgba(13,28,47,0.4) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(13,28,47,0.4) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            font-family: 'Inter', sans-serif;
            touch-action: pan-y pinch-zoom;
        }
        .pitch-perspective { perspective: 1500px; }
        .pitch-surface {
            transform: rotateX(20deg);
            transform-origin: center bottom;
            background: linear-gradient(180deg, #0a1b0f 0%, #112d1a 100%);
            border: 2px solid rgba(59,130,246,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 40px rgba(59,130,246,0.1);
            aspect-ratio: 3.5/5;
        }
        .pitch-glow-lines { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.2); margin: 12px; }
        .pitch-center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 100px; height: 100px; border: 1px solid rgba(59,130,246,0.4); border-radius: 50%; }
        .pitch-center-line { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent); }
        .glass-player {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
            cursor: grab;
            touch-action: none;
        }
        .glass-player:active { cursor: grabbing; transform: scale(1.05); border-color: #f97316; }
        .bench-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
            cursor: grab;
            touch-action: none;
        }
        .bench-card:active { cursor: grabbing; transform: scale(0.98); }
        .drop-over { background: rgba(249,115,22,0.3); border: 2px dashed #f97316; }
        .dragging-touch {
            position: fixed;
            z-index: 2000;
            pointer-events: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f97316;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            opacity: 0.8;
            transform: scale(1.1);
        }
        .bench-side-scroller::-webkit-scrollbar { display: none; }
        .bench-side-scroller { -ms-overflow-style: none; scrollbar-width: none; }
        .fab-blur { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="font-body-md">

<!-- TopAppBar -->

    <div class="flex items-center gap-base">

<main class="pt-20 pb-40 px-4">
    <div class="flex justify-between items-end mb-6">
        <div>
            <h2 class="font-headline-lg-mobile text-2xl text-white">Nápoles FC</h2>
            <p class="font-label-sm text-white/40 uppercase tracking-widest mt-1">vs Franco Canadiense · 13/06</p>

    <!-- Pitch Area -->
    <div class="pitch-perspective w-full max-w-md mx-auto">

    <!-- Quick Formation Switcher (opcional, pero se mantiene) -->

        <button class="flex-shrink-0 px-5 py-2 rounded-xl bg-primary-container text-white font-label-md shadow-lg shadow-primary-container/20 active:scale-95" onclick="aplicarFormacion('4-3-3')">4-3-3</button>
        <button class="flex-shrink-0 px-5 py-2 rounded-xl bg-white/5 border border-white/10 text-white/60 font-label-md hover:border-primary-container/50 transition-all active:scale-95" onclick="aplicarFormacion('3-5-2')">3-5-2</button>

</main>

<!-- Floating Action Buttons -->
<div class="fixed bottom-24 right-6 flex flex-col gap-3 z-50">
    <button class="fab-blur w-12 h-12 rounded-full flex items-center justify-center text-white/70 hover:text-white shadow-xl transition-all active:rotate-180" onclick="location.reload()">
        <span class="material-symbols-outlined">restart_alt</span>
    </button>

        <span class="material-symbols-outlined text-[28px]">save</span>
    </button>
</div>

<!-- Bench / Bottom Side-Scroller -->
<section class="fixed bottom-0 left-0 w-full z-40 bg-background/80 backdrop-blur-2xl border-t border-white/5 pt-5 pb-24 rounded-t-[32px]">
    <div class="px-gutter flex items-center justify-between mb-4">
        <h3 class="font-headline-md text-lg text-white">Suplentes disponibles</h3>
        <span class="text-[10px] font-bold text-primary-container bg-primary-container/10 px-2 py-0.5 rounded uppercase" id="suplentes-count">0</span>
    </div>
    <div id="bench-list" class="bench-side-scroller flex gap-3 overflow-x-auto px-gutter pb-4"></div>
</section>

<!-- Bottom Navigation (estético) -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-background/40 backdrop-blur-3xl flex justify-around items-center px-4 border-t border-white/5 z-40">
    <div class="flex flex-col items-center justify-center text-white/40"><span class="material-symbols-outlined">grid_view</span><span class="font-label-sm text-[10px] mt-1">Panel</span></div>
    <div class="flex flex-col items-center justify-center text-primary-container"><span class="material-symbols-outlined active-icon">sports_soccer</span><span class="font-label-sm text-[10px] mt-1">Táctica</span></div>
    <div class="flex flex-col items-center justify-center text-white/40"><span class="material-symbols-outlined">monitoring</span><span class="font-label-sm text-[10px] mt-1">Stats</span></div>
    <div class="flex flex-col items-center justify-center text-white/40"><span class="material-symbols-outlined">person</span><span class="font-label-sm text-[10px] mt-1">Perfil</span></div>
</nav>

<script>
    // ================= CONFIGURACIÓN API REAL =================
    const API_URL = "https://script.google.com/macros/s/AKfycbxVb8dHTsSl8EuE3tQDxOUznxCv6DEX8ugq2RHlZO00oKzO4wJ1szEtbNASGdbTnQUK/exec";
    const FECHA_PARTIDO = "2026-06-13";
    const RIVAL = "FRANCO CANADIENSE";

    let jugadoresConfirmados = [];   // { id, name, number, position, goles, amarillas, rojas }
    let jugadoresEnCampo = [];       // { jugador, x, y }
    let jugadoresEnBanca = [];

    // Arrastre táctil/ratón
    let dragActive = false, dragType = null, dragIndex = -1, dragJugador = null, clone = null;

    // Elementos DOM
    const pitchContainer = document.getElementById('pitch-container');
    const formationContainer = document.getElementById('formation-container');
    const benchListDiv = document.getElementById('bench-list');
    const suplentesSpan = document.getElementById('suplentes-count');
    const campoCountSpan = document.getElementById('jugadores-campo-count');

    // ========== FUNCIONES DE RED ==========
    async function cargarJugadoresDesdeGoogleSheets() {
        try {
            const params = new URLSearchParams({ action: 'getPartidoHombres', fecha: FECHA_PARTIDO, rival: RIVAL, t: Date.now() });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.jugadores && data.jugadores.length) {
                jugadoresConfirmados = data.jugadores.map(j => ({
                    id: j.cedula,
                    name: j.nombre,
                    number: j.dorsal || '--',
                    position: "JUG",
                    goles: j.goles || 0,
                    amarillas: j.amarillas || 0,
                    rojas: j.rojas || 0
                }));
            } else {
                throw new Error("No se encontraron jugadores confirmados");
            }
            // Inicializar: todos en banca
            jugadoresEnCampo = [];
            jugadoresEnBanca = [...jugadoresConfirmados];
            renderizarCampo();
            renderizarBanca();
            actualizarContadores();
            // Cargar última alineación guardada (si existe)
            await cargarUltimaAlineacion();
        } catch (err) {
            console.error(err);
            alert("Error al cargar jugadores: " + err.message);
        }
    }

    async function guardarAlineacionEnCloud() {
        const dataToSend = {
            action: 'guardarAlineacion',
            fecha: FECHA_PARTIDO,
            rival: RIVAL,
            alineacion: jugadoresEnCampo.map(item => ({
                id: item.jugador.id,
                nombre: item.jugador.name,
                dorsal: item.jugador.number,
                x: item.x,
                y: item.y
            }))
        };
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // Si tu API no soporta CORS, usamos no-cors (no podremos leer respuesta)
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSend)
            });
            alert("✅ Alineación guardada en la nube");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        } catch (err) {
            alert("⚠️ Error al guardar en la nube, se guardó localmente");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        }
    }

    async function cargarUltimaAlineacion() {
        try {
            const params = new URLSearchParams({ action: 'getUltimaAlineacion', fecha: FECHA_PARTIDO, rival: RIVAL, t: Date.now() });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.alineacion && data.alineacion.length) {
                const nuevosCampo = [];
                for (let a of data.alineacion) {
                    const jug = jugadoresConfirmados.find(j => j.id === a.id);
                    if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                }
                if (nuevosCampo.length) {
                    jugadoresEnCampo = nuevosCampo;
                    const idsCampo = new Set(jugadoresEnCampo.map(i => i.jugador.id));
                    jugadoresEnBanca = jugadoresConfirmados.filter(j => !idsCampo.has(j.id));
                    renderizarCampo();
                    renderizarBanca();
                    actualizarContadores();
                }
            } else {
                // intentar backup local
                const local = localStorage.getItem('alineacion_napoles_backup');
                if (local) {
                    const backup = JSON.parse(local);
                    const nuevosCampo = [];
                    for (let a of backup) {
                        const jug = jugadoresConfirmados.find(j => j.id === a.id);
                        if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                    }
                    if (nuevosCampo.length) {
                        jugadoresEnCampo = nuevosCampo;
                        jugadoresEnBanca = jugadoresConfirmados.filter(j => !new Set(jugadoresEnCampo.map(i=>i.jugador.id)).has(j.id));
                        renderizarCampo();
                        renderizarBanca();
                        actualizarContadores();
                    }
                }
            }
        } catch(e) { console.warn(e); }
    }

    // ========== RENDER ==========
    function renderizarCampo() {
        formationContainer.innerHTML = '';
        jugadoresEnCampo.forEach((item, idx) => {
            const token = document.createElement('div');
            token.className = 'glass-player absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 z-20 w-14 h-14 rounded-full';
            token.style.left = `${item.x}%`;
            token.style.top = `${item.y}%`;
            token.setAttribute('data-idx', idx);
            token.setAttribute('data-id', item.jugador.id);
            token.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full h-full">
                    <span class="font-headline-md text-white text-lg">${item.jugador.number}</span>
                    <span class="text-[9px] text-white/80 bg-black/40 px-1 rounded-full">${item.jugador.name.split(' ')[0]}</span>
                </div>
            `;
            // Eventos arrastre
            token.addEventListener('touchstart', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            token.addEventListener('mousedown', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            formationContainer.appendChild(token);
        });
    }

    function renderizarBanca() {
        benchListDiv.innerHTML = '';
        suplentesSpan.innerText = `${jugadoresEnBanca.length}`;
        if (jugadoresEnBanca.length === 0) {
            benchListDiv.innerHTML = '<div class="text-white/50 text-sm px-4 py-8 text-center w-full">No hay más jugadores</div>';
            return;
        }
        jugadoresEnBanca.forEach(j => {
            const card = document.createElement('div');
            card.className = 'bench-card flex-shrink-0 w-24 h-24 rounded-2xl flex flex-col items-center justify-center gap-1 cursor-grab';
            card.setAttribute('data-id', j.id);
            card.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center font-headline-md text-white border border-white/20">${j.number}</div>
                <p class="font-headline-md text-[10px] text-white/80 uppercase truncate w-20 text-center">${j.name.split(' ')[0]}</p>
                <p class="font-label-sm text-[8px] text-primary-container font-bold">JUG</p>
            `;
            card.addEventListener('touchstart', (e) => iniciarArrastre(e, 'banca', -1, j));
            card.addEventListener('mousedown', (e) => iniciarArrastre(e, 'banca', -1, j));
            benchListDiv.appendChild(card);
        });
    }

    function actualizarContadores() {
        campoCountSpan.innerText = jugadoresEnCampo.length;
        suplentesSpan.innerText = jugadoresEnBanca.length;
    }

    // ========== ARRASTRE TÁCTIL/RATÓN ==========
    function iniciarArrastre(e, type, idx, jugador) {
        e.preventDefault();
        dragActive = true;
        dragType = type;
        dragIndex = idx;
        dragJugador = jugador;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        clone = document.createElement('div');
        clone.className = 'dragging-touch';
        clone.innerText = jugador.number;
        clone.style.left = `${cx - 25}px`;
        clone.style.top = `${cy - 25}px`;
        document.body.appendChild(clone);
        document.addEventListener('touchmove', onMove);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchend', onEnd);
        document.addEventListener('mouseup', onEnd);
    }

    function onMove(e) {
        if (!dragActive) return;
        e.preventDefault();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        if (clone) {
            clone.style.left = `${cx - 25}px`;
            clone.style.top = `${cy - 25}px`;
        }
        const rect = pitchContainer.getBoundingClientRect();
        if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom)
            pitchContainer.classList.add('drop-over');
        else
            pitchContainer.classList.remove('drop-over');
    }

    function onEnd(e) {
        if (!dragActive) return;
        dragActive = false;
        if (clone) clone.remove();
        pitchContainer.classList.remove('drop-over');
        let cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        let cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const rect = pitchContainer.getBoundingClientRect();
        const dentro = cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom;
        if (dragType === 'banca') {
            if (dentro) {
                let x = ((cx - rect.left) / rect.width) * 100;
                let y = ((cy - rect.top) / rect.height) * 100;
                x = Math.min(100, Math.max(0, x));
                y = Math.min(100, Math.max(0, y));
                agregarAlCampo(dragJugador, x, y);
            }
        } else if (dragType === 'campo') {
            if (dentro) {
                let x = ((cx - rect.left) / rect.width) * 100;
                let y = ((cy - rect.top) / rect.height) * 100;
                x = Math.min(100, Math.max(0, x));
                y = Math.min(100, Math.max(0, y));
                moverEnCampo(dragIndex, x, y);
            } else {
                eliminarDelCampo(dragIndex);
            }
        }
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchend', onEnd);
        document.removeEventListener('mouseup', onEnd);
    }

    function agregarAlCampo(jugador, x, y) {
        if (jugadoresEnCampo.some(i => i.jugador.id === jugador.id)) return;
        jugadoresEnCampo.push({ jugador, x, y });
        jugadoresEnBanca = jugadoresEnBanca.filter(j => j.id !== jugador.id);
        renderizarCampo();
        renderizarBanca();
        actualizarContadores();
    }

    function moverEnCampo(idx, x, y) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            jugadoresEnCampo[idx].x = x;
            jugadoresEnCampo[idx].y = y;
            renderizarCampo();
        }
    }

    function eliminarDelCampo(idx) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            const jug = jugadoresEnCampo[idx].jugador;
            jugadoresEnCampo.splice(idx, 1);
            jugadoresEnBanca.push(jug);
            renderizarCampo();
            renderizarBanca();
            actualizarContadores();
        }
    }

    // ========== FORMACIONES PREDEFINIDAS (opcional) ==========
    function aplicarFormacion(tipo) {
        const formaciones = {
            '4-3-3': [
                { x: 50, y: 88 }, { x: 80, y: 70 }, { x: 62, y: 72 }, { x: 38, y: 72 }, { x: 20, y: 70 },
                { x: 70, y: 52 }, { x: 50, y: 56 }, { x: 30, y: 52 },
                { x: 80, y: 32 }, { x: 50, y: 22 }, { x: 20, y: 32 }
            ],
            '4-4-2': [
                { x: 50, y: 88 }, { x: 80, y: 70 }, { x: 62, y: 72 }, { x: 38, y: 72 }, { x: 20, y: 70 },
                { x: 76, y: 52 }, { x: 58, y: 54 }, { x: 42, y: 54 }, { x: 24, y: 52 },
                { x: 58, y: 28 }, { x: 42, y: 28 }
            ],
            '3-5-2': [
                { x: 50, y: 88 }, { x: 70, y: 72 }, { x: 50, y: 76 }, { x: 30, y: 72 },
                { x: 86, y: 56 }, { x: 68, y: 52 }, { x: 50, y: 56 }, { x: 32, y: 52 }, { x: 14, y: 56 },
                { x: 60, y: 28 }, { x: 40, y: 28 }
            ]
        };
        const posiciones = formaciones[tipo];
        if (!posiciones) return;
        const jugadoresActuales = jugadoresEnCampo.map(i => i.jugador);
        if (jugadoresActuales.length !== posiciones.length) {
            alert(`La formación ${tipo} necesita ${posiciones.length} jugadores. Actualmente tienes ${jugadoresActuales.length}. Arrastra más jugadores al campo.`);
            return;
        }
        jugadoresEnCampo = jugadoresActuales.map((jug, idx) => ({ jugador: jug, x: posiciones[idx].x, y: posiciones[idx].y }));
        renderizarCampo();
        actualizarContadores();
    }

    // ========== EVENTOS BOTONES ==========
    document.getElementById('guardar-alineacion-btn').addEventListener('click', guardarAlineacionEnCloud);

    // Inicializar
    cargarJugadoresDesdeGoogleSheets();
</script>
</body>
