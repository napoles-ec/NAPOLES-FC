<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" name="viewport"/>
<title>Nápoles FC - Alineación táctica (conectada a Google Sheets)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#9d4300",
              "primary-container": "#f97316",
              "secondary": "#565e74"
            },
            fontFamily: { "headline-md": ["Outfit"], "body-md": ["Inter"] }
          }
        }
      }
    </script>
<style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(145deg, #0a1a2a 0%, #051020 100%); font-family: 'Inter', sans-serif; touch-action: pan-y pinch-zoom; padding-bottom: 70px; }
        .pitch-perspective { perspective: 800px; }
        .pitch-surface { transform: rotateX(8deg); transform-origin: top; background: linear-gradient(to bottom, #1a5a2a 0%, #0e3a1a 100%); border: 2px solid rgba(255,255,255,0.2); border-radius: 1rem; box-shadow: 0 15px 25px rgba(0,0,0,0.5); aspect-ratio: 3/4; }
        .pitch-surface svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.3; }
        .glass-card { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); }
        .player-token { position: absolute; cursor: grab; z-index: 20; width: 50px; transform: translate(-50%, -50%); touch-action: none; }
        .player-token .inner { background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); border-radius: 40px; width: 50px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #f97316; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .player-token .dorsal { font-size: 1rem; font-weight: 800; color: white; }
        .player-token .nombre { font-size: 0.55rem; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46px; }
        .player-token .stats { font-size: 0.5rem; display: flex; gap: 4px; margin-top: 2px; }
        .bench-card { background: rgba(10,20,30,0.9); backdrop-filter: blur(12px); border-radius: 0.75rem; cursor: grab; touch-action: none; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .bench-card .dorsal { background: #f97316; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .bench-card .nombre { font-size: 0.65rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
        .bench-card .stats { font-size: 0.55rem; color: #ccc; }
        .drop-over { background: rgba(249,115,22,0.3); border: 2px dashed #f97316; }
        .dragging-touch { opacity: 0.8; transform: scale(1.1); position: fixed; width: 50px; height: 50px; border-radius: 40px; background: #f97316; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.2rem; z-index: 2000; pointer-events: none; }
        .btn-movil { font-size: 0.7rem; padding: 6px 12px; }
        @media (max-width: 500px) {
            .player-token { width: 45px; }
            .player-token .inner { width: 45px; height: 45px; }
            .player-token .dorsal { font-size: 0.9rem; }
            .bench-card .dorsal { width: 30px; height: 30px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header class="fixed top-0 w-full z-50 bg-black/40 backdrop-blur-xl border-b border-white/10 px-3 h-12 flex justify-between items-center">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary-container text-xl">sports_soccer</span>
        <h1 class="font-headline-md text-sm font-bold text-white">NÁPOLES FC - TÁCTICA</h1>
    </div>
    <div class="w-7 h-7 rounded-full bg-primary-container/20 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary-container text-sm">cloud_sync</span>
    </div>
</header>

<main class="pt-14 pb-24 px-2 max-w-5xl mx-auto">
    <!-- Info partido -->
    <div class="glass-card rounded-xl p-2 mb-3 flex flex-wrap justify-between items-center gap-2 text-xs">
        <div>
            <div class="font-bold text-sm">🗓️ 13 jun · Nápoles vs <span class="text-primary-container">FRANCO CANADIENSE</span></div>
            <div class="text-white/60">12:00 · Cancha 1 - Liga Santa Rita</div>
        </div>
        <div class="flex gap-2 bg-black/30 px-2 py-1 rounded-full text-[10px]">
            <span>⚽ <span id="total-goles">0</span></span>
            <span>🟨 <span id="total-amarillas">0</span></span>
            <span>🟥 <span id="total-rojas">0</span></span>
        </div>
    </div>

    <!-- Campo -->
    <div class="pitch-perspective w-full">
        <div id="pitch-container" class="pitch-surface relative w-full rounded-xl overflow-hidden">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <rect x="2" y="2" width="96" height="96" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="2 2"/>
                <line x1="50" y1="2" x2="50" y2="98" stroke="white" stroke-width="0.5" stroke-dasharray="2 2"/>
                <circle cx="50" cy="50" r="6" fill="none" stroke="white" stroke-width="0.5"/>
                <rect x="40" y="2" width="20" height="12" fill="none" stroke="white" stroke-width="0.5"/>
                <rect x="40" y="86" width="20" height="12" fill="none" stroke="white" stroke-width="0.5"/>
            </svg>
            <div id="campo-jugadores" class="absolute inset-0 w-full h-full"></div>
        </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-center gap-2 mt-3">
        <button id="reset-tactica" class="px-3 py-1 rounded-full bg-primary-container text-white text-xs font-bold shadow-lg">🔄 Vaciar</button>
        <button id="guardar-tactica" class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs hover:bg-primary-container transition">💾 Guardar</button>
        <button id="cargar-ultima" class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs hover:bg-primary-container transition">📂 Cargar</button>
    </div>

    <!-- Banca -->
    <div class="mt-4">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-sm font-bold">✅ JUGADORES CONFIRMADOS (arrastra)</h3>
            <span class="text-[10px] text-white/60" id="suplentes-count">0</span>
        </div>
        <div id="bench-list" class="grid grid-cols-3 gap-2"></div>
    </div>
</main>

<nav class="fixed bottom-0 left-0 w-full bg-black/60 backdrop-blur-xl border-t border-white/10 flex justify-around items-center h-12 px-2 z-40">
    <div class="flex flex-col items-center text-white/60 text-[10px]"><span class="material-symbols-outlined text-sm">sports_soccer</span><span>Partido</span></div>
    <div class="flex flex-col items-center text-primary-container text-[10px]"><span class="material-symbols-outlined text-sm">gesture</span><span>Táctica</span></div>
    <div class="flex flex-col items-center text-white/60 text-[10px]"><span class="material-symbols-outlined text-sm">bar_chart</span><span>Stats</span></div>
</nav>

<script>
    // ================= CONFIGURACIÓN API REAL =================
    const API_URL = "https://script.google.com/macros/s/AKfycbwLcpH5z2x_EjRPaPu6gI_lLokWkVxsKLgBz-HHCVX7_OhKAFU1LVfZ67bh9DCbn9L6/exec"; // <-- TU URL REAL
    const FECHA_PARTIDO = "2026-06-13";
    const RIVAL = "FRANCO CANADIENSE";

    let jugadoresConfirmados = [];   // Lista de jugadores desde la hoja
    let jugadoresEnCampo = [];       // { jugador, x, y }
    let jugadoresEnBanca = [];

    // Arrastre táctil/ratón
    let dragActive = false, dragType = null, dragIndex = -1, dragJugador = null, clone = null;
    const campoDiv = document.getElementById('campo-jugadores');
    const pitchContainer = document.getElementById('pitch-container');
    const benchListDiv = document.getElementById('bench-list');
    const resetBtn = document.getElementById('reset-tactica');
    const guardarBtn = document.getElementById('guardar-tactica');
    const cargarUltimaBtn = document.getElementById('cargar-ultima');

    function mostrarToast(msg, error = false) {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-black/80 text-white px-3 py-1 rounded-full text-xs z-50 ${error ? 'bg-red-800' : ''}`;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ========== 1. CARGAR JUGADORES CONFIRMADOS DESDE GOOGLE SHEETS (REAL) ==========
    async function cargarJugadoresDesdeGoogleSheets() {
        mostrarToast('Conectando a la hoja...');
        try {
            // Construir URL con parámetros para obtener los jugadores confirmados del partido
            const params = new URLSearchParams({
                action: 'getPartidoHombres',
                fecha: FECHA_PARTIDO,
                rival: RIVAL,
                t: Date.now()
            });
            const response = await fetch(`${API_URL}?${params.toString()}`);
            const data = await response.json();
            
            if (data.success && data.jugadores) {
                // Filtrar solo los que tienen estado CONFIRMADO (si la hoja tiene esa columna)
                jugadoresConfirmados = data.jugadores
                    .filter(j => j.estado === 'CONFIRMADO' || j.estado === 'confirmado')
                    .map(j => ({
                        id: j.cedula,
                        nombre: j.nombre || j.jugador,
                        dorsal: j.dorsal || '--',
                        goles: j.goles || 0,
                        amarillas: j.amarillas || 0,
                        rojas: j.rojas || 0
                    }));
                
                if (jugadoresConfirmados.length === 0) {
                    mostrarToast('⚠️ No hay jugadores confirmados para este partido', true);
                    jugadoresConfirmados = [];
                } else {
                    mostrarToast(`✅ ${jugadoresConfirmados.length} jugadores confirmados`);
                }
                // Inicializar vacío
                jugadoresEnCampo = [];
                jugadoresEnBanca = [...jugadoresConfirmados];
                renderizarCampo();
                renderizarBanca();
                actualizarStats();
            } else {
                throw new Error(data.error || 'No se pudo obtener los datos');
            }
        } catch (error) {
            console.error(error);
            mostrarToast('❌ Error al cargar: ' + error.message, true);
            // Datos de ejemplo para que no se rompa la interfaz (opcional)
            jugadoresConfirmados = [];
            jugadoresEnBanca = [];
            renderizarBanca();
        }
    }

    // ========== 2. GUARDAR ALINEACIÓN EN LA NUBE (Google Sheets) ==========
    async function guardarAlineacionEnCloud() {
        const dataToSend = {
            action: 'guardarAlineacion',
            fecha: FECHA_PARTIDO,
            rival: RIVAL,
            alineacion: jugadoresEnCampo.map(item => ({
                id: item.jugador.id,
                nombre: item.jugador.nombre,
                dorsal: item.jugador.dorsal,
                x: item.x,
                y: item.y
            })),
            timestamp: new Date().toISOString()
        };
        mostrarToast('Guardando en la nube...');
        try {
            // Enviar mediante POST (necesitas que tu API acepte POST)
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // Si tu API no soporta CORS, usa no-cors (pero no podrás leer respuesta)
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSend)
            });
            // Si usas no-cors, no podrás leer response.json(), asumimos éxito.
            mostrarToast('✅ Alineación guardada en la hoja');
            // También guardamos localmente como respaldo
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        } catch (error) {
            console.error(error);
            mostrarToast('⚠️ Error al guardar, se guardó localmente', true);
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        }
    }

    // ========== 3. CARGAR ÚLTIMA ALINEACIÓN DESDE LA NUBE ==========
    async function cargarUltimaAlineacion() {
        mostrarToast('Cargando última alineación guardada...');
        try {
            const params = new URLSearchParams({
                action: 'getUltimaAlineacion',
                fecha: FECHA_PARTIDO,
                rival: RIVAL,
                t: Date.now()
            });
            const response = await fetch(`${API_URL}?${params.toString()}`);
            const data = await response.json();
            if (data.success && data.alineacion && data.alineacion.length > 0) {
                // Reconstruir jugadores en campo según los ids guardados
                const nuevosCampo = [];
                for (let a of data.alineacion) {
                    const jug = jugadoresConfirmados.find(j => j.id === a.id);
                    if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                }
                if (nuevosCampo.length > 0) {
                    jugadoresEnCampo = nuevosCampo;
                    const idsCampo = new Set(jugadoresEnCampo.map(i => i.jugador.id));
                    jugadoresEnBanca = jugadoresConfirmados.filter(j => !idsCampo.has(j.id));
                    renderizarCampo();
                    renderizarBanca();
                    actualizarStats();
                    mostrarToast('Alineación restaurada desde la nube');
                    return;
                }
            }
            // Si no hay en la nube, intentar backup local
            const local = localStorage.getItem('alineacion_napoles_backup');
            if (local) {
                const backup = JSON.parse(local);
                const nuevosCampo = [];
                for (let a of backup) {
                    const jug = jugadoresConfirmados.find(j => j.id === a.id);
                    if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                }
                if (nuevosCampo.length) {
                    jugadoresEnCampo = nuevosCampo;
                    const idsCampo = new Set(jugadoresEnCampo.map(i => i.jugador.id));
                    jugadoresEnBanca = jugadoresConfirmados.filter(j => !idsCampo.has(j.id));
                    renderizarCampo();
                    renderizarBanca();
                    actualizarStats();
                    mostrarToast('Alineación cargada desde backup local');
                    return;
                }
            }
            mostrarToast('No hay alineación guardada previamente');
        } catch (error) {
            console.error(error);
            mostrarToast('Error al cargar alineación', true);
        }
    }

    // ========== FUNCIONES DE RENDER Y ESTADÍSTICAS ==========
    function actualizarStats() {
        let g = 0, a = 0, r = 0;
        jugadoresEnCampo.forEach(i => { g += i.jugador.goles; a += i.jugador.amarillas; r += i.jugador.rojas; });
        document.getElementById('total-goles').innerText = g;
        document.getElementById('total-amarillas').innerText = a;
        document.getElementById('total-rojas').innerText = r;
    }

    function renderizarCampo() {
        campoDiv.innerHTML = '';
        jugadoresEnCampo.forEach((item, idx) => {
            const token = document.createElement('div');
            token.className = 'player-token';
            token.setAttribute('data-idx', idx);
            token.style.left = `${item.x}%`;
            token.style.top = `${item.y}%`;
            token.innerHTML = `
                <div class="inner">
                    <div class="dorsal">${item.jugador.dorsal}</div>
                    <div class="nombre">${item.jugador.nombre.split(' ')[0]}</div>
                    <div class="stats">⚽${item.jugador.goles} 🟨${item.jugador.amarillas}</div>
                </div>
            `;
            token.addEventListener('touchstart', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            token.addEventListener('mousedown', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            campoDiv.appendChild(token);
        });
    }

    function renderizarBanca() {
        benchListDiv.innerHTML = '';
        document.getElementById('suplentes-count').innerText = `${jugadoresEnBanca.length}`;
        if (jugadoresEnBanca.length === 0) {
            benchListDiv.innerHTML = '<div class="col-span-full text-center text-white/50 py-4 text-xs">No hay más jugadores en banca</div>';
            return;
        }
        jugadoresEnBanca.forEach(j => {
            const card = document.createElement('div');
            card.className = 'bench-card';
            card.innerHTML = `
                <div class="dorsal">${j.dorsal}</div>
                <div class="nombre">${j.nombre.split(' ')[0]}</div>
                <div class="stats">⚽${j.goles} 🟨${j.amarillas}</div>
            `;
            card.addEventListener('touchstart', (e) => iniciarArrastre(e, 'banca', -1, j));
            card.addEventListener('mousedown', (e) => iniciarArrastre(e, 'banca', -1, j));
            benchListDiv.appendChild(card);
        });
    }

    // ========== LÓGICA DE ARRASTRE TÁCTIL/RATÓN (sin cambios) ==========
    function iniciarArrastre(e, type, idx, jugador) {
        e.preventDefault();
        dragActive = true;
        dragType = type;
        dragIndex = idx;
        dragJugador = jugador;
        let cx, cy;
        if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        clone = document.createElement('div');
        clone.className = 'dragging-touch';
        clone.innerText = jugador.dorsal;
        clone.style.left = `${cx - 25}px`;
        clone.style.top = `${cy - 25}px`;
        document.body.appendChild(clone);
        document.addEventListener('touchmove', onMove);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchend', onEnd);
        document.addEventListener('mouseup', onEnd);
    }

    function onMove(e) {
        if (!dragActive) return;
        e.preventDefault();
        let cx, cy;
        if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        if (clone) {
            clone.style.left = `${cx - 25}px`;
            clone.style.top = `${cy - 25}px`;
        }
        const rect = pitchContainer.getBoundingClientRect();
        if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom)
            pitchContainer.classList.add('drop-over');
        else
            pitchContainer.classList.remove('drop-over');
    }

    function onEnd(e) {
        if (!dragActive) return;
        dragActive = false;
        if (clone) clone.remove();
        pitchContainer.classList.remove('drop-over');
        let cx, cy;
        if (e.changedTouches) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        const rectPitch = pitchContainer.getBoundingClientRect();
        const dentro = cx >= rectPitch.left && cx <= rectPitch.right && cy >= rectPitch.top && cy <= rectPitch.bottom;
        if (dragType === 'banca') {
            if (dentro) {
                let x = ((cx - rectPitch.left) / rectPitch.width) * 100;
                let y = ((cy - rectPitch.top) / rectPitch.height) * 100;
                x = Math.min(100, Math.max(0, x));
                y = Math.min(100, Math.max(0, y));
                agregarJugadorAlCampo(dragJugador, x, y);
            }
        } else if (dragType === 'campo') {
            if (dentro) {
                let x = ((cx - rectPitch.left) / rectPitch.width) * 100;
                let y = ((cy - rectPitch.top) / rectPitch.height) * 100;
                x = Math.min(100, Math.max(0, x));
                y = Math.min(100, Math.max(0, y));
                moverJugadorEnCampo(dragIndex, x, y);
            } else {
                eliminarJugadorDelCampo(dragIndex);
            }
        }
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchend', onEnd);
        document.removeEventListener('mouseup', onEnd);
    }

    function agregarJugadorAlCampo(jugador, x, y) {
        if (jugadoresEnCampo.some(i => i.jugador.id === jugador.id)) return;
        jugadoresEnCampo.push({ jugador, x, y });
        jugadoresEnBanca = jugadoresEnBanca.filter(j => j.id !== jugador.id);
        renderizarCampo();
        renderizarBanca();
        actualizarStats();
    }

    function moverJugadorEnCampo(idx, x, y) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            jugadoresEnCampo[idx].x = x;
            jugadoresEnCampo[idx].y = y;
            renderizarCampo();
        }
    }

    function eliminarJugadorDelCampo(idx) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            const jug = jugadoresEnCampo[idx].jugador;
            jugadoresEnCampo.splice(idx, 1);
            jugadoresEnBanca.push(jug);
            renderizarCampo();
            renderizarBanca();
            actualizarStats();
        }
    }

    function vaciarCampo() {
        jugadoresEnCampo = [];
        jugadoresEnBanca = [...jugadoresConfirmados];
        renderizarCampo();
        renderizarBanca();
        actualizarStats();
        mostrarToast('Campo vaciado');
    }

    // Eventos de botones
    resetBtn.addEventListener('click', vaciarCampo);
    guardarBtn.addEventListener('click', guardarAlineacionEnCloud);
    cargarUltimaBtn.addEventListener('click', cargarUltimaAlineacion);

    // Inicializar: cargar desde la hoja primero
    cargarJugadoresDesdeGoogleSheets();
</script>
</body>
</html>
