<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" name="viewport"/>
    <title>Nápoles FC - Táctica Elite Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "napoles-blue": "#0094d6",
                        "napoles-dark": "#031124",
                        "gold-accent": "#d4af37"
                    },
                    fontFamily: { "headline": ["Outfit"], "body": ["Inter"] }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #020813; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 148, 214, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            font-family: 'Inter', sans-serif; 
            touch-action: pan-y pinch-zoom; 
        }
        
        .pitch-perspective { perspective: 1000px; }
        .pitch-surface { 
            transform: rotateX(12deg); 
            transform-origin: center bottom; 
            background: repeating-linear-gradient(
                180deg,
                #0d2b18 0px,
                #0d2b18 30px,
                #11361e 30px,
                #11361e 60px
            );
            border: 2px solid rgba(255,255,255,0.15); 
            box-shadow: 
                0 0 40px rgba(0, 148, 214, 0.2),
                0 30px 70px -10px rgba(0,0,0,0.9), 
                inset 0 0 60px rgba(0,0,0,0.6); 
            aspect-ratio: 3.4/4.6; 
        }
        
        .pitch-surface::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 2;
        }

        .pitch-glow-lines { position: absolute; inset: 0; border: 1.5px solid rgba(255,255,255,0.25); margin: 12px; pointer-events: none; }
        .pitch-center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 84px; height: 84px; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 50%; pointer-events: none; }
        .pitch-center-line { position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; background: rgba(255,255,255,0.25); pointer-events: none; }
        
        /* 👕 Camiseta Reducida un 15% para evitar amontonamiento */
        .football-shirt {
            position: relative;
            width: 39px;
            height: 35px;
            background: #0094d6;
            border-radius: 3px 3px 0 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            will-change: transform;
        }
        /* Mangas adaptadas al nuevo tamaño */
        .football-shirt::before, .football-shirt::after {
            content: '';
            position: absolute;
            top: 0;
            width: 12px;
            height: 15px;
            background: #0094d6;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .football-shirt::before { left: -10px; border-radius: 3px 0 0 5px; transform: rotate(-25deg); transform-origin: top right; }
        .football-shirt::after { right: -10px; border-radius: 0 3px 5px 0; transform: rotate(25deg); transform-origin: top left; }
        
        .shirt-neck {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 6px;
            background: #d4af37;
            border-radius: 0 0 10px 10px;
            z-index: 3;
        }

        /* Jugador */
        .player-node {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
            z-index: 20;
            cursor: grab;
            user-select: none;
        }
        .player-node:active { cursor: grabbing; z-index: 100; }
        .player-node:active .football-shirt { transform: scale(1.15); box-shadow: 0 12px 24px rgba(0,0,0,0.6); }
        
        .dragging-touch-shirt { 
            position: fixed; 
            z-index: 9999; 
            pointer-events: none; 
            opacity: 0.95;
            transform: scale(1.2);
        }

        .drop-over { border-color: #0094d6 !important; box-shadow: 0 0 30px rgba(0, 148, 214, 0.4), inset 0 0 40px rgba(0,0,0,0.6); }
        .bench-side-scroller::-webkit-scrollbar { display: none; }
        .bench-collapsed { transform: translateY(calc(100% - 54px)); }
        .bench-expanded { transform: translateY(0); }
    </style>
</head>
<body class="font-body text-slate-200 antialiased selection:bg-blue-500/30">

<header class="fixed top-0 w-full h-16 bg-napoles-dark/50 backdrop-blur-xl border-b border-white/5 flex justify-between items-center px-6 z-50">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-napoles-blue to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <span class="material-symbols-outlined text-white text-[18px] font-bold">shield</span>
        </div>
        <h1 class="font-headline text-base font-bold tracking-widest uppercase italic bg-gradient-to-r from-white via-slate-200 to-gold-accent bg-clip-text text-transparent">Nápoles FC Pro</h1>
    </div>
    <div class="flex items-center">
        <div class="w-9 h-9 rounded-full overflow-hidden border border-gold-accent/40 p-0.5 bg-slate-900 shadow-lg">
            <img alt="Napoles FC" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKnzZBKgj-tIsZIANm539n2Qnx1B96Zv7y-woqjXbFcyw3W-n1CYhamu-jubz9cEXAqt01I2lBzbs9hMD_bEqD_AU1xsen-OWCsIO7FA7Fq5s8LRdtrX0GvDAVcB_TzCM9pqWaKaa08rIH7gz-4s8cddQdOzRT6AdBBOq_e_XMNtyxGlcJup7ErJl-ZnS8fwzTr_As4A6IttvBSWGCvCq2XaTi3Z9PDI9ckr9CJHza0IoDSjHsPyBKK6KgugXzmEprMjflIBvKOS4"/>
        </div>
    </div>
</header>

<main class="pt-20 pb-40 px-4 max-w-md mx-auto">
    <div class="flex justify-between items-center mb-5 bg-gradient-to-r from-napoles-dark/80 to-slate-950/80 border border-white/10 p-4 rounded-2xl backdrop-blur-md shadow-2xl" id="partido-header">
        <div>
            <h2 class="font-headline text-lg font-bold text-white tracking-wide flex items-center gap-2">
                Nápoles FC <span class="text-gold-accent text-xs">⚜️</span>
            </h2>
            <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider mt-0.5 flex items-center gap-1.5" id="rival-display">
                <span class="inline-block w-2 h-2 rounded-full bg-napoles-blue animate-pulse"></span> 
                Cargando partido...
            </p>
        </div>
        <div class="bg-gradient-to-b from-napoles-blue/10 to-transparent px-3 py-1.5 rounded-xl border border-napoles-blue/30 text-center min-w-[85px]">
            <span class="text-napoles-blue font-headline text-lg font-bold block leading-none" id="jugadores-campo-count">0</span>
            <span class="text-slate-400 text-[9px] uppercase font-bold tracking-tight">Titulares</span>
        </div>
    </div>

    <div id="sin-partido" style="display:none;" class="text-center py-16 bg-napoles-dark/50 rounded-2xl border border-white/10 backdrop-blur-md">
        <span class="material-symbols-outlined text-5xl text-slate-500 block mb-4">sports_soccer</span>
        <p class="text-slate-400 font-medium">No hay partidos próximos programados.</p>
        <p class="text-slate-500 text-sm mt-1">Crea un partido con estado <strong>PRÓXIMO</strong> para armar la alineación.</p>
    </div>

    <div class="pitch-perspective w-full mb-6" id="pitch-wrapper">
        <div id="pitch-container" class="pitch-surface relative w-full rounded-2xl overflow-hidden transition-all duration-300">
            <div class="pitch-glow-lines rounded-xl"></div>
            <div class="pitch-center-line"></div>
            <div class="pitch-center-circle"></div>
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-14 border-b border-x border-white/20"></div>
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/2 h-14 border-t border-x border-white/20"></div>
            
            <div id="formation-container" class="absolute inset-0 z-10"></div>
        </div>
    </div>

    <!-- Selectores de Formación -->
    <div class="flex justify-center gap-2 bg-slate-950/60 p-1.5 rounded-xl border border-white/5 backdrop-blur-md shadow-xl">
        <button class="flex-1 py-2 px-3 rounded-lg bg-napoles-blue text-white text-xs font-semibold shadow-lg shadow-blue-500/20 hover:bg-blue-600 transition-all active:scale-95" onclick="aplicarFormacion('4-1-3-2')">4-1-3-2</button>
        <button class="flex-1 py-2 px-3 rounded-lg bg-white/[0.02] border border-white/5 text-slate-400 text-xs font-semibold hover:text-white transition-all active:scale-95" onclick="aplicarFormacion('4-4-2')">4-4-2</button>
        <button class="flex-1 py-2 px-3 rounded-lg bg-white/[0.02] border border-white/5 text-slate-400 text-xs font-semibold hover:text-white transition-all active:scale-95" onclick="aplicarFormacion('3-5-2')">3-5-2</button>
    </div>
</main>

<div class="fixed bottom-36 right-4 flex flex-col gap-3 z-50">
    <button class="w-11 h-11 rounded-full flex items-center justify-center bg-slate-900/80 text-slate-400 hover:text-white border border-white/10 backdrop-blur-md shadow-lg transition-all active:rotate-180" onclick="location.reload()">
        <span class="material-symbols-outlined text-[20px]">restart_alt</span>
    </button>
    <button id="guardar-alineacion-btn" class="w-12 h-12 rounded-full bg-gradient-to-b from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 shadow-xl shadow-amber-500/20 transition-all active:scale-90 border border-gold-accent/50">
        <span class="material-symbols-outlined text-[22px] font-bold">save</span>
    </button>
    <button id="toggle-bench-btn" class="w-11 h-11 rounded-full flex items-center justify-center bg-slate-900/80 text-slate-400 hover:text-white border border-white/10 backdrop-blur-md shadow-lg">
        <span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span>
    </button>
</div>

<section id="bench-section" class="fixed bottom-0 left-0 w-full z-40 bg-gradient-to-b from-slate-950 via-slate-950/95 to-slate-950 border-t border-white/10 pt-4 rounded-t-[24px] bench-expanded transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] shadow-[0_-15px_40px_rgba(0,0,0,0.8)]">
    <div class="px-6 flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
            <h3 class="font-headline font-semibold text-xs tracking-wider uppercase text-slate-400">Banca de Suplentes</h3>
            <span class="text-[10px] font-bold text-gold-accent bg-gold-accent/10 px-2 py-0.5 rounded-full border border-gold-accent/20" id="suplentes-count">0</span>
        </div>
        <div class="w-12 h-1 bg-white/10 rounded-full"></div>
    </div>
    <div id="bench-list" class="bench-side-scroller flex gap-3.5 overflow-x-auto px-6 pb-5 pt-1"></div>
</section>

<script>
    // ==================== CONFIGURACIÓN ====================
    // ⚠️ CAMBIA ESTA URL POR LA DE TU SCRIPT DE GAS ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbxaVDxTdJxYLq4dq7otQiPW70HG-qs4i3Mzl1iBK_YVS2HDabU8RKLJqdJWVFSu0own/exec";

    let FECHA_PARTIDO = null;
    let RIVAL = null;
    let PARTIDO_DISPONIBLE = false;

    let jugadoresConfirmados = [];
    let jugadoresEnCampo = [];
    let jugadoresEnBanca = [];
    let dragActive = false, dragType = null, dragIndex = -1, dragJugador = null, clone = null;

    const pitchContainer = document.getElementById('pitch-container');
    const formationContainer = document.getElementById('formation-container');
    const benchListDiv = document.getElementById('bench-list');
    const suplentesSpan = document.getElementById('suplentes-count');
    const campoCountSpan = document.getElementById('jugadores-campo-count');
    const benchSection = document.getElementById('bench-section');
    const toggleBtn = document.getElementById('toggle-bench-btn');
    let benchCollapsed = false;

    // ==================== OBTENER PRÓXIMO PARTIDO ====================
    async function obtenerProximoPartido() {
        try {
            const resp = await fetch(`${API_URL}?action=getProximoPartido&t=${Date.now()}`);
            const data = await resp.json();
            if (data.success && data.partido) {
                FECHA_PARTIDO = data.partido.fecha;
                RIVAL = data.partido.rival;
                PARTIDO_DISPONIBLE = true;
                // Actualizar encabezado
                document.getElementById('rival-display').innerHTML = `
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 
                    vs ${RIVAL} · ${formatearFecha(FECHA_PARTIDO)}
                `;
                return true;
            } else {
                PARTIDO_DISPONIBLE = false;
                document.getElementById('rival-display').innerHTML = `
                    <span class="inline-block w-2 h-2 rounded-full bg-red-500"></span> 
                    Sin partidos próximos
                `;
                return false;
            }
        } catch(e) {
            console.error(e);
            PARTIDO_DISPONIBLE = false;
            return false;
        }
    }

    function formatearFecha(fechaStr) {
        if (!fechaStr) return 'Sin fecha';
        try {
            const d = new Date(fechaStr);
            return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
        } catch(e) { return fechaStr; }
    }

    // ==================== CARGAR JUGADORES CONFIRMADOS ====================
    async function cargarJugadoresDesdeGoogleSheets() {
        if (!PARTIDO_DISPONIBLE) {
            // Mostrar mensaje de sin partido
            document.getElementById('sin-partido').style.display = 'block';
            document.getElementById('pitch-wrapper').style.display = 'none';
            return;
        }
        document.getElementById('sin-partido').style.display = 'none';
        document.getElementById('pitch-wrapper').style.display = 'block';

        try {
            const params = new URLSearchParams({ 
                action: 'getPartidoHombres', 
                fecha: FECHA_PARTIDO, 
                rival: RIVAL, 
                t: Date.now() 
            });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.jugadores && data.jugadores.length) {
                jugadoresConfirmados = data.jugadores.map(j => ({
                    id: j.cedula,
                    name: j.nombre,
                    number: j.dorsal || '--',
                    position: "JUG",
                    goles: j.goles || 0,
                    amarillas: j.amarillas || 0,
                    rojas: j.rojas || 0
                }));
            } else {
                throw new Error("No se encontraron jugadores confirmados para este partido.");
            }
            jugadoresEnCampo = [];
            jugadoresEnBanca = [...jugadoresConfirmados];
            renderizarCampo();
            renderizarBanca();
            actualizarContadores();
            await cargarUltimaAlineacion();
        } catch (err) {
            console.error(err);
            alert('❌ Error al cargar jugadores: ' + err.message);
        }
    }

    // ==================== GUARDAR ALINEACIÓN ====================
    async function guardarAlineacionEnCloud() {
        if (!PARTIDO_DISPONIBLE) {
            alert('No hay partido próximo para guardar la alineación.');
            return;
        }
        const dataToSend = {
            action: 'guardarAlineacion',
            fecha: FECHA_PARTIDO,
            rival: RIVAL,
            alineacion: jugadoresEnCampo.map(item => ({
                id: item.jugador.id,
                nombre: item.jugador.name,
                dorsal: item.jugador.number,
                x: item.x,
                y: item.y
            }))
        };
        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSend)
            });
            alert("✅ Alineación guardada en la nube");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        } catch (err) {
            alert("⚠️ Guardado localmente en el dispositivo");
            localStorage.setItem('alineacion_napoles_backup', JSON.stringify(dataToSend.alineacion));
        }
    }

    // ==================== CARGAR ÚLTIMA ALINEACIÓN GUARDADA ====================
    async function cargarUltimaAlineacion() {
        try {
            const params = new URLSearchParams({ 
                action: 'getUltimaAlineacion', 
                fecha: FECHA_PARTIDO, 
                rival: RIVAL, 
                t: Date.now() 
            });
            const res = await fetch(`${API_URL}?${params.toString()}`);
            const data = await res.json();
            if (data.success && data.alineacion && data.alineacion.length) {
                const nuevosCampo = [];
                for (let a of data.alineacion) {
                    const jug = jugadoresConfirmados.find(j => j.id === a.id);
                    if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                }
                if (nuevosCampo.length) {
                    jugadoresEnCampo = nuevosCampo;
                    const idsCampo = new Set(jugadoresEnCampo.map(i => i.jugador.id));
                    jugadoresEnBanca = jugadoresConfirmados.filter(j => !idsCampo.has(j.id));
                    renderizarCampo(); renderizarBanca(); actualizarContadores();
                }
            } else {
                const local = localStorage.getItem('alineacion_napoles_backup');
                if (local) {
                    const backup = JSON.parse(local);
                    const nuevosCampo = [];
                    for (let a of backup) {
                        const jug = jugadoresConfirmados.find(j => j.id === a.id);
                        if (jug) nuevosCampo.push({ jugador: jug, x: a.x, y: a.y });
                    }
                    if (nuevosCampo.length) {
                        jugadoresEnCampo = nuevosCampo;
                        jugadoresEnBanca = jugadoresConfirmados.filter(j => !new Set(jugadoresEnCampo.map(i=>i.jugador.id)).has(j.id));
                        renderizarCampo(); renderizarBanca(); actualizarContadores();
                    }
                }
            }
        } catch(e) { console.warn(e); }
    }

    // ==================== FUNCIONES DE RENDERIZADO (sin cambios) ====================
    function renderizarCampo() {
        formationContainer.innerHTML = '';
        jugadoresEnCampo.forEach((item, idx) => {
            const node = document.createElement('div');
            node.className = 'player-node flex flex-col items-center justify-center';
            node.style.left = `${item.x}%`;
            node.style.top = `${item.y}%`;
            
            let badgesHtml = '';
            if (item.jugador.goles > 0 || item.jugador.amarillas > 0 || item.jugador.rojas > 0) {
                badgesHtml = `
                    <div class="absolute -top-2 -right-3 bg-slate-900/90 border border-white/20 rounded-md px-1 py-0.5 flex items-center gap-0.5 shadow-md z-30 scale-90">
                        ${item.jugador.goles > 0 ? `<span class="text-[9px] font-bold text-white">⚽${item.jugador.goles}</span>` : ''}
                        ${item.jugador.amarillas > 0 ? `<span class="text-[9px]">🟨</span>` : ''}
                        ${item.jugador.rojas > 0 ? `<span class="text-[9px]">🟥</span>` : ''}
                    </div>
                `;
            }
            
            node.innerHTML = `
                <div class="relative">
                    <div class="football-shirt flex items-center justify-center">
                        <div class="shirt-neck"></div>
                        <span class="font-headline font-bold text-gold-accent text-xs z-10 mt-0.5">${item.jugador.number}</span>
                    </div>
                    ${badgesHtml}
                </div>
                <p class="text-[9px] font-bold text-white bg-slate-950/85 px-1.5 py-0.5 rounded-md mt-1 border border-white/10 shadow-md whitespace-nowrap">${item.jugador.name.split(' ')[0]}</p>
            `;
            
            node.addEventListener('touchstart', (e) => iniciarArrastre(e, 'campo', idx, item.jugador), {passive: false});
            node.addEventListener('mousedown', (e) => iniciarArrastre(e, 'campo', idx, item.jugador));
            formationContainer.appendChild(node);
        });
    }

    function renderizarBanca() {
        benchListDiv.innerHTML = '';
        suplentesSpan.innerText = `${jugadoresEnBanca.length}`;
        if (jugadoresEnBanca.length === 0) {
            benchListDiv.innerHTML = '<div class="text-slate-500 text-xs py-4 text-center w-full font-medium">Banca vacía · Todos en cancha</div>';
            return;
        }
        jugadoresEnBanca.forEach(j => {
            const card = document.createElement('div');
            card.className = 'flex-shrink-0 w-20 h-24 bg-white/[0.02] border border-white/5 hover:border-napoles-blue/40 rounded-xl flex flex-col items-center justify-center p-2 transition-all active:scale-95 cursor-grab';
            card.innerHTML = `
                <div class="football-shirt flex items-center justify-center scale-90 mb-1">
                    <div class="shirt-neck"></div>
                    <span class="font-headline font-bold text-gold-accent text-xs z-10 mt-0.5">${j.number}</span>
                </div>
                <p class="font-semibold text-[10px] text-slate-200 truncate w-16 text-center">${j.name.split(' ')[0]}</p>
                <span class="text-[8px] text-slate-400 mt-0.5">${j.goles > 0 ? '⚽ ' + j.goles : 'Suplente'}</span>
            `;
            card.addEventListener('touchstart', (e) => iniciarArrastre(e, 'banca', -1, j), {passive: false});
            card.addEventListener('mousedown', (e) => iniciarArrastre(e, 'banca', -1, j));
            benchListDiv.appendChild(card);
        });
    }

    function actualizarContadores() {
        campoCountSpan.innerText = jugadoresEnCampo.length;
        suplentesSpan.innerText = jugadoresEnBanca.length;
    }

    // ==================== ARRASTRE (sin cambios) ====================
    function iniciarArrastre(e, type, idx, jugador) {
        if (e.cancelable) e.preventDefault();
        dragActive = true; dragType = type; dragIndex = idx; dragJugador = jugador;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        
        clone = document.createElement('div');
        clone.className = 'dragging-touch-shirt';
        clone.innerHTML = `
            <div class="football-shirt flex items-center justify-center">
                <div class="shirt-neck"></div>
                <span class="font-headline font-bold text-gold-accent text-xs z-10 mt-0.5">${jugador.number}</span>
            </div>
        `;
        clone.style.left = `${cx - 20}px`;
        clone.style.top = `${cy - 17}px`;
        document.body.appendChild(clone);
        
        document.addEventListener('touchmove', onMove, {passive: false});
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchend', onEnd);
        document.addEventListener('mouseup', onEnd);
    }

    function onMove(e) {
        if (!dragActive) return;
        if (e.cancelable) e.preventDefault();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        if (clone) { clone.style.left = `${cx - 20}px`; clone.style.top = `${cy - 17}px`; }
        
        const rect = pitchContainer.getBoundingClientRect();
        if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) pitchContainer.classList.add('drop-over');
        else pitchContainer.classList.remove('drop-over');
    }

    function onEnd(e) {
        if (!dragActive) return;
        dragActive = false;
        if (clone) clone.remove();
        pitchContainer.classList.remove('drop-over');
        
        let cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        let cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const rect = pitchContainer.getBoundingClientRect();
        const dentro = cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom;
        
        if (dragType === 'banca' && dentro) {
            let x = ((cx - rect.left) / rect.width) * 100;
            let y = ((cy - rect.top) / rect.height) * 100;
            agregarAlCampo(dragJugador, Math.min(100, Math.max(0, x)), Math.min(100, Math.max(0, y)));
        } else if (dragType === 'campo') {
            if (dentro) {
                let x = ((cx - rect.left) / rect.width) * 100;
                let y = ((cy - rect.top) / rect.height) * 100;
                moverEnCampo(dragIndex, Math.min(100, Math.max(0, x)), Math.min(100, Math.max(0, y)));
            } else {
                eliminarDelCampo(dragIndex);
            }
        }
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchend', onEnd);
        document.removeEventListener('mouseup', onEnd);
    }

    function agregarAlCampo(jugador, x, y) {
        if (jugadoresEnCampo.some(i => i.jugador.id === jugador.id)) return;
        jugadoresEnCampo.push({ jugador, x, y });
        jugadoresEnBanca = jugadoresEnBanca.filter(j => j.id !== jugador.id);
        renderizarCampo(); renderizarBanca(); actualizarContadores();
    }

    function moverEnCampo(idx, x, y) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            jugadoresEnCampo[idx].x = x; jugadoresEnCampo[idx].y = y;
            renderizarCampo();
        }
    }

    function eliminarDelCampo(idx) {
        if (idx >= 0 && idx < jugadoresEnCampo.length) {
            const jug = jugadoresEnCampo[idx].jugador;
            jugadoresEnCampo.splice(idx, 1);
            jugadoresEnBanca.push(jug);
            renderizarCampo(); renderizarBanca(); actualizarContadores();
        }
    }

    // ==================== FORMACIONES ====================
    function aplicarFormacion(tipo) {
        const formaciones = {
            '4-1-3-2': [
                {x:50, y:88},
                {x:18, y:70}, {x:38, y:75}, {x:62, y:75}, {x:82, y:70},
                {x:50, y:58},
                {x:22, y:38}, {x:50, y:43}, {x:78, y:38},
                {x:35, y:15}, {x:65, y:15}
            ],
            '4-4-2': [{x:50,y:88},{x:80,y:70},{x:62,y:72},{x:38,y:72},{x:20,y:70},{x:76,y:52},{x:58,y:54},{x:42,y:54},{x:24,y:52},{x:58,y:28},{x:42,y:28}],
            '3-5-2': [{x:50,y:88},{x:70,y:72},{x:50,y:76},{x:30,y:72},{x:86,y:56},{x:68,y:52},{x:50,y:56},{x:32,y:52},{x:14,y:56},{x:60,y:28},{x:40,y:28}]
        };
        const posiciones = formaciones[tipo];
        if (!posiciones) return;
        const jugadoresActuales = jugadoresEnCampo.map(i => i.jugador);
        if (jugadoresActuales.length !== posiciones.length) {
            alert(`La formación ${tipo} necesita ${posiciones.length} jugadores en el campo. Tienes ${jugadoresActuales.length}.`);
            return;
        }
        jugadoresEnCampo = jugadoresActuales.map((jug, idx) => ({ jugador: jug, x: posiciones[idx].x, y: posiciones[idx].y }));
        renderizarCampo(); actualizarContadores();
    }

    // ==================== EVENTOS ====================
    toggleBtn.addEventListener('click', () => {
        benchCollapsed = !benchCollapsed;
        if (benchCollapsed) {
            benchSection.classList.remove('bench-expanded');
            benchSection.classList.add('bench-collapsed');
            toggleBtn.querySelector('span').innerText = 'keyboard_arrow_up';
        } else {
            benchSection.classList.remove('bench-collapsed');
            benchSection.classList.add('bench-expanded');
            toggleBtn.querySelector('span').innerText = 'keyboard_arrow_down';
        }
    });

    document.getElementById('guardar-alineacion-btn').addEventListener('click', guardarAlineacionEnCloud);

    // ==================== INICIALIZACIÓN ====================
    (async function init() {
        // 1. Obtener próximo partido
        const tienePartido = await obtenerProximoPartido();
        // 2. Cargar jugadores confirmados para ese partido
        await cargarJugadoresDesdeGoogleSheets();
        // 3. Si no hay partido, mostrar mensaje y deshabilitar interacciones
        if (!tienePartido) {
            document.getElementById('pitch-wrapper').style.display = 'none';
            document.querySelector('.flex.justify-center.gap-2').style.display = 'none';
            document.querySelector('.fixed.bottom-36.right-4').style.display = 'none';
            document.getElementById('bench-section').style.display = 'none';
        }
    })();
</script>
