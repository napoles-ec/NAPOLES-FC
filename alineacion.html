<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineación de Texto</title>
    <style>
        /* ----- RESET Y ESTILOS ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            padding: 36px 40px 40px;
            transition: 0.25s;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
            letter-spacing: 0;
        }

        .subtitulo {
            font-size: 15px;
            color: #475569;
            border-left: 5px solid #3b82f6;
            padding-left: 16px;
            margin-top: 2px;
            margin-bottom: 28px;
        }

        .campo-texto {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 18px 22px;
            font-size: 17px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.8;
            color: #1e293b;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.15);
            background: #ffffff;
        }

        .acciones-alinear {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        .btn-alinear {
            flex: 1 0 auto;
            min-width: 72px;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: 600;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-alinear:hover {
            background: #e9edf2;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn-alinear.activo {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 6px 14px rgba(59, 130, 246, 0.30);
        }

        .btn-alinear .icono {
            font-size: 18px;
            line-height: 1;
        }

        .etiqueta-vista {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 8px;
            display: block;
        }

        .vista-previa {
            background: #f8fafc;
            border: 2px dashed #d1d9e6;
            border-radius: 18px;
            padding: 22px 26px;
            min-height: 80px;
            font-size: 18px;
            line-height: 1.8;
            color: #0f172a;
            transition: 0.2s;
            word-break: break-word;
        }

        .vista-previa.izquierda { text-align: left; }
        .vista-previa.centro    { text-align: center; }
        .vista-previa.derecha   { text-align: right; }
        .vista-previa.justificar { text-align: justify; }

        .acciones-pie {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e9edf2;
        }

        .btn-secundario {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            background: #f1f5f9;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secundario:hover {
            background: #e2e8f0;
        }

        .btn-guardar {
            background: #0b1e33;
            color: #fff;
            margin-left: auto;
        }
        .btn-guardar:hover {
            background: #1e2f45;
        }

        .mensaje {
            font-size: 14px;
            color: #16a34a;
            background: #f0fdf4;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid #bbf7d0;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .mensaje.mostrar {
            display: inline-flex;
        }

        @media (max-width: 500px) {
            .contenedor { padding: 22px 18px; }
            h1 { font-size: 24px; flex-wrap: wrap; }
            h1 small { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>
            📐 Alineación de texto
            <small>Web App</small>
        </h1>
        <div class="subtitulo">Escribe y elige la alineación para el texto</div>

        <div class="campo-texto">
            <textarea id="textoEntrada" placeholder="Escribe o pega tu texto aquí…">Este es un ejemplo de texto. Prueba los distintos alineamientos: izquierda, centro, derecha y justificado.</textarea>
        </div>

        <div class="acciones-alinear">
            <button class="btn-alinear activo" data-alineacion="izquierda" id="btnIzquierda">
                <span class="icono">⬅️</span> Izquierda
            </button>
            <button class="btn-alinear" data-alineacion="centro" id="btnCentro">
                <span class="icono">⬛</span> Centro
            </button>
            <button class="btn-alinear" data-alineacion="derecha" id="btnDerecha">
                <span class="icono">➡️</span> Derecha
            </button>
            <button class="btn-alinear" data-alineacion="justificar" id="btnJustificar">
                <span class="icono">↔️</span> Justificar
            </button>
        </div>

        <span class="etiqueta-vista">👁️ Vista previa</span>
        <div class="vista-previa izquierda" id="vistaPrevia">
            Este es un ejemplo de texto. Prueba los distintos alineamientos: izquierda, centro, derecha y justificado.
        </div>

        <div class="acciones-pie">
            <button class="btn-secundario" id="btnLimpiar">🧹 Limpiar</button>
            <button class="btn-secundario" id="btnRestablecer">↩️ Restablecer</button>
            <button class="btn-secundario btn-guardar" id="btnGuardar">💾 Guardar en servidor</button>
            <span class="mensaje" id="mensajeExito">✅ Guardado correctamente</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- CONFIGURACIÓN: URL de tu Web App (cámbiala por la tuya) -----
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwqCNLJDZeXjWMsSlhyOFc4x6XUF_QRFdkZ9ljMjdIcQSx83tQ-nzysNdi4cQDB_ysY/exec'; // <--- REEMPLAZA

            const textoEntrada = document.getElementById('textoEntrada');
            const vistaPrevia = document.getElementById('vistaPrevia');
            const btnIzquierda = document.getElementById('btnIzquierda');
            const btnCentro = document.getElementById('btnCentro');
            const btnDerecha = document.getElementById('btnDerecha');
            const btnJustificar = document.getElementById('btnJustificar');
            const btnLimpiar = document.getElementById('btnLimpiar');
            const btnRestablecer = document.getElementById('btnRestablecer');
            const btnGuardar = document.getElementById('btnGuardar');
            const mensajeExito = document.getElementById('mensajeExito');

            let alineacionActual = 'izquierda';

            function actualizarVista() {
                vistaPrevia.textContent = textoEntrada.value || '';
            }

            function cambiarAlineacion(alineacion) {
                document.querySelectorAll('.btn-alinear').forEach(btn => btn.classList.remove('activo'));
                let botonActivo;
                switch (alineacion) {
                    case 'izquierda': botonActivo = btnIzquierda; break;
                    case 'centro':    botonActivo = btnCentro; break;
                    case 'derecha':   botonActivo = btnDerecha; break;
                    case 'justificar': botonActivo = btnJustificar; break;
                    default: return;
                }
                botonActivo.classList.add('activo');
                vistaPrevia.className = 'vista-previa ' + alineacion;
                alineacionActual = alineacion;
                mensajeExito.classList.remove('mostrar');
            }

            btnIzquierda.addEventListener('click', () => cambiarAlineacion('izquierda'));
            btnCentro.addEventListener('click', () => cambiarAlineacion('centro'));
            btnDerecha.addEventListener('click', () => cambiarAlineacion('derecha'));
            btnJustificar.addEventListener('click', () => cambiarAlineacion('justificar'));

            textoEntrada.addEventListener('input', actualizarVista);

            btnLimpiar.addEventListener('click', function() {
                textoEntrada.value = '';
                actualizarVista();
                mensajeExito.classList.remove('mostrar');
            });

            btnRestablecer.addEventListener('click', function() {
                textoEntrada.value = 'Este es un ejemplo de texto. Prueba los distintos alineamientos: izquierda, centro, derecha y justificado.';
                actualizarVista();
                cambiarAlineacion('izquierda');
                mensajeExito.classList.remove('mostrar');
            });

            function mostrarMensajeExito() {
                mensajeExito.classList.add('mostrar');
                setTimeout(() => mensajeExito.classList.remove('mostrar'), 4000);
            }

            // ----- GUARDAR usando fetch (para separar HTML de .GS) -----
            btnGuardar.addEventListener('click', async function() {
                const texto = textoEntrada.value;
                const alineacion = alineacionActual;

                if (!texto.trim()) {
                    alert('El texto está vacío. Escribe algo antes de guardar.');
                    return;
                }

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors', // importante para evitar CORS en Apps Script
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            texto: texto,
                            alineacion: alineacion,
                            accion: 'guardar'
                        })
                    });

                    // Con mode: 'no-cors', no podemos leer la respuesta, pero la petición se envía.
                    // Asumimos éxito.
                    console.log('Datos enviados al servidor.');
                    mostrarMensajeExito();

                } catch (error) {
                    console.error('Error al guardar:', error);
                    alert('❌ Error al guardar. Revisa la consola.');
                }
            });

            // Inicializar
            actualizarVista();
            cambiarAlineacion('izquierda');

        })();
    </script>

</body>
</html>
