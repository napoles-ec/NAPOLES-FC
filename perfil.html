<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nápoles F.C. - Sorteo Inaugural</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --gold:#D4AF37;
    --bg:#060912;
    --card:rgba(255,255,255,.05);
    --text:#fff;
    --muted:#9ca3af;
    --success:#2ecc71;
    --danger:#e74c3c;
    --warning:#f39c12;
    --info:#3498db;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:radial-gradient(circle at top,#111a33 0%,#060912 100%);
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
}

.profile-container{
    width:100%;
    max-width:460px;
}

.profile-header{
    text-align:center;
    margin-bottom:20px;
}

.profile-header h1{
    font-family:'Outfit',sans-serif;
    color:var(--gold);
    font-size:1.3rem;
    letter-spacing:2px;
}

.cards-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:15px;
}

.glass-card{
    background:linear-gradient(145deg,rgba(10,20,40,.85),rgba(5,10,20,.95));
    border-radius:20px;
    border:1px solid rgba(212,175,55,.25);
    overflow:hidden;
    position:relative;
}

.id-card-identity{
    padding:15px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.avatar-icon-box{
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid var(--gold);
    background:radial-gradient(circle, #1a2a4a 0%, #0a1428 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    color:var(--gold);
    font-size:2.2rem;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
}

.id-card-jersey-wrap{
    perspective:900px;
    height:180px;
}

.jersey-card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation:rotateCard 12s linear infinite;
}

@keyframes rotateCard{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(360deg);}
}

.face-front,
.face-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    backface-visibility:hidden;
    background:linear-gradient(145deg,#0a1428,#000814);
    border:2px solid rgba(212,175,55,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.face-back{
    transform:rotateY(180deg);
}

.jersey-name{
    font-size:.7rem;
    color:#f5e6a3;
    text-transform:uppercase;
    letter-spacing:2px;
    font-weight:800;
}

.jersey-number{
    font-size:4.5rem;
    font-family:'Outfit';
    font-weight:900;

}

.section-box,
.stats-section,
.performance-section,
.match-section{

}

.section-title{

.stats-grid{
    display:grid;

.stat-card{

.stat-icon{

}

.stat-value{

.stat-label{

.performance-grid{

.metric-card{

}

.progress-circle{

.progress-circle svg{

.progress-bg{

}

.progress-fill{

    stroke-linecap:round;

}

.progress-text{

.metric-title{

.vs-circle{

.rival-chip{

/* Modal de sorteo (ruleta) */
.ruleta-overlay {
    position: fixed;
    top:0; left:0; width:100%; height:100%;

    backdrop-filter: blur(12px);

}
.ruleta-card {

.ruleta-titulo {

}
.canvas-container {

canvas {

}
.btn-aceptar:active { transform: scale(0.97); }

    margin-top: 140px;
}
.soccer-spinner {

}
@keyframes spinSoccer { 100%{transform:rotate(360deg);} }
.error-message{ text-align:center; padding:60px 20px; color:#e74c3c;}
</style>

<body>

<!-- MODAL DE SORTEO CON RULETA -->
<div id="ruletaSorteo" class="ruleta-overlay">
    <div class="ruleta-card">
        <div class="ruleta-titulo">
            <i class="fa-solid fa-trophy"></i> SORTEO OFICIAL
        </div>
        <div class="ruleta-sub">¡Gira la ruleta! Se definirá tu rival inaugural</div>
        <div class="canvas-container">
            <canvas id="ruletaCanvasSorteo" width="500" height="500"></canvas>
        </div>
        <div id="resultadoPreview" class="resultado-vs">
            <span class="equipo">⚜️ NÁPOLES</span>
            <span style="font-weight:900;">VS</span>
            <span class="equipo" id="rivalMostrado">???</span>
        </div>
        <button id="btnAceptarPartido" class="btn-aceptar" disabled>
            <i class="fa-regular fa-clock"></i> ACEPTAR · ESTARÉ PUNTUAL
        </button>
        <div style="font-size:0.65rem; margin-top: 15px; color: #bbb;">La ruleta seleccionará automáticamente al primer contrincante</div>
    </div>
</div>

<!-- CONTENEDOR DEL PERFIL (inicialmente oculto) -->
<div class="profile-container" id="perfilContent" style="display: none;"></div>

<script>
// ==================== CONFIGURACIÓN EMBEBIDA ====================
const CONFIG = {
    URL_GAS: "https://script.google.com/macros/s/AKfycbybGi_p22bkyO-CHnSjlZEQSmWETPjqA0zZv-m2Ox9E2Jvec1b-XnPySv6259wfI48/exec"
};

// LISTA DE RIVALES (para la ruleta)
const RIVALES = [
    "LEONES", "IDEAL", "BARZA", "SAN MARTIN", "INDEPENDIENTE",
    "VODKILA", "CHELSEA", "JUVENTUD DE AMERICA", "JUVENTUS", "FRANCO CANADIENSE"
];

const RIVAL_FIJO = "LEONES";
let jugadorSesion = null;
let girando = false;
let anguloActual = 0;
let canvas, ctx;
let radio = 0, centroX = 0, centroY = 0;

// ==================== FUNCIONES DE RULETA ====================
function initRuleta() {
    canvas = document.getElementById('ruletaCanvasSorteo');
    if (!canvas) return;
    const container = canvas.parentElement;
    const size = Math.min(260, container.clientWidth);
    canvas.width = size;
    canvas.height = size;
    ctx = canvas.getContext('2d');
    dibujarRuletaEstatica();
}

function dibujarRuletaEstatica(angulo = anguloActual) {
    if (!ctx) return;
    const w = canvas.width, h = canvas.height;
    centroX = w/2, centroY = h/2;
    radio = w * 0.42;
    ctx.clearRect(0,0,w,h);
    const num = RIVALES.length;
    const anguloPorcion = (Math.PI * 2) / num;
    const colores = ['#D4AF37','#C0A030','#B4941A','#9C7E18','#856C14','#6E5910','#57480C','#3A3008','#D4AF37','#C0A030'];
    for(let i=0; i<num; i++) {
        let inicio = angulo + i * anguloPorcion;
        let fin = inicio + anguloPorcion;
        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, inicio, fin);
        ctx.fillStyle = colores[i % colores.length];
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(inicio + anguloPorcion/2);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let fontSize = Math.max(9, radio*0.11);
        ctx.font = `bold ${fontSize}px "Outfit"`;
        ctx.fillStyle = "#03060f";
        let nombreCorto = RIVALES[i].length > 8 ? RIVALES[i].substring(0,7)+".." : RIVALES[i];
        ctx.fillText(nombreCorto, radio*0.72, 5);
        ctx.restore();
    }
    // Círculo central
    ctx.beginPath();
    ctx.arc(centroX, centroY, radio*0.2, 0, 2*Math.PI);
    ctx.fillStyle = "#D4AF37";
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 18px Outfit";
    ctx.fillText("VS", centroX-8, centroY+5);
    // Marcador fijo (triángulo arriba)
    ctx.beginPath();
    let puntaX = centroX, puntaY = centroY - radio - 10;
    ctx.moveTo(puntaX-8, puntaY+12);
    ctx.lineTo(puntaX, puntaY);
    ctx.lineTo(puntaX+8, puntaY+12);
    ctx.fillStyle = "#FFD966";
    ctx.fill();
}

function girarRuleta() {
    if (girando) return;
    girando = true;
    const duracion = 1800;
    const inicio = performance.now();
    const inicioAngulo = anguloActual;
    const vueltas = 8 * Math.PI * 2;
    const extra = Math.random() * Math.PI * 2;
    let objetivoDelta = vueltas + extra;
    
    function animar(now) {
        const elapsed = now - inicio;
        let t = Math.min(1, elapsed / duracion);
        const easeOut = 1 - Math.pow(1-t, 3);
        const delta = objetivoDelta * easeOut;
        anguloActual = (inicioAngulo + delta) % (Math.PI * 2);
        dibujarRuletaEstatica(anguloActual);
        if (t < 1) {
            requestAnimationFrame(animar);
        } else {
            // Forzar que el rival sea LEONES
            const num = RIVALES.length;
            const anguloPorcion = (Math.PI*2)/num;
            let dirMarcador = -Math.PI/2;
            let indiceObjetivo = RIVALES.indexOf(RIVAL_FIJO);
            let anguloObjetivo = (dirMarcador - (indiceObjetivo * anguloPorcion) + 2*Math.PI) % (2*Math.PI);
            anguloActual = anguloObjetivo;
            dibujarRuletaEstatica(anguloActual);
            document.getElementById('rivalMostrado').innerHTML = RIVAL_FIJO;
            const btn = document.getElementById('btnAceptarPartido');
            btn.disabled = false;
            btn.style.opacity = '1';
            girando = false;
        }
    }
    requestAnimationFrame(animar);
}

// ==================== FUNCIONES DE PERFIL (igual que antes) ====================
function escapeHtml(str){
    if(!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function calcularEdad(fechaNacimiento){
    if(!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if(isNaN(fecha.getTime())){ 
        let partes = fechaNacimiento.split(/[\/\-]/); 
        if(partes.length===3) fecha = new Date(partes[2], partes[1]-1, partes[0]);
    }
    if(isNaN(fecha.getTime())) return '--';
    let hoy = new Date(); 
    let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if(mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota){
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0))/2;
    let html='';
    for(let i=1;i<=5;i++){
        if(puntuacion>=i) html+='<i class="fa-solid fa-star"></i>';
        else if(puntuacion>=i-0.5) html+='<i class="fa-solid fa-star-half-stroke"></i>';
        else html+='<i class="fa-regular fa-star" style="opacity:0.2;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color){
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius=40, circum=2*Math.PI*radius;
    let dash=circum - ((value/10)*circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-dasharray="${circum}" stroke-dashoffset="${dash}"></circle></svg><div class="progress-text">${value}</div></div>`;
}

async function mostrarPerfil(cedula, categoria) {
    const container = document.getElementById('perfilContent');
    container.style.display = 'block';
    container.innerHTML = `<div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div class="soccer-loading-text">Cargando perfil...</div></div>`;
    try {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if(data.success && data.jugador){
            const j = data.jugador;
            const sanitized = {
                primerNombre: escapeHtml(j['primer nombre'] || ''),
                apellidos: escapeHtml(j['apellidos'] || ''),
                fechaNacimiento: j['fecha de nacimiento'] || '',
                nombreCamiseta: escapeHtml(j['nombre en camiseta'] || 'NÁPOLES'),
                dorsal: escapeHtml(j['número de dorsal'] || '00'),
                tallaUni: escapeHtml(j['talla uni.'] || 'M'),
                partidosJugados: Number(j['partidos jugados']) || 0,
                goles: Number(j['goles']) || 0,
                amarillas: Number(j['amarillas']) || 0,
                rojas: Number(j['rojas']) || 0,
                puntualidad: parseFloat(j['puntualidad']) || 0,
                companerismo: parseFloat(j['compañerismo']) || 0,
                respeto: parseFloat(j['respeto']) || 0,
                humildad: parseFloat(j['humildad']) || 0,
                deudaVocalia: Number(j['deuda vocalia']) || 0,
                inscripEstado: escapeHtml(j['inscrip_estado'] || 'PENDIENTE'),
                unifEstado: escapeHtml(j['unif_estado'] || 'PENDIENTE'),
                mediasEstado: escapeHtml(j['medias_estado'] || 'PENDIENTE')
            };
            let edad=calcularEdad(sanitized.fechaNacimiento);
            let suma=sanitized.puntualidad+sanitized.companerismo+sanitized.respeto+sanitized.humildad;
            let promedio=suma>0?parseFloat((suma/4).toFixed(1)):0;
            let deudaInscripcion=sanitized.inscripEstado.toUpperCase().includes('PENDIENTE')?5:0;
            let deudaUniforme=sanitized.unifEstado.toUpperCase().includes('PENDIENTE')?17:0;
            let deudaMedias=sanitized.mediasEstado.toUpperCase().includes('PENDIENTE')?2:0;
            let totalAdmin=deudaInscripcion+deudaUniforme+deudaMedias+sanitized.deudaVocalia;
            
            const LISTA_RIVALES_HORIZONTAL = ["LEONES","IDEAL","BARZA","SAN MARTIN","INDEPENDIENTE","VODKILA","CHELSEA","JUVENTUD DE AMERICA","JUVENTUS","FRANCO CANADIENSE"];
            let chipsRivales = LISTA_RIVALES_HORIZONTAL.map(r => `<span class="rival-chip ${r === 'LEONES' ? 'active' : ''}">${r}</span>`).join('');
            
            container.innerHTML = `
            <div class="profile-header"><h1>⚜️ PANEL NÁPOLES ⚜️</h1><div style="font-size:0.75rem;color:var(--gold);">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div></div>
            <div class="cards-row">
                <div class="id-card-identity glass-card"><div class="avatar-icon-box"><i class="fa-solid fa-user-ninja"></i></div><div style="font-weight:900;">${sanitized.primerNombre}<br>${sanitized.apellidos}</div><div style="font-size:.65rem;"><i class="fa-solid fa-id-card"></i> ${cedula}</div><div style="margin-top:8px;background:rgba(212,175,55,.2);padding:4px 10px;border-radius:20px;">${edad} años</div></div>
                <div class="id-card-jersey-wrap"><div class="jersey-card-inner"><div class="face-front"><div class="jersey-name">${sanitized.nombreCamiseta}</div><div class="jersey-number">${sanitized.dorsal}</div><div>Talla ${sanitized.tallaUni}</div></div><div class="face-back"><div class="jersey-name">NÁPOLES FC</div><div class="jersey-number">${sanitized.dorsal}</div></div></div></div>
            </div>
            <button class="btn-sync" onclick="recargarPerfil()"><i class="fa-solid fa-rotate"></i> ACTUALIZAR DATOS</button>
            <div class="match-section">
                <div class="section-title"><i class="fa-solid fa-calendar-check"></i> PRÓXIMO ENCUENTRO OFICIAL</div>
                <div class="match-card-gold">
                    <div class="match-teams"><div class="team-badge"><div class="team-name">⚜️ NÁPOLES F.C.</div><div class="team-sub">Local</div></div><div class="vs-circle">VS</div><div class="team-badge"><div class="team-name">🦁 LEONES</div><div class="team-sub">Visitante</div></div></div>
                    <div class="match-info"><div class="match-info-item"><i class="fa-regular fa-calendar-alt"></i> SÁBADO 24 DE MAYO</div><div class="match-info-item"><i class="fa-regular fa-clock"></i> 12:00 PM</div><div class="match-info-item"><i class="fa-solid fa-location-dot"></i> CANCHA 1</div></div>
                    <div style="margin-top: 12px; font-size:0.7rem; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 6px; text-align:center;"><i class="fa-solid fa-trophy"></i> FECHA 1 - CAMPEONATO OFICIAL</div>
                </div>
                <div class="section-title" style="margin-top: 6px;"><i class="fa-solid fa-people-group"></i> OTROS RIVALES DEL TORNEO</div>
                <div class="rivales-scroll">${chipsRivales}</div>
                <div style="font-size:0.65rem; text-align:center; margin-top: 12px; color: var(--gold);">⚡ La gran cita es SÁBADO 12:00 PM · CANCHA 1 · ¡Prepárate!</div>
            </div>
            <div class="stats-section"><div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="color:#3498db"><i class="fa-solid fa-shirt"></i></div><div class="stat-value">${sanitized.partidosJugados}</div><div class="stat-label">PARTIDOS</div></div><div class="stat-card"><div class="stat-icon" style="color:#2ecc71"><i class="fa-solid fa-futbol"></i></div><div class="stat-value">${sanitized.goles}</div><div class="stat-label">GOLES</div></div><div class="stat-card"><div class="stat-icon" style="color:#f39c12"><i class="fa-solid fa-square"></i></div><div class="stat-value">${sanitized.amarillas}</div><div class="stat-label">AMARILLAS</div></div><div class="stat-card"><div class="stat-icon" style="color:#e74c3c"><i class="fa-solid fa-square"></i></div><div class="stat-value">${sanitized.rojas}</div><div class="stat-label">ROJAS</div></div></div></div>
            <div class="performance-section"><div class="section-title"><i class="fa-solid fa-heart"></i> Rendimiento Humano</div><div class="performance-grid">${['puntualidad','companerismo','respeto','humildad'].map((m,i)=> `<div class="metric-card">${renderProgressCircle(sanitized[m],['#3498db','#2ecc71','#f39c12','#9b59b6'][i])}<div class="metric-title">${m.toUpperCase()}</div></div>`).join('')}</div><div class="average-box"><div class="average-score">${promedio}/10</div><div class="stars-container">${generarEstrellas(promedio)}</div></div></div>
            <div class="section-box"><div class="section-title"><i class="fa-solid fa-chart-line"></i> Estado Administrativo</div><div class="admin-grid">${deudaInscripcion?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-file-signature"></i></div><div class="admin-value">$5</div><div class="admin-label">INSCRIPCIÓN</div><div class="admin-status pending">PENDIENTE</div></div>`:''}${deudaUniforme?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-tshirt"></i></div><div class="admin-value">$17</div><div class="admin-label">UNIFORME</div><div class="admin-status warning">PENDIENTE</div></div>`:''}${deudaMedias?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-socks"></i></div><div class="admin-value">$2</div><div class="admin-label">MEDIAS</div><div class="admin-status info">PENDIENTE</div></div>`:''}${sanitized.deudaVocalia>0?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-money-bill-wave"></i></div><div class="admin-value">$${sanitized.deudaVocalia.toFixed(2)}</div><div class="admin-label">VOCALÍA</div><div class="admin-status vocalia">PENDIENTE</div></div>`:''}</div><div class="debt-box"><div class="debt-header"><span>VALORES PENDIENTES</span><span style="color:${totalAdmin>0?'#e74c3c':'#2ecc71'}">$${totalAdmin.toFixed(2)}</span></div><div class="progress-bar"><div class="progress-fill-bar" style="width:${Math.min(totalAdmin/30*100,100)}%"></div></div><div class="debt-message">${totalAdmin===0?'✅ ¡Estás al día!':'⚠️ Regulariza tus pagos'}</div></div></div>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN</button>
            `;
        } else {
            container.innerHTML = `<div class="error-message">${data.message || 'Jugador no encontrado'}</div>`;
        }
    } catch(e) {
        container.innerHTML = `<div class="error-message">❌ Error de conexión con el servidor</div>`;
    }
}

function recargarPerfil(){
    if(!jugadorSesion){ window.location.href='login.html'; return; }
    mostrarPerfil(jugadorSesion.cedula, jugadorSesion.categoria || 'hombres');
}
function cerrarSesion(){
    if(confirm('¿Cerrar sesión?')){ localStorage.removeItem('jugador_actual'); window.location.href='login.html'; }
}

async function confirmarAsistencia() {
    const btn = document.getElementById('btnAceptarPartido');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> CONFIRMANDO...';
    try {
        const url = `${CONFIG.URL_GAS}?action=guardarTerminos&cedula=${encodeURIComponent(jugadorSesion.cedula)}&categoria=${encodeURIComponent(jugadorSesion.categoria)}&opcion=1`;
        const resp = await fetch(url);
        const r = await resp.json();
        if(r.success) {
            document.getElementById('ruletaSorteo').style.display = 'none';
            mostrarPerfil(jugadorSesion.cedula, jugadorSesion.categoria || 'hombres');
        } else {
            alert('Error al guardar confirmación: ' + r.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-regular fa-clock"></i> ACEPTAR · ESTARÉ PUNTUAL';
        }
    } catch(e) {
        alert('Error de red. Intenta nuevamente.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-regular fa-clock"></i> ACEPTAR · ESTARÉ PUNTUAL';
    }
}

// ==================== INICIO ====================
(function(){
    jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
    if(!jugadorSesion || !jugadorSesion.cedula){
        window.location.href = 'login.html';
        return;
    }
    document.getElementById('perfilContent').style.display = 'none';
    document.getElementById('ruletaSorteo').style.display = 'flex';
    initRuleta();
    setTimeout(() => { girarRuleta(); }, 500);
    document.getElementById('btnAceptarPartido').addEventListener('click', confirmarAsistencia);
})();
</script>
</body>
</html>
