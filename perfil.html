<style>
    /* ========== ESTILOS EXCLUSIVOS DE LA RULETA ========== */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* ========== ESTILOS EXCLUSIVOS DEL PERFIL (DISEÑO ORIGINAL) ========== */

    .cards-row {

    .rival-chip {

    .avatar-icon-box {

    .id-card-jersey-wrap {

    .jersey-card-inner {

    @keyframes rotateCard {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
    }
    .face-front, .face-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        backface-visibility: hidden;
        background: linear-gradient(145deg, #0a1428, #000814);
        border: 2px solid rgba(212,175,55,.4);
        display: flex;
        flex-direction: column;
        align-items: center;

    .jersey-number {
        font-size: 4.5rem;
        font-family: 'Outfit';

        line-height: 1;

    }
    .stats-grid {
        display: grid;

    }
    .performance-grid {

    .progress-circle {

    .progress-circle svg {

    }
    .average-box {
        background: rgba(212,175,55,.08);
        border: 1px solid rgba(212,175,55,.2);

        text-align: center;

    .btn-logout {

    @keyframes spinSoccer { 100% { transform: rotate(360deg); } }
    .error-message { text-align: center; padding: 60px 20px; color: #e74c3c; }

    /* ========== MEJORAS (Tooltips, botones, ranking, etc.) ========== */
    [data-tooltip] { position: relative; cursor: help; border-bottom: 1px dotted rgba(255,215,0,0.5); }
    [data-tooltip]:before {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 120%;
        left: 50%;

        background: #000c;
        color: #FFD700;
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 0.7rem;

        z-index: 100;
        display: none;

    [data-tooltip]:hover:before { display: block; }
    .btn-share, .btn-report, .btn-pdf {
        background: rgba(212,175,55,0.15);
        border: 1px solid rgba(212,175,55,0.3);
        border-radius: 40px;
        padding: 6px 12px;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;

        color: #D4AF37;
    }
    .btn-share:hover, .btn-report:hover, .btn-pdf:hover { background: rgba(212,175,55,0.3); }
    .ranking-card { background: rgba(0,0,0,.3); border-radius: 20px; padding: 12px; margin-bottom: 15px; }
    .ranking-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .calendar-grid { background: rgba(0,0,0,.3); border-radius: 20px; padding: 12px; margin-bottom: 15px; max-height: 220px; overflow-y: auto; }
    .match-event { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
    .advanced-stats { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 15px; }
    .stat-advanced { background: rgba(0,0,0,.3); border-radius: 16px; padding: 8px; flex: 1; text-align: center; cursor: help; }
    .notification-banner {
        background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(0,0,0,0.7));
        border-left: 5px solid #FFD700;
        border-radius: 16px;
        padding: 10px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
    }
    .close-notification { background: none; border: none; color: #fff; cursor: pointer; }
    .modal-backdrop-report {
        position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
        z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px;
    }
    .modal-report-box { background: #1e1e2f; border-radius: 28px; padding: 24px; max-width: 450px; width: 100%; }
    .modal-report-box textarea { width: 100%; padding: 12px; border-radius: 16px; background: #2a2a3a; color: white; border: none; margin: 12px 0; }

<body id="appBody">
<div id="dynamicContent"></div>

<!-- Modal reporte incidencia -->
<div id="reportModal" class="modal-backdrop-report">
    <div class="modal-report-box">
        <h3 style="margin-bottom:12px;">Reportar incidencia</h3>
        <textarea id="reportText" rows="4" placeholder="Describe el problema o sugerencia..."></textarea>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
            <button class="btn-submit-report" onclick="enviarReporte()">Enviar</button>
            <button class="btn-submit-report" style="background:#555;" onclick="cerrarReporte()">Cancelar</button>
        </div>
    </div>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {
    URL_GAS: "https://script.google.com/macros/s/AKfycbwjophe8wostDR9rNsMjGkIMP3WpE_IiUPJvorurqXs5OHgjAMyHHAlnmuDY4qwxRVh/exec"  // REEMPLAZA CON TU URL
};
const PROXIMO_PARTIDO = {
    rival: "FRANCO CANADIENSE", icono: "🍁", fecha: "2026-06-13", fechaLegible: "SÁBADO 13 DE JUNIO, 2026", hora: "12:00", lugar: "CANCHA 1 - LIGA SANTA RITA", valorVocalia: 2.5
};

let jugadorSesion = null;
try { jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual')); } catch(e) { console.warn(e); }
if (!jugadorSesion || !jugadorSesion.cedula) window.location.href = 'login.html';
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';
const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');
console.log("✅ Jugador autenticado:", cedula, nombreCompleto);

let jugadorData = null;
let rankingData = [];
let partidosConfirmados = [];
let refreshInterval = null;

// ==================== CACHÉ ====================
function guardarCache(perfil, partidos, ranking, notificacion) {
    const cache = { timestamp: Date.now(), perfil, partidos, ranking, notificacion };
    localStorage.setItem('perfilCache_' + cedula, JSON.stringify(cache));
}
function obtenerCache() {
    const cached = localStorage.getItem('perfilCache_' + cedula);
    if (!cached) return null;
    const data = JSON.parse(cached);
    if (Date.now() - data.timestamp < 5 * 60 * 1000) return data;
    return null;
}

// ==================== NOTIFICACIONES ====================
function mostrarNotificacion(notificacion) {
    const container = document.querySelector('.perfil-container');
    if (!container) return;
    const existing = document.querySelector('.notification-banner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-bell" style="color:#FFD700;"></i>
            <span>${notificacion.titulo || 'Nueva notificación'}: ${notificacion.mensaje || ''}</span>
        </div>
        <button class="close-notification" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
    `;
    container.insertBefore(banner, container.firstChild);
}

// ==================== RANKING Y PARTIDOS ====================
async function obtenerRanking() {
    try {
        const res = await fetch(`${CONFIG.URL_GAS}?action=getJugadores&t=${Date.now()}`);
        const data = await res.json();
        if (data.success && data.jugadores) {
            return data.jugadores.filter(j => j.estado === 'APROBADO').sort((a,b) => (b.goles || 0) - (a.goles || 0));
        }
        return [];
    } catch(e) { return []; }
}
async function obtenerPartidosConfirmados() { return []; } // Placeholder

// ==================== PDF, COMPARTIR, REPORTE ====================
function descargarPDF() {
    if (!jugadorData) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text(`Ficha de Jugador - ${jugadorData.primerNombre} ${jugadorData.apellidos}`, 20, 20);
    doc.setFontSize(12);
    doc.text(`Cédula: ${cedula}`, 20, 40);
    doc.text(`Dorsal: ${jugadorData.dorsal}`, 20, 50);
    doc.text(`Goles totales: ${jugadorData.goles}`, 20, 60);
    doc.text(`Partidos jugados: ${jugadorData.partidosJugados}`, 20, 70);
    doc.text(`Promedio goles/partido: ${(jugadorData.goles / (jugadorData.partidosJugados || 1)).toFixed(2)}`, 20, 80);
    doc.text(`Rendimiento: Puntualidad ${jugadorData.puntualidad}, Compañerismo ${jugadorData.companerismo}, Respeto ${jugadorData.respeto}, Humildad ${jugadorData.humildad}`, 20, 100);
    doc.save(`perfil_${cedula}.pdf`);
}
function compartirPerfil() {
    const url = window.location.href;
    if (navigator.share) navigator.share({ title: `Perfil de ${jugadorData.primerNombre}`, text: `Mira mis estadísticas`, url: url });
    else { navigator.clipboard.writeText(url); alert('Enlace copiado'); }
}
function abrirReporte() { document.getElementById('reportModal').style.display = 'flex'; }
function cerrarReporte() { document.getElementById('reportModal').style.display = 'none'; }
function enviarReporte() {
    const texto = document.getElementById('reportText').value.trim();
    if (!texto) { alert('Escribe una descripción'); return; }
    alert('Reporte enviado al administrador. Gracias.');
    cerrarReporte();
    document.getElementById('reportText').value = '';
}

// ==================== RENDER PERFIL (DISEÑO ORIGINAL) ====================
async function mostrarPerfil() {
    document.body.className = '';
    document.body.style.background = '';
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
        if (document.body.className !== 'ruleta-mode') actualizarDatosEnSegundoPlano();
    }, 30000);

    const container = document.getElementById('dynamicContent');
    container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div>Cargando perfil...</div></div></div></div>`;
    
    let cache = obtenerCache();
    let perfil, partidos, ranking, notificacion;
    if (cache) {
        perfil = cache.perfil;
        partidos = cache.partidos;
        ranking = cache.ranking;
        notificacion = cache.notificacion;
    } else {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (!data.success || !data.jugador) throw new Error(data.error);
        perfil = data.jugador;
        ranking = await obtenerRanking();
        partidos = await obtenerPartidosConfirmados();
        const notiRes = await fetch(`${CONFIG.URL_GAS}?action=getNotificacionActiva&t=${Date.now()}`);
        const notiData = await notiRes.json();
        notificacion = notiData.success ? notiData.notificacion : null;
        guardarCache(perfil, partidos, ranking, notificacion);
    }
    jugadorData = perfil;
    rankingData = ranking;
    partidosConfirmados = partidos;

    const posicion = ranking.findIndex(j => j.cedula === cedula) + 1;
    const rankingTop5 = ranking.slice(0,5);
    const partidosJugados = Number(perfil.partidosJugados) || 0;
    const goles = Number(perfil.goles) || 0;
    const promedioGoles = partidosJugados > 0 ? (goles / partidosJugados).toFixed(2) : 0;
    const tarjetasPorPartido = partidosJugados > 0 ? ((Number(perfil.amarillas) + Number(perfil.rojas)) / partidosJugados).toFixed(2) : 0;
    const efectividad = (goles / (partidosJugados || 1)).toFixed(2);
    
    const s = {
        primerNombre: escapeHtml(perfil['primer nombre'] || ''),
        apellidos: escapeHtml(perfil['apellidos'] || ''),
        fechaNacimiento: perfil['fecha de nacimiento'] || '',
        nombreCamiseta: escapeHtml(perfil['nombre en camiseta'] || 'NÁPOLES'),
        dorsal: escapeHtml(perfil['número de dorsal'] || '00'),
        tallaUni: escapeHtml(perfil['talla uni.'] || 'M'),
        partidosJugados: partidosJugados,
        goles: goles,
        amarillas: Number(perfil.amarillas) || 0,
        rojas: Number(perfil.rojas) || 0,
        puntualidad: parseFloat(perfil.puntualidad) || 0,
        companerismo: parseFloat(perfil.compañerismo) || 0,
        respeto: parseFloat(perfil.respeto) || 0,
        humildad: parseFloat(perfil.humildad) || 0,
        deudaVocalia: Number(perfil['deuda vocalia']) || 0,
        inscripEstado: escapeHtml(perfil.inscrip_estado || 'PENDIENTE'),
        unifEstado: escapeHtml(perfil.unif_estado || 'PENDIENTE'),
        mediasEstado: escapeHtml(perfil.medias_estado || 'PENDIENTE')
    };
    let edad = calcularEdad(s.fechaNacimiento);
    let suma = s.puntualidad + s.companerismo + s.respeto + s.humildad;
    let promedio = suma > 0 ? parseFloat((suma / 4).toFixed(1)) : 0;
    let deudaInscripcion = s.inscripEstado.toUpperCase().includes('PENDIENTE') ? 5 : 0;
    let deudaUniforme = s.unifEstado.toUpperCase().includes('PENDIENTE') ? 17 : 0;
    let deudaMedias = s.mediasEstado.toUpperCase().includes('PENDIENTE') ? 2 : 0;
    let totalAdmin = deudaInscripcion + deudaUniforme + deudaMedias + s.deudaVocalia;

    const listaRivales = ["IDEAL", "BARZA", "SAN MARTIN", "INDEPENDIENTE", "VODKILA", "CHELSEA", "JUVENTUD DE AMERICA", "JUVENTUS", "LEONES", "FRANCO CANADIENSE"];
    const chipsRivales = listaRivales.map(rival => `<span class="rival-chip">${rival}</span>`).join('');

    container.innerHTML = `
    <div class="perfil-root">
        <div class="perfil-container">
            <!-- Header con logo -->
            <div class="perfil-header" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                <img src="./imagen/logo/napoles_fc.png" alt="Logo" style="height: 50px;">
                <h1>⚜️ PANEL NÁPOLES ⚜️</h1>
            </div>
            <div style="font-size:0.75rem;color:#D4AF37; text-align:center; margin-bottom:20px;">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div>

// Funciones auxiliares
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function calcularEdad(fechaNacimiento) {
    if (!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if (isNaN(fecha.getTime())) { let partes = fechaNacimiento.split(/[\/\-]/); if (partes.length === 3) fecha = new Date(partes[2], partes[1]-1, partes[0]); }
    if (isNaN(fecha.getTime())) return '--';
    let hoy = new Date();
    let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota) {
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0)) / 2;
    let html = '';
    for (let i = 1; i <= 5; i++) {
        if (puntuacion >= i) html += '<i class="fa-solid fa-star" style="color:#FFD700;"></i>';
        else if (puntuacion >= i - 0.5) html += '<i class="fa-solid fa-star-half-stroke" style="color:#FFD700;"></i>';
        else html += '<i class="fa-regular fa-star" style="opacity:0.3;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color) {
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius = 40, circum = 2 * Math.PI * radius;
    let dash = circum - ((value / 10) * circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40" stroke="rgba(255,255,255,.08)" stroke-width="8" fill="none"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-width="8" fill="none" stroke-dasharray="${circum}" stroke-dashoffset="${dash}" stroke-linecap="round"></circle></svg><div class="progress-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:900; color:#D4AF37;">${value}</div></div>`;
}
async function actualizarDatosEnSegundoPlano() {
    if (document.body.className === 'ruleta-mode') return;
    const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.success && data.jugador) {
        const nuevoRanking = await obtenerRanking();
        guardarCache(data.jugador, partidosConfirmados, nuevoRanking, null);
        mostrarPerfil();
    }
}
window.cerrarSesion = function() {
    if (confirm('¿Cerrar sesión?')) {
        localStorage.removeItem('jugador_actual');
        window.location.href = 'login.html';
    }
};
