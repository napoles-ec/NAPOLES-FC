<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#ADFF2F">
<title>Nápoles F.C. - Panel del Jugador</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    /* ========== LOADER GLOBAL ========== */
    .global-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, #111a33 0%, #060912 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
        font-family: 'Outfit', sans-serif;
    }
    .global-loader .soccer-spinner {
        font-size: 4rem;
        color: #D4AF37;
        animation: spinSoccer 1.2s linear infinite;
        margin-bottom: 20px;
    }
    .global-loader p {
        color: #D4AF37;
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
    }
    @keyframes spinSoccer {
        100% { transform: rotate(360deg); }
    }

    /* ========== ESTILOS DE LA RULETA ========== */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-card { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(233, 195, 73, 0.6); color: white; }
    .premium-glow { box-shadow: 0 0 30px rgba(233, 195, 73, 0.4); }
    .roulette-track { display: flex; gap: 24px; width: fit-content; transform: translateX(0); }
    .spinning { animation: scroll-fast 0.2s linear infinite; filter: blur(4px); }
    @keyframes scroll-fast { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    .slowing { animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; filter: blur(0px); transition: filter 2s ease-out; }
    @keyframes scroll-slow { from { transform: translateX(0); } to { transform: translateX(-4000px); } }
    .winner-glow { animation: winner-pulse 2s infinite alternate; }
    @keyframes winner-pulse { 0% { box-shadow: 0 0 20px rgba(233, 195, 73, 0.3); border-color: rgba(233, 195, 73, 0.6); } 100% { box-shadow: 0 0 60px rgba(233, 195, 73, 0.8); border-color: #e9c349; transform: scale(1.05); } }
    .particle { position: absolute; pointer-events: none; z-index: 100; }
    .cinematic-text { text-shadow: 0 0 20px rgba(233, 195, 73, 0.6); }
    .reveal-element { opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .revealed { opacity: 1; transform: translateY(0); }
    body.ruleta-mode { background: #0a0c10; overflow: hidden; min-height: 100dvh; }
    .match-info-card { background: #1a1c22; border-radius: 40px; padding: 16px 20px; margin: 15px 0; border-left: 5px solid #e9c349; text-align: center; }

    /* ========== ESTILOS DEL PERFIL ========== */
    .perfil-root {
        background: radial-gradient(circle at top, #111a33 0%, #060912 100%);
        font-family: 'Inter', sans-serif;
        color: #fff;
        min-height: 100vh;
        padding: 15px;
        display: flex;
        justify-content: center;
    }
    .perfil-container {
        width: 100%;
        max-width: 480px;
    }
    .perfil-header {
        text-align: center;
        margin-bottom: 20px;
    }
    .perfil-header h1 {
        font-family: 'Outfit', sans-serif;
        color: #D4AF37;
        font-size: 2rem;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }
    .perfil-header h1 img {
        height: 80px;
    }

    /* Tarjetas: izquierda con fondo/borde, derecha solo la camiseta giratoria */
    .cards-row {
        display: flex;
        gap: 12px;
        margin-bottom: 15px;
    }
    .card-identity {
        flex: 1;
        background: linear-gradient(145deg, rgba(10,20,40,.85), rgba(5,10,20,.95));
        border-radius: 20px;
        border: 1px solid rgba(212,175,55,.25);
        padding: 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 260px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(212,175,55,0.3), inset 0 0 5px rgba(255,215,0,0.2);
        animation: glowPulse 2s infinite alternate;
    }
    @keyframes glowPulse {
        0% { box-shadow: 0 0 5px rgba(212,175,55,0.2), inset 0 0 2px rgba(255,215,0,0.1); }
        100% { box-shadow: 0 0 25px rgba(212,175,55,0.6), inset 0 0 10px rgba(255,215,0,0.3); }
    }
    .avatar-icon-box {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid #D4AF37;
        background: radial-gradient(circle, #1a2a4a 0%, #0a1428 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        overflow: hidden;
    }
    .avatar-icon-box img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Jersey giratorio */
    .jersey-3d {
        flex: 1;
        perspective: 900px;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .jersey-rotating {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotateSmooth 12s infinite linear;
        will-change: transform;
    }
    @keyframes rotateSmooth {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(360deg); }
    }
    .jersey-front, .jersey-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        backface-visibility: hidden;
        background: linear-gradient(145deg, #0a1428, #000814);
        border: 2px solid rgba(212,175,55,.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .jersey-back {
        transform: rotateY(180deg);
    }
    .jersey-number {
        font-size: 4rem;
        font-family: 'Outfit';
        font-weight: 900;
        line-height: 1;
        color: #FFD700;
    }
    .jersey-name {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 5px;
        color: #D4AF37;
    }

    /* Tarjeta del partido */
    .match-card-gold {
        background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(0,0,0,0.6));
        border-left: 6px solid #D4AF37;
        border-radius: 24px;
        padding: 18px 15px;
        margin-bottom: 20px;
        text-align: center;
    }
    .match-next {
        border-left: 6px solid #2ecc71;
        box-shadow: 0 0 15px rgba(46,204,113,0.4);
        animation: neonPulseGreen 1.5s infinite alternate;
    }
    @keyframes neonPulseGreen {
        0% { box-shadow: 0 0 5px rgba(46,204,113,0.3); border-left-color: #2ecc71; }
        100% { box-shadow: 0 0 25px rgba(46,204,113,0.7); border-left-color: #27ae60; }
    }
    .match-teams {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }
    .team-badge {
        text-align: center;
        flex: 1;
    }
    .team-badge .team-name {
        font-size: 1.2rem;
        font-weight: 900;
        font-family: 'Outfit';
        letter-spacing: 1px;
    }
    .vs-circle {
        background: #D4AF37;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        color: #000;
        font-size: 1.3rem;
        box-shadow: 0 0 10px rgba(212,175,55,0.6);
    }
    .match-info {
        background: rgba(0,0,0,0.5);
        border-radius: 50px;
        padding: 12px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 8px;
    }
    .match-info-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 600;
    }
    .match-info-item i {
        color: #D4AF37;
    }

    /* Rivales */
    .rivales-scroll {
        margin-top: 18px;
        overflow-x: hidden;
        white-space: nowrap;
        padding-bottom: 8px;
    }
    .rivales-track {
        display: inline-flex;
        gap: 12px;
        animation: scrollRivales 25s linear infinite;
    }
    @keyframes scrollRivales {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }
    .rival-chip {
        display: inline-block;
        background: rgba(212,175,55,0.12);
        border: 1px solid rgba(212,175,55,0.3);
        border-radius: 40px;
        padding: 6px 18px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #f5e6a3;
        backdrop-filter: blur(4px);
    }
    .rival-chip.past {
        background: rgba(127,140,141,0.2);
        border-color: #7f8c8d;
        color: #bdc3c7;
    }
    .rival-chip.next {
        background: rgba(46,204,113,0.2);
        border-color: #2ecc71;
        color: #2ecc71;
        box-shadow: 0 0 8px rgba(46,204,113,0.4);
    }

    /* Estadísticas básicas */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 15px;
    }
    .stat-card {
        background: rgba(0,0,0,.35);
        border-radius: 16px;
        padding: 10px 5px;
        text-align: center;
    }
    .stat-icon {
        font-size: 1.4rem;
        margin-bottom: 5px;
    }
    .stat-value {
        font-size: 1.2rem;
        font-weight: 800;
    }
    .stat-label {
        font-size: 0.7rem;
        color: #ccc;
    }

    /* Rendimiento humano */
    .performance-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 15px;
    }
    .metric-card {
        background: rgba(0,0,0,.35);
        border-radius: 16px;
        padding: 14px 10px;
        text-align: center;
    }
    .metric-icon {
        font-size: 1.5rem;
        margin-bottom: 5px;
        display: block;
        color: #D4AF37;
    }
    .progress-circle {
        position: relative;
        width: 85px;
        height: 85px;
        margin: auto;
    }
    .progress-circle svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }
    .average-box {
        background: rgba(212,175,55,.08);
        border: 1px solid rgba(212,175,55,.2);
        border-radius: 15px;
        padding: 15px;
        text-align: center;
        margin-top: 15px;
    }
    .stars-container i, .fa-star, .fa-star-half-stroke {
        color: #FFD700;
    }

    /* Estado Administrativo */
    .admin-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 15px;
    }
    .btn-logout {
        background: rgba(231,76,60,.12);
        color: #e74c3c;
        border: 1px solid rgba(231,76,60,.2);
        width: 100%;
        border-radius: 14px;
        padding: 14px;
        font-weight: 800;
        cursor: pointer;
        margin-top: 10px;
    }
    .action-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
    }
    .btn-share, .btn-report, .btn-pdf {
        background: rgba(212,175,55,0.15);
        border: 1px solid rgba(212,175,55,0.3);
        border-radius: 40px;
        padding: 8px 16px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
        color: #FFD700;
    }
    .btn-share:hover, .btn-report:hover, .btn-pdf:hover {
        background: rgba(212,175,55,0.3);
        transform: scale(1.02);
    }

    /* Botón pagar con animación */
    .btn-pagar {
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 40px;
        padding: 10px 16px;
        font-size: 0.8rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        justify-content: center;
        transition: all 0.2s ease;
        animation: pulseSoft 1.8s infinite ease-in-out;
        box-shadow: 0 0 5px rgba(22, 163, 74, 0.5);
    }
    @keyframes pulseSoft {
        0% { transform: scale(1); box-shadow: 0 0 5px rgba(22, 163, 74, 0.5); }
        50% { transform: scale(1.03); box-shadow: 0 0 20px rgba(22, 163, 74, 0.8); background: #15803d; }
        100% { transform: scale(1); box-shadow: 0 0 5px rgba(22, 163, 74, 0.5); }
    }
    .btn-pagar:hover { animation: none; transform: scale(1.02); background: #15803d; box-shadow: 0 0 25px rgba(22, 163, 74, 0.9); }
    .btn-pagar:active { transform: scale(0.98); }

    .soccer-loading-container { text-align: center; margin-top: 140px; }
    .soccer-spinner { font-size: 3.5rem; color: #D4AF37; animation: spinSoccer 1.2s linear infinite; }
    
    /* Modales */
    .modal-backdrop {
        position: fixed; top:0; left:0; width:100%; height:100%;
        background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
        z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px;
    }
    .modal-box {
        background: #1e293b;
        border-radius: 28px;
        padding: 24px;
        max-width: 450px;
        width: 100%;
        border: 1px solid rgba(212,175,55,0.3);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        color: #fff;
    }
    .modal-box h3 { color: #D4AF37; margin-bottom: 16px; font-family: 'Outfit', sans-serif; }
    .modal-box textarea { width: 100%; padding: 12px; border-radius: 16px; background: #0f172a; color: white; border: 1px solid #334155; margin: 12px 0; }
    .modal-box textarea:focus { outline: none; border-color: #D4AF37; }
    .btn-modal { background: #D4AF37; color: black; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; }
    .btn-modal-secondary { background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; }
    .bank-info { margin: 15px 0; padding: 15px; background: #0f172a; border-radius: 16px; border: 1px solid #334155; }
    .bank-info p { margin: 8px 0; }
    .bank-account { font-family: monospace; font-size: 1.2rem; font-weight: bold; background: #00000040; padding: 8px; border-radius: 12px; text-align: center; letter-spacing: 1px; user-select: all; cursor: pointer; transition: background 0.2s; }
    .bank-account:hover { background: #00000060; }
    .flex-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    .copy-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #D4AF37; border-radius: 40px; padding: 10px 24px; color: #D4AF37; font-weight: 600; font-size: 0.9rem; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(4px); animation: toastFade 2.5s ease forwards; pointer-events: none; }
    @keyframes toastFade { 0% { opacity: 0; transform: translateX(-50%) translateY(20px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 85% { opacity: 1; transform: translateX(-50%) translateY(0); } 100% { opacity: 0; transform: translateX(-50%) translateY(20px); } }
</style>
</head>
<body>
    <!-- LOADER GLOBAL (aparece al inicio) -->
    <div id="globalLoader" class="global-loader">
        <div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div>
        <p>Cargando experiencia Nápoles...</p>
    </div>

    <div id="dynamicContent"></div>

    <!-- Modales (igual que antes) -->
    <div id="reportModal" class="modal-backdrop">
        <div class="modal-box">
            <h3><i class="fa-solid fa-flag"></i> Reportar incidencia</h3>
            <textarea id="reportText" rows="4" placeholder="Describe el problema o sugerencia..."></textarea>
            <div class="flex-buttons">
                <button class="btn-modal-secondary" onclick="cerrarReporte()">Cancelar</button>
                <button class="btn-modal" onclick="enviarReporte()">Enviar</button>
            </div>
        </div>
    </div>

    <div id="bankModal" class="modal-backdrop">
        <div class="modal-box">
            <h3><i class="fa-solid fa-credit-card"></i> Información de pago</h3>
            <div class="bank-info">
                <p><strong>🏦 Banco Pichincha</strong></p>
                <p><strong>Número de cuenta:</strong></p>
                <div class="bank-account" id="cuentaBancaria" data-cuenta="2209100265">2209100265</div>
                <p><strong>Titular:</strong> Darwin Muñoz</p>
                <p style="margin-top: 12px;">Realice el pago por el valor indicado y notifique al administrador.</p>
            </div>
            <div class="flex-buttons">
                <button class="btn-modal" onclick="cerrarBankModal()">Cerrar</button>
            </div>
        </div>
    </div>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {
    URL_GAS: "https://script.google.com/macros/s/AKfycbwjophe8wostDR9rNsMjGkIMP3WpE_IiUPJvorurqXs5OHgjAMyHHAlnmuDY4qwxRVh/exec"
};
const PROXIMO_PARTIDO = {
    rival: "FRANCO CANADIENSE", icono: "🍁", fecha: "2026-06-13", fechaLegible: "SÁBADO 13 DE JUNIO, 2026", hora: "12:00", lugar: "CANCHA 1 - LIGA SANTA RITA", valorVocalia: 2.5
};

let jugadorSesion = null;
try { jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual')); } catch(e) { console.warn(e); }
if (!jugadorSesion || !jugadorSesion.cedula) window.location.href = 'login.html';
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';
const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');
console.log("✅ Jugador autenticado:", cedula, nombreCompleto);

let jugadorData = null;
let refreshInterval = null;

// Ocultar loader global
function ocultarLoaderGlobal() {
    const loader = document.getElementById('globalLoader');
    if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
    }
}

// ==================== CACHÉ ====================
function guardarCache(perfil, notificacion) {
    const cache = { timestamp: Date.now(), perfil, notificacion };
    localStorage.setItem('perfilCache_' + cedula, JSON.stringify(cache));
}
function obtenerCache() {
    const cached = localStorage.getItem('perfilCache_' + cedula);
    if (!cached) return null;
    const data = JSON.parse(cached);
    if (Date.now() - data.timestamp < 5 * 60 * 1000) return data;
    return null;
}

// ==================== NOTIFICACIONES ====================
function mostrarNotificacion(notificacion) {
    const container = document.querySelector('.perfil-container');
    if (!container) return;
    const existing = document.querySelector('.notification-banner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-bell" style="color:#FFD700;"></i>
            <span>${notificacion.titulo || 'Nueva notificación'}: ${notificacion.mensaje || ''}</span>
        </div>
        <button class="close-notification" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
    `;
    container.insertBefore(banner, container.firstChild);
}

// ==================== PDF, COMPARTIR, REPORTE ====================
function descargarPDF() {
    if (!jugadorData) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text(`Ficha de Jugador - ${jugadorData.primerNombre} ${jugadorData.apellidos}`, 20, 20);
    doc.setFontSize(12);
    doc.text(`Cédula: ${cedula}`, 20, 40);
    doc.text(`Dorsal: ${jugadorData.dorsal}`, 20, 50);
    doc.text(`Goles totales: ${jugadorData.goles}`, 20, 60);
    doc.text(`Partidos jugados: ${jugadorData.partidosJugados}`, 20, 70);
    doc.text(`Rendimiento: Puntualidad ${jugadorData.puntualidad}, Compañerismo ${jugadorData.companerismo}, Respeto ${jugadorData.respeto}, Humildad ${jugadorData.humildad}`, 20, 90);
    doc.save(`perfil_${cedula}.pdf`);
}
function compartirPerfil() {
    const url = window.location.href;
    if (navigator.share) navigator.share({ title: `Perfil de ${jugadorData.primerNombre}`, text: `Mira mis estadísticas`, url: url });
    else { navigator.clipboard.writeText(url); alert('Enlace copiado'); }
}
function abrirReporte() { document.getElementById('reportModal').style.display = 'flex'; }
function cerrarReporte() { document.getElementById('reportModal').style.display = 'none'; }
function enviarReporte() {
    const texto = document.getElementById('reportText').value.trim();
    if (!texto) { alert('Escribe una descripción'); return; }
    alert('Reporte enviado al administrador. Gracias.');
    cerrarReporte();
    document.getElementById('reportText').value = '';
}

// ==================== MODAL BANCARIO ====================
function abrirBankModal() { document.getElementById('bankModal').style.display = 'flex'; }
function cerrarBankModal() { document.getElementById('bankModal').style.display = 'none'; }
function mostrarToast(mensaje) {
    const toastAnterior = document.querySelector('.copy-toast');
    if (toastAnterior) toastAnterior.remove();
    const toast = document.createElement('div');
    toast.className = 'copy-toast';

// Funciones auxiliares
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function calcularEdad(fechaNacimiento) {
    if (!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if (isNaN(fecha.getTime())) { let partes = fechaNacimiento.split(/[\/\-]/); if (partes.length === 3) fecha = new Date(partes[2], partes[1]-1, partes[0]); }
    if (isNaN(fecha.getTime())) return '--';
    let hoy = new Date();
    let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota) {
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0)) / 2;
    let html = '';
    for (let i = 1; i <= 5; i++) {
        if (puntuacion >= i) html += '<i class="fa-solid fa-star" style="color:#FFD700;"></i>';
        else if (puntuacion >= i - 0.5) html += '<i class="fa-solid fa-star-half-stroke" style="color:#FFD700;"></i>';
        else html += '<i class="fa-regular fa-star" style="opacity:0.3;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color) {
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius = 40, circum = 2 * Math.PI * radius;
    let dash = circum - ((value / 10) * circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40" stroke="rgba(255,255,255,.08)" stroke-width="8" fill="none"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-width="8" fill="none" stroke-dasharray="${circum}" stroke-dashoffset="${dash}" stroke-linecap="round"></circle></svg><div class="progress-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:900; color:#D4AF37;">${value}</div></div>`;
}

}

            const velocity = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            container.appendChild(p);
            p.animate([{ transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }, { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }], { duration: Math.random() * 1500 + 1000, easing: 'cubic-bezier(0, .9, .57, 1)', fill: 'forwards' });
        }
    }
}

async function guardarPartido() {
    const btn = document.getElementById('confirmButton');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.innerText = 'GUARDANDO...';
    const params = new URLSearchParams({
        action: 'guardarPartido', cedula: cedula, categoria: categoria, nombre: nombreCompleto,
        rival: PROXIMO_PARTIDO.rival, fecha: PROXIMO_PARTIDO.fecha, hora: PROXIMO_PARTIDO.hora,
        lugar: PROXIMO_PARTIDO.lugar, amarillas: '0', rojas: '0', goles: '0',
        valor_vocalia: PROXIMO_PARTIDO.valorVocalia.toString(), estado: 'CONFIRMADO',
        vocalias_pendientes: '0', puntualidad: '10', companerismo: '10', respeto: '10', humildad: '10'
    });
    const url = `${CONFIG.URL_GAS}?${params.toString()}`;
    try {
        const response = await fetch(url);
        const result = await response.json();
        if (result.success) {
            alert("✅ Asistencia confirmada para el partido contra FRANCO CANADIENSE");
            mostrarPerfil();
        } else {
            alert("⚠️ Ya habías confirmado este partido. Redirigiendo a tu perfil.");
            mostrarPerfil();
        }
    } catch(error) {
        alert('❌ Error de conexión. Intenta de nuevo.');
        if (btn) { btn.disabled = false; btn.innerText = 'Ahí estaré puntual'; }
    }
}

async function verificarConfirmacionPrevia() {
    try {
        const url = `${CONFIG.URL_GAS}?action=verificarConfirmacionPartido&cedula=${encodeURIComponent(cedula)}&rival=${encodeURIComponent(PROXIMO_PARTIDO.rival)}&fecha=${PROXIMO_PARTIDO.fecha}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        return data.confirmed === true;
    } catch(e) { return false; }
}

// ==================== INICIALIZACIÓN CON LOADER ====================
(async function() {
    // Mostrar loader global mientras se verifica
    const loader = document.getElementById('globalLoader');
    if (loader) loader.style.display = 'flex';
    
    const yaConfirmo = await verificarConfirmacionPrevia();
    // Ocultar loader antes de mostrar la pantalla correspondiente
    ocultarLoaderGlobal();
    
    if (yaConfirmo) {
        await mostrarPerfil();
    } else {
        mostrarRuleta();
    }
})();
