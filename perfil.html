<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nápoles F.C. - Mi Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ========== ESTILOS (los mismos que tenías, se omiten por brevedad pero se mantienen) ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0c10; color: #fff; }
  .perfil-root { background: radial-gradient(circle at top, #111a33 0%, #060912 100%); min-height: 100vh; padding: 15px; display: flex; justify-content: center; }
  .perfil-container { width: 100%; max-width: 480px; }
  .glass-card-perfil { background: linear-gradient(145deg, rgba(10,20,40,.85), rgba(5,10,20,.95)); border-radius: 20px; border: 1px solid rgba(212,175,55,.25); overflow: hidden; padding: 15px; margin-bottom: 15px; }
  .match-card-gold { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(0,0,0,0.6)); border-left: 6px solid #D4AF37; border-radius: 24px; padding: 18px 15px; text-align: center; }
  .match-teams { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
  .team-badge { text-align: center; flex: 1; }
  .team-badge .team-name { font-size: 1.3rem; font-weight: 900; font-family: 'Outfit'; }
  .vs-circle { background: #D4AF37; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 1.3rem; }
  .match-info { background: rgba(0,0,0,0.5); border-radius: 50px; padding: 12px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
  .match-info-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; }
  .match-info-item i { color: #D4AF37; }
  .result-badge { font-size: 0.7rem; font-weight: 800; margin-top: 6px; padding: 4px 12px; border-radius: 50px; display: inline-block; }
  .victoria { background: #15803d; color: white; }
  .derrota { background: #b91c1c; color: white; }
  .empate { background: #a16207; color: white; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
  .stat-card { background: rgba(0,0,0,.35); border-radius: 16px; padding: 10px; text-align: center; }
  .btn-logout { background: rgba(231,76,60,.12); color: #e74c3c; border: 1px solid rgba(231,76,60,.2); width: 100%; border-radius: 14px; padding: 14px; font-weight: 800; cursor: pointer; margin-top: 10px; }
  .soccer-loading-container { text-align: center; margin-top: 140px; }
  .rivales-scroll { overflow-x: auto; white-space: nowrap; padding-bottom: 8px; }
  .rival-chip { display: inline-block; background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.3); border-radius: 40px; padding: 6px 18px; margin-right: 12px; font-size: 0.8rem; font-weight: 600; color: #f5e6a3; }
  .terms-backdrop { position: fixed; top:0;left:0;width:100%;height:100%;background:rgba(3,5,10,0.97);backdrop-filter:blur(20px);z-index:10000;display:none;align-items:center;justify-content:center; }
  .terms-box { background: #091022; border: 2px solid #D4AF37; border-radius: 24px; max-width: 430px; padding: 24px; }
  .terms-option-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .btn-modal-send { background: linear-gradient(90deg, #D4AF37 0%, #F3E5AB 100%); color: #000; margin-top: 18px; font-weight: 800; border: none; padding: 14px; border-radius: 40px; width: 100%; }
  .progress-circle { position: relative; width: 85px; height: 85px; margin: auto; }
  .avatar-icon-box { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #D4AF37; background: radial-gradient(circle, #1a2a4a 0%, #0a1428 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; color: #D4AF37; font-size: 2.2rem; }
  .id-card-jersey-wrap { perspective: 900px; height: 180px; }
  .jersey-card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: rotateCard 12s linear infinite; }
  @keyframes rotateCard { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  .face-front, .face-back { position: absolute; width: 100%; height: 100%; border-radius: 20px; backface-visibility: hidden; background: linear-gradient(145deg, #0a1428, #000814); border: 2px solid rgba(212,175,55,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .face-back { transform: rotateY(180deg); }
  .jersey-number { font-size: 4.5rem; font-family: 'Outfit'; font-weight: 900; color: #D4AF37; }
  /* ruleta */
  .roulette-track { display: flex; gap: 24px; width: fit-content; transform: translateX(0); }
  .spinning { animation: scroll-fast 0.2s linear infinite; filter: blur(4px); }
  @keyframes scroll-fast { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
  .slowing { animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; }
  @keyframes scroll-slow { from { transform: translateX(0); } to { transform: translateX(-4000px); } }
  .reveal-element { opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .revealed { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="terms-backdrop" id="modalTerms">
  <div class="terms-box">
    <h2 style="text-align:center; color:#D4AF37;">GRAN INAUGURACIÓN</h2>
    <div class="terms-announcement" style="margin-bottom:20px;">⚽ ATENCIÓN JUGADORES ⚽<br>📅 17 de mayo - 9:30 a.m.<br>✅ Seleccione opción de asistencia</div>
    <div class="terms-option-card" onclick="selectRadio(1)"><input type="radio" name="termOption" id="opt1" value="1"><label>1️⃣ Asistiré, ahí estaré puntual</label></div>
    <div class="terms-option-card" onclick="selectRadio(2)"><input type="radio" name="termOption" id="opt2" value="2"><label>2️⃣ Enviaré a mi representante</label></div>
    <button class="btn-modal-send" id="btnFirmar" disabled onclick="enviarFirmaTerminos()">CONFIRMAR ASISTENCIA</button>
  </div>
</div>
<div id="dynamicContent"></div>

<script>
const CONFIG = { URL_GAS: "https://script.google.com/macros/s/AKfycbxCmR1ivxxiUyqU7Agq-Z1eAEXdJFuM2WHpYR-5SUOPJP3XuNC1IIUNbK9kwI4CZx2U/exec" }; // <- REEMPLAZA

let jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual') || 'null');
if (!jugadorSesion || !jugadorSesion.cedula) window.location.href = 'login.html';
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';

// ==================== LLAMADAS API ====================
async function callApi(action, params = {}) {
  const url = new URL(CONFIG.URL_GAS);
  url.searchParams.append("action", action);
  Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
  const resp = await fetch(url.toString());
  return resp.json();
}

// ==================== OBTENER DATOS REALES ====================
async function cargarPartidos() {
  const data = await callApi("getPartidos");
  return data.success ? data.data : [];
}

async function cargarRivales() {
  const data = await callApi("getRivales");
  return data.success ? data.data.map(r => r.nombre) : ["LEONES","IDEAL","BARZA","SAN MARTIN"];
}

async function obtenerPerfilJugador() {
  const data = await callApi("getPerfil", { cedula, categoria });
  return data.success ? data.jugador : null;
}

// ==================== PERFIL COMPLETO ====================
async function mostrarPerfil() {
  document.body.className = '';
  const container = document.getElementById('dynamicContent');
  container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container"><i class="fa-solid fa-futbol fa-spin" style="font-size:3rem;color:#D4AF37;"></i><div>Cargando perfil...</div></div></div></div>`;
  
  const [partidos, rivalesList, jugador] = await Promise.all([cargarPartidos(), cargarRivales(), obtenerPerfilJugador()]);
  if (!jugador) { container.innerHTML = `<div class="perfil-root"><div class="perfil-container">Error al cargar perfil</div></div>`; return; }
  
  const hoy = new Date();
  const proximos = partidos.filter(p => p.estado !== "FINALIZADO" && new Date(p.fecha) >= hoy).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const proximoPartido = proximos[0] || null;
  const historial = partidos.filter(p => p.estado === "FINALIZADO" && p.resultado && p.resultado !== "VS").sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,5);
  
  // Renderizar sección de próximo partido
  let proximoHTML = '';
  if (proximoPartido) {
    const resultadoParse = analizarResultado(proximoPartido.resultado, 'FINALIZADO'); // solo para badges
    proximoHTML = `
      <div class="glass-card-perfil">
        <div class="match-card-gold">
          <div class="match-teams">
            <div class="team-badge"><div class="team-name">⚜️ NÁPOLES F.C.</div><div class="team-sub">Local</div></div>
            <div class="vs-circle">VS</div>
            <div class="team-badge"><div class="team-name">${proximoPartido.rival}</div><div class="team-sub">Visitante</div></div>
          </div>
          <div class="match-info">
            <div class="match-info-item"><i class="fa-regular fa-calendar-alt"></i> ${new Date(proximoPartido.fecha).toLocaleDateString()}</div>
            <div class="match-info-item"><i class="fa-regular fa-clock"></i> ${proximoPartido.hora || "12:00"}</div>
            <div class="match-info-item"><i class="fa-solid fa-location-dot"></i> ${proximoPartido.lugar || "LIGA SANTA RITA"}</div>
          </div>
        </div>
      </div>`;
  } else {
    proximoHTML = `<div class="glass-card-perfil" style="text-align:center;">📅 No hay próximos partidos programados aún.</div>`;
  }
  
  // Historial con marcador diferenciado
  let historialHTML = '<div class="glass-card-perfil"><div style="color:#D4AF37; margin-bottom:12px;">📋 PARTIDOS RECIENTES</div>';
  if (historial.length === 0) historialHTML += '<div style="text-align:center;">Aún no hay partidos finalizados.</div>';
  else {
    historial.forEach(p => {
      const { tipo, home, away } = analizarResultado(p.resultado, 'FINALIZADO');
      let badge = '';
      if (tipo === 'victoria') badge = '<span class="result-badge victoria">🏆 VICTORIA</span>';
      else if (tipo === 'derrota') badge = '<span class="result-badge derrota">⚠️ DERROTA</span>';
      else if (tipo === 'empate') badge = '<span class="result-badge empate">🤝 EMPATE</span>';
      else badge = `<span class="result-badge" style="background:#334155;">${p.resultado}</span>`;
      historialHTML += `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding:12px 0;">
          <div style="font-size:0.8rem;">${new Date(p.fecha).toLocaleDateString()}<br><span style="color:#D4AF37;">vs ${p.rival}</span></div>
          <div style="font-weight:800;">${home} - ${away}</div>
          <div>${badge}</div>
        </div>`;
    });
  }
  historialHTML += '</div>';
  
  // Lista de rivales
  const chips = rivalesList.map(r => `<span class="rival-chip">${r}</span>`).join('');
  
  // Aquí iría el resto del perfil (estadísticas, etc.) - por simplicidad se muestra lo esencial
  container.innerHTML = `
  <div class="perfil-root">
    <div class="perfil-container">
      <div class="perfil-header"><h1 style="font-family:'Outfit'; color:#D4AF37; text-align:center;">⚜️ PANEL NÁPOLES ⚜️</h1></div>
      <div class="cards-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="glass-card-perfil" style="text-align:center;"><div class="avatar-icon-box"><i class="fa-solid fa-user-ninja"></i></div><div><strong>${jugador['primer nombre'] || ''} ${jugador['apellidos'] || ''}</strong></div><div>${cedula}</div></div>
        <div class="id-card-jersey-wrap"><div class="jersey-card-inner"><div class="face-front"><div class="jersey-number">${jugador['número de dorsal'] || '00'}</div></div><div class="face-back"><div class="jersey-number">${jugador['número de dorsal'] || '00'}</div></div></div></div>
      </div>
      ${proximoHTML}
      <div class="glass-card-perfil"><div style="color:#D4AF37;">⚔️ RIVALES DEL TORNEO</div><div class="rivales-scroll">${chips}</div></div>
      ${historialHTML}
      <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN</button>
    </div>
  </div>`;
}

function analizarResultado(res, estado) {
  if (estado !== 'FINALIZADO') return { tipo: null, home: null, away: null };
  const parts = (res || '').toString().trim().split('-');
  if (parts.length === 2) {
    let home = parseInt(parts[0]), away = parseInt(parts[1]);
    if (!isNaN(home) && !isNaN(away)) {
      let tipo = home > away ? 'victoria' : (home < away ? 'derrota' : 'empate');
      return { home, away, tipo };
    }
  }
  return { home: null, away: null, tipo: null };
}

function cerrarSesion() { localStorage.removeItem('jugador_actual'); window.location.href = 'login.html'; }

// ==================== RULETA CON RIVALES REALES ====================
async function mostrarRuleta() {
  const rivalesReales = await cargarRivales();
  if (!rivalesReales.length) rivalesReales.push("LEONES");
  const container = document.getElementById('dynamicContent');
  container.innerHTML = `
    <div class="h-screen flex flex-col items-center justify-center bg-black/90">
      <h2 style="color:#D4AF37;">SORTEO DE RIVAL</h2>
      <div class="relative w-full overflow-hidden py-12" id="roulette-window">
        <div class="roulette-track px-[50vw]" id="roulette-track"></div>
      </div>
      <div class="hidden text-center" id="reveal-screen">
        <div class="reveal-element"><div class="text-6xl" id="winnerIcon">🦁</div><div class="text-2xl font-bold" id="winnerName">LEONES</div></div>
        <div class="reveal-element mt-4"><div class="match-info-card bg-gray-800 p-4 rounded-xl"><div class="flex justify-center gap-4"><span>📅 SÁBADO PRÓXIMO</span><span>⏰ 12:00</span><span>🏟️ CANCHA 1</span></div></div></div>
        <button id="confirmButton" class="mt-6 bg-yellow-500 text-black px-8 py-3 rounded-full font-bold">Ahí estaré puntual</button>
      </div>
    </div>
  `;
  const track = document.getElementById('roulette-track');
  const revealScreen = document.getElementById('reveal-screen');
  // construir cartas
  for (let i = 0; i < 40; i++) {
    const rival = rivalesReales[i % rivalesReales.length];
    const div = document.createElement('div');
    div.className = 'flex-shrink-0 w-48 h-64 bg-black/70 rounded-xl flex flex-col items-center justify-center border border-yellow-500/30';
    div.innerHTML = `<div class="text-5xl">${obtenerIconoRival(rival)}</div><div class="text-white mt-2 font-bold">${rival}</div>`;
    track.appendChild(div);
  }
  let spinning = true;
  track.classList.add('spinning');
  setTimeout(() => {
    track.classList.remove('spinning');
    track.classList.add('slowing');
    setTimeout(() => {
      spinning = false;
      const items = Array.from(track.children);
      const centro = window.innerWidth / 2;
      let closest = null, minDist = Infinity;
      items.forEach(card => {
        const rect = card.getBoundingClientRect();
        const centerCard = rect.left + rect.width/2;
        const dist = Math.abs(centro - centerCard);
        if (dist < minDist) { minDist = dist; closest = card; }
      });
      const nombreRival = closest.querySelector('div:last-child')?.innerText || "LEONES";
      document.getElementById('winnerName').innerText = nombreRival;
      document.getElementById('winnerIcon').innerHTML = obtenerIconoRival(nombreRival);
      document.querySelector('#roulette-window')?.classList.add('hidden');
      revealScreen.classList.remove('hidden');
      setTimeout(() => document.querySelectorAll('.reveal-element').forEach(el => el.classList.add('revealed')), 100);
      document.getElementById('confirmButton').onclick = () => guardarPartidoConRival(nombreRival);
    }, 3000);
  }, 3000);
}

function obtenerIconoRival(nombre) {
  const map = { "LEONES":"🦁", "IDEAL":"⚡", "BARZA":"🔵🔴", "SAN MARTIN":"🏰", "INDEPENDIENTE":"🔥", "VODKILA":"🍺", "CHELSEA":"💙", "JUVENTUD":"⚪⚫", "FRANCO CANADIENSE":"🍁" };
  return map[nombre] || "⚽";
}

async function guardarPartidoConRival(rival) {
  const btn = document.getElementById('confirmButton');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.innerText = 'GUARDANDO...';
  const fechaPartido = new Date();
  fechaPartido.setDate(fechaPartido.getDate() + (7 - fechaPartido.getDay() + 1)); // próximo sábado
  const fechaStr = fechaPartido.toISOString().split('T')[0];
  // 1. Crear el partido en Programacion_Partidos_H
  const partidoData = {
    fecha: fechaStr,
    hora: "12:00",
    rival: rival,
    local: "NAPOLES F.C.",
    lugar: "LIGA SANTA RITA - Cancha 1",
    resultado: "VS",
    estado: "PRÓXIMO",
    vocalia: ""
  };
  await callApi("agregarPartido", { partido: JSON.stringify(partidoData) });
  // 2. Registrar asistencia en Partidos Hombres
  const asistenciaData = {
    cedula: cedula,
    categoria: categoria,
    nombre: jugadorSesion.primerNombre + " " + jugadorSesion.apellidos,
    rival: rival,
    fecha: fechaStr,
    hora: "12:00",
    lugar: "LIGA SANTA RITA - Cancha 1",
    amarillas: 0, rojas: 0, goles: 0, valor_vocalia: 2.5, estado: "CONFIRMADO",
    puntualidad: 10, companerismo: 10, respeto: 10, humildad: 10, dorsal: jugadorSesion.dorsal || ""
  };
  await callApi("registrarAsistencia", asistenciaData);
  alert(`✅ Confirmaste asistencia contra ${rival}. ¡Buena suerte!`);
  mostrarPerfil();
}

// ==================== TÉRMINOS ====================
function selectRadio(num) { document.getElementById(`opt${num}`).checked = true; document.getElementById('btnFirmar').disabled = false; }
async function enviarFirmaTerminos() {
  const opcion = document.querySelector('input[name="termOption"]:checked').value;
  await callApi("guardarTerminos", { cedula, categoria, opcion });
  document.getElementById('modalTerms').style.display = 'none';
  const yaConfirmo = await callApi("verificarConfirmacionPartido", { cedula, rival: "LEONES", fecha: "2026-06-06" });
  if (yaConfirmo.confirmed) mostrarPerfil();
  else mostrarRuleta();
}
async function verificarTerminos() {
  const perfil = await obtenerPerfilJugador();
  if (!perfil || !perfil.terminos_aceptados) { document.getElementById('modalTerms').style.display = 'flex'; return false; }
  return true;
}
(async function() {
  const terminosOk = await verificarTerminos();
  if (!terminosOk) return;
  const yaConfirmo = await callApi("verificarConfirmacionPartido", { cedula, rival: "LEONES", fecha: "2026-06-06" });
  if (yaConfirmo.confirmed) mostrarPerfil();
  else mostrarRuleta();
})();
</script>
</body>
</html>
