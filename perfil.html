<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nápoles F.C. - Ruleta del Campeonato</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --gold:#D4AF37;
    --bg:#060912;
    --card:rgba(255,255,255,.05);
    --text:#fff;
    --muted:#9ca3af;
    --success:#2ecc71;
    --danger:#e74c3c;
    --warning:#f39c12;
    --info:#3498db;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:radial-gradient(circle at top,#111a33 0%,#060912 100%);
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
}

.profile-container{
    width:100%;
    max-width:460px;
}

.profile-header{
    text-align:center;
    margin-bottom:20px;
}

.profile-header h1{
    font-family:'Outfit',sans-serif;
    color:var(--gold);
    font-size:1.3rem;
    letter-spacing:2px;
}

.cards-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:15px;
}

.glass-card{
    background:linear-gradient(145deg,rgba(10,20,40,.85),rgba(5,10,20,.95));
    border-radius:20px;
    border:1px solid rgba(212,175,55,.25);
    overflow:hidden;
    position:relative;
}

.id-card-identity{
    padding:15px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.avatar-icon-box{
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid var(--gold);
    background:radial-gradient(circle, #1a2a4a 0%, #0a1428 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    color:var(--gold);
    font-size:2.2rem;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
}

.id-card-jersey-wrap{
    perspective:900px;
    height:180px;
}

.jersey-card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation:rotateCard 12s linear infinite;
}

@keyframes rotateCard{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(360deg);}
}

.face-front,
.face-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    backface-visibility:hidden;
    background:linear-gradient(145deg,#0a1428,#000814);
    border:2px solid rgba(212,175,55,.4);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.face-back{
    transform:rotateY(180deg);
}

.jersey-name{
    font-size:.7rem;
    color:#f5e6a3;
    text-transform:uppercase;
    letter-spacing:2px;
    font-weight:800;
}

.jersey-number{
    font-size:4.5rem;
    font-family:'Outfit';
    font-weight:900;
    line-height:1;
    color:var(--gold);
}

.section-box,
.stats-section,
.performance-section,
.ruleta-section{
    background:var(--card);
    border-radius:20px;
    padding:15px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(5px);
}

.section-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
    color:var(--gold);
    font-size:.8rem;
    font-weight:800;
    text-transform:uppercase;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);

.stat-card{
    background:rgba(0,0,0,.35);
    border-radius:16px;

.stat-icon{

}

.stat-value{

.stat-label{

.performance-grid{

.metric-card{

}

.progress-circle{

    height:85px;

}

.progress-circle svg{

}

.progress-bg{
    stroke:rgba(255,255,255,.08);
    stroke-width:8;
    fill:none;
}

.progress-fill{
    stroke-width:8;
    fill:none;
    stroke-linecap:round;

}

.progress-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

}

.metric-title{
    margin-top:10px;

}

.average-box{

    background:rgba(212,175,55,.08);

.average-score{

.ruleta-btn{

.vs-card{

.equipo-local, .equipo-visita{

.vs-medio{
    background:var(--gold);

    height:40px;
    border-radius:50%;
    display:flex;

}
.rival-result{

/* Modal inauguración (preexistente) */
.terms-backdrop{

.terms-box{
    background: linear-gradient(145deg, #091022, #040812);
    border: 2px solid var(--gold);

.terms-announcement{

    border: 1px solid rgba(212,175,55,0.25);

    padding: 18px;
    border-radius: 14px;

}
.terms-option-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);

.terms-option-card input[type="radio"] { accent-color: var(--gold); transform: scale(1.3);}
.terms-option-card.selected { border-color: var(--gold); background: rgba(212,175,55,0.08);}
.btn-modal-send {
    background: linear-gradient(90deg, #D4AF37 0%, #F3E5AB 100%);

    margin-top: 18px;
    font-weight:800;
    border:none;

}
.soccer-loading-container {
    text-align: center;
    margin-top: 140px;
}

    font-size: 3.5rem;

<body>

<div class="terms-backdrop" id="modalTerms">
    <div class="terms-box">
        <h2 style="text-align:center; color:var(--gold);">GRAN INAUGURACIÓN</h2>
        <div class="terms-announcement" id="anuncioTexto">⚽ ATENCIÓN JUGADORES ⚽<br>📅 17 de mayo - 9:30 a.m.<br>✅ Seleccione opción de asistencia</div>
        <div class="terms-option-card" onclick="selectRadio(1)"><input type="radio" name="termOption" id="opt1" value="1"><label>1️⃣ Asistiré, ahí estaré puntual</label></div>
        <div class="terms-option-card" onclick="selectRadio(2)"><input type="radio" name="termOption" id="opt2" value="2"><label>2️⃣ Enviaré a mi representante</label></div>
        <button class="btn-modal-send" id="btnFirmar" disabled onclick="enviarFirmaTerminos()">CONFIRMAR ASISTENCIA</button>
    </div>
</div>

<div class="profile-container" id="perfilContent">
    <div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div class="soccer-loading-text">Cargando perfil...</div></div>
</div>

<script src="config.js"></script>
<script>
// -------------------- DATA JUGADOR Y CONSTANTES --------------------
let jugadorSesion = null;
// Lista de rivales (todos los equipos posibles, incluido Leones)
const EQUIPOS_RIVALES = [
    "LEONES", "IDEAL", "BARZA", "SAN MARTIN", "INDEPENDIENTE", 
    "VODKILA", "CHELSEA", "JUVENTUD DE AMERICA", "JUVENTUS", "FRANCO CANADIENSE"
];

// -------------------- FUNCIONES AUXILIARES EXISTENTES --------------------
function escapeHtml(str){
    if(!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function calcularEdad(fechaNacimiento){
    if(!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if(isNaN(fecha.getTime())){ let partes = fechaNacimiento.split(/[\/\-]/); if(partes.length===3) fecha = new Date(partes[2], partes[1]-1, partes[0]);}
    if(isNaN(fecha.getTime())) return '--';
    let hoy = new Date(); let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if(mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota){
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0))/2;
    let html='';
    for(let i=1;i<=5;i++){
        if(puntuacion>=i) html+='<i class="fa-solid fa-star"></i>';
        else if(puntuacion>=i-0.5) html+='<i class="fa-solid fa-star-half-stroke"></i>';
        else html+='<i class="fa-regular fa-star" style="opacity:0.2;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color){
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius=40, circum=2*Math.PI*radius;
    let dash=circum - ((value/10)*circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-dasharray="${circum}" stroke-dashoffset="${dash}"></circle></svg><div class="progress-text">${value}</div></div>`;
}

// Variables ruleta
let ruletaGirando = false;
let anguloActual = 0;
let rivalSeleccionado = null;

// DOM elementos ruleta (se inyectarán)
let canvasRuleta, ctxRuleta, ruletaImgRef;

function initRuletaGrafica() {
    const canvas = document.getElementById('ruletaCanvas');
    if(!canvas) return;
    canvasRuleta = canvas;
    ctxRuleta = canvas.getContext('2d');
    const container = canvas.parentElement;
    const size = Math.min(280, container.clientWidth);
    canvas.width = size;
    canvas.height = size;
    dibujarRuleta();
}

function dibujarRuleta() {
    if(!ctxRuleta) return;
    const w = canvasRuleta.width, h = canvasRuleta.height;
    const centroX = w/2, centroY = h/2;
    const radio = w*0.42;
    ctxRuleta.clearRect(0,0,w,h);
    
    const colores = ['#D4AF37','#C0A030','#B4941A','#9C7E18','#856C14','#6E5910','#57480C','#3A3008','#D4AF37','#C0A030','#B4941A','#9C7E18'];
    const numRivales = EQUIPOS_RIVALES.length;
    const anguloPorcion = (Math.PI * 2) / numRivales;
    
    for(let i=0;i<numRivales;i++){
        let inicio = anguloActual + i * anguloPorcion;
        let fin = inicio + anguloPorcion;
        ctxRuleta.beginPath();
        ctxRuleta.moveTo(centroX, centroY);
        ctxRuleta.arc(centroX, centroY, radio, inicio, fin);
        ctxRuleta.fillStyle = colores[i % colores.length];
        ctxRuleta.fill();
        ctxRuleta.strokeStyle = '#000000';
        ctxRuleta.lineWidth = 1.5;
        ctxRuleta.stroke();
        ctxRuleta.save();
        ctxRuleta.translate(centroX, centroY);
        ctxRuleta.rotate(inicio + anguloPorcion/2);
        ctxRuleta.textAlign = "center";
        ctxRuleta.textBaseline = "middle";
        ctxRuleta.font = `bold ${Math.max(10, radio*0.1)}px "Outfit"`;
        ctxRuleta.fillStyle = "#03060f";
        let nombreCorto = EQUIPOS_RIVALES[i].length > 8 ? EQUIPOS_RIVALES[i].substring(0,7)+".." : EQUIPOS_RIVALES[i];
        ctxRuleta.fillText(nombreCorto, radio*0.72, 6);
        ctxRuleta.restore();
    }
    ctxRuleta.beginPath();
    ctxRuleta.arc(centroX, centroY, radio*0.2, 0, 2*Math.PI);
    ctxRuleta.fillStyle = "#D4AF37";
    ctxRuleta.fill();
    ctxRuleta.fillStyle = "#000";
    ctxRuleta.font = "bold 18px Outfit";
    ctxRuleta.fillText("VS", centroX-8, centroY+5);
    // marcador triangular
    ctxRuleta.beginPath();
    let puntaX = centroX, puntaY = centroY - radio - 8;
    ctxRuleta.moveTo(puntaX-8, puntaY+12);
    ctxRuleta.lineTo(puntaX, puntaY);
    ctxRuleta.lineTo(puntaX+8, puntaY+12);
    ctxRuleta.fillStyle = "#FFD966";
    ctxRuleta.fill();
}

function girarRuleta() {
    if(ruletaGirando) return;
    ruletaGirando = true;
    const vueltas = 6 * Math.PI * 2; // vueltas aleatorias
    const duracion = 1200;
    const inicio = performance.now();
    const inicioAngulo = anguloActual;
    const objetivoDelta = vueltas + (Math.random() * Math.PI * 2);
    
    function animate(now) {
        const elapsed = now - inicio;
        let t = Math.min(1, elapsed / duracion);
        const easeOut = 1 - Math.pow(1-t,3);
        const deltaAngulo = objetivoDelta * easeOut;
        anguloActual = (inicioAngulo + deltaAngulo) % (Math.PI*2);
        dibujarRuleta();
        if(t < 1) requestAnimationFrame(animate);
        else {
            ruletaGirando = false;
            // determinar índice del rival según el marcador fijo (arriba centro)
            const num = EQUIPOS_RIVALES.length;
            const anguloPorcion = (Math.PI*2)/num;
            // dirección del marcador es -PI/2 (hacia arriba)
            let dirMarcador = -Math.PI/2;
            let anguloRelativo = (dirMarcador - anguloActual + 2*Math.PI) % (2*Math.PI);
            let indice = Math.floor(anguloRelativo / anguloPorcion) % num;
            rivalSeleccionado = EQUIPOS_RIVALES[indice];
            // Actualizar vista previa en tarjeta VS
            const vsCard = document.getElementById('vsPreview');
            if(vsCard){
                vsCard.innerHTML = `
                    <div class="equipo-local"><h4>⚜️ NÁPOLES F.C.</h4><span>Local</span></div>
                    <div class="vs-medio">VS</div>
                    <div class="equipo-visita"><h4>🏆 ${rivalSeleccionado}</h4><span>Visitante</span></div>
                `;
                const rivalResult = document.getElementById('rivalResultado');
                if(rivalResult) rivalResult.innerHTML = `🔁 ¡CAMPEONATO! Partido inaugural: Nápoles F.C. vs ${rivalSeleccionado} ⚽`;
            }
        }
    }
    requestAnimationFrame(animate);
}

// Modal terminos existente
function selectRadio(num){
    document.getElementById('opt'+num).checked=true;
    document.querySelectorAll('.terms-option-card').forEach(c=>c.classList.remove('selected'));
    document.getElementById(`opt${num}`).parentElement.classList.add('selected');
    document.getElementById('btnFirmar').disabled=false;
}
async function enviarFirmaTerminos(){
    const opcion=document.querySelector('input[name="termOption"]:checked').value;
    const btn=document.getElementById('btnFirmar');
    btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';
    try{
        const url=`${CONFIG.URL_GAS}?action=guardarTerminos&cedula=${encodeURIComponent(jugadorSesion.cedula)}&categoria=${encodeURIComponent(jugadorSesion.categoria)}&opcion=${opcion}`;
        const resp=await fetch(url);
        const r=await resp.json();
        if(r.success){
            document.getElementById('modalTerms').style.display='none';
            recargarPerfil();
        } else alert('Error: '+r.message);
    }catch(e){ alert('Error de red');}
    finally{ btn.disabled=false; btn.innerHTML='CONFIRMAR ASISTENCIA';}
}

// RENDER PERFIL COMPLETO CON RULETA
async function cargarPerfil(cedula, categoria){
    const container = document.getElementById('perfilContent');
    try{
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if(data.success && data.jugador){
            const j = data.jugador;
            if (!j.terminos_aceptados) document.getElementById('modalTerms').style.display = 'flex';
            else document.getElementById('modalTerms').style.display = 'none';

            const sanitized = {
                primerNombre: escapeHtml(j['primer nombre'] || ''),
                apellidos: escapeHtml(j['apellidos'] || ''),
                fechaNacimiento: j['fecha de nacimiento'] || '',
                nombreCamiseta: escapeHtml(j['nombre en camiseta'] || 'NÁPOLES'),
                dorsal: escapeHtml(j['número de dorsal'] || '00'),
                tallaUni: escapeHtml(j['talla uni.'] || 'M'),
                partidosJugados: Number(j['partidos jugados']) || 0,
                goles: Number(j['goles']) || 0,
                amarillas: Number(j['amarillas']) || 0,
                rojas: Number(j['rojas']) || 0,
                puntualidad: parseFloat(j['puntualidad']) || 0,
                companerismo: parseFloat(j['compañerismo']) || 0,
                respeto: parseFloat(j['respeto']) || 0,
                humildad: parseFloat(j['humildad']) || 0,
                deudaVocalia: Number(j['deuda vocalia']) || 0,
                inscripEstado: escapeHtml(j['inscrip_estado'] || 'PENDIENTE'),
                unifEstado: escapeHtml(j['unif_estado'] || 'PENDIENTE'),
                mediasEstado: escapeHtml(j['medias_estado'] || 'PENDIENTE')
            };
            let edad=calcularEdad(sanitized.fechaNacimiento);
            let suma=sanitized.puntualidad+sanitized.companerismo+sanitized.respeto+sanitized.humildad;
            let promedio=suma>0?parseFloat((suma/4).toFixed(1)):0;
            let deudaInscripcion=sanitized.inscripEstado.toUpperCase().includes('PENDIENTE')?5:0;
            let deudaUniforme=sanitized.unifEstado.toUpperCase().includes('PENDIENTE')?17:0;
            let deudaMedias=sanitized.mediasEstado.toUpperCase().includes('PENDIENTE')?2:0;
            let totalAdmin=deudaInscripcion+deudaUniforme+deudaMedias+sanitized.deudaVocalia;

            container.innerHTML = `
            <div class="profile-header"><h1>⚜️ PANEL NÁPOLES ⚜️</h1><div style="font-size:0.75rem;color:var(--gold);">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div></div>
            <div class="cards-row">
                <div class="id-card-identity glass-card"><div class="avatar-icon-box"><i class="fa-solid fa-user-ninja"></i></div><div style="font-weight:900;">${sanitized.primerNombre}<br>${sanitized.apellidos}</div><div style="font-size:.65rem;"><i class="fa-solid fa-id-card"></i> ${cedula}</div><div style="margin-top:8px;background:rgba(212,175,55,.2);padding:4px 10px;border-radius:20px;">${edad} años</div></div>
                <div class="id-card-jersey-wrap"><div class="jersey-card-inner"><div class="face-front"><div class="jersey-name">${sanitized.nombreCamiseta}</div><div class="jersey-number">${sanitized.dorsal}</div><div>Talla ${sanitized.tallaUni}</div></div><div class="face-back"><div class="jersey-name">NÁPOLES FC</div><div class="jersey-number">${sanitized.dorsal}</div></div></div></div>
            </div>
            <button class="btn-sync" onclick="recargarPerfil()"><i class="fa-solid fa-rotate"></i> ACTUALIZAR</button>
            
            <!-- SECCIÓN RULETA - NUEVA INAGURACIÓN CAMPEONATO -->
            <div class="ruleta-section">
                <div class="section-title"><i class="fa-solid fa-trophy"></i> GRAN INAUGURACIÓN - RULETA DE RIVALES</div>
                <div class="ruleta-wrapper">
                    <div class="ruleta-canvas">
                        <canvas id="ruletaCanvas" width="280" height="280" style="width:100%; height:auto; cursor:pointer;"></canvas>
                    </div>
                    <div class="ruleta-btn">
                        <button class="btn-spin" id="btnGirarRuleta"><i class="fa-solid fa-futbol"></i> GIRAR RULETA · SORTEAR RIVAL</button>
                    </div>
                    <div id="vsPreview" class="vs-card">
                        <div class="equipo-local"><h4>⚜️ NÁPOLES F.C.</h4><span>Local</span></div>
                        <div class="vs-medio">VS</div>
                        <div class="equipo-visita"><h4>🏆 ¿¿??</h4><span>Gira la ruleta</span></div>
                    </div>
                    <div id="rivalResultado" class="rival-result">🎲 Presiona el botón para definir el rival del primer partido</div>
                </div>
            </div>
            
            <div class="stats-section"><div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="color:#3498db"><i class="fa-solid fa-shirt"></i></div><div class="stat-value">${sanitized.partidosJugados}</div><div class="stat-label">PARTIDOS</div></div><div class="stat-card"><div class="stat-icon" style="color:#2ecc71"><i class="fa-solid fa-futbol"></i></div><div class="stat-value">${sanitized.goles}</div><div class="stat-label">GOLES</div></div><div class="stat-card"><div class="stat-icon" style="color:#f39c12"><i class="fa-solid fa-square"></i></div><div class="stat-value">${sanitized.amarillas}</div><div class="stat-label">AMARILLAS</div></div><div class="stat-card"><div class="stat-icon" style="color:#e74c3c"><i class="fa-solid fa-square"></i></div><div class="stat-value">${sanitized.rojas}</div><div class="stat-label">ROJAS</div></div></div></div>

            <div class="performance-section"><div class="section-title"><i class="fa-solid fa-heart"></i> Rendimiento Humano</div><div class="performance-grid">${['puntualidad','companerismo','respeto','humildad'].map((m,i)=> `<div class="metric-card">${renderProgressCircle(sanitized[m],['#3498db','#2ecc71','#f39c12','#9b59b6'][i])}<div class="metric-title">${m.toUpperCase()}</div></div>`).join('')}</div><div class="average-box"><div class="average-score">${promedio}/10</div><div class="stars-container">${generarEstrellas(promedio)}</div></div></div>

            <div class="section-box"><div class="section-title"><i class="fa-solid fa-chart-line"></i> Estado Administrativo</div><div class="admin-grid">${deudaInscripcion?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-file-signature"></i></div><div class="admin-value">$5</div><div class="admin-label">INSCRIPCIÓN</div><div class="admin-status pending">PENDIENTE</div></div>`:''}${deudaUniforme?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-tshirt"></i></div><div class="admin-value">$17</div><div class="admin-label">UNIFORME</div><div class="admin-status warning">PENDIENTE</div></div>`:''}${deudaMedias?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-socks"></i></div><div class="admin-value">$2</div><div class="admin-label">MEDIAS</div><div class="admin-status info">PENDIENTE</div></div>`:''}${sanitized.deudaVocalia>0?`<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-money-bill-wave"></i></div><div class="admin-value">$${sanitized.deudaVocalia.toFixed(2)}</div><div class="admin-label">VOCALÍA</div><div class="admin-status vocalia">PENDIENTE</div></div>`:''}</div><div class="debt-box"><div class="debt-header"><span>VALORES PENDIENTES</span><span style="color:${totalAdmin>0?'#e74c3c':'#2ecc71'}">$${totalAdmin.toFixed(2)}</span></div><div class="progress-bar"><div class="progress-fill-bar" style="width:${Math.min(totalAdmin/30*100,100)}%"></div></div><div class="debt-message">${totalAdmin===0?'✅ ¡Estás al día!':'⚠️ Regulariza tus pagos'}</div></div></div>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN</button>
            `;
            // Inicializar ruleta después de inyectar el HTML
            setTimeout(()=>{
                initRuletaGrafica();
                const btnGirar = document.getElementById('btnGirarRuleta');
                if(btnGirar) btnGirar.addEventListener('click', (e) => { e.preventDefault(); girarRuleta(); });
            }, 50);
        } else {
            container.innerHTML = `<div class="error-message">${data.message || 'Jugador no encontrado'}</div>`;
        }
    } catch(e){
        container.innerHTML = `<div class="error-message">❌ Error crítico de conexión</div>`;
    }
}

function recargarPerfil(){
    if(!jugadorSesion){ window.location.href='login.html'; return; }
    document.getElementById('perfilContent').innerHTML = `<div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div class="soccer-loading-text">Cargando perfil...</div></div>`;
    cargarPerfil(jugadorSesion.cedula, jugadorSesion.categoria || 'hombres');
}

function cerrarSesion(){
    if(confirm('¿Cerrar sesión?')){ localStorage.removeItem('jugador_actual'); window.location.href='login.html'; }
}

// Inicio
(function(){
    jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
    if(!jugadorSesion || !jugadorSesion.cedula){ window.location.href='login.html'; return; }
    cargarPerfil(jugadorSesion.cedula, jugadorSesion.categoria || 'hombres');
})();
</script>
</body>
</html>
