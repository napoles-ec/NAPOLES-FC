<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nápoles F.C. - Depuración</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    body { background: #0a0c10; color: #fff; font-family: monospace; padding: 20px; }
    .log-panel { background: #1a1c22; border: 1px solid #D4AF37; border-radius: 12px; padding: 15px; margin-bottom: 20px; max-height: 500px; overflow-y: auto; }
    .log-entry { border-bottom: 1px solid #334155; padding: 6px 0; font-size: 0.8rem; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    .info { color: #60a5fa; }
    button { background: #D4AF37; color: #000; padding: 8px 16px; border-radius: 20px; margin: 5px; cursor: pointer; }
    pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 0.7rem; }
</style>
</head>
<body>
<h1 class="text-yellow-500 text-2xl">🔍 Depuración de conexión con Google Apps Script</h1>
<p class="mb-2">Cédula de prueba: <strong id="cedulaSpan">Cargando...</strong></p>
<button id="testConnectionBtn">🧪 Probar conexión con Web App</button>
<button id="clearLogsBtn">🗑️ Limpiar logs</button>

<div class="log-panel">
    <h3 class="text-yellow-500">📋 Logs de ejecución</h3>
    <div id="logContainer"></div>
</div>

<div class="mt-4">
    <h3 class="text-yellow-500">⚙️ Configuración actual</h3>
    <pre id="configDisplay"></pre>
</div>

<script>
// ==================== CONFIGURACIÓN - CAMBIA ESTA URL POR LA TUYA ====================
const CONFIG = { URL_GAS: "https://script.google.com/macros/s/AKfycbzCrbkxDZfjmq0xFolGp3MgVZi_u5HA1FVPc3WnfR9WBN2ztEBMG2CnXsaSrv24jeYf/exec" };

// Mostrar configuración
document.getElementById('configDisplay').innerText = JSON.stringify(CONFIG, null, 2);

// ==================== LOGS ====================
function addLog(message, type = 'info') {
    const container = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
    console.log(`[${type}]`, message);
}

function addError(message) { addLog(message, 'error'); }
function addSuccess(message) { addLog(message, 'success'); }

// ==================== OBTENER SESIÓN ====================
let jugadorSesion = null;
try {
    jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
    addSuccess(`Sesión cargada: ${JSON.stringify(jugadorSesion)}`);
    document.getElementById('cedulaSpan').innerText = jugadorSesion?.cedula || 'No hay sesión';
} catch(e) {
    addError(`Error al leer sessionStorage: ${e.message}`);
}
if (!jugadorSesion || !jugadorSesion.cedula) {
    addError('❌ No hay sesión de jugador. Por favor inicia sesión primero en login.html');
    document.getElementById('cedulaSpan').innerHTML = '<span class="text-red-400">No hay sesión - ve a login.html</span>';
} else {
    addSuccess(`✅ Jugador: ${jugadorSesion.primerNombre} ${jugadorSesion.apellidos} (${jugadorSesion.cedula})`);
}

// ==================== FUNCIONES DE PRUEBA ====================
async function callApi(action, params = {}) {
    const url = new URL(CONFIG.URL_GAS);
    url.searchParams.append("action", action);
    Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
    addLog(`📡 Llamando a ${action} con params: ${JSON.stringify(params)}`, 'info');
    try {
        const resp = await fetch(url.toString());
        const text = await resp.text();
        let json;
        try { json = JSON.parse(text); } catch(e) { json = { raw: text }; }
        addLog(`📥 Respuesta de ${action}: ${JSON.stringify(json).substring(0, 300)}`, json.success !== false ? 'success' : 'error');
        return json;
    } catch(error) {
        addError(`❌ Error en fetch ${action}: ${error.message}`);
        return { success: false, error: error.message };
    }
}

async function testGetPerfil() {
    if (!jugadorSesion?.cedula) { addError('No hay cédula para probar getPerfil'); return; }
    addLog('🔍 Probando getPerfil...');
    const data = await callApi('getPerfil', { cedula: jugadorSesion.cedula });
    if (data.success && data.jugador) {
        addSuccess(`getPerfil OK: ${JSON.stringify(data.jugador).substring(0, 200)}`);
    } else {
        addError(`getPerfil falló: ${data.error || 'sin datos'}`);
    }
}

async function testGetPartidos() {
    addLog('🔍 Probando getPartidos...');
    const data = await callApi('getPartidos');
    if (data.success && data.data) {
        addSuccess(`getPartidos OK: ${data.data.length} partidos encontrados`);
        addLog(`Primer partido: ${JSON.stringify(data.data[0])}`);
    } else {
        addError(`getPartidos falló: ${data.error}`);
    }
}

async function testGetRivales() {
    addLog('🔍 Probando getRivales...');
    const data = await callApi('getRivales');
    if (data.success && data.data) {
        addSuccess(`getRivales OK: ${data.data.length} rivales`);
    } else {
        addError(`getRivales falló: ${data.error}`);
    }
}

async function testGetRendimiento() {
    if (!jugadorSesion?.cedula) return;
    addLog('🔍 Probando getRendimientoJugador...');
    const data = await callApi('getRendimientoJugador', { cedula: jugadorSesion.cedula });
    if (data.success) {
        addSuccess(`Rendimiento: puntualidad=${data.puntualidad}, compañerismo=${data.companerismo}, respeto=${data.respeto}, humildad=${data.humildad}`);
    } else {
        addError(`getRendimiento falló: ${data.error}`);
    }
}

async function testVerificarAsistenciaFutura() {
    if (!jugadorSesion?.cedula) return;
    addLog('🔍 Probando verificarAsistenciaFutura...');
    const data = await callApi('verificarAsistenciaFutura', { cedula: jugadorSesion.cedula });
    if (data.confirmed !== undefined) {
        addSuccess(`Asistencia futura confirmada: ${data.confirmed}`);
    } else {
        addError(`verificarAsistenciaFutura falló: ${JSON.stringify(data)}`);
    }
}

async function testVerificarTerminos() {
    if (!jugadorSesion?.cedula) return;
    addLog('🔍 Probando getPerfil para ver términos...');
    const data = await callApi('getPerfil', { cedula: jugadorSesion.cedula });
    if (data.success && data.jugador) {
        const terminos = data.jugador.terminos_aceptados;
        addSuccess(`Términos aceptados: ${terminos}`);
    } else {
        addError(`No se pudo leer términos: ${data.error}`);
    }
}

async function testAll() {
    addLog('🚀 Iniciando batería de pruebas...');
    await testGetPartidos();
    await testGetRivales();
    await testGetPerfil();
    await testGetRendimiento();
    await testVerificarAsistenciaFutura();
    await testVerificarTerminos();
    addLog('✅ Pruebas completadas.');
}

// ==================== EVENTOS ====================
document.getElementById('testConnectionBtn').addEventListener('click', testAll);
document.getElementById('clearLogsBtn').addEventListener('click', () => {
    document.getElementById('logContainer').innerHTML = '';
    addLog('Logs limpiados', 'info');
});

// Ejecutar pruebas automáticas al cargar la página
window.addEventListener('load', () => {
    addLog('Página de depuración cargada. Pruebas automáticas en 1 segundo...');
    setTimeout(testAll, 1000);
});
</script>
</body>
</html>
