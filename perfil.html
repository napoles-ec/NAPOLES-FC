<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nápoles F.C. - Sorteo de Rivales</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    /* Estilos generales (igual que antes) */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-card { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(233, 195, 73, 0.6); color: white; }
    .premium-glow { box-shadow: 0 0 30px rgba(233, 195, 73, 0.4); }
    .roulette-track { display: flex; gap: 24px; width: fit-content; transform: translateX(0); }
    .spinning { animation: scroll-fast 0.2s linear infinite; filter: blur(4px); }
    @keyframes scroll-fast { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    .slowing { animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; filter: blur(0px); transition: filter 2s ease-out; }
    @keyframes scroll-slow { from { transform: translateX(0); } to { transform: translateX(-4000px); } }
    .winner-glow { animation: winner-pulse 2s infinite alternate; }
    @keyframes winner-pulse { 0% { box-shadow: 0 0 20px rgba(233, 195, 73, 0.3); border-color: rgba(233, 195, 73, 0.6); } 100% { box-shadow: 0 0 60px rgba(233, 195, 73, 0.8); border-color: #e9c349; transform: scale(1.05); } }
    .particle { position: absolute; pointer-events: none; z-index: 100; }
    .cinematic-text { text-shadow: 0 0 20px rgba(233, 195, 73, 0.6); }
    .reveal-element { opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .revealed { opacity: 1; transform: translateY(0); }
    body.ruleta-mode { background: #0a0c10; overflow: hidden; min-height: 100dvh; }
    .match-info-card { background: #1a1c22; border-radius: 40px; padding: 16px 20px; margin: 15px 0; border-left: 5px solid #e9c349; text-align: center; }

    /* Estilos del perfil */
    .perfil-root { background: radial-gradient(circle at top, #111a33 0%, #060912 100%); font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; padding: 15px; display: flex; justify-content: center; }
    .perfil-container { width: 100%; max-width: 460px; }
    .perfil-header h1 { font-family: 'Outfit', sans-serif; color: #D4AF37; font-size: 1.3rem; letter-spacing: 2px; text-align: center; margin-bottom: 20px; }
    .cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    .glass-card-perfil { background: linear-gradient(145deg, rgba(10,20,40,.85), rgba(5,10,20,.95)); border-radius: 20px; border: 1px solid rgba(212,175,55,.25); overflow: hidden; }
    .match-card-gold { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(0,0,0,0.6)); border-left: 6px solid #D4AF37; border-radius: 24px; padding: 18px 15px; margin-bottom: 20px; text-align: center; }
    .match-teams { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
    .team-badge { text-align: center; flex: 1; }
    .team-badge .team-name { font-size: 1.5rem; font-weight: 900; font-family: 'Outfit'; letter-spacing: 1px; }
    .team-badge .team-sub { font-size: 0.7rem; color: #D4AF37; text-transform: uppercase; }
    .vs-circle { background: #D4AF37; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 1.3rem; box-shadow: 0 0 10px rgba(212,175,55,0.6); }
    .match-info { background: rgba(0,0,0,0.5); border-radius: 50px; padding: 12px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
    .match-info-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; }
    .match-info-item i { color: #D4AF37; font-size: 1rem; }
    .rivales-scroll { margin-top: 18px; overflow-x: auto; white-space: nowrap; padding-bottom: 8px; scrollbar-width: thin; }
    .rivales-scroll::-webkit-scrollbar { height: 4px; }
    .rivales-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .rivales-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    .rival-chip { display: inline-block; background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.3); border-radius: 40px; padding: 6px 18px; margin-right: 12px; font-size: 0.8rem; font-weight: 600; color: #f5e6a3; backdrop-filter: blur(4px); transition: 0.2s; }
    .rival-chip.active { background: #D4AF37; color: #000; border-color: #D4AF37; box-shadow: 0 0 8px #D4AF37; }
    .avatar-icon-box { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #D4AF37; background: radial-gradient(circle, #1a2a4a 0%, #0a1428 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: #D4AF37; font-size: 2.2rem; }
    .id-card-jersey-wrap { perspective: 900px; height: 180px; }
    .jersey-card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: rotateCard 12s linear infinite; }
    @keyframes rotateCard { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    .face-front, .face-back { position: absolute; width: 100%; height: 100%; border-radius: 20px; backface-visibility: hidden; background: linear-gradient(145deg, #0a1428, #000814); border: 2px solid rgba(212,175,55,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .face-back { transform: rotateY(180deg); }
    .jersey-number { font-size: 4.5rem; font-family: 'Outfit'; font-weight: 900; line-height: 1; color: #D4AF37; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .stat-card { background: rgba(0,0,0,.35); border-radius: 16px; padding: 10px 5px; text-align: center; }
    .performance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
    .progress-circle { position: relative; width: 85px; height: 85px; margin: auto; }
    .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .average-box { background: rgba(212,175,55,.08); border: 1px solid rgba(212,175,55,.2); border-radius: 15px; padding: 15px; text-align: center; margin-top: 15px; }
    .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
    .btn-logout { background: rgba(231,76,60,.12); color: #e74c3c; border: 1px solid rgba(231,76,60,.2); width: 100%; border-radius: 14px; padding: 14px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .soccer-loading-container { text-align: center; margin-top: 140px; }
    .soccer-spinner { font-size: 3.5rem; color: #D4AF37; display: inline-block; animation: spinSoccer 1.2s linear infinite; }
    @keyframes spinSoccer { 100% { transform: rotate(360deg); } }
    .error-message { text-align: center; padding: 60px 20px; color: #e74c3c; }
    .terms-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3,5,10,0.97); backdrop-filter: blur(20px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .terms-box { background: linear-gradient(145deg, #091022, #040812); border: 2px solid #D4AF37; border-radius: 24px; width: 100%; max-width: 430px; padding: 24px; box-shadow: 0 0 35px rgba(212,175,55,0.25); max-height: 92vh; overflow-y: auto; }
    .terms-announcement { background: linear-gradient(135deg, rgba(212,175,55,0.04) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(212,175,55,0.25); border-left: 5px solid #D4AF37; padding: 18px; border-radius: 14px; font-size: 0.88rem; line-height: 1.6; margin-bottom: 22px; white-space: pre-line; }
    .terms-option-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .terms-option-card.selected { border-color: #D4AF37; background: rgba(212,175,55,0.08); }
    .btn-modal-send { background: linear-gradient(90deg, #D4AF37 0%, #F3E5AB 100%); color: #000; margin-top: 18px; font-weight: 800; border: none; padding: 14px; border-radius: 40px; width: 100%; }
</style>
</head>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {

const PROXIMO_PARTIDO = {
    rival: "FRANCO CANADIENSE",
    icono: "🍁",
    fecha: "2026-06-13",
    fechaLegible: "SÁBADO 13 DE JUNIO, 2026",

    lugar: "CANCHA 1 - LIGA SANTA RITA",
    valorVocalia: 2.5

let jugadorSesion = null;
try {

} catch(e) { console.warn(e); }
if (!jugadorSesion || !jugadorSesion.cedula) {
    window.location.href = 'login.html';
}
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';
const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');
console.log("✅ Jugador autenticado:", cedula, nombreCompleto);

// ========== FUNCIONES DEL PERFIL (iguales que antes) ==========
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function calcularEdad(fechaNacimiento) { /* ... */ return edad; }
function generarEstrellas(nota) { /* ... */ return html; }
function renderProgressCircle(valor, color) { /* ... */ return html; }

async function mostrarPerfil() {
    console.log("📱 Mostrando perfil");
    document.body.className = '';
    document.body.style.background = '';
    const container = document.getElementById('dynamicContent');
    container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div>Cargando perfil...</div></div></div></div>`;
    try {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.success && data.jugador) {
            const j = data.jugador;
            const s = {
                primerNombre: escapeHtml(j['primer nombre'] || ''),
                apellidos: escapeHtml(j['apellidos'] || ''),
                fechaNacimiento: j['fecha de nacimiento'] || '',
                nombreCamiseta: escapeHtml(j['nombre en camiseta'] || 'NÁPOLES'),
                dorsal: escapeHtml(j['número de dorsal'] || '00'),
                tallaUni: escapeHtml(j['talla uni.'] || 'M'),
                partidosJugados: Number(j['partidos jugados']) || 0,
                goles: Number(j['goles']) || 0,
                amarillas: Number(j['amarillas']) || 0,
                rojas: Number(j['rojas']) || 0,
                puntualidad: parseFloat(j['puntualidad']) || 0,
                companerismo: parseFloat(j['compañerismo']) || 0,
                respeto: parseFloat(j['respeto']) || 0,
                humildad: parseFloat(j['humildad']) || 0,
                deudaVocalia: Number(j['deuda vocalia']) || 0,
                inscripEstado: escapeHtml(j['inscrip_estado'] || 'PENDIENTE'),
                unifEstado: escapeHtml(j['unif_estado'] || 'PENDIENTE'),
                mediasEstado: escapeHtml(j['medias_estado'] || 'PENDIENTE')
            };
            let edad = calcularEdad(s.fechaNacimiento);
            let suma = s.puntualidad + s.companerismo + s.respeto + s.humildad;
            let promedio = suma > 0 ? parseFloat((suma / 4).toFixed(1)) : 0;
            let deudaInscripcion = s.inscripEstado.toUpperCase().includes('PENDIENTE') ? 5 : 0;
            let deudaUniforme = s.unifEstado.toUpperCase().includes('PENDIENTE') ? 17 : 0;
            let deudaMedias = s.mediasEstado.toUpperCase().includes('PENDIENTE') ? 2 : 0;
            let totalAdmin = deudaInscripcion + deudaUniforme + deudaMedias + s.deudaVocalia;
            const listaRivales = ["IDEAL", "BARZA", "SAN MARTIN", "INDEPENDIENTE", "VODKILA", "CHELSEA", "JUVENTUD DE AMERICA", "JUVENTUS", "LEONES", "FRANCO CANADIENSE"];
            const chipsRivales = listaRivales.map(rival => `<span class="rival-chip">${rival}</span>`).join('');
            container.innerHTML = `... (el mismo HTML del perfil que ya tenías) ...`;
        } else {
            container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="error-message">${data.message || 'Jugador no encontrado'}</div></div></div>`;
        }
    } catch(e) {
        console.error(e);
        container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="error-message">❌ Error de conexión</div></div></div>`;
    }
}

function cerrarSesion() { if (confirm('¿Cerrar sesión?')) { localStorage.removeItem('jugador_actual'); window.location.href = 'login.html'; } }

// ==================== RULETA CORREGIDA (botón visible) ====================
function mostrarRuleta() {
    console.log("🎰 Mostrando ruleta para partido:", PROXIMO_PARTIDO);
    document.body.className = 'ruleta-mode';
    document.body.style.background = '#0a0c10';
    const container = document.getElementById('dynamicContent');
    container.innerHTML = `
        <main class="h-screen flex flex-col items-center justify-center pt-16 relative">
            <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-secondary/10 rounded-full blur-[120px]"></div>
            </div>
            <div class="text-center px-4 mb-12" id="intro-header">
                <h2 class="font-display-lg text-[32px] text-secondary tracking-widest mb-2 uppercase" style="color:#e9c349;">Sorteo de Rivales</h2>
                <p class="font-label-caps text-on-surface-variant text-[10px] tracking-[0.3em] uppercase" style="color:#ccc;">Buscando el próximo desafío...</p>
            </div>
            <div class="relative w-full overflow-hidden py-12 flex items-center" id="roulette-window">
                <div class="absolute left-1/2 top-0 -translate-x-1/2 z-20 flex flex-col items-center h-full justify-between py-4">
                    <div class="w-1 h-8 bg-secondary/80 rounded-full blur-[2px]"></div>
                    <div class="w-1 h-8 bg-secondary/80 rounded-full blur-[2px]"></div>
                </div>
                <div class="roulette-track px-[50vw]" id="roulette-track"></div>
            </div>
            <div class="hidden absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/90 backdrop-blur-md" id="reveal-screen">
                <div class="reveal-element text-center mb-8">
                    <p class="font-label-caps text-secondary tracking-[0.4em] mb-4" style="color:#e9c349;">PRÓXIMO ENCUENTRO</p>
                    <div class="flex items-center justify-center gap-6 md:gap-12">
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-white/30"><span class="text-5xl">⚜️</span></div>
                            <span class="font-display-lg text-xl tracking-wider text-white">NÁPOLES</span>
                        </div>
                        <div class="font-display-lg text-5xl text-secondary cinematic-text italic" style="color:#e9c349;">VS</div>
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-secondary winner-glow"><span class="text-5xl">${PROXIMO_PARTIDO.icono}</span></div>
                            <span class="font-display-lg text-xl tracking-wider text-white">${PROXIMO_PARTIDO.rival}</span>
                        </div>
                    </div>
                </div>
                <div class="reveal-element match-info-card w-full max-w-md mx-4">
                    <div class="flex justify-center gap-6 flex-wrap text-white">
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">event</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.fechaLegible}</span></div>
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">schedule</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.hora} HORAS</span></div>
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">stadium</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.lugar}</span></div>
                    </div>
                </div>
                <div class="reveal-element space-y-6 w-full max-w-xs px-6">
                    <div class="glass-card p-6 rounded-2xl border border-secondary/40">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-label-caps text-[10px] text-white uppercase">Nivel de Riesgo</span>
                            <span class="font-label-caps text-[10px] text-secondary">MÁXIMO</span>
                        </div>
                        <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden"><div class="bg-secondary h-full rounded-full" style="width: 95%;"></div></div>
                    </div>
                    <!-- Botón visible con estilos sólidos -->
                    <button id="confirmButton" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-4 rounded-lg text-sm uppercase transition-all shadow-lg">Ahí estaré puntual</button>
                </div>
            </div>
            <div class="fixed inset-0 pointer-events-none z-50" id="particles"></div>
        </main>
    `;

    const rivals = [
        { name: "LEONES", icon: "🦁", power: "ALTO" },
        { name: "IDEAL", icon: "⚡", power: "MEDIO" },
        { name: "BARZA", icon: "🔵🔴", power: "EXTREMO" },
        { name: "SAN MARTIN", icon: "🏰", power: "MEDIO" },
        { name: "INDEPENDIENTE", icon: "🔥", power: "ALTO" },
        { name: "VODKILA", icon: "🍺", power: "MEDIO" },
        { name: "CHELSEA", icon: "💙", power: "ALTO" },
        { name: "JUVENTUD DE AMERICA", icon: "🟡🔴", power: "EXTREMO" },
        { name: "JUVENTUS", icon: "⚪⚫", power: "ALTO" },
        { name: "FRANCO CANADIENSE", icon: "🍁", power: "EXTREMO" }
    ];
    const track = document.getElementById('roulette-track');
    const revealScreen = document.getElementById('reveal-screen');
    const revealElements = document.querySelectorAll('.reveal-element');
    const introHeader = document.getElementById('intro-header');
    const rouletteWindow = document.getElementById('roulette-window');

    function createCard(rival) {
        const div = document.createElement('div');
        div.className = 'flex-shrink-0 w-48 h-64 glass-card rounded-xl p-6 flex flex-col items-center justify-center border border-white/30';
        div.style.background = 'rgba(0,0,0,0.8)';
        div.style.backdropFilter = 'blur(8px)';
        div.innerHTML = `<div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-4 border border-white/20"><span class="text-5xl">${rival.icon}</span></div><h3 class="font-display-lg text-lg text-white">${rival.name}</h3><p class="font-label-caps text-[10px] text-gray-300 uppercase mt-1">Poder: ${rival.power}</p>`;
        return div;
    }
    for (let i = 0; i < 40; i++) track.appendChild(createCard(rivals[i % rivals.length]));

    setTimeout(() => {
        track.classList.add('spinning');
        setTimeout(() => {
            track.classList.remove('spinning');
            track.classList.add('slowing');
            setTimeout(() => {
                rouletteWindow.style.opacity = '0';
                introHeader.style.opacity = '0';
                setTimeout(() => {
                    revealScreen.classList.remove('hidden');
                    setTimeout(() => {
                        revealElements.forEach((el, idx) => setTimeout(() => el.classList.add('revealed'), idx * 300));
                        createParticles();
                        // Asegurar que el botón sea visible y funcione
                        const btn = document.getElementById('confirmButton');
                        if (btn) {
                            btn.disabled = false;
                            btn.addEventListener('click', guardarPartido);
                        }
                    }, 100);
                }, 800);
            }, 3000);
        }, 3000);
    }, 500);

    function createParticles() {
        const container = document.getElementById('particles');
        const colors = ['#e9c349', '#ffffff', '#af8d11'];
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = `${Math.random() * 4 + 2}px`;
            p.style.height = p.style.width;
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = '50%';
            p.style.top = '50%';
            p.style.borderRadius = '50%';
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            container.appendChild(p);
            p.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], { duration: Math.random() * 1500 + 1000, easing: 'cubic-bezier(0, .9, .57, 1)', fill: 'forwards' });
        }
    }
}

async function guardarPartido() {
    const btn = document.getElementById('confirmButton');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.innerText = 'GUARDANDO...';
    const params = new URLSearchParams({
        action: 'guardarPartido',
        cedula: cedula,
        categoria: categoria,
        nombre: nombreCompleto,
        rival: PROXIMO_PARTIDO.rival,
        fecha: PROXIMO_PARTIDO.fecha,
        hora: PROXIMO_PARTIDO.hora,
        lugar: PROXIMO_PARTIDO.lugar,
        amarillas: '0',
        rojas: '0',
        goles: '0',
        valor_vocalia: PROXIMO_PARTIDO.valorVocalia.toString(),
        estado: 'CONFIRMADO',
        vocalias_pendientes: '0',
        puntualidad: '10',
        companerismo: '10',
        respeto: '10',
        humildad: '10'
    });
    const url = `${CONFIG.URL_GAS}?${params.toString()}`;
    try {
        const response = await fetch(url);
        const result = await response.json();
        console.log("📝 Respuesta guardarPartido:", result);
        if (result.success) {
            alert("✅ Asistencia confirmada para el partido contra FRANCO CANADIENSE");
            mostrarPerfil();
        } else {
            alert("⚠️ Ya habías confirmado este partido. Redirigiendo a tu perfil.");
            mostrarPerfil();
        }
    } catch(error) {
        console.error(error);
        alert('❌ Error de conexión. Intenta de nuevo.');
        btn.disabled = false;
        btn.innerText = 'Ahí estaré puntual';
    }
}

async function verificarConfirmacionPrevia() {
    try {
        const url = `${CONFIG.URL_GAS}?action=verificarConfirmacionPartido&cedula=${encodeURIComponent(cedula)}&rival=${encodeURIComponent(PROXIMO_PARTIDO.rival)}&fecha=${PROXIMO_PARTIDO.fecha}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        console.log("🔍 Verificación confirmación previa:", data);
        return data.confirmed === true;
    } catch(e) {
        console.error("Error en verificación:", e);
        return false;
    }
}

// ==================== MODAL DE TÉRMINOS ====================
function selectRadio(num) {
    document.getElementById('opt'+num).checked = true;
    document.querySelectorAll('.terms-option-card').forEach(c => c.classList.remove('selected'));
    document.getElementById(`opt${num}`).parentElement.classList.add('selected');
    document.getElementById('btnFirmar').disabled = false;
}
async function enviarFirmaTerminos() {
    const opcion = document.querySelector('input[name="termOption"]:checked').value;
    const btn = document.getElementById('btnFirmar');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';
    try {
        const url = `${CONFIG.URL_GAS}?action=guardarTerminos&cedula=${cedula}&categoria=${categoria}&opcion=${opcion}`;
        const resp = await fetch(url);
        const r = await resp.json();
        if (r.success) {
            document.getElementById('modalTerms').style.display = 'none';
            const yaConfirmo = await verificarConfirmacionPrevia();
            if (yaConfirmo) mostrarPerfil();
            else mostrarRuleta();
        } else alert('Error: ' + r.message);
    } catch(e) { alert('Error de red'); }
    finally { btn.disabled = false; btn.innerHTML = 'CONFIRMAR ASISTENCIA'; }
}
async function verificarTerminos() {
    try {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.success && data.jugador) {
            if (!data.jugador.terminos_aceptados) {
                document.getElementById('modalTerms').style.display = 'flex';
                return false;
            }
            return true;
        }
        return false;
    } catch(e) { return false; }
}

// ==================== FLUJO PRINCIPAL ====================
(async function() {
    const terminosOk = await verificarTerminos();
    if (!terminosOk) return;
    const yaConfirmo = await verificarConfirmacionPrevia();
    console.log("¿Ya confirmó para Franco Canadiense?", yaConfirmo);
    if (yaConfirmo) mostrarPerfil();
    else mostrarRuleta();
})();
</script>
