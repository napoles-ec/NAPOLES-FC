<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nápoles F.C. - Sorteo de Rivales</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    /* ========== ESTILOS EXCLUSIVOS DE LA RULETA ========== */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-card { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(233, 195, 73, 0.6); color: white; }
    .premium-glow { box-shadow: 0 0 30px rgba(233, 195, 73, 0.4); }
    .roulette-track { display: flex; gap: 24px; width: fit-content; transform: translateX(0); }
    .spinning { animation: scroll-fast 0.2s linear infinite; filter: blur(4px); }
    @keyframes scroll-fast { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    .slowing { animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; filter: blur(0px); transition: filter 2s ease-out; }
    @keyframes scroll-slow { from { transform: translateX(0); } to { transform: translateX(-4000px); } }
    .winner-glow { animation: winner-pulse 2s infinite alternate; }
    @keyframes winner-pulse { 0% { box-shadow: 0 0 20px rgba(233, 195, 73, 0.3); border-color: rgba(233, 195, 73, 0.6); } 100% { box-shadow: 0 0 60px rgba(233, 195, 73, 0.8); border-color: #e9c349; transform: scale(1.05); } }
    .particle { position: absolute; pointer-events: none; z-index: 100; }
    .cinematic-text { text-shadow: 0 0 20px rgba(233, 195, 73, 0.6); }
    .reveal-element { opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .revealed { opacity: 1; transform: translateY(0); }
    body.ruleta-mode { background: #0a0c10; overflow: hidden; min-height: 100dvh; }
    .match-info-card { background: #1a1c22; border-radius: 40px; padding: 16px 20px; margin: 15px 0; border-left: 5px solid #e9c349; text-align: center; }

    /* ========== ESTILOS EXCLUSIVOS DEL PERFIL ========== */
    .perfil-root { background: radial-gradient(circle at top, #111a33 0%, #060912 100%); font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; padding: 15px; display: flex; justify-content: center; }
    .perfil-container { width: 100%; max-width: 460px; }
    .perfil-header h1 { font-family: 'Outfit', sans-serif; color: #D4AF37; font-size: 1.3rem; letter-spacing: 2px; text-align: center; margin-bottom: 20px; }
    
    /* Tarjetas igualadas */
    .cards-row {
        display: flex;
        gap: 12px;
        margin-bottom: 15px;
    }
    .card-identity, .card-jersey {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: linear-gradient(145deg, rgba(10,20,40,.85), rgba(5,10,20,.95));
        border-radius: 20px;
        border: 1px solid rgba(212,175,55,.25);
        padding: 15px;
        text-align: center;
        min-height: 220px;
        justify-content: center;
    }
    /* Efecto de brillo en la tarjeta de identidad */
    .card-identity {
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(212,175,55,0.3), inset 0 0 5px rgba(255,215,0,0.2);
        animation: glowPulse 2s infinite alternate;
    }
    @keyframes glowPulse {
        0% { box-shadow: 0 0 5px rgba(212,175,55,0.2), inset 0 0 2px rgba(255,215,0,0.1); }
        100% { box-shadow: 0 0 25px rgba(212,175,55,0.6), inset 0 0 10px rgba(255,215,0,0.3); }
    }
    /* Efecto neón en la tarjeta del partido */
    .match-card-gold {
        background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(0,0,0,0.8));
        border-left: 6px solid #FFD700;
        border-radius: 24px;
        padding: 18px 15px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255,215,0,0.5), inset 0 0 10px rgba(255,215,0,0.1);
        animation: neonPulse 1.5s infinite alternate;
    }
    @keyframes neonPulse {
        0% { box-shadow: 0 0 10px rgba(255,215,0,0.3), inset 0 0 5px rgba(255,215,0,0.05); }
        100% { box-shadow: 0 0 35px rgba(255,215,0,0.8), inset 0 0 15px rgba(255,215,0,0.2); }
    }
    /* Estilos del jersey */
    .id-card-jersey-wrap {
        perspective: 900px;
        height: 140px;
        margin-bottom: 8px;
    }
    .jersey-card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotateCard 12s linear infinite;
    }
    @keyframes rotateCard {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
    }
    .face-front, .face-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        backface-visibility: hidden;
        background: linear-gradient(145deg, #0a1428, #000814);
        border: 2px solid rgba(212,175,55,.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .face-back { transform: rotateY(180deg); }
    .jersey-number {
        font-size: 3.5rem;
        font-family: 'Outfit';
        font-weight: 900;
        line-height: 1;
        color: #D4AF37;
    }
    .jersey-name {
        font-size: 0.9rem;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .avatar-icon-box { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #D4AF37; background: radial-gradient(circle, #1a2a4a 0%, #0a1428 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; overflow: hidden; }
    .avatar-icon-box img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Chips de rivales en movimiento (trotando) */
    .rivales-scroll {
        overflow-x: hidden;
        white-space: nowrap;
        padding: 10px 0;
        position: relative;
    }
    .rivales-track {
        display: inline-flex;
        gap: 12px;
        animation: trotar 20s linear infinite;
    }
    .rivales-track:hover {
        animation-play-state: paused;
    }
    @keyframes trotar {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }
    .rival-chip {
        display: inline-block;
        background: rgba(212,175,55,0.12);
        border: 1px solid rgba(212,175,55,0.3);
        border-radius: 40px;
        padding: 6px 18px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #f5e6a3;
        backdrop-filter: blur(4px);
        transition: 0.2s;
    }
    .rival-chip.active { background: #D4AF37; color: #000; border-color: #D4AF37; box-shadow: 0 0 8px #D4AF37; }

    /* Resto de estilos sin cambios */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .stat-card { background: rgba(0,0,0,.35); border-radius: 16px; padding: 10px 5px; text-align: center; }
    .performance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
    .progress-circle { position: relative; width: 85px; height: 85px; margin: auto; }
    .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .average-box { background: rgba(212,175,55,.08); border: 1px solid rgba(212,175,55,.2); border-radius: 15px; padding: 15px; text-align: center; margin-top: 15px; }
    .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
    .btn-logout { background: rgba(231,76,60,.12); color: #e74c3c; border: 1px solid rgba(231,76,60,.2); width: 100%; border-radius: 14px; padding: 14px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .soccer-loading-container { text-align: center; margin-top: 140px; }
    .soccer-spinner { font-size: 3.5rem; color: #D4AF37; display: inline-block; animation: spinSoccer 1.2s linear infinite; }
    @keyframes spinSoccer { 100% { transform: rotate(360deg); } }
    .error-message { text-align: center; padding: 60px 20px; color: #e74c3c; }
    .terms-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3,5,10,0.97); backdrop-filter: blur(20px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .terms-box { background: linear-gradient(145deg, #091022, #040812); border: 2px solid #D4AF37; border-radius: 24px; width: 100%; max-width: 430px; padding: 24px; box-shadow: 0 0 35px rgba(212,175,55,0.25); max-height: 92vh; overflow-y: auto; }
    .terms-announcement { background: linear-gradient(135deg, rgba(212,175,55,0.04) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(212,175,55,0.25); border-left: 5px solid #D4AF37; padding: 18px; border-radius: 14px; font-size: 0.88rem; line-height: 1.6; margin-bottom: 22px; white-space: pre-line; }
    .terms-option-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .terms-option-card.selected { border-color: #D4AF37; background: rgba(212,175,55,0.08); }
    .btn-modal-send { background: linear-gradient(90deg, #D4AF37 0%, #F3E5AB 100%); color: #000; margin-top: 18px; font-weight: 800; border: none; padding: 14px; border-radius: 40px; width: 100%; }
</style>
</head>
<body id="appBody">
<div class="terms-backdrop" id="modalTerms">
    <div class="terms-box">
        <h2 style="text-align:center; color:#D4AF37;">GRAN INAUGURACIÓN</h2>
        <div class="terms-announcement">⚽ ATENCIÓN JUGADORES ⚽<br>📅 17 de mayo - 9:30 a.m.<br>✅ Seleccione opción de asistencia</div>
        <div class="terms-option-card" onclick="selectRadio(1)"><input type="radio" name="termOption" id="opt1" value="1"><label>1️⃣ Asistiré, ahí estaré puntual</label></div>
        <div class="terms-option-card" onclick="selectRadio(2)"><input type="radio" name="termOption" id="opt2" value="2"><label>2️⃣ Enviaré a mi representante</label></div>
        <button class="btn-modal-send" id="btnFirmar" disabled onclick="enviarFirmaTerminos()">CONFIRMAR ASISTENCIA</button>
    </div>
</div>
<div id="dynamicContent"></div>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {
    URL_GAS: "https://script.google.com/macros/s/AKfycbwjophe8wostDR9rNsMjGkIMP3WpE_IiUPJvorurqXs5OHgjAMyHHAlnmuDY4qwxRVh/exec"  // Reemplaza con tu URL
};

const PROXIMO_PARTIDO = {
    rival: "FRANCO CANADIENSE",
    icono: "🍁",
    fecha: "2026-06-13",
    fechaLegible: "SÁBADO 13 DE JUNIO, 2026",
    hora: "12:00",
    lugar: "CANCHA 1 - LIGA SANTA RITA",
    valorVocalia: 2.5
};

let jugadorSesion = null;
try {
    jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
} catch(e) { console.warn(e); }
if (!jugadorSesion || !jugadorSesion.cedula) {
    window.location.href = 'login.html';
}
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';
const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');
console.log("✅ Jugador autenticado:", cedula, nombreCompleto);

// ==================== FUNCIONES DEL PERFIL ====================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function calcularEdad(fechaNacimiento) {
    if (!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if (isNaN(fecha.getTime())) {
        let partes = fechaNacimiento.split(/[\/\-]/);
        if (partes.length === 3) fecha = new Date(partes[2], partes[1]-1, partes[0]);
    }
    if (isNaN(fecha.getTime())) return '--';
    let hoy = new Date();
    let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota) {
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0)) / 2;
    let html = '';
    for (let i = 1; i <= 5; i++) {
        if (puntuacion >= i) html += '<i class="fa-solid fa-star"></i>';
        else if (puntuacion >= i - 0.5) html += '<i class="fa-solid fa-star-half-stroke"></i>';
        else html += '<i class="fa-regular fa-star" style="opacity:0.2;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color) {
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius = 40, circum = 2 * Math.PI * radius;
    let dash = circum - ((value / 10) * circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40" stroke="rgba(255,255,255,.08)" stroke-width="8" fill="none"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-width="8" fill="none" stroke-dasharray="${circum}" stroke-dashoffset="${dash}" stroke-linecap="round"></circle></svg><div class="progress-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:900;">${value}</div></div>`;
}

async function mostrarPerfil() {
    console.log("📱 Mostrando perfil");
    document.body.className = '';
    document.body.style.background = '';
    const container = document.getElementById('dynamicContent');
    container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div>Cargando perfil...</div></div></div></div>`;
    try {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.success && data.jugador) {
            const j = data.jugador;
            const s = {
                primerNombre: escapeHtml(j['primer nombre'] || ''),
                apellidos: escapeHtml(j['apellidos'] || ''),
                fechaNacimiento: j['fecha de nacimiento'] || '',
                nombreCamiseta: escapeHtml(j['nombre en camiseta'] || 'NÁPOLES'),
                dorsal: escapeHtml(j['número de dorsal'] || '00'),
                tallaUni: escapeHtml(j['talla uni.'] || 'M'),
                partidosJugados: Number(j['partidos jugados']) || 0,
                goles: Number(j['goles']) || 0,
                amarillas: Number(j['amarillas']) || 0,
                rojas: Number(j['rojas']) || 0,
                puntualidad: parseFloat(j['puntualidad']) || 0,
                companerismo: parseFloat(j['compañerismo']) || 0,
                respeto: parseFloat(j['respeto']) || 0,
                humildad: parseFloat(j['humildad']) || 0,
                deudaVocalia: Number(j['deuda vocalia']) || 0,
                inscripEstado: escapeHtml(j['inscrip_estado'] || 'PENDIENTE'),
                unifEstado: escapeHtml(j['unif_estado'] || 'PENDIENTE'),
                mediasEstado: escapeHtml(j['medias_estado'] || 'PENDIENTE')
            };
            let edad = calcularEdad(s.fechaNacimiento);
            let suma = s.puntualidad + s.companerismo + s.respeto + s.humildad;
            let promedio = suma > 0 ? parseFloat((suma / 4).toFixed(1)) : 0;
            let deudaInscripcion = s.inscripEstado.toUpperCase().includes('PENDIENTE') ? 5 : 0;
            let deudaUniforme = s.unifEstado.toUpperCase().includes('PENDIENTE') ? 17 : 0;
            let deudaMedias = s.mediasEstado.toUpperCase().includes('PENDIENTE') ? 2 : 0;
            let totalAdmin = deudaInscripcion + deudaUniforme + deudaMedias + s.deudaVocalia;

            const listaRivales = ["IDEAL", "BARZA", "SAN MARTIN", "INDEPENDIENTE", "VODKILA", "CHELSEA", "JUVENTUD DE AMERICA", "JUVENTUS", "LEONES", "FRANCO CANADIENSE"];
            // Duplicamos la lista para que la animación de trotar sea continua
            const chipsRivales = [...listaRivales, ...listaRivales].map(rival => `<span class="rival-chip">${rival}</span>`).join('');

            container.innerHTML = `
            <div class="perfil-root">
                <div class="perfil-container">
                    <div class="perfil-header"><h1>⚜️ PANEL NÁPOLES ⚜️</h1><div style="font-size:0.75rem;color:#D4AF37; text-align:center;">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div></div>
                    
                    <div class="cards-row">
                        <!-- Tarjeta de identidad (con brillo) -->
                        <div class="card-identity">
                            <div class="avatar-icon-box">
                                <img src="./imagen/avatar/${cedula}.png" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <i class="fa-solid fa-user-ninja" style="display:none;"></i>
                            </div>
                            <div style="font-weight:900;">${s.primerNombre}<br>${s.apellidos}</div>
                            <div style="font-size:.65rem;"><i class="fa-solid fa-id-card"></i> ${cedula}</div>
                            <div style="margin-top:8px;background:rgba(212,175,55,.2);padding:4px 10px;border-radius:20px; display:inline-block;">${edad} años</div>
                        </div>
                        <!-- Tarjeta del jersey (sin talla) -->
                        <div class="card-jersey">
                            <div class="id-card-jersey-wrap">
                                <div class="jersey-card-inner">
                                    <div class="face-front">
                                        <div class="jersey-name">${s.nombreCamiseta}</div>
                                        <div class="jersey-number">${s.dorsal}</div>
                                    </div>
                                    <div class="face-back">
                                        <div class="jersey-name">NÁPOLES FC</div>
                                        <div class="jersey-number">${s.dorsal}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tarjeta del partido con efecto neón -->
                    <div class="glass-card-perfil" style="padding:15px; margin-bottom:15px;">
                        <div class="match-card-gold" style="margin-bottom:0;">
                            <div class="match-teams">
                                <div class="team-badge"><div class="team-name">⚜️ NÁPOLES F.C.</div><div class="team-sub">Local · Fuerza Azteca</div></div>
                                <div class="vs-circle">VS</div>
                                <div class="team-badge"><div class="team-name">🍁 FRANCO CANADIENSE</div><div class="team-sub">Visitante · Tradición</div></div>
                            </div>
                            <div class="match-info">
                                <div class="match-info-item"><i class="fa-regular fa-calendar-alt"></i> ${PROXIMO_PARTIDO.fechaLegible}</div>
                                <div class="match-info-item"><i class="fa-regular fa-clock"></i> ${PROXIMO_PARTIDO.hora} HORAS</div>
                                <div class="match-info-item"><i class="fa-solid fa-location-dot"></i> ${PROXIMO_PARTIDO.lugar}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Rivales con animación "trotando" -->
                    <div class="glass-card-perfil" style="padding:15px; margin-bottom:15px;">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px; color:#D4AF37;"><i class="fa-solid fa-people-group"></i> OTROS RIVALES DEL TORNEO</div>
                        <div class="rivales-scroll">
                            <div class="rivales-track">
                                ${chipsRivales}
                            </div>
                        </div>
                    </div>

                    <!-- Estadísticas y demás (sin cambios) -->
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-icon" style="color:#3498db"><i class="fa-solid fa-shirt"></i></div><div class="stat-value">${s.partidosJugados}</div><div class="stat-label">PARTIDOS</div></div>
                        <div class="stat-card"><div class="stat-icon" style="color:#2ecc71"><i class="fa-solid fa-futbol"></i></div><div class="stat-value">${s.goles}</div><div class="stat-label">GOLES</div></div>
                        <div class="stat-card"><div class="stat-icon" style="color:#f39c12"><i class="fa-solid fa-square"></i></div><div class="stat-value">${s.amarillas}</div><div class="stat-label">AMARILLAS</div></div>
                        <div class="stat-card"><div class="stat-icon" style="color:#e74c3c"><i class="fa-solid fa-square"></i></div><div class="stat-value">${s.rojas}</div><div class="stat-label">ROJAS</div></div>
                    </div>

                    <div class="glass-card-perfil" style="padding:15px; margin-bottom:15px;">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px; color:#D4AF37;"><i class="fa-solid fa-heart"></i> Rendimiento Humano</div>
                        <div class="performance-grid">
                            ${['puntualidad','companerismo','respeto','humildad'].map((m,i) => `<div class="metric-card" style="background:rgba(0,0,0,.35); border-radius:16px; padding:14px 10px; text-align:center;">${renderProgressCircle(s[m], ['#3498db','#2ecc71','#f39c12','#9b59b6'][i])}<div class="metric-title" style="margin-top:10px; font-size:.7rem;">${m.toUpperCase()}</div></div>`).join('')}
                        </div>
                        <div class="average-box"><div class="average-score" style="font-size:2.2rem;">${promedio}/10</div><div class="stars-container">${generarEstrellas(promedio)}</div></div>
                    </div>

                    <div class="glass-card-perfil" style="padding:15px; margin-bottom:15px;">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px; color:#D4AF37;"><i class="fa-solid fa-chart-line"></i> Estado Administrativo</div>
                        <div class="admin-grid">
                            ${deudaInscripcion ? `<div class="admin-card" style="background:rgba(0,0,0,.35); border-radius:16px; padding:12px; text-align:center;"><div class="admin-icon"><i class="fa-solid fa-file-signature"></i></div><div class="admin-value">$5</div><div class="admin-label">INSCRIPCIÓN</div><div class="admin-status pending" style="background:rgba(231,76,60,.15); color:#e74c3c;">PENDIENTE</div></div>` : ''}
                            ${deudaUniforme ? `<div class="admin-card" style="background:rgba(0,0,0,.35); border-radius:16px; padding:12px; text-align:center;"><div class="admin-icon"><i class="fa-solid fa-tshirt"></i></div><div class="admin-value">$17</div><div class="admin-label">UNIFORME</div><div class="admin-status warning" style="background:rgba(243,156,18,.15); color:#f39c12;">PENDIENTE</div></div>` : ''}
                            ${deudaMedias ? `<div class="admin-card" style="background:rgba(0,0,0,.35); border-radius:16px; padding:12px; text-align:center;"><div class="admin-icon"><i class="fa-solid fa-socks"></i></div><div class="admin-value">$2</div><div class="admin-label">MEDIAS</div><div class="admin-status info" style="background:rgba(52,152,219,.15); color:#3498db;">PENDIENTE</div></div>` : ''}
                            ${s.deudaVocalia > 0 ? `<div class="admin-card" style="background:rgba(0,0,0,.35); border-radius:16px; padding:12px; text-align:center;"><div class="admin-icon"><i class="fa-solid fa-money-bill-wave"></i></div><div class="admin-value">$${s.deudaVocalia.toFixed(2)}</div><div class="admin-label">VOCALÍA</div><div class="admin-status vocalia" style="background:rgba(155,89,182,.15); color:#9b59b6;">PENDIENTE</div></div>` : ''}
                        </div>
                        <div class="debt-box" style="margin-top:15px; background:rgba(0,0,0,.4); border-radius:14px; padding:12px;">
                            <div class="debt-header" style="display:flex; justify-content:space-between;"><span>VALORES PENDIENTES</span><span style="color:${totalAdmin > 0 ? '#e74c3c' : '#2ecc71'}">$${totalAdmin.toFixed(2)}</span></div>
                            <div class="progress-bar" style="width:100%; height:8px; border-radius:10px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:10px;"><div class="progress-fill-bar" style="height:100%; width:${Math.min(totalAdmin / 30 * 100, 100)}%; background:linear-gradient(90deg,#e74c3c,#f39c12);"></div></div>
                            <div class="debt-message" style="margin-top:10px; font-size:.7rem; padding:8px; border-radius:10px; text-align:center; background:${totalAdmin === 0 ? 'rgba(46,204,113,.1)' : 'rgba(231,76,60,.1)'};">${totalAdmin === 0 ? '✅ ¡Estás al día!' : '⚠️ Regulariza tus pagos'}</div>
                        </div>
                    </div>

                    <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN</button>
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="error-message">${data.message || 'Jugador no encontrado'}</div></div></div>`;
        }
    } catch(e) {
        console.error(e);
        container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="error-message">❌ Error de conexión</div></div></div>`;
    }
}

function cerrarSesion() {
    if (confirm('¿Cerrar sesión?')) {
        localStorage.removeItem('jugador_actual');
        window.location.href = 'login.html';
    }
}
