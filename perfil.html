<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#0F2E1F">
<title>Nápoles F.C. - Panel del Jugador</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    /* ================= TOKENS ================= */
    :root {
        --pitch-0: #071a11;
        --pitch-1: #0e2c1d;
        --chalk: #f4f2e9;
        --chalk-dim: #a9b6ac;
        --amber: #f2b705;
        --amber-dim: rgba(242,183,5,0.16);
        --navy: #101a2c;
        --navy-2: #172343;
        --red: #e6483d;
        --green-ok: #35c977;
        --blue-cup: #4fa8d8;
        --violet: #a78bfa;
        --coral: #ef8354;
        --radius-lg: 22px;
        --radius-md: 16px;
        --font-display: 'Anton', 'Inter', sans-serif;
        --font-body: 'Inter', sans-serif;
        --font-mono: 'Space Mono', monospace;
    }

    * { box-sizing: border-box; }

    .field-bg {
        background:
            repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 40px, transparent 40px, transparent 80px),
            radial-gradient(circle at top, var(--pitch-1) 0%, var(--pitch-0) 72%);
    }

    /* ========== SKELETON LOADER ========== */
    .skeleton-wrapper { min-height: 100vh; padding: 15px; display: flex; justify-content: center; font-family: var(--font-body); }
    .skeleton-container { width: 100%; max-width: 480px; }
    .skeleton-shimmer { background: linear-gradient(90deg, rgba(242,183,5,0.08) 0%, rgba(242,183,5,0.25) 50%, rgba(242,183,5,0.08) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(242,183,5,0.18); margin: 0 auto 12px; }
    .skeleton-line { height: 16px; border-radius: 20px; background: rgba(242,183,5,0.12); margin: 8px 0; }
    .skeleton-title { height: 32px; width: 70%; margin: 0 auto 10px; border-radius: 40px; }
    .skeleton-card { background: rgba(0,0,0,0.35); border-radius: var(--radius-lg); padding: 15px; margin-bottom: 15px; border: 1px solid rgba(242,183,5,0.18); }
    .skeleton-jersey { width: 100%; height: 200px; border-radius: var(--radius-lg); background: rgba(242,183,5,0.08); }
    .slogan-text { text-align: center; color: var(--amber); font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 3px; margin-top: 30px; font-weight: 700; text-transform: uppercase; animation: fadeSlogan 0.5s ease; }
    @keyframes fadeSlogan { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ========== RULETA ========== */
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .text-secondary { color: var(--amber); }
    .text-on-surface-variant { color: var(--chalk-dim); }
    .font-display-lg { font-family: var(--font-display); letter-spacing: 0.04em; }
    .font-label-caps { font-family: var(--font-mono); text-transform: uppercase; }
    .bg-signature-glow { background: var(--amber); opacity: 0.08; }
    .glass-card { background: rgba(4, 10, 8, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(242,183,5,0.5); color: var(--chalk); }
    .roulette-track { display: flex; gap: 24px; width: fit-content; transform: translateX(0); }
    .spinning { animation: scroll-fast 0.2s linear infinite; filter: blur(4px); }
    @keyframes scroll-fast { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    .slowing { animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; filter: blur(0px); transition: filter 2s ease-out; }
    @keyframes scroll-slow { from { transform: translateX(0); } to { transform: translateX(-4000px); } }
    .winner-glow { animation: winner-pulse 2.2s infinite alternate; }
    @keyframes winner-pulse { 0% { box-shadow: 0 0 16px rgba(242,183,5,0.25); border-color: rgba(242,183,5,0.5); } 100% { box-shadow: 0 0 42px rgba(242,183,5,0.7); border-color: var(--amber); transform: scale(1.04); } }
    .particle { position: absolute; pointer-events: none; z-index: 100; }
    .cinematic-text { text-shadow: 0 0 20px rgba(242,183,5,0.55); }
    .reveal-element { opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .revealed { opacity: 1; transform: translateY(0); }
    body.ruleta-mode { background: var(--pitch-0); overflow: hidden; min-height: 100dvh; }
    .match-info-card { background: var(--navy); border-radius: 30px; padding: 16px 20px; margin: 15px 0; border-left: 5px solid var(--amber); text-align: center; }

    /* ========== PERFIL ========== */
    .perfil-root { font-family: var(--font-body); color: var(--chalk); min-height: 100vh; padding: 15px 15px 90px 15px; display: flex; justify-content: center; }
    .perfil-container { width: 100%; max-width: 480px; }
    .perfil-header { text-align: center; margin-bottom: 6px; }
    .perfil-header h1 { font-family: var(--font-display); color: var(--amber); font-size: 1.9rem; letter-spacing: 3px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 400; }
    .perfil-header h1 img { height: 46px; }
    .categoria-tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--chalk-dim); text-align: center; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }

    .cards-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .card-identity {
        flex: 1.1;
        position: relative;
        background: var(--navy);
        border-radius: var(--radius-lg);
        border: 1px solid rgba(242,183,5,0.25);
        padding: 18px 12px 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 260px;
        overflow: hidden;
    }
    .card-identity::before {
        content: attr(data-dorsal);
        position: absolute;
        top: -18px; right: -10px;
        font-family: var(--font-display);
        font-size: 5.5rem;
        color: rgba(242,183,5,0.09);
        line-height: 1;
    }
    .avatar-icon-box { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--amber); background: radial-gradient(circle, #1a2438 0%, #0a1020 100%); margin: 0 auto 12px; overflow: hidden; position: relative; z-index: 1; }
    .id-name { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.5px; position: relative; z-index: 1; line-height: 1.25; }
    .id-cedula { font-family: var(--font-mono); font-size: 0.68rem; color: var(--chalk-dim); margin-top: 6px; position: relative; z-index: 1; }
    .id-edad { margin-top: 10px; background: var(--amber-dim); color: var(--amber); padding: 4px 12px; border-radius: 20px; display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; position: relative; z-index: 1; }

    .jersey-3d { flex: 1; perspective: 900px; height: 260px; display: flex; align-items: center; justify-content: center; }
    .jersey-rotating { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: rotateSmooth 14s infinite linear; }
    @keyframes rotateSmooth { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
    .jersey-front, .jersey-back { position: absolute; width: 100%; height: 100%; border-radius: var(--radius-lg); backface-visibility: hidden; background: linear-gradient(160deg, var(--navy-2), #0a1020); border: 2px solid rgba(242,183,5,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .jersey-back { transform: rotateY(180deg); }
    .jersey-number { font-size: 4rem; font-family: var(--font-display); font-weight: 400; color: var(--amber); }
    .jersey-name { font-size: 1.05rem; font-weight: 700; color: var(--chalk); letter-spacing: 1px; }

    /* Match ticket */
    .match-ticket { position: relative; background: var(--navy); border-radius: var(--radius-lg); padding: 18px 20px; margin: 16px 0; border: 1px solid rgba(242,183,5,0.22); }
    .match-ticket::before, .match-ticket::after { content: ''; position: absolute; top: 50%; width: 20px; height: 20px; background: var(--pitch-0); border-radius: 50%; transform: translateY(-50%); }
    .match-ticket::before { left: -10px; }
    .match-ticket::after { right: -10px; }
    .match-ticket.match-next { border-color: rgba(53,201,119,0.4); }
    .match-ticket.match-copa { border-color: rgba(79,168,216,0.4); }
    .ticket-divider { border-top: 2px dashed rgba(244,242,233,0.14); margin: 14px 0; }
    .match-teams { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .team-badge { text-align: center; flex: 1; }
    .team-name { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.5px; }
    .vs-circle { background: var(--amber); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--pitch-0); font-size: 1.1rem; font-family: var(--font-display); }
    .match-info { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.72rem; color: var(--chalk-dim); }
    .match-info-item i { color: var(--amber); margin-right: 4px; }
    .match-campeonato-tag { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; color: var(--chalk-dim); }

    .rivales-scroll { margin-top: 6px; overflow-x: hidden; white-space: nowrap; }
    .rivales-track { display: inline-flex; gap: 10px; animation: scrollRivales 25s linear infinite; }
    @keyframes scrollRivales { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .rival-chip { background: rgba(242,183,5,0.08); border: 1px solid rgba(242,183,5,0.25); border-radius: 40px; padding: 6px 16px; font-size: 0.72rem; font-family: var(--font-mono); color: var(--chalk-dim); }
    .campeonato-label { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px 0; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }

    .panel-card { background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-lg); padding: 16px 15px; margin-bottom: 15px; }
    .panel-title { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; color: var(--amber); font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.5px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 15px; }
    .stat-card { background: var(--navy); border-radius: var(--radius-md); padding: 12px 5px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
    .stat-icon { font-size: 1rem; margin-bottom: 6px; }
    .stat-value { font-family: var(--font-mono); font-weight: 700; font-size: 1.4rem; color: var(--chalk); }
    .stat-label { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 1px; color: var(--chalk-dim); text-transform: uppercase; margin-top: 2px; }

    .performance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
    @media (min-width: 640px) { .performance-grid { grid-template-columns: repeat(3, 1fr); } }
    .metric-card { background: rgba(0,0,0,.3); border-radius: var(--radius-md); padding: 14px 10px; text-align: center; }
    .metric-icon { font-size: 0.9rem; color: var(--chalk-dim); margin-bottom: 6px; }
    .metric-label { margin-top: 10px; font-size: 0.65rem; font-family: var(--font-mono); letter-spacing: 0.5px; color: var(--chalk-dim); text-transform: uppercase; }
    .progress-circle { position: relative; width: 82px; height: 82px; margin: auto; }
    .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 1.15rem; font-weight: 700; font-family: var(--font-mono); color: var(--chalk); }
    .average-box { background: var(--amber-dim); border: 1px solid rgba(242,183,5,0.2); border-radius: var(--radius-md); padding: 15px; text-align: center; }
    .average-score { font-size: 2rem; font-family: var(--font-display); color: var(--amber); }

    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .admin-item { background: rgba(0,0,0,.3); border-radius: var(--radius-md); padding: 12px; text-align: center; font-family: var(--font-body); }
    .admin-item i { font-size: 1.1rem; }
    .admin-amount { font-family: var(--font-mono); font-weight: 700; margin: 4px 0 2px; }
    .admin-label { font-size: 0.65rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--chalk-dim); }
    .admin-pill { border-radius: 20px; margin-top: 6px; padding: 3px; font-size: 0.62rem; font-weight: 600; }
    .debt-box { margin-top: 15px; background: rgba(0,0,0,.32); border-radius: var(--radius-md); padding: 14px; }
    .debt-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.85rem; }
    .progress-bar-track { width: 100%; height: 7px; border-radius: 10px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--amber)); }
    .debt-status { margin-top: 10px; font-size: 0.72rem; padding: 8px; border-radius: 10px; text-align: center; font-family: var(--font-mono); }

    .btn-pagar { background: var(--green-ok); color: #062012; border: none; border-radius: 40px; padding: 13px 16px; font-weight: 700; width: 100%; justify-content: center; display: flex; align-items: center; gap: 8px; font-family: var(--font-body); transition: transform 0.15s ease, background 0.15s ease; }
    .btn-pagar:hover { transform: translateY(-1px); background: #2fb567; }
    .btn-logout { background: rgba(230,72,61,.1); color: var(--red); border: 1px solid rgba(230,72,61,.25); width: 100%; border-radius: 14px; padding: 14px; cursor: pointer; margin-top: 10px; font-family: var(--font-body); font-weight: 600; }

    /* ========== NAV INFERIOR ========== */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(9, 15, 12, 0.96);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(242,183,5,0.2);
        display: flex; justify-content: space-around; align-items: center;
        padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
        z-index: 100;
    }
    .bottom-nav .nav-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 4px 12px; border-radius: 12px; color: #6f8177; transition: all 0.2s; cursor: pointer;
        text-decoration: none; font-size: 0.6rem; gap: 3px; min-width: 50px; border: none; background: transparent;
        font-family: var(--font-mono); font-weight: 600;
    }
    .bottom-nav .nav-item i { font-size: 1.2rem; }
    .bottom-nav .nav-item:hover { color: var(--amber); }
    .bottom-nav .nav-item:active { transform: scale(0.92); }
    .bottom-nav .nav-item.active { color: var(--amber); }
    .bottom-nav .nav-item .nav-label { font-size: 0.55rem; letter-spacing: 0.4px; text-transform: uppercase; }

    /* ========== MODALES ========== */
    .modal-backdrop { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(2,6,4,0.92); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .modal-box { background: var(--navy); border-radius: 28px; padding: 26px; max-width: 450px; width: 100%; border: 1px solid rgba(242,183,5,0.35); box-shadow: 0 25px 40px rgba(0,0,0,0.5); color: var(--chalk); font-family: var(--font-body); }
    .modal-box h3 { color: var(--amber); font-size: 1.4rem; margin-bottom: 18px; font-family: var(--font-display); font-weight: 400; letter-spacing: 0.5px; border-left: 4px solid var(--amber); padding-left: 14px; }
    .bank-info { margin: 18px 0; padding: 18px; background: rgba(0,0,0,0.3); border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.06); }
    .bank-info p { margin: 10px 0; font-size: 0.95rem; display: flex; align-items: center; gap: 12px; }
    .bank-info p strong { color: var(--amber); min-width: 120px; }
    .account-copy-container { display: flex; align-items: center; justify-content: space-between; background: var(--pitch-0); border-radius: 60px; padding: 8px 16px; margin: 12px 0; border: 1px solid var(--amber); }
    .bank-account { font-family: var(--font-mono); font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; color: var(--amber); background: transparent; padding: 0; user-select: all; }
    .btn-copy { background: var(--amber); border: none; border-radius: 40px; padding: 8px 18px; color: var(--pitch-0); font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
    .btn-copy:hover { transform: scale(1.02); }
    .flex-buttons { display: flex; gap: 15px; justify-content: flex-end; margin-top: 22px; }
    .btn-modal { background: var(--amber); color: var(--pitch-0); border: none; padding: 12px 24px; border-radius: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: var(--font-body); }
    .btn-modal:hover { transform: scale(1.02); }
    .btn-modal-secondary { background: rgba(255,255,255,0.06); color: var(--chalk); padding: 12px 24px; border-radius: 40px; border: none; cursor: pointer; font-family: var(--font-body); }
    .copy-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--navy); border: 1px solid var(--amber); border-radius: 40px; padding: 10px 24px; color: var(--amber); font-weight: 600; font-size: 0.85rem; z-index: 2000; font-family: var(--font-mono); animation: toastFade 2.5s ease forwards; pointer-events: none; }
    @keyframes toastFade { 0% { opacity: 0; transform: translateX(-50%) translateY(20px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 85% { opacity: 1; transform: translateX(-50%) translateY(0); } 100% { opacity: 0; transform: translateX(-50%) translateY(20px); } }
    .notification-banner { background: var(--amber-dim); border-left: 4px solid var(--amber); border-radius: 14px; padding: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .close-notification { background: none; border: none; color: var(--amber); cursor: pointer; font-size: 1.2rem; }

    textarea#reportText { font-family: var(--font-body); }

    @media (max-width: 480px) {
        .bottom-nav .nav-item i { font-size: 1.05rem; }
        .bottom-nav .nav-item .nav-label { font-size: 0.45rem; }
        .bottom-nav .nav-item { min-width: 40px; padding: 2px 8px; }
    }
</style>
</head>

            </div>

                <div class="skeleton-line skeleton-shimmer" style="width: 50%; margin-bottom: 15px;"></div>

                    <div class="skeleton-line skeleton-shimmer" style="height: 80px; border-radius: 16px;"></div>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {
    URL_GAS: "https://script.google.com/macros/s/AKfycbywS6IouNegXuhs-hSNjEm18tE4IyJusY5o-P8diXxxkMiU7UESmsWYcpbxmrc9KgtY/exec"  // CAMBIA POR TU URL
};

const RIVALES_COPA = ['UNION FAMILIAR']; // Solo para inferir campeonato si el backend no lo envía

let PROXIMO_PARTIDO = null;
let jugadorSesion = null;
try { jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual')); } catch(e) { console.warn(e); }
if (!jugadorSesion || !jugadorSesion.cedula) window.location.href = 'login.html';
const cedula = jugadorSesion.cedula;
const categoria = jugadorSesion.categoria || 'hombres';
const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');
const dorsal = jugadorSesion.dorsal || '0';

let jugadorData = null;
let refreshInterval = null;
let sloganInterval = null;

const slogans = [
    "⚽ Afila los botines...", "🏆 La gloria está cerca", "🔥 Sentimos la presión del partido", 
    "💪 Corazón de campeón", "🎯 Preparando la táctica", "✨ Magia napolitana", 
    "🦁 A rugir en la cancha", "⚡ Cargando la pasión del fútbol", "🥅 El gol está por llegar"
];

// ==================== FUNCIONES DE FORMATO ====================
function formatearFecha(fechaStr) {
    if (!fechaStr) return 'FECHA NO DISPONIBLE';
    try {
        const partes = fechaStr.split('-');
        if (partes.length !== 3) return fechaStr;
        const fecha = new Date(partes[0], partes[1]-1, partes[2]);
        if (isNaN(fecha.getTime())) return fechaStr;
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return fecha.toLocaleDateString('es-ES', opciones).toUpperCase();
    } catch(e) {
        return fechaStr;
    }
}

function formatearHora(hora) {
    if (!hora) return '12:00';
    let h = String(hora).trim();
    if (h.indexOf(':') !== -1) {
        const partes = h.split(':');
        if (partes.length >= 2) {
            return partes[0].padStart(2, '0') + ':' + partes[1].padStart(2, '0');
        }
    } else {
        const num = parseInt(h);
        if (!isNaN(num)) {
            return String(num).padStart(2, '0') + ':00';
        }
    }
    return '12:00';
}

// ==================== FUNCIONES DE CARGA ====================
function iniciarSlogan() {
    const sloganDiv = document.getElementById('sloganBox');
    if (!sloganDiv) return;
    let index = 0;
    const cambiarSlogan = () => {
        sloganDiv.style.animation = 'none';
        setTimeout(() => {
            sloganDiv.textContent = slogans[index % slogans.length];
            sloganDiv.style.animation = 'fadeSlogan 0.5s ease';
            index++;
        }, 10);
    };
    cambiarSlogan();
    sloganInterval = setInterval(cambiarSlogan, 2500);
}

function ocultarSkeleton() {
    if (sloganInterval) clearInterval(sloganInterval);
    const skeleton = document.getElementById('skeletonLoader');
    if (skeleton) {
        skeleton.style.transition = 'opacity 0.5s ease';
        skeleton.style.opacity = '0';
        setTimeout(() => { skeleton.style.display = 'none'; }, 500);
    }
}

// ==================== FUNCIONES MODAL BANCARIO ====================
function abrirBankModal() { document.getElementById('bankModal').style.display = 'flex'; }
function cerrarBankModal() { document.getElementById('bankModal').style.display = 'none'; }
function mostrarToast(mensaje) {
    const toastAnterior = document.querySelector('.copy-toast');
    if (toastAnterior) toastAnterior.remove();
    const toast = document.createElement('div');
    toast.className = 'copy-toast';
    toast.innerHTML = `<i class="fa-regular fa-circle-check"></i> ${mensaje}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
function copiarCuenta() {
    const numero = "2209100265";
    navigator.clipboard.writeText(numero).then(() => {
        mostrarToast('📋 Número de cuenta copiado: 2209100265');
    }).catch(() => {
        mostrarToast('❌ No se pudo copiar, intente manualmente');
    });
}

// ==================== CACHÉ, NOTIFICACIONES, ETC. ====================
function guardarCache(perfil, notificacion) {
    const cache = { timestamp: Date.now(), perfil, notificacion };
    localStorage.setItem('perfilCache_' + cedula, JSON.stringify(cache));
}
function obtenerCache() {
    const cached = localStorage.getItem('perfilCache_' + cedula);
    if (!cached) return null;
    const data = JSON.parse(cached);
    if (Date.now() - data.timestamp < 5 * 60 * 1000) return data;
    return null;
}
function mostrarNotificacion(notificacion) {
    const container = document.querySelector('.perfil-container');
    if (!container) return;
    const existing = document.querySelector('.notification-banner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-bell" style="color:var(--amber);"></i><span>${notificacion.titulo || 'Nueva notificación'}: ${notificacion.mensaje || ''}</span></div><button class="close-notification" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
    container.insertBefore(banner, container.firstChild);
}
function descargarPDF() {
    if (!jugadorData) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text(`Ficha de Jugador - ${jugadorData.primerNombre} ${jugadorData.apellidos}`, 20, 20);
    doc.setFontSize(12);
    doc.text(`Cédula: ${cedula}`, 20, 40);
    doc.text(`Dorsal: ${jugadorData.dorsal}`, 20, 50);
    doc.text(`Goles totales: ${jugadorData.goles}`, 20, 60);
    doc.text(`Partidos jugados: ${jugadorData.partidosJugados}`, 20, 70);
    doc.text(`Rendimiento: Puntualidad ${jugadorData.puntualidad}, Compañerismo ${jugadorData.companerismo}, Respeto ${jugadorData.respeto}, Humildad ${jugadorData.humildad}`, 20, 90);
    doc.save(`perfil_${cedula}.pdf`);
}
function compartirPerfil() {
    const url = window.location.href;
    if (navigator.share) navigator.share({ title: `Perfil de ${jugadorData.primerNombre}`, text: `Mira mis estadísticas`, url: url });
    else { navigator.clipboard.writeText(url); alert('Enlace copiado'); }
}
function abrirReporte() { document.getElementById('reportModal').style.display = 'flex'; }
function cerrarReporte() { document.getElementById('reportModal').style.display = 'none'; }
function enviarReporte() {
    const texto = document.getElementById('reportText').value.trim();
    if (!texto) { alert('Escribe una descripción'); return; }
    alert('Reporte enviado al administrador. Gracias.');

    document.getElementById('reportText').value = '';
}
function irAlineacion() { window.location.href = 'alineacion.html'; }
function irHistorialValores() { window.location.href = 'h_valores.html'; }
function irHistorialPartidos() { window.location.href = 'h_partidos.html'; }

// ==================== ACTUALIZAR DATOS ====================
async function actualizarPerfil() {
    const btn = document.getElementById('btnActualizar');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span class="nav-label">Actualizando...</span>';
    }
    try {
        localStorage.removeItem('perfilCache_' + cedula);
        await mostrarPerfil(true);
        mostrarToast('✅ Datos actualizados correctamente');
    } catch(e) {
        mostrarToast('❌ Error al actualizar');
        console.error(e);
    }
    if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rotate"></i> <span class="nav-label">Actualizar</span>';
    }
}

// ==================== OBTENER PRÓXIMO PARTIDO ====================
async function cargarProximoPartido() {
    try {
        const resp = await fetch(`${CONFIG.URL_GAS}?action=getProximoPartido&t=${Date.now()}`);
        const data = await resp.json();
        if (data.success && data.partido) {
            const partido = data.partido;
            partido.fechaLegible = formatearFecha(partido.fecha);
            partido.hora = formatearHora(partido.hora);
            if (!partido.campeonato) {
                partido.campeonato = RIVALES_COPA.includes(partido.rival) ? 'COPA SANTA RITA' : 'CAMPEONATO SANTA RITA';
            }
            PROXIMO_PARTIDO = partido;
            return true;
        } else {
            PROXIMO_PARTIDO = null;
            return false;
        }
    } catch(e) {
        PROXIMO_PARTIDO = null;
        return false;
    }
}

// ==================== OBTENER RIVALES CON CAMPEONATO (sin "SIN CAMPEONATO") ====================
async function obtenerRivalesConCampeonato() {
    try {
        const resp = await fetch(`${CONFIG.URL_GAS}?action=getRivales&t=${Date.now()}`);
        const data = await resp.json();
        if (data.success && data.data) {
            return data.data.map(r => {
                const camp = (r.campeonato || '').trim();
                if (!camp || camp === 'SIN CAMPEONATO') {
                    return { ...r, campeonato: 'CAMPEONATO SANTA RITA' };
                }
                return r;
            });
        } else {
            return [];
        }
    } catch(e) {
        console.error("Error cargando rivales:", e);
        return [];
    }
}

async function obtenerPartidosFinalizados() {
    try {
        const resp = await fetch(`${CONFIG.URL_GAS}?action=getPartidos&t=${Date.now()}`);
        const data = await resp.json();
        if (data.success && data.data) {
            return data.data
                .filter(p => p.estado && p.estado.toUpperCase() === 'FINALIZADO')
                .map(p => p.rival);
        } else {
            return [];
        }
    } catch(e) {
        return [];
    }
}

// ==================== RENDER PERFIL ====================
async function mostrarPerfil(forceRefresh = false) {
    document.body.className = 'field-bg';
    if (refreshInterval) clearInterval(refreshInterval);
    
    refreshInterval = setInterval(() => {
        if (document.body.className !== 'ruleta-mode') actualizarDatosEnSegundoPlano();
    }, 10 * 60 * 1000);

    const container = document.getElementById('dynamicContent');
    container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container" style="text-align:center; margin-top:140px;"><div class="soccer-spinner" style="font-size:3.5rem; color:var(--amber); animation: spinSoccer 1.2s linear infinite;"><i class="fa-solid fa-futbol"></i></div><div style="margin-top:12px; font-family:var(--font-mono); color:var(--chalk-dim);">Cargando perfil...</div></div></div></div>`;
    
    let cache = forceRefresh ? null : obtenerCache();
    let perfil, notificacion;
    if (cache) {
        perfil = cache.perfil;
        notificacion = cache.notificacion;
    } else {
        const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        console.log("🔍 DATOS DE DEPURACIÓN:", data.debug);
        if (!data.success || !data.jugador) throw new Error(data.error);
        perfil = data.jugador;
        const notiRes = await fetch(`${CONFIG.URL_GAS}?action=getNotificacionActiva&t=${Date.now()}`);
        const notiData = await notiRes.json();
        notificacion = notiData.success ? notiData.notificacion : null;
        guardarCache(perfil, notificacion);
    }
    jugadorData = perfil;

    // ====== OBTENER RIVALES Y FINALIZADOS PARA CARRUSELES ======
    const [todosRivales, finalizados] = await Promise.all([
        obtenerRivalesConCampeonato(),
        obtenerPartidosFinalizados()
    ]);

    const activos = todosRivales.filter(r => !finalizados.includes(r.nombre));
    const grupos = {};
    activos.forEach(r => {
        const camp = r.campeonato || 'CAMPEONATO SANTA RITA';
        if (!grupos[camp]) grupos[camp] = [];
        grupos[camp].push(r.nombre);
    });

    const carruselHTML = Object.keys(grupos).filter(camp => grupos[camp].length > 0).map(camp => {
        const esCopa = camp.toUpperCase().includes('COPA');
        const color = esCopa ? 'var(--blue-cup)' : 'var(--amber)';
        const icono = esCopa ? 'fa-crown' : 'fa-trophy';
        const chips = grupos[camp].map(r => `<span class="rival-chip">${r}</span>`).join('');
        const chipsDuplicados = [chips, chips].join('');
        return `
            <div class="campeonato-label" style="color:${color}; border-bottom-color:${color}33;">
                <i class="fa-solid ${icono}"></i> ${camp}
            </div>
            <div class="rivales-scroll">
                <div class="rivales-track">${chipsDuplicados}</div>
            </div>
        `;
    }).join('');

    if (PROXIMO_PARTIDO && !PROXIMO_PARTIDO.campeonato) {
        const encontrado = todosRivales.find(r => r.nombre === PROXIMO_PARTIDO.rival);
        if (encontrado) {
            PROXIMO_PARTIDO.campeonato = encontrado.campeonato;
        } else {
            PROXIMO_PARTIDO.campeonato = 'CAMPEONATO SANTA RITA';
        }
    }

    const s = {
        primerNombre: escapeHtml(perfil['primer nombre'] || ''),
        apellidos: escapeHtml(perfil['apellidos'] || ''),
        fechaNacimiento: perfil['fecha de nacimiento'] || '',
        nombreCamiseta: escapeHtml(perfil['nombre en camiseta'] || 'NÁPOLES'),
        dorsal: escapeHtml(perfil['número de dorsal'] || '00'),
        partidosJugados: Number(perfil["partidos jugados"]) || 0,
        goles: Number(perfil.goles) || 0,
        amarillas: Number(perfil.amarillas) || 0,
        rojas: Number(perfil.rojas) || 0,
        puntualidad: parseFloat(perfil.puntualidad) || 0,
        companerismo: parseFloat(perfil.compañerismo) || 0,
        respeto: parseFloat(perfil.respeto) || 0,
        humildad: parseFloat(perfil.humildad) || 0,
        deudaTotal: Number(perfil["deuda total"]) || 0,
        detalleDeudas: perfil["detalle deudas"] || [],
        inscripEstado: escapeHtml(perfil.inscrip_estado || 'PENDIENTE'),
        unifEstado: escapeHtml(perfil.unif_estado || 'PENDIENTE'),
        mediasEstado: escapeHtml(perfil.medias_estado || 'PENDIENTE')
    };

    let edad = calcularEdad(s.fechaNacimiento);
    let suma = s.puntualidad + s.companerismo + s.respeto + s.humildad;
    let promedio = suma > 0 ? parseFloat((suma / 4).toFixed(1)) : 0;
    let deudaInscripcion = s.inscripEstado.toUpperCase().includes('PENDIENTE') ? 5 : 0;
    let deudaUniforme = s.unifEstado.toUpperCase().includes('PENDIENTE') ? 17 : 0;
    let deudaMedias = s.mediasEstado.toUpperCase().includes('PENDIENTE') ? 2 : 0;
    let totalAdmin = deudaInscripcion + deudaUniforme + deudaMedias + s.deudaTotal;

    // Compromiso: 100% si ha jugado partidos, 0 si no
    let compromiso = s.partidosJugados > 0 ? 100 : 0;

    // ====== Tarjeta de deudas ======
    let deudasHTML = '';
    if (s.detalleDeudas && s.detalleDeudas.length > 0) {
        let items = s.detalleDeudas.map(d => 
            `<div style="display:flex; justify-content:space-between; font-size:0.72rem; font-family:var(--font-mono); border-bottom:1px solid rgba(255,255,255,0.05); padding:4px 0;">
                <span>${escapeHtml(d.concepto)}</span>
                <span>$${Number(d.saldo).toFixed(2)}</span>
                <span style="color:${d.estado === 'PAGADO' ? 'var(--green-ok)' : 'var(--amber)'}; font-size:0.6rem;">${d.estado}</span>
            </div>`
        ).join('');
        deudasHTML = `
            <div class="admin-item" style="grid-column: span 2;">
                <div><i class="fa-solid fa-file-invoice"></i></div>
                <div class="admin-amount">$${s.deudaTotal.toFixed(2)}</div>
                <div class="admin-label">Valores pendientes</div>
                <div class="admin-pill" style="background:rgba(167,139,250,.15); color:var(--violet);">${s.detalleDeudas.length} concepto(s)</div>
                <div style="margin-top:8px; background:rgba(0,0,0,0.3); border-radius:12px; padding:8px; text-align:left; font-size:0.7rem; color:var(--chalk-dim);">
                    <div style="font-weight:bold; margin-bottom:4px; font-family:var(--font-mono);">Detalle:</div>
                    ${items}
                </div>
            </div>
        `;
    } else {
        deudasHTML = `
            <div class="admin-item" style="grid-column: span 2;">
                <div><i class="fa-solid fa-check-circle" style="color:var(--green-ok);"></i></div>
                <div class="admin-amount" style="color:var(--green-ok);">Al día</div>
                <div class="admin-label">Valores pendientes</div>
                <div class="admin-pill" style="background:rgba(53,201,119,.15); color:var(--green-ok);">PAGADO</div>
            </div>

    }

    // ====== Partido próximo ======
    let partidoHTML = '';
    if (PROXIMO_PARTIDO) {
        const rival = PROXIMO_PARTIDO.rival || 'RIVAL';
        const icono = PROXIMO_PARTIDO.icono || '⚽';
        const fechaLegible = PROXIMO_PARTIDO.fechaLegible || 'FECHA NO DISPONIBLE';
        const hora = PROXIMO_PARTIDO.hora || '12:00';

        const esCopa = campeonato && campeonato.toUpperCase().includes('COPA');
        const matchClass = esCopa ? 'match-ticket match-copa' : 'match-ticket match-next';

        partidoHTML = `
            <div class="${matchClass}">
                <div class="match-teams">
                    <div class="team-badge"><div class="team-name">⚜️ NÁPOLES F.C.</div></div>
                    <div class="vs-circle">VS</div>
                    <div class="team-badge"><div class="team-name">${icono} ${rival}</div></div>
                </div>
                <div class="ticket-divider"></div>
                <div class="match-info">
                    <div class="match-info-item"><i class="fa-regular fa-calendar-alt"></i>${fechaLegible}</div>
                    <div class="match-info-item"><i class="fa-regular fa-clock"></i>${hora} HORAS</div>
                    <div class="match-info-item"><i class="fa-solid fa-location-dot"></i>${lugar}</div>
                </div>
                ${campeonato ? `<div class="match-campeonato-tag">${campeonato}</div>` : ''}
            </div>
        `;
    } else {
        partidoHTML = `
            <div class="match-ticket" style="border-color: rgba(242,183,5,0.3);">
                <div style="text-align:center; padding: 10px; color: var(--amber);">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 2rem;"></i>

        puntualidad: '<i class="fa-solid fa-clock"></i>', 
        companerismo: '<i class="fa-solid fa-handshake"></i>', 
        respeto: '<i class="fa-solid fa-hand-peace"></i>', 
        humildad: '<i class="fa-solid fa-dove"></i>',
        compromiso: '<i class="fa-solid fa-handshake"></i>' 
    };

    container.innerHTML = `

            <div class="categoria-tag">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div>

                <div class="card-identity" data-dorsal="${s.dorsal}">
                    <div class="avatar-icon-box"><img src="./imagen/avatar/${cedula}.png" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><i class="fa-solid fa-user-ninja" style="display:none;"></i></div>
                    <div class="id-name">${s.primerNombre}<br>${s.apellidos}</div>
                    <div class="id-cedula"><i class="fa-solid fa-id-card"></i> ${cedula}</div>
                    <div class="id-edad">${edad} años</div>
                </div>
                <div class="jersey-3d"><div class="jersey-rotating"><div class="jersey-front"><div class="jersey-name">${s.nombreCamiseta}</div><div class="jersey-number">${s.dorsal}</div></div><div class="jersey-back"><div class="jersey-name">NÁPOLES FC</div><div class="jersey-number">${s.dorsal}</div></div></div></div>
            </div>
            ${partidoHTML}

            <!-- OTROS RIVALES DEL TORNEO -->

                ${carruselHTML}

// ==================== FUNCIONES AUXILIARES ====================
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function calcularEdad(fechaNacimiento) {
    if (!fechaNacimiento) return '--';
    let fecha = new Date(fechaNacimiento);
    if (isNaN(fecha.getTime())) { let partes = fechaNacimiento.split(/[\/\-]/); if (partes.length === 3) fecha = new Date(partes[2], partes[1]-1, partes[0]); }
    if (isNaN(fecha.getTime())) return '--';
    let hoy = new Date(); let edad = hoy.getFullYear() - fecha.getFullYear();
    let mes = hoy.getMonth() - fecha.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
    return edad;
}
function generarEstrellas(nota) {
    let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0)) / 2;
    let html = '';
    for (let i = 1; i <= 5; i++) {
        if (puntuacion >= i) html += '<i class="fa-solid fa-star" style="color:var(--amber);"></i>';
        else if (puntuacion >= i - 0.5) html += '<i class="fa-solid fa-star-half-stroke" style="color:var(--amber);"></i>';
        else html += '<i class="fa-regular fa-star" style="opacity:0.3;"></i>';
    }
    return html;
}
function renderProgressCircle(valor, color) {
    let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
    let radius = 40, circum = 2 * Math.PI * radius;
    let dash = circum - ((value / 10) * circum);
    return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,.07)" stroke-width="8" fill="none"></circle><circle cx="50" cy="50" r="40" stroke="${color}" stroke-width="8" fill="none" stroke-dasharray="${circum}" stroke-dashoffset="${dash}" stroke-linecap="round"></circle></svg><div class="progress-text">${value}</div></div>`;
}
async function actualizarDatosEnSegundoPlano() {
    if (document.body.className === 'ruleta-mode') return;
    const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.success && data.jugador) { guardarCache(data.jugador, null); mostrarPerfil(); }
}
window.cerrarSesion = function() { if (confirm('¿Cerrar sesión?')) { localStorage.removeItem('jugador_actual'); window.location.href = 'login.html'; } };

// ==================== RULETA ====================
function mostrarRuleta() {
    if (!PROXIMO_PARTIDO) {

    }
    if (!PROXIMO_PARTIDO.campeonato) {

    }

    document.body.className = 'ruleta-mode';
    const container = document.getElementById('dynamicContent');
    container.innerHTML = `
        <main class="h-screen flex flex-col items-center justify-center pt-16 relative field-bg">
            <div class="absolute inset-0 overflow-hidden pointer-events-none"><div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-signature-glow rounded-full blur-[120px]"></div></div>

            <div class="relative w-full overflow-hidden py-12 flex items-center" id="roulette-window"><div class="absolute left-1/2 top-0 -translate-x-1/2 z-20 flex flex-col items-center h-full justify-between py-4"><div class="w-1 h-8 bg-signature-glow rounded-full blur-[2px]" style="opacity:1; background:var(--amber);"></div><div class="w-1 h-8 rounded-full blur-[2px]" style="background:var(--amber);"></div></div><div class="roulette-track px-[50vw]" id="roulette-track"></div></div>
            <div class="hidden absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/90 backdrop-blur-md" id="reveal-screen">
                <div class="reveal-element text-center mb-8">
                    <p class="font-label-caps text-secondary tracking-[0.4em] mb-4">PRÓXIMO ENCUENTRO</p>
                    <div class="flex items-center justify-center gap-6 md:gap-12">
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-white/30"><span class="text-5xl">⚜️</span></div>
                            <span class="font-display-lg text-xl tracking-wider text-white">NÁPOLES</span>
                        </div>
                        <div class="font-display-lg text-5xl text-secondary cinematic-text italic">VS</div>
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-secondary winner-glow" style="border-color:var(--amber);"><span class="text-5xl">${PROXIMO_PARTIDO.icono}</span></div>
                            <span class="font-display-lg text-xl tracking-wider text-white">${PROXIMO_PARTIDO.rival}</span>
                        </div>
                    </div>
                </div>
                <div class="reveal-element match-info-card w-full max-w-md mx-4">
                    <div class="flex justify-center gap-6 flex-wrap text-white">
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">event</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.fechaLegible}</span></div>
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">schedule</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.hora} HORAS</span></div>
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary">stadium</span><span class="text-sm font-bold">${PROXIMO_PARTIDO.lugar}</span></div>
                    </div>
                </div>
                <div class="reveal-element space-y-6 w-full max-w-xs px-6">
                    <div class="glass-card p-6 rounded-2xl" style="border:1px solid rgba(242,183,5,0.4);">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-label-caps text-[10px] text-white uppercase">Nivel de Riesgo</span>
                            <span class="font-label-caps text-[10px] text-secondary">MÁXIMO</span>
                        </div>
                        <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full rounded-full" style="width: 95%; background:var(--amber);"></div>
                        </div>
                    </div>
                    <button id="confirmButton" class="w-full font-bold py-4 rounded-lg text-sm uppercase transition-all shadow-lg" style="background:var(--amber); color:var(--pitch-0);">Ahí estaré puntual</button>
                </div>
            </div>
            <div class="fixed inset-0 pointer-events-none z-50" id="particles"></div>
        </main>`;
    const rivals = [
        { name: "LEONES", icon: "🦁", power: "ALTO" },
        { name: "IDEAL", icon: "⚡", power: "MEDIO" },
        { name: "BARZA", icon: "🔵🔴", power: "EXTREMO" },
        { name: "SAN MARTIN", icon: "🏰", power: "MEDIO" },
        { name: "INDEPENDIENTE", icon: "🔥", power: "ALTO" },
        { name: "VODKILA", icon: "🍺", power: "MEDIO" },
        { name: "CHELSEA", icon: "💙", power: "ALTO" },
        { name: "JUVENTUD DE AMERICA", icon: "🟡🔴", power: "EXTREMO" },
        { name: "JUVENTUS", icon: "⚪⚫", power: "ALTO" },
        { name: PROXIMO_PARTIDO.rival, icon: PROXIMO_PARTIDO.icono, power: "EXTREMO" }
    ];
    const track = document.getElementById('roulette-track');
    const revealScreen = document.getElementById('reveal-screen');
    const revealElements = document.querySelectorAll('.reveal-element');
    const introHeader = document.getElementById('intro-header');
    const rouletteWindow = document.getElementById('roulette-window');
    function createCard(rival) {
        const div = document.createElement('div');
        div.className = 'flex-shrink-0 w-48 h-64 glass-card rounded-xl p-6 flex flex-col items-center justify-center border border-white/30';
        div.innerHTML = `<div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-4 border border-white/20"><span class="text-5xl">${rival.icon}</span></div><h3 class="font-display-lg text-lg text-white">${rival.name}</h3><p class="font-label-caps text-[10px] text-gray-300 uppercase mt-1">Poder: ${rival.power}</p>`;
        return div;
    }
    for (let i = 0; i < 40; i++) track.appendChild(createCard(rivals[i % rivals.length]));
    setTimeout(() => {
        track.classList.add('spinning');
        setTimeout(() => {
            track.classList.remove('spinning');
            track.classList.add('slowing');
            setTimeout(() => {
                rouletteWindow.style.opacity = '0';
                introHeader.style.opacity = '0';
                setTimeout(() => {
                    revealScreen.classList.remove('hidden');
                    setTimeout(() => {
                        revealElements.forEach((el, idx) => setTimeout(() => el.classList.add('revealed'), idx * 300));
                        createParticles();
                        const btn = document.getElementById('confirmButton');
                        if (btn) { btn.disabled = false; btn.addEventListener('click', guardarPartido); }
                    }, 100);
                }, 800);
            }, 3000);
        }, 3000);
    }, 500);
    function createParticles() {
        const container = document.getElementById('particles');
        const colors = ['#f2b705', '#ffffff', '#a97e0a'];
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = `${Math.random() * 4 + 2}px`;
            p.style.height = p.style.width;
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = '50%';
            p.style.top = '50%';
            p.style.borderRadius = '50%';
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            container.appendChild(p);
            p.animate([{ transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }, { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }], { duration: Math.random() * 1500 + 1000, easing: 'cubic-bezier(0, .9, .57, 1)', fill: 'forwards' });
        }
    }
}

// ==================== GUARDAR PARTIDO (con dorsal) ====================
async function guardarPartido() {
    const btn = document.getElementById('confirmButton');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.innerText = 'GUARDANDO...';
    if (!PROXIMO_PARTIDO) {
        await cargarProximoPartido();
        if (!PROXIMO_PARTIDO) {
            alert('No hay partido próximo para confirmar.');
            btn.disabled = false;
            btn.innerText = 'Ahí estaré puntual';
            return;
        }
    }
    const params = new URLSearchParams({ 
        action: 'guardarPartido', 
        cedula, 
        categoria, 
        nombre: nombreCompleto, 
        dorsal: dorsal,
        rival: PROXIMO_PARTIDO.rival, 
        fecha: PROXIMO_PARTIDO.fecha, 
        hora: PROXIMO_PARTIDO.hora, 
        lugar: PROXIMO_PARTIDO.lugar, 
        amarillas: '0', 
        rojas: '0', 
        goles: '0', 
        valor_vocalia: PROXIMO_PARTIDO.valorVocalia.toString(), 
        estado: 'CONFIRMADO', 
        vocalias_pendientes: '0', 
        puntualidad: '10', 
        companerismo: '10', 
        respeto: '10', 
        humildad: '10' 
    });
    try {
        const response = await fetch(`${CONFIG.URL_GAS}?${params.toString()}`);
        const result = await response.json();
        if (result.success) { 
            alert(`✅ Asistencia confirmada para el partido contra ${PROXIMO_PARTIDO.rival}`); 
            mostrarPerfil(); 
        } else { 
            alert(`⚠️ Ya habías confirmado este partido. Redirigiendo a tu perfil.`); 
            mostrarPerfil(); 
        }
    } catch(error) { 
        alert('❌ Error de conexión. Intenta de nuevo.'); 
        if (btn) { btn.disabled = false; btn.innerText = 'Ahí estaré puntual'; } 
    }
}

async function verificarConfirmacionPrevia() {
    try {
        if (!PROXIMO_PARTIDO) {
            await cargarProximoPartido();
        }
        if (!PROXIMO_PARTIDO) return false;
        const url = `${CONFIG.URL_GAS}?action=verificarConfirmacionPartido&cedula=${encodeURIComponent(cedula)}&rival=${encodeURIComponent(PROXIMO_PARTIDO.rival)}&fecha=${PROXIMO_PARTIDO.fecha}&t=${Date.now()}`;
        const resp = await fetch(url);
        const data = await resp.json();
        return data.confirmed === true;
    } catch(e) { return false; }
}

// ==================== INICIALIZACIÓN ====================
(async function() {
    iniciarSlogan();
    await cargarProximoPartido();
    if (!PROXIMO_PARTIDO) {
        ocultarSkeleton();
        await mostrarPerfil();
        return;
    }
    const yaConfirmo = await verificarConfirmacionPrevia();
    ocultarSkeleton();
    if (yaConfirmo) {
        await mostrarPerfil();
    } else {
        mostrarRuleta();
    }
})();
</script>
