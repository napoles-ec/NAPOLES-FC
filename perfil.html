<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nápoles F.C. - Sorteo de Rivales</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(17, 20, 21, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(233, 195, 73, 0.2);
        }
        .premium-glow {
            box-shadow: 0 0 30px rgba(233, 195, 73, 0.2);
        }
        
        /* Roulette Animation Styles */
        .roulette-track {
            display: flex;
            gap: 24px;
            width: fit-content;
            transform: translateX(0);
        }
        
        .spinning {
            animation: scroll-fast 0.2s linear infinite;
            filter: blur(4px);
        }
        
        @keyframes scroll-fast {
            from { transform: translateX(0); }
            to { transform: translateX(-1000px); }
        }

        .slowing {
            animation: scroll-slow 3s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
            filter: blur(0px);
            transition: filter 2s ease-out;
        }

        @keyframes scroll-slow {
            from { transform: translateX(0); }
            to { transform: translateX(-4000px); }
        }

        /* Final Reveal Animations */
        .winner-glow {
            animation: winner-pulse 2s infinite alternate;
        }

        @keyframes winner-pulse {
            0% { box-shadow: 0 0 20px rgba(233, 195, 73, 0.2); border-color: rgba(233, 195, 73, 0.4); }
            100% { box-shadow: 0 0 60px rgba(233, 195, 73, 0.6); border-color: #e9c349; transform: scale(1.05); }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 100;
        }

        .cinematic-text {
            text-shadow: 0 0 20px rgba(233, 195, 73, 0.5);
        }

        .reveal-element {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .revealed {
            opacity: 1;
            transform: translateY(0);
        }

        body {
            min-height: max(884px, 100dvh);
            overflow: hidden;
            background-color: #111415;
        }

        /* Estilos del perfil (para cuando se muestre después) */
        .profile-container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 20px 0;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-header h1 {
            font-family: 'Outfit', sans-serif;
            color: #e9c349;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }
        .cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .id-card-identity {
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-icon-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #e9c349;
            background: radial-gradient(circle, #1a2a4a 0%, #0a1428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: #e9c349;
            font-size: 2.2rem;
        }
        .id-card-jersey-wrap {
            perspective: 900px;
            height: 180px;
        }
        .jersey-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCard 12s linear infinite;
        }
        @keyframes rotateCard {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        .face-front, .face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backface-visibility: hidden;
            background: linear-gradient(145deg, #0a1428, #000814);
            border: 2px solid rgba(233, 195, 73, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .face-back { transform: rotateY(180deg); }
        .jersey-name {
            font-size: 0.7rem;
            color: #f5e6a3;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        .jersey-number {
            font-size: 4.5rem;
            font-family: 'Outfit';
            font-weight: 900;
            line-height: 1;
            color: #e9c349;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: rgba(0,0,0,0.35);
            border-radius: 16px;
            padding: 10px 5px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-family: 'Outfit';
            font-weight: 900;
        }
        .progress-circle {
            position: relative;
            width: 85px;
            height: 85px;
            margin: auto;
        }
        .progress-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .btn-logout {
            background: rgba(231,76,60,0.12);
            color: #e74c3c;
            border: 1px solid rgba(231,76,60,0.2);
            width: 100%;
            border-radius: 14px;
            padding: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }
        .soccer-loading-container {
            text-align: center;
            margin-top: 140px;
        }
        .soccer-spinner {
            font-size: 3.5rem;
            color: #e9c349;
            display: inline-block;
            animation: spinSoccer 1.2s linear infinite;
        }
        @keyframes spinSoccer { 100% { transform: rotate(360deg); } }
        .error-message { text-align: center; padding: 60px 20px; color: #e74c3c; }
        .hidden { display: none; }
        .metric-card { text-align: center; }
        .metric-title { margin-top: 10px; font-size: 0.7rem; font-weight: 700; }
        .average-box { background: rgba(233,195,73,0.08); border-radius: 15px; padding: 15px; text-align: center; margin-top: 15px; }
        .average-score { font-size: 2rem; font-weight: 900; }
        .admin-card { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px; text-align: center; }
        .admin-value { font-size: 1.2rem; font-weight: 900; }
        .admin-label { font-size: 0.65rem; color: #9ca3af; margin-top: 5px; }
        .debt-box { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px; margin-top: 15px; }
        .debt-header { display: flex; justify-content: space-between; align-items: center; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill-bar { height: 100%; background: linear-gradient(90deg, #e74c3c, #f39c12); }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md">

<!-- Contenedor principal donde se mostrará la ruleta o el perfil -->
<div id="mainContainer" class="flex flex-col items-center justify-center min-h-screen pt-16"></div>

<script>
    // ==================== CONFIGURACIÓN ====================
    const CONFIG = {
        URL_GAS: "https://script.google.com/macros/s/AKfycbytEmBoAG_N8APbuYMM4F4miBS8ugYmRFbER41WgGb9n8__z4QmOFor612a5DI_zhr2/exec"
    };

    // Obtener sesión del jugador desde localStorage (login previo)
    let jugadorSesion = null;
    try {
        jugadorSesion = JSON.parse(localStorage.getItem('jugador_actual'));
    } catch(e) { console.warn(e); }
    if (!jugadorSesion || !jugadorSesion.cedula) {
        window.location.href = 'login.html';
    }

    const cedula = jugadorSesion.cedula;
    const categoria = jugadorSesion.categoria || 'hombres';
    const nombreCompleto = (jugadorSesion.primerNombre || '') + ' ' + (jugadorSesion.apellidos || '');

    // Lista de rivales para la ruleta
    const rivals = [
        { name: "LEONES", icon: "🦁", power: "ALTO" },
        { name: "TITANES", icon: "⚔️", power: "MEDIO" },
        { name: "LOBOS", icon: "🐺", power: "ALTO" },
        { name: "RAYO", icon: "⚡", power: "EXTREMO" },
        { name: "HALCONES", icon: "🦅", power: "MEDIO" },
        { name: "PIRATAS", icon: "🏴‍☠️", power: "ALTO" },
        { name: "DRAGONES", icon: "🐉", power: "EXTREMO" }
    ];

    // ==================== FUNCIONES DEL PERFIL ====================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function calcularEdad(fechaNacimiento) {
        if (!fechaNacimiento) return '--';
        let fecha = new Date(fechaNacimiento);
        if (isNaN(fecha.getTime())) {
            let partes = fechaNacimiento.split(/[\/\-]/);
            if (partes.length === 3) fecha = new Date(partes[2], partes[1]-1, partes[0]);
        }
        if (isNaN(fecha.getTime())) return '--';
        let hoy = new Date();
        let edad = hoy.getFullYear() - fecha.getFullYear();
        let mes = hoy.getMonth() - fecha.getMonth();
        if (mes < 0 || (mes === 0 && hoy.getDate() < fecha.getDate())) edad--;
        return edad;
    }
    function generarEstrellas(nota) {
        let puntuacion = Math.min(10, Math.max(0, parseFloat(nota) || 0)) / 2;
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (puntuacion >= i) html += '<i class="fa-solid fa-star"></i>';
            else if (puntuacion >= i - 0.5) html += '<i class="fa-solid fa-star-half-stroke"></i>';
            else html += '<i class="fa-regular fa-star" style="opacity:0.2;"></i>';
        }
        return html;
    }
    function renderProgressCircle(valor, color) {
        let value = Math.min(10, Math.max(0, parseFloat(valor) || 0));
        let radius = 40, circum = 2 * Math.PI * radius;
        let dash = circum - ((value / 10) * circum);
        return `<div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="none"></circle><circle class="progress-fill" cx="50" cy="50" r="40" stroke="${color}" stroke-width="8" fill="none" stroke-dasharray="${circum}" stroke-dashoffset="${dash}" stroke-linecap="round"></circle></svg><div class="progress-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:900;">${value}</div></div>`;
    }

    async function mostrarPerfil() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = `<div class="soccer-loading-container"><div class="soccer-spinner"><i class="fa-solid fa-futbol"></i></div><div class="soccer-loading-text">Cargando perfil...</div></div>`;
        try {
            const url = `${CONFIG.URL_GAS}?action=getPerfil&cedula=${encodeURIComponent(cedula)}&categoria=${encodeURIComponent(categoria)}&t=${Date.now()}`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.success && data.jugador) {
                const j = data.jugador;
                const s = {
                    primerNombre: escapeHtml(j['primer nombre'] || ''),
                    apellidos: escapeHtml(j['apellidos'] || ''),
                    fechaNacimiento: j['fecha de nacimiento'] || '',
                    nombreCamiseta: escapeHtml(j['nombre en camiseta'] || 'NÁPOLES'),
                    dorsal: escapeHtml(j['número de dorsal'] || '00'),
                    tallaUni: escapeHtml(j['talla uni.'] || 'M'),
                    partidosJugados: Number(j['partidos jugados']) || 0,
                    goles: Number(j['goles']) || 0,
                    amarillas: Number(j['amarillas']) || 0,
                    rojas: Number(j['rojas']) || 0,
                    puntualidad: parseFloat(j['puntualidad']) || 0,
                    companerismo: parseFloat(j['compañerismo']) || 0,
                    respeto: parseFloat(j['respeto']) || 0,
                    humildad: parseFloat(j['humildad']) || 0,
                    deudaVocalia: Number(j['deuda vocalia']) || 0,
                    inscripEstado: escapeHtml(j['inscrip_estado'] || 'PENDIENTE'),
                    unifEstado: escapeHtml(j['unif_estado'] || 'PENDIENTE'),
                    mediasEstado: escapeHtml(j['medias_estado'] || 'PENDIENTE')
                };
                let edad = calcularEdad(s.fechaNacimiento);
                let suma = s.puntualidad + s.companerismo + s.respeto + s.humildad;
                let promedio = suma > 0 ? parseFloat((suma / 4).toFixed(1)) : 0;
                let deudaInscripcion = s.inscripEstado.toUpperCase().includes('PENDIENTE') ? 5 : 0;
                let deudaUniforme = s.unifEstado.toUpperCase().includes('PENDIENTE') ? 17 : 0;
                let deudaMedias = s.mediasEstado.toUpperCase().includes('PENDIENTE') ? 2 : 0;
                let totalAdmin = deudaInscripcion + deudaUniforme + deudaMedias + s.deudaVocalia;

                container.innerHTML = `
                    <div class="profile-container">
                        <div class="profile-header"><h1>⚜️ PANEL NÁPOLES ⚜️</h1><div style="font-size:0.75rem;color:#e9c349;">Categoría: ${categoria === 'mujeres' ? 'Femenina ♀' : 'Masculina ♂'}</div></div>
                        <div class="cards-row">
                            <div class="glass-card id-card-identity"><div class="avatar-icon-box"><i class="fa-solid fa-user-ninja"></i></div><div style="font-weight:900;">${s.primerNombre}<br>${s.apellidos}</div><div style="font-size:.65rem;"><i class="fa-solid fa-id-card"></i> ${cedula}</div><div style="margin-top:8px;background:rgba(212,175,55,.2);padding:4px 10px;border-radius:20px;">${edad} años</div></div>
                            <div class="id-card-jersey-wrap"><div class="jersey-card-inner"><div class="face-front"><div class="jersey-name">${s.nombreCamiseta}</div><div class="jersey-number">${s.dorsal}</div><div>Talla ${s.tallaUni}</div></div><div class="face-back"><div class="jersey-name">NÁPOLES FC</div><div class="jersey-number">${s.dorsal}</div></div></div></div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card"><div class="stat-icon" style="color:#3498db"><i class="fa-solid fa-shirt"></i></div><div class="stat-value">${s.partidosJugados}</div><div class="stat-label">PARTIDOS</div></div>
                            <div class="stat-card"><div class="stat-icon" style="color:#2ecc71"><i class="fa-solid fa-futbol"></i></div><div class="stat-value">${s.goles}</div><div class="stat-label">GOLES</div></div>
                            <div class="stat-card"><div class="stat-icon" style="color:#f39c12"><i class="fa-solid fa-square"></i></div><div class="stat-value">${s.amarillas}</div><div class="stat-label">AMARILLAS</div></div>
                            <div class="stat-card"><div class="stat-icon" style="color:#e74c3c"><i class="fa-solid fa-square"></i></div><div class="stat-value">${s.rojas}</div><div class="stat-label">ROJAS</div></div>
                        </div>
                        <div class="glass-card p-4 mb-4">
                            <div class="section-title" style="color:#e9c349; margin-bottom:15px;"><i class="fa-solid fa-heart"></i> Rendimiento Humano</div>
                            <div class="grid grid-cols-2 gap-4">
                                ${['puntualidad','companerismo','respeto','humildad'].map((m,i) => `<div class="metric-card">${renderProgressCircle(s[m], ['#3498db','#2ecc71','#f39c12','#9b59b6'][i])}<div class="metric-title">${m.toUpperCase()}</div></div>`).join('')}
                            </div>
                            <div class="average-box">
                                <div class="average-score">${promedio}/10</div>
                                <div class="stars-container">${generarEstrellas(promedio)}</div>
                            </div>
                        </div>
                        <div class="glass-card p-4 mb-4">
                            <div class="section-title" style="color:#e9c349;"><i class="fa-solid fa-chart-line"></i> Estado Administrativo</div>
                            <div class="grid grid-cols-2 gap-4 mt-4">
                                ${deudaInscripcion ? `<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-file-signature"></i></div><div class="admin-value">$5</div><div class="admin-label">INSCRIPCIÓN</div><div class="admin-status pending" style="background:rgba(231,76,60,.15); color:#e74c3c;">PENDIENTE</div></div>` : ''}
                                ${deudaUniforme ? `<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-tshirt"></i></div><div class="admin-value">$17</div><div class="admin-label">UNIFORME</div><div class="admin-status warning" style="background:rgba(243,156,18,.15); color:#f39c12;">PENDIENTE</div></div>` : ''}
                                ${deudaMedias ? `<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-socks"></i></div><div class="admin-value">$2</div><div class="admin-label">MEDIAS</div><div class="admin-status info" style="background:rgba(52,152,219,.15); color:#3498db;">PENDIENTE</div></div>` : ''}
                                ${s.deudaVocalia > 0 ? `<div class="admin-card"><div class="admin-icon"><i class="fa-solid fa-money-bill-wave"></i></div><div class="admin-value">$${s.deudaVocalia.toFixed(2)}</div><div class="admin-label">VOCALÍA</div><div class="admin-status vocalia" style="background:rgba(155,89,182,.15); color:#9b59b6;">PENDIENTE</div></div>` : ''}
                            </div>
                            <div class="debt-box">
                                <div class="debt-header"><span>VALORES PENDIENTES</span><span style="color:${totalAdmin > 0 ? '#e74c3c' : '#2ecc71'}">$${totalAdmin.toFixed(2)}</span></div>
                                <div class="progress-bar"><div class="progress-fill-bar" style="width:${Math.min(totalAdmin / 30 * 100, 100)}%;"></div></div>
                                <div class="debt-message mt-2 text-center text-sm">${totalAdmin === 0 ? '✅ ¡Estás al día!' : '⚠️ Regulariza tus pagos'}</div>
                            </div>
                        </div>
                        <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN</button>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="error-message">${data.message || 'Jugador no encontrado'}</div>`;
            }
        } catch (e) {
            container.innerHTML = `<div class="error-message">❌ Error de conexión</div>`;
        }
    }

    function cerrarSesion() {
        if (confirm('¿Cerrar sesión?')) {
            localStorage.removeItem('jugador_actual');
            window.location.href = 'login.html';
        }
    }

    // ==================== RULETA HORIZONTAL ====================
    function mostrarRuleta() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = `
            <div class="text-center px-4 mb-12" id="intro-header">
                <h2 class="font-display-lg text-[32px] text-secondary tracking-widest mb-2 uppercase">Sorteo de Rivales</h2>
                <p class="font-label-caps text-on-surface-variant text-[10px] tracking-[0.3em] uppercase">Buscando el próximo desafío...</p>
            </div>
            <div class="relative w-full overflow-hidden py-12 flex items-center" id="roulette-window">
                <div class="absolute left-1/2 top-0 -translate-x-1/2 z-20 flex flex-col items-center h-full justify-between py-4">
                    <div class="w-1 h-8 bg-secondary/50 rounded-full blur-[2px]"></div>
                    <div class="w-1 h-8 bg-secondary/50 rounded-full blur-[2px]"></div>
                </div>
                <div class="roulette-track px-[50vw]" id="roulette-track"></div>
            </div>
            <div class="hidden absolute inset-0 flex flex-col items-center justify-center z-40 bg-surface/90 backdrop-blur-md" id="reveal-screen">
                <div class="reveal-element text-center mb-8">
                    <p class="font-label-caps text-secondary tracking-[0.4em] mb-4">PRÓXIMO ENCUENTRO</p>
                    <div class="flex items-center justify-center gap-6 md:gap-12">
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-white/20">
                                <span class="text-5xl">⚜️</span>
                            </div>
                            <span class="font-display-lg text-xl tracking-wider">NÁPOLES</span>
                        </div>
                        <div class="font-display-lg text-5xl text-secondary cinematic-text italic">VS</div>
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-24 h-24 glass-card rounded-full flex items-center justify-center border-2 border-secondary winner-glow">
                                <span class="text-5xl">🦁</span>
                            </div>
                            <span class="font-display-lg text-xl tracking-wider">LEONES</span>
                        </div>
                    </div>
                </div>
                <div class="reveal-element space-y-6 w-full max-w-xs px-6">
                    <div class="glass-card p-6 rounded-2xl border border-secondary/30">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-label-caps text-[10px] text-on-surface-variant uppercase">Nivel de Riesgo</span>
                            <span class="font-label-caps text-[10px] text-secondary">MÁXIMO</span>
                        </div>
                        <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-secondary h-full rounded-full" style="width: 95%;"></div>
                        </div>
                    </div>
                    <button id="confirmButton" class="w-full bg-secondary text-on-secondary py-4 rounded-lg font-display-lg tracking-widest text-sm premium-glow uppercase">Confirmar Desafío</button>
                </div>
            </div>
            <div class="fixed inset-0 pointer-events-none z-50" id="particles"></div>
        `;

        const track = document.getElementById('roulette-track');
        const revealScreen = document.getElementById('reveal-screen');
        const revealElements = document.querySelectorAll('.reveal-element');
        const introHeader = document.getElementById('intro-header');
        const rouletteWindow = document.getElementById('roulette-window');

        function createCard(rival) {
            const div = document.createElement('div');
            div.className = 'flex-shrink-0 w-48 h-64 glass-card rounded-xl p-6 flex flex-col items-center justify-center border border-white/10';
            div.innerHTML = `
                <div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center mb-4 border border-white/5">
                    <span class="text-5xl">${rival.icon}</span>
                </div>
                <h3 class="font-display-lg text-lg text-on-surface">${rival.name}</h3>
                <p class="font-label-caps text-[10px] text-on-surface-variant uppercase mt-1">Poder: ${rival.power}</p>
            `;
            return div;
        }

        for (let i = 0; i < 40; i++) {
            track.appendChild(createCard(rivals[i % rivals.length]));
        }

        setTimeout(() => {
            track.classList.add('spinning');
            setTimeout(() => {
                track.classList.remove('spinning');
                track.classList.add('slowing');
                setTimeout(() => {
                    rouletteWindow.style.opacity = '0';
                    rouletteWindow.style.transition = 'opacity 1s';
                    introHeader.style.opacity = '0';
                    introHeader.style.transition = 'opacity 1s';
                    setTimeout(() => {
                        revealScreen.classList.remove('hidden');
                        setTimeout(() => {
                            revealElements.forEach((el, index) => {
                                setTimeout(() => el.classList.add('revealed'), index * 300);
                            });
                            createParticles();
                        }, 100);
                    }, 800);
                }, 3000);
            }, 3000);
        }, 500);

        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 60;
            const colors = ['#e9c349', '#ffffff', '#af8d11'];
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                const size = Math.random() * 4 + 2;
                p.className = 'particle';
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.borderRadius = '50%';
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 300 + 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                container.appendChild(p);
                p.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 1500 + 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    fill: 'forwards'
                });
            }
        }

        document.getElementById('confirmButton').addEventListener('click', guardarPartido);
    }

    async function guardarPartido() {
        const btn = document.getElementById('confirmButton');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        btn.innerText = 'GUARDANDO...';
        
        // Valores por defecto: puntualidad, compañerismo, respeto, humildad = 10
        const params = new URLSearchParams({
            action: 'guardarPartido',
            cedula: cedula,
            categoria: categoria,
            nombre: nombreCompleto,
            rival: 'LEONES',
            fecha: '2026-07-06',
            hora: '12:00',
            lugar: 'CANCHA 1 - LIGA SANTA RITA',
            amarillas: '0',
            rojas: '0',
            goles: '0',
            valor_vocalia: '0',
            estado: 'CONFIRMADO',
            vocalias_pendientes: '0',
            puntualidad: '10',
            companerismo: '10',
            respeto: '10',
            humildad: '10'
        });
        const url = `${CONFIG.URL_GAS}?${params.toString()}`;
        try {
            const response = await fetch(url);
            const result = await response.json();
            if (result.success) {
                mostrarPerfil();
            } else {
                alert('⚠️ ' + (result.message || 'Ya confirmaste anteriormente. Cargando perfil...'));
                mostrarPerfil();
            }
        } catch(error) {
            alert('Error de conexión. Intenta de nuevo.');
            btn.disabled = false;
            btn.innerText = 'Confirmar Desafío';
        }
    }

    // ==================== VERIFICAR SI YA CONFIRMÓ EL PARTIDO ====================
    async function verificarConfirmacionPrevia() {
        try {
            const url = `${CONFIG.URL_GAS}?action=verificarConfirmacionPartido&cedula=${encodeURIComponent(cedula)}`;
            const resp = await fetch(url);
            const data = await resp.json();
            return data.confirmed === true;
        } catch(e) {
            console.error(e);
            return false;
        }
    }

    // ==================== FLUJO PRINCIPAL ====================
    (async function() {
        const yaConfirmo = await verificarConfirmacionPrevia();
        if (yaConfirmo) {
            mostrarPerfil();
        } else {
            mostrarRuleta();
        }
    })();
</script>
