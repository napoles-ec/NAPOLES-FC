<script>
const CONFIG = { URL_GAS: "https://script.google.com/macros/s/AKfycby9LJS4ZTGGoKV9Mzxjw66l9vXPtAkctwoPhkdTtUT30KKsrUmfXIGfH7OCdhFntpv2/exec" };

let jugadorSesion = null;

async function callApi(action, params = {}) {
    const url = new URL(CONFIG.URL_GAS);
    url.searchParams.append("action", action);
    Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
    const resp = await fetch(url.toString());
    return resp.json();
}
async function callPost(action, body) {
    const formData = new URLSearchParams();
    formData.append("action", action);
    Object.keys(body).forEach(k => formData.append(k, body[k]));
    await fetch(CONFIG.URL_GAS, { method: "POST", mode: "no-cors", body: formData });
    return { success: true };
}

async function cargarPartidos() {
    const data = await callApi("getPartidos");
    return data.success ? data.data : [];
}
async function cargarRivales() {
    const data = await callApi("getRivales");
    return data.success ? data.data.map(r => r.nombre) : ["LEONES","IDEAL","BARZA","SAN MARTIN","INDEPENDIENTE","VODKILA","CHELSEA","JUVENTUS","FRANCO CANADIENSE"];
}
async function obtenerPerfilJugador() {
    const data = await callApi("getPerfil", { cedula });
    return data.success ? data.jugador : null;
}
async function obtenerRendimiento() {
    const data = await callApi("getRendimientoJugador", { cedula });
    if (data.success) {
        return { puntualidad: data.puntualidad, companerismo: data.companerismo, respeto: data.respeto, humildad: data.humildad };
    }
    return null;
}

    document.body.className = '';
    const container = document.getElementById('dynamicContent');
    container.innerHTML = `<div class="perfil-root"><div class="perfil-container"><div class="soccer-loading-container"><i class="fa-solid fa-futbol fa-spin" style="font-size:3rem;color:#D4AF37;"></i><div>Cargando perfil...</div></div></div></div>`;

// ========== Ruleta (para partidos pendientes) ==========
async function mostrarRuleta(rivalPendiente = null) {
    document.body.className = 'ruleta-mode';
    document.body.style.background = '#0a0c10';
    const container = document.getElementById('dynamicContent');
    // Si se pasa un rival específico (porque hay un partido pendiente con ese rival), se fuerza ese rival en la ruleta
    // En este ejemplo, si hay partido pendiente, se usa ese rival directamente sin sorteo.
    // Pero mantengo la ruleta para que el jugador confirme.
    // Para simplificar, si hay pendiente, directamente se muestra la confirmación con ese rival.
    if (rivalPendiente) {
        // Mostrar pantalla de confirmación directa
        container.innerHTML = `
            <div class="h-screen flex flex-col items-center justify-center bg-black/90">
                <div class="text-center">
                    <h2 class="text-yellow-500 text-3xl mb-4">Partido Pendiente</h2>
                    <div class="glass-card p-6 rounded-xl">
                        <div class="flex items-center justify-center gap-6">
                            <div>⚜️ NÁPOLES F.C.</div>
                            <div class="text-yellow-500 text-4xl">VS</div>
                            <div>${rivalPendiente}</div>
                        </div>
                        <div class="match-info-card mt-4">📅 Fecha: ${new Date().toLocaleDateString()} | ⏰ 12:00 | 🏟️ LIGA SANTA RITA</div>
                        <button id="confirmButton" class="mt-6 bg-yellow-500 text-black px-8 py-3 rounded-full">Confirmar Asistencia</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('confirmButton').onclick = () => guardarAsistenciaPartidoPendiente(rivalPendiente);
        return;
    }
    
    // Si no hay pendiente, se muestra la ruleta normal (sorteo de rival)
    container.innerHTML = `...`; // código de ruleta con sorteo
}

async function guardarAsistenciaPartidoPendiente(rival) {
    const btn = document.getElementById('confirmButton');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.innerText = 'GUARDANDO...';
    const fechaStr = new Date().toISOString().split('T')[0];
    const hora = "12:00";
    const lugar = "LIGA SANTA RITA - Cancha 1";
    const dorsal = jugadorSesion.dorsal || "";
    const asistenciaData = { cedula, categoria, nombre: nombreCompleto, rival, fecha: fechaStr, hora, lugar, amarillas: 0, rojas: 0, goles: 0, valor_vocalia: 2.5, estado: "CONFIRMADO", puntualidad: 10, companerismo: 10, respeto: 10, humildad: 10, dorsal };
    await callPost("registrarAsistencia", asistenciaData);
    alert(`✅ Confirmaste asistencia contra ${rival}. ¡Buena suerte!`);
    mostrarPerfil();
}

// ========== Flujo principal ==========
(async function() {
    // 1. Verificar términos (igual que antes)
    const perfil = await obtenerPerfilJugador();
    if (!perfil || !perfil.terminos_aceptados) {

        document.getElementById('modalTerms').style.display = 'flex';
        window.enviarFirmaTerminos = async function() {
            const opcion = document.querySelector('input[name="termOption"]:checked').value;
            await callPost("guardarTerminos", { cedula, categoria, opcion });
            document.getElementById('modalTerms').style.display = 'none';
            // Después de términos, revisar partidos pendientes
            const partidos = await cargarPartidos();
            const pendientes = partidos.filter(p => p.estado === "PENDIENTE");
            if (pendientes.length > 0) {
                // Mostrar ruleta con el primer rival pendiente (o sortear entre ellos)
                mostrarRuleta(pendientes[0].rival);
            } else {

            }
        };

    }
    
    // 2. Buscar partidos pendientes en Programacion_Partidos_H
    const partidos = await cargarPartidos();
    const pendientes = partidos.filter(p => p.estado === "PENDIENTE");
    if (pendientes.length > 0) {

        mostrarRuleta(pendientes[0].rival);
    } else {

        mostrarPerfil();

})();
