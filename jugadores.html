<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NAPÓLES FC · ADMIN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e17;
      font-family: 'Inter', sans-serif;
      color: #fff;
      padding-bottom: 60px;
    }

    /* Header estilo top */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(72, 187, 255, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p {
      font-size: 0.7rem;
      opacity: 0.7;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      background: #1e293b;
      width: 42px;
      height: 42px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #334155;
    }
    .icon-btn:hover {
      background: #2d3a4e;
      transform: scale(1.02);
    }

    /* Tabs estilo "Sun Mon Tue" */
    .tabs-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px 16px 0;
      flex-wrap: wrap;
    }
    .tab {
      background: #11161f;
      border-radius: 40px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      border: 1px solid #2a3440;
      cursor: pointer;
      color: #b9c7d9;
      transition: 0.2s;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .tab span {
      font-size: 1.3rem;
      font-weight: 900;
      color: #60a5fa;
    }
    .tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: transparent;
      color: white;
      box-shadow: 0 4px 12px #2563eb40;
    }
    .tab.active span {
      color: white;
    }

    /* Barra de búsqueda */
    .search-bar {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .search-wrapper {
      flex: 3;
      background: #11161f;
      border: 1px solid #2a3440;
      border-radius: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      padding: 14px 0;
      width: 100%;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .search-wrapper input::placeholder {
      color: #5b6e8c;
    }
    .filter-select {
      background: #11161f;
      border: 1px solid #2a3440;
      border-radius: 40px;
      padding: 0 20px;
      color: white;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Tarjetas estilo "partido en vivo" */
    .match-card {
      background: #0f131e;
      border-radius: 28px;
      margin-bottom: 18px;
      border: 1px solid #202838;
      transition: 0.2s;
      overflow: hidden;
    }
    .match-card:hover {
      border-color: #3b82f660;
      transform: scale(0.99);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .match-content {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* enfrentamiento dos lados */
    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .team {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .team-avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, #1e2a4a, #0f172a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 1px solid #3b82f630;
    }
    .team-info h4 {
      font-size: 1.1rem;
      font-weight: 800;
    }
    .team-info .ced {
      font-size: 0.7rem;
      opacity: 0.6;
      margin-top: 4px;
    }
    .match-status {
      background: #0a0e16;
      padding: 8px 18px;
      border-radius: 40px;
      text-align: center;
      min-width: 110px;
    }
    .status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 30px;
      display: inline-block;
    }
    .status-badge.aprobado { background: #10b981; color: white; }
    .status-badge.pendiente { background: #f59e0b; color: #0c0a2a; }
    .status-badge.rechazado { background: #ef4444; color: white; }
    .score-block {
      background: #010409;
      border-radius: 24px;
      padding: 6px 20px;
      text-align: center;
      border: 1px solid #2a3440;
    }
    .dorsal-score {
      font-size: 2.2rem;
      font-weight: 900;
      font-family: monospace;
      letter-spacing: 2px;
      color: #38bdf8;
    }
    .label-dorsal {
      font-size: 0.6rem;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .shirt-name {
      font-size: 0.9rem;
      font-weight: 600;
      background: #00000060;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .action-buttons-live {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
      border-top: 1px solid #202838;
      padding-top: 16px;
    }
    .live-btn {
      background: #1e293b;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      color: #e2e8f0;
    }
    .live-btn.approve { background: #10b981; color: white; }
    .live-btn.reject { background: #ef4444; color: white; }
    .live-btn.edit { background: #2563eb; }
    .live-btn.whatsapp { background: #25D366; }
    .live-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .loading-placeholder {
      text-align: center;
      padding: 80px;
      opacity: 0.7;
    }

    @media (max-width: 750px) {
      .match-teams { flex-direction: column; align-items: stretch; }
      .team { justify-content: space-between; }
      .action-buttons-live { justify-content: center; }
      .tabs-row { gap: 8px; }
      .tab { padding: 6px 14px; font-size: 0.7rem; }
      .search-bar { flex-direction: column; padding: 16px; }
    }
  </style>
</head>
<body>

<div class="app-header">
  <div class="logo">
    <h1>⚡ NÁPOLES F.C.</h1>
    <p>Administración · Modo PRO</p>
  </div>
  <div class="header-actions">
    <div class="icon-btn" onclick="descargarPDF()"><span class="material-symbols-outlined">picture_as_pdf</span></div>
    <div class="icon-btn" onclick="configurarWhatsapp()"><span class="material-symbols-outlined">settings</span></div>
    <div class="icon-btn" onclick="cerrarSesion()"><span class="material-symbols-outlined">logout</span></div>
  </div>
</div>

<div class="tabs-row" id="tabsContainer">
  <div class="tab active" data-estado="TODOS" onclick="filtrarPorEstado('TODOS', this)"><span id="totalJugadores">0</span> TOTAL</div>
  <div class="tab" data-estado="APROBADO" onclick="filtrarPorEstado('APROBADO', this)"><span id="totalAprobados">0</span> APROBADOS</div>
  <div class="tab" data-estado="PENDIENTE" onclick="filtrarPorEstado('PENDIENTE', this)"><span id="totalPendientes">0</span> PENDIENTES</div>
  <div class="tab" data-estado="RECHAZADO" onclick="filtrarPorEstado('RECHAZADO', this)"><span id="totalRechazados">0</span> RECHAZADOS</div>
</div>

<div class="search-bar">
  <div class="search-wrapper">
    <span class="material-symbols-outlined">search</span>
    <input type="text" id="searchInput" placeholder="Buscar jugador, cédula o dorsal...">
  </div>
  <select id="filterSelect" class="filter-select">
    <option value="nombre">Nombre</option>
    <option value="cedula">Cédula</option>
    <option value="dorsal">Dorsal</option>
    <option value="estado">Estado</option>
  </select>
</div>

<div id="playersContainer" style="max-width: 1300px; margin: 0 auto; padding: 0 20px;">
  <div class="loading-placeholder">Cargando jugadores...</div>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
const CONFIG = {
  URL_GAS: "https://script.google.com/macros/s/AKfycbyVo5TkMFV-0KXxE6Wp3R3zAwt1O6SmRuRsGMTKpSvYiUPTRIOkc5JLgwlFQ0qfLg9y/exec"
};

if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

let jugadoresGlobal = [];
let estadoFiltro = 'TODOS';
let activeTab = null;

if (!localStorage.getItem('tipo_whatsapp')) localStorage.setItem('tipo_whatsapp', 'normal');
function configurarWhatsapp() {
  let tipo = prompt('WhatsApp: normal / business', localStorage.getItem('tipo_whatsapp'));
  if (tipo) localStorage.setItem('tipo_whatsapp', tipo.toLowerCase());
  alert('Configuración guardada');
}

async function cargarJugadores() {
  const container = document.getElementById('playersContainer');
  container.innerHTML = '<div class="loading-placeholder">Cargando jugadores...</div>';
  try {
    const res = await fetch(`${CONFIG.URL_GAS}?action=getJugadores&t=${Date.now()}`);
    const data = await res.json();
    jugadoresGlobal = (data.jugadores || []).sort((a,b) => (Number(a.dorsal) || 0) - (Number(b.dorsal) || 0));
    actualizarContadores();
    aplicarFiltros();
  } catch(e) {
    container.innerHTML = '<div class="loading-placeholder">Error de conexión</div>';
  }
}

function actualizarContadores() {
  document.getElementById('totalJugadores').innerText = jugadoresGlobal.length;
  document.getElementById('totalAprobados').innerText = jugadoresGlobal.filter(j=> (j.estado||'').toUpperCase() === 'APROBADO').length;
  document.getElementById('totalPendientes').innerText = jugadoresGlobal.filter(j=> (j.estado||'').toUpperCase() === 'PENDIENTE').length;
  document.getElementById('totalRechazados').innerText = jugadoresGlobal.filter(j=> (j.estado||'').toUpperCase() === 'RECHAZADO').length;
}

function filtrarPorEstado(estado, elemento) {
  if (activeTab) activeTab.classList.remove('active');
  elemento.classList.add('active');
  activeTab = elemento;
  estadoFiltro = estado;
  aplicarFiltros();
}

function aplicarFiltros() {
  let lista = [...jugadoresGlobal];
  if (estadoFiltro !== 'TODOS') {
    lista = lista.filter(j => (j.estado||'PENDIENTE').toUpperCase() === estadoFiltro);
  }
  const texto = document.getElementById('searchInput').value.toLowerCase().trim();
  const tipo = document.getElementById('filterSelect').value;
  if (texto) {
    lista = lista.filter(j => {
      if (tipo === 'nombre') return `${j.primerNombre} ${j.apellidos}`.toLowerCase().includes(texto);
      if (tipo === 'cedula') return (j.cedula||'').includes(texto);
      if (tipo === 'dorsal') return String(j.dorsal||'').includes(texto);
      if (tipo === 'estado') return (j.estado||'').toLowerCase().includes(texto);
      return true;
    });
  }
  renderMatches(lista);
}

function renderMatches(jugadores) {
  const container = document.getElementById('playersContainer');
  if (!jugadores.length) {
    container.innerHTML = '<div class="loading-placeholder">No hay jugadores que coincidan</div>';
    return;
  }
  container.innerHTML = '';
  jugadores.forEach(j => {
    const estado = (j.estado || 'PENDIENTE').toUpperCase();
    let estadoClass = 'pendiente';
    if (estado === 'APROBADO') estadoClass = 'aprobado';
    if (estado === 'RECHAZADO') estadoClass = 'rechazado';
    const esPendiente = (estado === 'PENDIENTE');
    const avatarLocal = j.primerNombre ? j.primerNombre.charAt(0).toUpperCase() : '⚽';
    
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-content">
        <div class="match-teams">
          <div class="team">
            <div class="team-avatar">${avatarLocal}</div>
            <div class="team-info">
              <h4>${j.primerNombre || ''} ${j.segundoNombre || ''} ${j.apellidos || ''}</h4>
              <div class="ced">${j.cedula}</div>
              <div class="shirt-name">${j.nombreCamiseta || 'SIN NOMBRE'}</div>
            </div>
          </div>
          <div class="match-status">
            <div class="status-badge ${estadoClass}">${estado}</div>
          </div>
          <div class="team">
            <div class="score-block">
              <div class="dorsal-score">${j.dorsal || 0}</div>
              <div class="label-dorsal">DORSAL</div>
            </div>
          </div>
        </div>
        <div class="action-buttons-live">
          ${esPendiente ? `
            <button class="live-btn approve" onclick="aprobarJugador('${j.cedula}')"><span class="material-symbols-outlined">check</span> APROBAR</button>
            <button class="live-btn reject" onclick="rechazarJugador('${j.cedula}')"><span class="material-symbols-outlined">close</span> RECHAZAR</button>
          ` : ''}
          <button class="live-btn edit" onclick="editarJugador('${j.cedula}')"><span class="material-symbols-outlined">edit</span> EDITAR</button>
          <button class="live-btn whatsapp" onclick="enviarWhatsapp('${j.telefono}','${j.primerNombre}')"><span class="material-symbols-outlined">chat</span> WHATSAPP</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// Acciones
async function aprobarJugador(cedula) {
  if (!confirm('¿Aprobar este jugador? Se enviará mensaje de WhatsApp.')) return;
  try {
    const res = await fetch(`${CONFIG.URL_GAS}?action=aprobarJugador&cedula=${cedula}`);
    const data = await res.json();
    if (data.ok) {
      const mensaje = `🏆 NÁPOLES F.C. ⚽\nHola, tu registro ha sido APROBADO. ¡Bienvenido al club! Ingresa con tu cédula en https://kilometro0-ec.github.io/NAPOLES-FC/login.html`;
      const tipo = localStorage.getItem('tipo_whatsapp');
      let url = tipo === 'business' ? `https://wa.me/593${data.telefono}?text=${encodeURIComponent(mensaje)}` : `https://api.whatsapp.com/send?phone=593${data.telefono}&text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
      cargarJugadores();
    } else alert('Error al aprobar');
  } catch(e) { alert('Error'); }
}

async function rechazarJugador(cedula) {
  if (!confirm('¿Rechazar este jugador?')) return;
  try {
    const res = await fetch(`${CONFIG.URL_GAS}?action=rechazarJugador&cedula=${cedula}`);
    const data = await res.json();
    if (data.ok) cargarJugadores();
    else alert('Error');
  } catch(e) { alert('Error'); }
}

function enviarWhatsapp(telefono, nombre) {
  const msg = `Hola ${nombre}, mensaje desde administración Nápoles FC.`;
  window.open(`https://wa.me/593${telefono}?text=${encodeURIComponent(msg)}`, '_blank');
}

function editarJugador(cedula) {
  localStorage.setItem('editCedula', cedula);
  window.location.href = './editar-jugador.html';
}

function descargarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text('NAPÓLES FC - LISTA DE JUGADORES', 20, 20);
  let y = 35;
  jugadoresGlobal.forEach(j => {
    if (y > 280) { doc.addPage(); y = 20; }
    doc.setFontSize(10);
    doc.text(`${j.dorsal || '0'} | ${j.nombreCamiseta || ''} | ${j.primerNombre} ${j.apellidos} | ${j.estado || 'PENDIENTE'}`, 20, y);
    y += 8;
  });
  doc.save('napoles_players.pdf');
}

function cerrarSesion() {
  localStorage.removeItem('admin_activo');
  window.location.href = './login.html';
}

document.getElementById('searchInput').addEventListener('input', aplicarFiltros);
document.getElementById('filterSelect').addEventListener('change', aplicarFiltros);
cargarJugadores();
</script>
</body>
</html>
