<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Estadísticas - Nápoles F.C.</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #D4AF37;
      --purple: #7c3aed;
      --purple-light: #c084fc;
      --slate-dark: #0f172a;
      --muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border: rgba(226, 232, 240, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 50%, #f1f4f9 100%);
      color: var(--slate-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ILUMINACIÓN AMBIENTAL */
    .ambient-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      opacity: 0.22;
    }
    .glow-1 { width: 300px; height: 300px; background: var(--purple-light); top: -5%; left: -10%; }
    .glow-2 { width: 350px; height: 350px; background: #e0f2fe; bottom: 10%; right: -10%; }

    /* BARRA SUPERIOR CRISTALINA */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-info h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--slate-dark);
      letter-spacing: -0.3px;
    }

    .admin-info p {
      font-size: .7rem;
      color: #78716c;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate-dark);
      border: 1px solid var(--border);
    }

    /* RESUMEN CUADRANTE PANEL MÓVIL */
    .summary {
      padding: 20px 18px 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.01);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .summary-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      margin-bottom: 2px;
      letter-spacing: -0.5px;
      color: var(--purple);
    }

    .summary-card p {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* LISTA DE JUGADORES Y SECCIONES */
    .players {
      padding: 10px 18px 60px;
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--slate-dark);
      margin: 16px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 20px rgba(0,0,0,0.01);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .player-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--slate-dark), #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .player-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--slate-dark);
    }

    .player-info p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 1px;
    }

    .player-stats {
      text-align: right;
    }

    .player-stats h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--purple);
    }

    .player-stats p {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* MAQUETACIÓN DEL GRÁFICO MENSUAL */
    .chart-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 22px;
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px rgba(0,0,0,0.01);
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 180px;
      margin-top: 32px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--border);
    }

    .bar {
      width: 38px;
      background: linear-gradient(180deg, var(--purple-light) 0%, var(--purple) 100%);
      border-radius: 8px 8px 4px 4px;
      position: relative;
      min-height: 6px;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bar .bar-value {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--purple);
      background: #f3e8ff;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .bar .bar-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
    }

    /* ESQUELETOS SHIMMER DE ESPERA */
    .shimmer-container { padding: 20px 18px; max-width: 700px; margin: 0 auto; }
    .shimmer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .shimmer-box { height: 82px; background: rgba(255,255,255,0.5); border-radius: 24px; position: relative; overflow: hidden; }
    .shimmer-strip { height: 74px; background: rgba(255,255,255,0.5); border-radius: 22px; margin-bottom: 12px; position: relative; overflow: hidden; }
    .shimmer-box::after, .shimmer-strip::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: translateX(-100%); animation: skeletonAnim 1.6s infinite;
    }
    @keyframes skeletonAnim { 100% { transform: translateX(100%); } }

    .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.95rem;
    }

    @media(max-width: 640px) {
      .summary { gap: 12px; padding: 16px 14px 5px; }
      .players { padding: 10px 14px 60px; }
      .bar { width: 32px; }
    }
  </style>
</head>
<body>

<div class="ambient-glow">
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>
</div>

<header class="topbar">
  <div class="top-left">
    <div class="admin-info">
      <h1>Estadísticas</h1>
      <p>Nápoles F.C. · Rendimiento Real</p>
    </div>
  </div>
  <div class="avatar"><i class="fa-solid fa-chart-simple"></i></div>
</header>

<main id="mainContent">
  <div class="shimmer-container">
    <div class="shimmer-grid">
      <div class="shimmer-box"></div>
      <div class="shimmer-box"></div>
      <div class="shimmer-box"></div>
      <div class="shimmer-box"></div>
    </div>
    <div class="shimmer-strip"></div>
    <div class="shimmer-strip"></div>
  </div>
</main>

<script>
// ==================== CONFIGURACIÓN ====================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby1hZoGzUNJU5qQW8nZJk3HQ7m1zzRpMC6Cwe6oPhYnCcqO_vXFJccphDoeQJpz7CEO/exec';

if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// ==================== AUXILIARES DE PROCESAMIENTO ====================
async function fetchData(action) {
  const url = `${WEBAPP_URL}?action=${action}&t=${Date.now()}`;
  const resp = await fetch(url);
  return await resp.json();
}

function getGolesNapoles(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[0], 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

function getNombreCompleto(j) {
  let nombre = '';
  if (j.primerNombre) nombre += j.primerNombre;
  if (j.segundoNombre) nombre += ' ' + j.segundoNombre;
  if (j.apellidos) nombre += ' ' + j.apellidos;
  return nombre.trim() || 'Sin nombre';
}

function getIniciales(nombre) {
  if (!nombre) return '??';
  const partes = nombre.trim().split(' ');
  if (partes.length >= 2) {
    return (partes[0][0] + partes[1][0]).toUpperCase();
  }
  return nombre.substring(0, 2).toUpperCase();
}

// ==================== CARGA Y CONSTRUCCIÓN FINAL ====================
async function cargarEstadisticas() {
  const container = document.getElementById('mainContent');
  try {
    const [partidosData, jugadoresData] = await Promise.all([
      fetchData('getPartidos'),
      fetchData('getJugadores')
    ]);

    if (!partidosData.success && !jugadoresData.success) {
      throw new Error('No se recuperaron las colecciones de la BD');
    }

    const partidos = partidosData.data || [];
    const jugadores = jugadoresData.jugadores || [];

    let totalGoles = 0;
    let partidosJugados = 0;
    let victorias = 0;
    let empates = 0;
    let derrotas = 0;

    const golesPorMes = {};

    partidos.forEach(p => {
      const resultado = p.resultado || '';
      const golesNap = getGolesNapoles(resultado);
      totalGoles += golesNap;

      if (resultado && resultado !== 'VS' && resultado.includes('-')) {
        partidosJugados++;
        const golesRival = parseInt(resultado.split('-')[1], 10) || 0;
        if (golesNap > golesRival) victorias++;
        else if (golesNap < golesRival) derrotas++;
        else empates++;
      }

      if (p.fecha && golesNap > 0) {
        let fechaObj = (typeof p.fecha === 'string') ? new Date(p.fecha) : p.fecha;
        if (fechaObj instanceof Date && !isNaN(fechaObj.getTime())) {
          const mes = fechaObj.toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
          golesPorMes[mes] = (golesPorMes[mes] || 0) + golesNap;
        }
      }
    });

    const topGoleadores = [...jugadores]
      .filter(j => (j.goles || 0) > 0)
      .sort((a, b) => (b.goles || 0) - (a.goles || 0))
      .slice(0, 5);

    const mesesOrden = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    let mesesConDatos = Object.keys(golesPorMes);
    if (mesesConDatos.length === 0) {
      mesesConDatos = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY'];
    }
    const mesesMostrar = mesesOrden.filter(m => mesesConDatos.includes(m)).slice(-5);
    if (mesesMostrar.length === 0) mesesMostrar.push('JUN');

    const maxGoles = Math.max(...mesesMostrar.map(m => golesPorMes[m] || 0), 1);
    const alturaMaxima = 130; 

    container.innerHTML = `
      <section class="summary">
        <div class="summary-card">
          <h3>${totalGoles}</h3>
          <p>⚽ Goles Club</p>
        </div>
        <div class="summary-card">
          <h3>${partidosJugados}</h3>
          <p>📅 Partidos</p>
        </div>
        <div class="summary-card">
          <h3 style="color: var(--success);">${victorias}</h3>
          <p>🏆 Victorias</p>
        </div>
        <div class="summary-card">
          <h3 style="color: var(--danger);">${derrotas}</h3>
          <p>❌ Derrotas</p>
        </div>
      </section>

      <section class="players">
        <h2 class="section-title"><i class="fa-solid fa-crown" style="color: var(--gold)"></i> Máximos Goleadores</h2>
        ${topGoleadores.length === 0 ? '<div style="text-align:center; padding:30px; color:var(--muted); font-size:0.9rem;">No hay registros de goles asignados a jugadores.</div>' : ''}
        
        ${topGoleadores.map(j => `
          <div class="player-card">
            <div class="player-left">
              <div class="player-avatar">${getIniciales(getNombreCompleto(j))}</div>
              <div class="player-info">
                <h3>${escapeHtml(getNombreCompleto(j))}</h3>
                <p>${j.dorsal ? `Dorsal ${j.dorsal}` : 'Sin Dorsal'}</p>
              </div>
            </div>
            <div class="player-stats">
              <h4>${j.goles || 0}</h4>
              <p>Goles</p>
            </div>
          </div>
        `).join('')}

        <div class="chart-card">
          <h2 class="section-title" style="margin:0;"><i class="fa-solid fa-chart-bar" style="color:var(--purple);"></i> Goles Mensuales</h2>
          <div class="chart-bars">
            ${mesesMostrar.map(mes => {
              const goles = golesPorMes[mes] || 0;
              const altura = (goles / maxGoles) * alturaMaxima;
              return `
                <div class="bar" style="height: ${altura}px;">
                  <span class="bar-value">${goles}</span>
                  <span class="bar-label">${mes}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </section>
    `;
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error-msg">❌ No se pudo compilar la tabla de estadísticas. Verifica tu conexión de red o backend.</div>`;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

cargarEstadisticas();
</script>
</body>
</html>
