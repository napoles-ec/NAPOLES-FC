<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Estadísticas - Nápoles F.C.</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #D4AF37;
      --purple: #7c3aed;
      --purple-light: #c084fc;
      --slate-dark: #0f172a;
      --muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border: rgba(226, 232, 240, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 50%, #f1f4f9 100%);
      color: var(--slate-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ILUMINACIÓN AMBIENTAL */
    .ambient-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      opacity: 0.22;
    }
    .glow-1 { width: 300px; height: 300px; background: var(--purple-light); top: -5%; left: -10%; }
    .glow-2 { width: 350px; height: 350px; background: #e0f2fe; bottom: 10%; right: -10%; }

    /* BARRA SUPERIOR CRISTALINA */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-info h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--slate-dark);
      letter-spacing: -0.3px;
    }

    .admin-info p {
      font-size: .7rem;
      color: #78716c;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate-dark);
      border: 1px solid var(--border);
    }

    /* RESUMEN CUADRANTE PANEL MÓVIL */
    .summary {
      padding: 20px 18px 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.01);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .summary-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      margin-bottom: 2px;
      letter-spacing: -0.5px;
      color: var(--purple);
    }

    .summary-card p {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* LISTA DE JUGADORES Y SECCIONES */
    .players {
      padding: 10px 18px 60px;
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--slate-dark);
      margin: 16px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 20px rgba(0,0,0,0.01);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .player-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--slate-dark), #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .player-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--slate-dark);
    }

    .player-info p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 1px;
    }

    .player-stats {
      text-align: right;
    }

    .player-stats h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--purple);
    }

    .player-stats p {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* MAQUETACIÓN DEL GRÁFICO MENSUAL */
    .chart-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 22px;
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px rgba(0,0,0,0.01);
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 180px;
      margin-top: 32px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--border);
    }

    .bar {
      width: 38px;
      background: linear-gradient(180deg, var(--purple-light) 0%, var(--purple) 100%);
      border-radius: 8px 8px 4px 4px;
      position: relative;
      min-height: 6px;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bar .bar-value {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--purple);
      background: #f3e8ff;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .bar .bar-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
    }

    /* ESQUELETOS SHIMMER DE ESPERA */
    .shimmer-container { padding: 20px 18px; max-width: 700px; margin: 0 auto; }
    .shimmer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .shimmer-box { height: 82px; background: rgba(255,255,255,0.5); border-radius: 24px; position: relative; overflow: hidden; }
