<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Nápoles F.C. | Estadísticas &amp; Rendimiento</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #b89329;
      --gold-soft: #d9b96a;
      --blue: #0094d6;
      --blue-deep: #006ba3;
      --card-bg: #ffffff;
      --card-border: rgba(15, 23, 42, 0.07);
      --ink: #0f172a;
      --ink-muted: #64748b;
    }
    body {
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 148, 214, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 100% 10%, rgba(184, 147, 41, 0.06) 0%, transparent 40%),
        #f7f8fb;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: max(884px, 100dvh);
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }

    .custom-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.10);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .chart-bar {
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-tile { position: relative; overflow: hidden; }
    .stat-tile .tile-icon-bg {
      position: absolute; right: -10px; top: -10px;
      font-size: 5.5rem; opacity: 0.06; pointer-events: none;
    }
    .stat-tile .tile-topline { position: absolute; top: 0; left: 0; right: 0; height: 3px; }

    .rank-medal {
      position: absolute; top: -6px; left: -6px;
      width: 20px; height: 20px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      font-family: 'Outfit', sans-serif;
    }
    .rank-1 { background: linear-gradient(155deg, #f4d47a, var(--gold)); }
    .rank-2 { background: linear-gradient(155deg, #cbd5e1, #94a3b8); }
    .rank-3 { background: linear-gradient(155deg, #d99a6c, #b56b3a); }

    .chart-grid-line { border-top: 1px dashed rgba(15,23,42,0.08); }

    .shimmer-box { position: relative; overflow: hidden; background: rgba(0,0,0,0.05); }
    .shimmer-box::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: translateX(-100%); animation: skeletonAnim 1.4s infinite;
    }
    @keyframes skeletonAnim { 100% { transform: translateX(100%); } }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: rise-in 0.45s cubic-bezier(0.16,1,0.3,1) both; }

    @media (prefers-reduced-motion: reduce) {
      .rise-in { animation: none !important; }
      * { transition-duration: 0.01ms !important; }
    }
  </style>

  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#f7f8fb",
            "primary": "#0094d6",
            "secondary": "#b89329",
            "surface": "#ffffff",
            "on-surface": "#0f172a",
            "on-surface-variant": "#64748b"
          },
          spacing: {
            "sm": "8px", "lg": "24px", "xl": "32px", "md": "16px",
            "margin-mobile": "16px", "margin-desktop": "40px", "gutter": "24px"
          },
          fontFamily: {
            "label-bold": ["Inter"],
            "headline-md": ["Outfit"],
            "headline-lg": ["Outfit"],
            "display-lg": ["Outfit"],
            "body-md": ["Inter"]
          }
        }
      }
    }
  </script>
</head>

<body class="pb-24">

<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-white/85 backdrop-blur-xl border-b border-slate-200 h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary to-[var(--blue-deep)] flex items-center justify-center shadow-[0_4px_12px_rgba(0,148,214,0.28)] hover:scale-105 active:scale-95 transition-transform" onclick="window.location.href='index.html'" style="cursor:pointer;">
      <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
    </div>
    <div>
      <h1 class="font-headline-md text-xl font-bold leading-none text-slate-900 tracking-tight">Estadísticas Club</h1>
      <p class="text-[10px] font-label-bold uppercase tracking-widest text-secondary mt-1 font-bold">Nápoles F.C. · Panel Oficial</p>
    </div>
  </div>
  <button onclick="cargarEstadisticas()" class="w-10 h-10 rounded-full custom-card flex items-center justify-center hover:scale-105 active:scale-95 transition-all text-slate-600 bg-white">
    <span class="material-symbols-outlined">sync</span>
  </button>
</header>

<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto space-y-xl" id="mainContent">
  <!-- Skeletons por defecto -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-md">
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
  </section>
  <div class="shimmer-box h-16 rounded-xl"></div>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl">
    <div class="lg:col-span-5 space-y-sm shimmer-box h-96 rounded-xl"></div>
    <div class="lg:col-span-7 shimmer-box h-96 rounded-xl"></div>
  </div>
</main>

<script>
// ==================== CONFIGURACIÓN ====================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby1hZoGzUNJU5qQW8nZJk3HQ7m1zzRpMC6Cwe6oPhYnCcqO_vXFJccphDoeQJpz7CEO/exec';

if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

async function fetchData(action) {
  const url = `${WEBAPP_URL}?action=${action}&t=${Date.now()}`;
  const resp = await fetch(url);
  return await resp.json();
}

// Extrae goles a favor (izq del guion)
function getGolesFavor(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[0].trim(), 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

// Extrae goles en contra (der del guion)
function getGolesContra(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[1].trim(), 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

function getNombreCompleto(j) {
  let nombre = '';
  if (j.primerNombre) nombre += j.primerNombre;
  if (j.segundoNombre) nombre += ' ' + j.segundoNombre;
  if (j.apellidos) nombre += ' ' + j.apellidos;
  return nombre.trim() || 'Sin nombre';
}

function getIniciales(nombre) {
  if (!nombre) return 'NP';
  const partes = nombre.trim().split(' ');
  if (partes.length >= 2) {
    return (partes[0][0] + partes[1][0]).toUpperCase();
  }
  return nombre.substring(0, 2).toUpperCase();
}

// Limpia el número de cédula en caso de que Google Sheets lo traiga con decimales (ej: "1716001431.0")
function sanitizarCedula(cedulaRaw) {
  if (!cedulaRaw) return '';
  let cedulaStr = cedulaRaw.toString().trim();
  if (cedulaStr.includes('.')) {
    const partes = cedulaStr.split('.');
    if (partes[1] === '0') {
      cedulaStr = partes[0];
    }
  }
  return cedulaStr;
}

// Parsea fechas de manera robusta previniendo bugs de navegadores móviles con el formato dd/mm/aaaa
function parseFecha(fechaRaw) {
  if (!fechaRaw) return null;
  if (fechaRaw instanceof Date) return fechaRaw;
  let dateStr = fechaRaw.toString().trim();

  let d = new Date(dateStr);
  if (!isNaN(d.getTime())) return d;

  const partes = dateStr.split('/');
  if (partes.length === 3) {
    const dia = parseInt(partes[0], 10);
    const mes = parseInt(partes[1], 10) - 1;
    const anio = parseInt(partes[2], 10);
    d = new Date(anio, mes, dia);
    if (!isNaN(d.getTime())) return d;
  }
  return null;
}

// ==================== CARGA Y CONSTRUCCIÓN FINAL ====================
async function cargarEstadisticas() {
  const container = document.getElementById('mainContent');
  try {
    const [partidosData, jugadoresData] = await Promise.all([
      fetchData('getPartidos'),
      fetchData('getJugadores')
    ]);

    const partidos = partidosData.data || [];
    const jugadores = jugadoresData.jugadores || [];

    let totalGolesFavor = 0;
    let totalGolesContra = 0;
    let partidosJugados = 0;
    let victorias = 0;
    let empates = 0;
    let derrotas = 0;

    const golesPorMes = {};

    partidos.forEach(p => {
      const resultado = p.resultado || '';
      const golesNap = getGolesFavor(resultado);
      const golesRival = getGolesContra(resultado);

      if (resultado && resultado !== 'VS' && resultado.includes('-')) {
        partidosJugados++;
        totalGolesFavor += golesNap;
        totalGolesContra += golesRival;

        if (golesNap > golesRival) victorias++;
        else if (golesNap < golesRival) derrotas++;
        else empates++;

        const fechaObj = parseFecha(p.fecha);
        if (fechaObj) {
          const mes = fechaObj.toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
          golesPorMes[mes] = (golesPorMes[mes] || 0) + golesNap;
        }
      }
    });

    // Derivados: efectividad y promedio de goles por partido
    const efectividad = partidosJugados > 0 ? Math.round((victorias / partidosJugados) * 100) : 0;
    const promedioGoles = partidosJugados > 0 ? (totalGolesFavor / partidosJugados).toFixed(1) : '0.0';

    // Procesar goleadores y emparejar sus fotos por cédula
    const topGoleadores = [...jugadores]
      .filter(j => (j.goles || 0) > 0)
      .sort((a, b) => (b.goles || 0) - (a.goles || 0))
      .slice(0, 5);

    // Configurar meses de la gráfica
    const mesesOrden = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    let mesesConDatos = Object.keys(golesPorMes);
    if (mesesConDatos.length === 0) {
      const mesActual = new Date().toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
      golesPorMes[mesActual] = totalGolesFavor;
      mesesConDatos = [mesActual];
    }

    const mesesMostrar = mesesOrden.filter(m => mesesConDatos.includes(m));
    if(mesesMostrar.length === 0) mesesMostrar.push('JUN');

    const maxGoles = Math.max(...mesesMostrar.map(m => golesPorMes[m] || 0), 1);
    const alturaMaxima = 220;

    container.innerHTML = `
      <!-- Tarjetas de Resumen -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-md">
        <!-- Goles a Favor -->
        <div class="custom-card stat-tile p-md rounded-xl bg-white rise-in">
          <div class="tile-topline bg-primary"></div>
          <span class="material-symbols-outlined tile-icon-bg text-primary">sports_soccer</span>
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Goles Club</p>
          <p class="font-display-lg font-mono-num text-4xl font-extrabold text-primary tabular">${totalGolesFavor}</p>
          <p class="text-[11px] text-slate-400 mt-2">Total anotados oficiales</p>
        </div>

        <!-- Goles en Contra -->
        <div class="custom-card stat-tile p-md rounded-xl bg-white rise-in" style="animation-delay:.05s;">
          <div class="tile-topline bg-amber-500"></div>
          <span class="material-symbols-outlined tile-icon-bg text-amber-500">shield</span>
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Goles en Contra</p>
          <p class="font-display-lg font-mono-num text-4xl font-extrabold text-amber-600 tabular">${totalGolesContra}</p>
          <p class="text-[11px] text-slate-400 mt-2">Goles recibidos en arco</p>
        </div>

        <!-- Partidos Jugados -->
        <div class="custom-card stat-tile p-md rounded-xl bg-white rise-in" style="animation-delay:.1s;">
          <div class="tile-topline bg-slate-400"></div>
          <span class="material-symbols-outlined tile-icon-bg text-slate-500">calendar_month</span>
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Partidos</p>
          <p class="font-display-lg font-mono-num text-4xl font-extrabold text-slate-800 tabular">${partidosJugados}</p>
          <p class="text-[11px] text-slate-400 mt-2">Prom. ${promedioGoles} goles/partido</p>
        </div>

        <!-- Victorias / Derrotas -->
        <div class="custom-card stat-tile p-md rounded-xl bg-white rise-in" style="animation-delay:.15s;">
          <div class="tile-topline bg-emerald-500"></div>
          <span class="material-symbols-outlined tile-icon-bg text-emerald-500">emoji_events</span>
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Victorias</p>
          <p class="font-display-lg font-mono-num text-4xl font-extrabold text-emerald-600 tabular">${victorias}</p>
          <p class="text-[12px] text-slate-400 mt-2">Derrotas: ${derrotas} · Empates: ${empates}</p>
        </div>
      </section>

      <!-- Efectividad -->
      <section class="custom-card p-md rounded-xl bg-white rise-in" style="animation-delay:.2s;">
        <div class="flex items-center justify-between mb-2">
          <p class="font-label-bold text-[12px] uppercase text-slate-500 font-bold flex items-center gap-1.5">
            <span class="material-symbols-outlined text-secondary text-base">trending_up</span>
            Efectividad del club
          </p>
          <span class="font-mono-num text-sm font-bold text-slate-800 tabular">${efectividad}%</span>
        </div>
        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
          <div class="h-full rounded-full bg-gradient-to-r from-primary to-secondary chart-bar" style="width: ${efectividad}%;"></div>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">Basado en ${partidosJugados} partidos con resultado registrado</p>
      </section>

      <!-- Tabla de Goleadores y Gráfica -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl">
        <!-- Lista de Goleadores -->
        <section class="lg:col-span-5 space-y-md">
          <div class="flex items-center justify-between px-2">
            <h2 class="font-headline-md text-slate-800 flex items-center gap-2 text-lg font-bold">
              <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">stars</span>
              Máximos Goleadores
            </h2>
            <span class="text-xs font-label-bold text-slate-400 uppercase tracking-wider font-bold">Top 5</span>
          </div>

          <div class="space-y-sm">
            ${topGoleadores.length === 0 ? '<div class="custom-card p-6 text-center text-slate-400 text-sm rounded-xl bg-white">No hay registros de goles asignados a jugadores activos.</div>' : ''}

            ${topGoleadores.map((j, index) => {
              const nombreCompleto = getNombreCompleto(j);
              const iniciales = getIniciales(nombreCompleto);
              const esPrimero = index === 0;
              const cedulaSanitizada = sanitizarCedula(j.cedula || j.ci);
              const medalClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';

              // Ruta de avatar exacta en tu servidor
              const avatarUrl = cedulaSanitizada ? `NAPOLES-FC/imagen/avatar/${cedulaSanitizada}.png` : '';

              return `
                <div class="custom-card p-4 rounded-xl flex items-center justify-between bg-white ${esPrimero ? 'border-l-4 border-secondary' : ''} hover:bg-slate-50 transition-colors rise-in" style="animation-delay:${0.05 * index}s;">
                  <div class="flex items-center gap-4">
                    <div class="relative">
                      <!-- Imagen del jugador o iniciales de respaldo -->
                      <div class="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center font-bold text-sm bg-slate-100 border ${esPrimero ? 'border-secondary' : 'border-slate-200'} text-primary shadow-inner">
                        ${avatarUrl ? `
                          <img src="${avatarUrl}"
                               alt="${escapeHtml(nombreCompleto)}"
                               class="w-full h-full object-cover"
                               onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                          <span class="text-slate-500 hidden">${iniciales}</span>
                        ` : `<span class="text-slate-500">${iniciales}</span>`}
                      </div>
                      ${medalClass ? `<div class="rank-medal ${medalClass}">${index + 1}</div>` : ''}
                    </div>
                    <div>
                      <p class="font-headline-md text-base text-slate-800 font-bold leading-tight">${escapeHtml(nombreCompleto)}</p>
                      <p class="text-xs font-label-bold text-slate-400 uppercase tracking-tight font-bold mt-1">${j.dorsal ? `Dorsal #${j.dorsal}` : 'Sin Dorsal'}</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="font-display-lg font-mono-num text-2xl font-black text-slate-800 tabular">${j.goles || 0}</p>
                    <p class="text-[9px] font-label-bold text-slate-400 uppercase tracking-tighter font-bold">Goles</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Gráfico Mensual -->
        <section class="lg:col-span-7 space-y-md">
          <div class="flex items-center justify-between px-2">
            <h2 class="font-headline-md text-slate-800 text-lg font-bold flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">bar_chart</span>
              Rendimiento Mensual
            </h2>
            <div class="flex gap-2">
              <span class="px-3 py-1 rounded-full bg-primary/10 text-primary text-[10px] font-bold tracking-wider">CONEXIÓN DIRECTA</span>
            </div>
          </div>

          <div class="custom-card p-xl rounded-2xl h-[400px] flex flex-col justify-end bg-white rise-in" style="animation-delay:.25s;">
            <div class="flex-grow flex items-end justify-around gap-2 md:gap-4 mb-4 chart-grid-line pb-2 relative">
              ${mesesMostrar.map(mes => {
                const goles = golesPorMes[mes] || 0;
                const altura = (goles / maxGoles) * alturaMaxima;
                return `
                  <div class="flex flex-col items-center gap-2 group w-full max-w-[48px]">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 text-white px-2 py-1 rounded text-[10px] font-bold shadow text-center font-mono-num">
                      ${goles}
                    </div>
                    <div class="chart-bar w-full bg-gradient-to-t from-primary to-sky-400 rounded-t-lg shadow-sm group-hover:brightness-110" style="height: ${altura}px;"></div>
                    <span class="text-[10px] font-label-bold text-slate-500 font-bold tracking-wide">${mes}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      </div>
    `;
  } catch (error) {
    console.error(error);
    container.innerHTML = `
      <div class="custom-card p-8 rounded-xl text-center max-w-md mx-auto border-rose-300 bg-white">
        <p class="text-rose-600 font-bold mb-2">❌ Error de Sincronización</p>
        <p class="text-xs text-slate-500">Comprueba que el Web App URL tenga los permisos de acceso configurados como 'Anyone' (Cualquiera).</p>
      </div>`;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

cargarEstadisticas();
</script>
</body>
</html>
