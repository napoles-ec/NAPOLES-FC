<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nápoles F.C. | Estadísticas Premium</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #e5c158;
      --gold-dark: #b89329;
      --purple: #0094d6; /* Azul Nápoles */
      --purple-light: #38bdf8;
      --slate-dark: #0b0713; /* Fondo Velvet Oscuro Premium */
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --muted: #cbd2e1;
      --success: #2dd4bf; /* Teal/Verde moderno */
      --danger: #f43f5e;
      --border: rgba(255, 255, 255, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0713;
      color: #f3f1f5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 40px;
    }

    /* ILUMINACIÓN AMBIENTAL */
    .ambient-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      opacity: 0.15;
    }
    .glow-1 { width: 350px; height: 350px; background: #e0897a; top: -5%; left: -10%; }
    .glow-2 { width: 450px; height: 450px; background: #0094d6; bottom: 10%; right: -10%; }

    /* TOPBAR CRISTALINA */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 7, 19, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: #f3f1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:active { transform: scale(0.92); background: rgba(255,255,255,0.08); }

    .admin-info h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .admin-info p {
      font-size: .62rem;
      color: #ffb2a8; /* Rose Gold */
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .top-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0, 148, 214, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple-light);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* CONTENEDOR CENTRAL */
    .dashboard-container {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* BENTO GRID DE CONTADORES */
    .summary {
      padding: 20px 16px 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .summary-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-meta p {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-icon-mini {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .summary-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1;
    }

    .card-subtext {
      font-size: 0.68rem;
      color: #cbd2e1;
      opacity: 0.6;
      margin-top: 6px;
      font-weight: 500;
    }

    /* SECCIONES */
    .players {
      padding: 8px 16px 40px;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* CROMO DE JUGADOR */
    .player-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s;
    }
    .player-card:active { transform: scale(0.99); }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2a1b40 0%, #140f20 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffb2a8; /* Rose Gold */
      font-size: 0.9rem;
      font-weight: 800;
      border: 1px solid rgba(224, 137, 122, 0.3);
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.05);
    }

    .player-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .player-info p {
      color: var(--muted);
      opacity: 0.7;
      font-size: .75rem;
      margin-top: 1px;
    }

    .player-stats {
      text-align: right;
      background: rgba(45, 212, 191, 0.08);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(45, 212, 191, 0.2);
    }

    .player-stats h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--success);
      line-height: 1;
    }

    .player-stats p {
      color: var(--success);
      opacity: 0.9;
      font-size: .55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    /* CONTENEDOR GRÁFICO */
    .chart-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid var(--glass-border);
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 150px;
      margin-top: 36px;
      padding: 0 10px 20px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
    }

    .bar {
      width: 34px;
      background: linear-gradient(180deg, var(--purple-light) 0%, var(--purple) 100%);
      border-radius: 8px 8px 3px 3px;
      position: relative;
      min-height: 6px;
      box-shadow: 0 4px 15px rgba(0, 148, 214, 0.3);
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar .bar-value {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: 800;
      color: #ffffff;
      background: rgba(0, 148, 214, 0.25);
      backdrop-filter: blur(5px);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .bar .bar-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .68rem;
      color: var(--muted);
      font-weight: 700;
    }

    /* ESQUELETOS SHIMMER OSCUROS */
    .shimmer-container { padding: 20px 16px; }
    .shimmer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .shimmer-box { height: 96px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 20px; position: relative; overflow: hidden; }
    .shimmer-strip { height: 72px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 18px; margin-bottom: 10px; position: relative; overflow: hidden; }
    
    .shimmer-box::after, .shimmer-strip::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: translateX(-100%); animation: skeletonAnim 1.4s infinite;
    }
    @keyframes skeletonAnim { 100% { transform: translateX(100%); } }

    .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="ambient-glow">
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>
</div>

<header class="topbar">
  <div class="top-left">
    <div class="btn-back" onclick="window.location.href='index.html'">
      <i class="fa-solid fa-chevron-left text-sm"></i>
    </div>
    <div class="admin-info">
      <h1>Estadísticas Club</h1>
      <p>Nápoles F.C. · En Vivo</p>
    </div>
  </div>
  <div class="top-icon"><i class="fa-solid fa-chart-line"></i></div>
</header>

<div class="dashboard-container">
  <main id="mainContent">
    <!-- Esqueletos de carga inicial -->
    <div class="shimmer-container">
      <div class="shimmer-grid">
        <div class="shimmer-box"></div>
        <div class="shimmer-box"></div>
        <div class="shimmer-box"></div>
        <div class="shimmer-box"></div>
      </div>
      <div class="shimmer-strip"></div>
      <div class="shimmer-strip"></div>
    </div>
  </main>
</div>

<script>
// ==================== CONFIGURACIÓN BACKEND ====================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby1hZoGzUNJU5qQW8nZJk3HQ7m1zzRpMC6Cwe6oPhYnCcqO_vXFJccphDoeQJpz7CEO/exec';

if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// ==================== AUXILIARES DE PROCESAMIENTO ====================
async function fetchData(action) {
  const url = `${WEBAPP_URL}?action=${action}&t=${Date.now()}`;
  const resp = await fetch(url);
  return await resp.json();
}

function getGolesNapoles(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[0], 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

function getNombreCompleto(j) {
  let nombre = '';
  if (j.primerNombre) nombre += j.primerNombre;
  if (j.segundoNombre) nombre += ' ' + j.segundoNombre;
  if (j.apellidos) nombre += ' ' + j.apellidos;
  return nombre.trim() || 'Sin nombre';
}

function getIniciales(nombre) {
  if (!nombre) return '??';
  const partes = nombre.trim().split(' ');
  if (partes.length >= 2) {
    return (partes[0][0] + partes[1][0]).toUpperCase();
  }
  return nombre.substring(0, 2).toUpperCase();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// ==================== CARGA Y PROCESAMIENTO DE DATOS REALES ====================
async function cargarEstadisticas() {
  const container = document.getElementById('mainContent');
  try {
    // Consulta paralela idéntica a tu script original
    const [partidosData, jugadoresData] = await Promise.all([
      fetchData('getPartidos'),
      fetchData('getJugadores')
    ]);

    if (!partidosData.success && !jugadoresData.success) {
      throw new Error('No se recuperaron las colecciones de la BD');
    }

    const partidos = partidosData.data || [];
    const jugadores = jugadoresData.jugadores || [];

    let totalGoles = 0;
    let partidosJugados = 0;
    let victorias = 0;
    let empates = 0;
    let derrotas = 0;

    const golesPorMes = {};

    partidos.forEach(p => {
      const resultado = p.resultado || '';
      const golesNap = getGolesNapoles(resultado);
      totalGoles += golesNap;

      if (resultado && resultado !== 'VS' && resultado.includes('-')) {
        partidosJugados++;
        const golesRival = parseInt(resultado.split('-')[1], 10) || 0;
        if (golesNap > golesRival) victorias++;
        else if (golesNap < golesRival) derrotas++;
        else empates++;
      }

      if (p.fecha && golesNap > 0) {
        let fechaObj = (typeof p.fecha === 'string') ? new Date(p.fecha) : p.fecha;
        if (fechaObj instanceof Date && !isNaN(fechaObj.getTime())) {
          const mes = fechaObj.toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
          golesPorMes[mes] = (golesPorMes[mes] || 0) + golesNap;
        }
      }
    });

    const topGoleadores = [...jugadores]
      .filter(j => (j.goles || 0) > 0)
      .sort((a, b) => (b.goles || 0) - (a.goles || 0))
      .slice(0, 5);

    const mesesOrden = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    let mesesConDatos = Object.keys(golesPorMes);
    if (mesesConDatos.length === 0) {
      mesesConDatos = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY'];
    }
    const mesesMostrar = mesesOrden.filter(m => mesesConDatos.includes(m)).slice(-5);
    if (mesesMostrar.length === 0) mesesMostrar.push('JUN');

    const maxGoles = Math.max(...mesesMostrar.map(m => golesPorMes[m] || 0), 1);
    const alturaMaxima = 110; 

    // Renderizado del HTML con la estructura Bento Box Oscura Premium
    container.innerHTML = `
      <section class="summary">
        <div class="summary-card">
          <div class="card-meta">
            <p>Goles Club</p>
            <div class="card-icon-mini" style="background:rgba(56, 189, 248, 0.15); color:var(--purple-light);"><i class="fa-solid fa-soccer-ball"></i></div>
          </div>
          <h3>${totalGoles}</h3>
          <span class="card-subtext">Total anotados</span>
        </div>
        <div class="summary-card">
          <div class="card-meta">
            <p>Partidos</p>
            <div class="card-icon-mini" style="background:rgba(255,255,255,0.05); color:#cbd2e1;"><i class="fa-solid fa-calendar-alt"></i></div>
          </div>
          <h3>${partidosJugados}</h3>
          <span class="card-subtext">Disputados oficiales</span>
        </div>
        <div class="summary-card" style="border-left: 3px solid var(--success);">
          <div class="card-meta">
            <p>Victorias</p>
            <div class="card-icon-mini" style="background:rgba(45, 212, 191, 0.15); color:var(--success);"><i class="fa-solid fa-trophy"></i></div>
          </div>
          <h3 style="color: var(--success);">${victorias}</h3>
          <span class="card-subtext">Rendimiento positivo</span>
        </div>
        <div class="summary-card" style="border-left: 3px solid var(--danger);">
          <div class="card-meta">
            <p>Derrotas</p>
            <div class="card-icon-mini" style="background:rgba(244, 63, 94, 0.15); color:var(--danger);"><i class="fa-solid fa-circle-xmark"></i></div>
          </div>
          <h3 style="color: var(--danger);">${derrotas}</h3>
          <span class="card-subtext">Por corregir</span>
        </div>
      </section>

      <section class="players">
        <h2 class="section-title"><i class="fa-solid fa-crown" style="color: var(--gold)"></i> Máximos Goleadores</h2>
        
        ${topGoleadores.length === 0 ? '<div style="text-align:center; padding:30px; color:var(--muted); opacity:0.6; font-size:0.9rem;">No hay registros de goles asignados.</div>' : ''}
        
        ${topGoleadores.map(j => `
          <div class="player-card">
            <div class="player-left">
              <div class="player-avatar">${getIniciales(getNombreCompleto(j))}</div>
              <div class="player-info">
                <h3>${escapeHtml(getNombreCompleto(j))}</h3>
                <p>${j.dorsal ? `Dorsal ${j.dorsal}` : 'Sin Dorsal'}</p>
              </div>
            </div>
            <div class="player-stats">
              <h4>${j.goles || 0}</h4>
              <p>Goles</p>
            </div>
          </div>
        `).join('')}

        <div class="chart-card">
          <h2 class="section-title" style="margin:0;"><i class="fa-solid fa-chart-bar" style="color:var(--purple-light);"></i> Rendimiento Mensual</h2>
          <div class="chart-bars">
            ${mesesMostrar.map(mes => {
              const goles = golesPorMes[mes] || 0;
              const altura = (goles / maxGoles) * alturaMaxima;
              return `
                <div class="bar" style="height: ${altura}px;">
                  <span class="bar-value">${goles}</span>
                  <span class="bar-label">${mes}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </section>
    `;
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error-msg">❌ No se pudo conectar con la base de datos de Google. Revisa tu WebApp URL.</div>`;
  }
}

// Inicializar ejecución al cargar la ventana
window.onload = cargarEstadisticas;
</script>
</body>
</html>
