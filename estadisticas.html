<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Nápoles F.C. | Estadísticas &amp; Rendimiento</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #b89329; /* Oro Nápoles */
      --purple: #0094d6; /* Azul Nápoles */
      --purple-light: #38bdf8;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Inter', sans-serif;
      min-height: max(884px, 100dvh);
    }
    .custom-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .chart-bar {
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .shimmer-box { position: relative; overflow: hidden; background: rgba(0,0,0,0.05); }
    .shimmer-box::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: translateX(-100%); animation: skeletonAnim 1.4s infinite;
    }
    @keyframes skeletonAnim { 100% { transform: translateX(100%); } }
  </style>

  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#f8fafc",
            "primary": "#0094d6",
            "secondary": "#b89329",
            "surface": "#ffffff",
            "on-surface": "#1e293b",
            "on-surface-variant": "#64748b"
          },
          spacing: {
            "sm": "8px", "lg": "24px", "xl": "32px", "md": "16px",
            "margin-mobile": "16px", "margin-desktop": "40px", "gutter": "24px"
          },
          fontFamily: {
            "label-bold": ["Inter"],
            "headline-md": ["Outfit"],
            "headline-lg": ["Outfit"],
            "display-lg": ["Outfit"],
            "body-md": ["Inter"]
          }
        }
      }
    }
  </script>
</head>

<body class="pb-24">

<!-- Top App Bar Clásico Claro -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200 h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center shadow-[0_4px_12px_rgba(0,148,214,0.2)] hover:scale-105 active:scale-95 transition-transform" onclick="window.location.href='index.html'" style="cursor:pointer;">
      <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
    </div>
    <div>
      <h1 class="font-headline-md text-xl font-bold leading-none text-slate-900">Estadísticas Club</h1>
      <p class="text-[10px] font-label-bold uppercase tracking-widest text-secondary mt-0.5 font-bold">Nápoles F.C. • Panel Oficial</p>
    </div>
  </div>
  <button onclick="cargarEstadisticas()" class="w-10 h-10 rounded-full custom-card flex items-center justify-center hover:scale-105 active:scale-95 transition-all text-slate-600 bg-white">
    <span class="material-symbols-outlined">sync</span>
  </button>
</header>

<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto space-y-xl" id="mainContent">
  <!-- Skeletons Claros por defecto -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-md">
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
    <div class="shimmer-box h-32 rounded-xl"></div>
  </section>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl">
    <div class="lg:col-span-5 space-y-sm shimmer-box h-96 rounded-xl"></div>
    <div class="lg:col-span-7 shimmer-box h-96 rounded-xl"></div>
  </div>
</main>

<script>
// ==================== CONFIGURACIÓN ====================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby1hZoGzUNJU5qQW8nZJk3HQ7m1zzRpMC6Cwe6oPhYnCcqO_vXFJccphDoeQJpz7CEO/exec';

if (localStorage.getItem('admin_activo') !== 'true') {
  window.location.href = './login.html';
}

// ==================== LECTOR FLEXIBLE DE PROPIEDADES ====================
function buscarPropiedad(objeto, posiblesNombres) {
  if (!objeto) return null;
  for (let nombre of posiblesNombres) {
    if (objeto.hasOwnProperty(nombre)) return objeto[nombre];
    let claveMin = Object.keys(objeto).find(k => k.toLowerCase() === nombre.toLowerCase().trim());
    if (claveMin) return objeto[claveMin];
  }
  return null;
}

async function fetchData(action) {
  const url = `${WEBAPP_URL}?action=${action}&t=${Date.now()}`;
  const resp = await fetch(url);
  return await resp.json();
}

// Extrae los goles del Nápoles F.C (Primer valor antes del guión)
function getGolesFavor(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[0].trim(), 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

// Extrae los goles recibidos (Segundo valor después del guión)
function getGolesContra(resultado) {
  if (!resultado || resultado === 'VS') return 0;
  const partes = resultado.toString().split('-');
  if (partes.length === 2) {
    const goles = parseInt(partes[1].trim(), 10);
    return isNaN(goles) ? 0 : goles;
  }
  return 0;
}

function getNombreCompleto(j) {
  let pNombre = buscarPropiedad(j, ['primerNombre', 'primernombre', 'nombre']) || '';
  let sNombre = buscarPropiedad(j, ['segundoNombre', 'segundonombre']) || '';
  let apellidos = buscarPropiedad(j, ['apellidos', 'apellido']) || '';
  
  let nombre = `${pNombre} ${sNombre} ${apellidos}`;
  return nombre.replace(/\s+/g, ' ').trim() || 'Jugador Sin Nombre';
}

function getIniciales(nombre) {
  if (!nombre || nombre === 'Jugador Sin Nombre') return 'NP';
  const partes = nombre.trim().split(' ');
  if (partes.length >= 2) {
    return (partes[0][0] + partes[1][0]).toUpperCase();
  }
  return nombre.substring(0, 2).toUpperCase();
}

// ==================== CARGA Y CONSTRUCCIÓN FINAL ====================
async function cargarEstadisticas() {
  const container = document.getElementById('mainContent');
  try {
    const [partidosData, jugadoresData] = await Promise.all([
      fetchData('getPartidos'),
      fetchData('getJugadores')
    ]);

    // Adaptación a la estructura real de tu JSON de Apps Script
    const partidos = partidosData.data || partidosData.partidos || (Array.isArray(partidosData) ? partidosData : []);
    const jugadores = jugadoresData.jugadores || jugadoresData.data || (Array.isArray(jugadoresData) ? jugadoresData : []);

    let totalGolesFavor = 0;
    let totalGolesContra = 0;
    let partidosJugados = 0;
    let victorias = 0;
    let empates = 0;
    let derrotas = 0;

    const golesPorMes = {};

    partidos.forEach(p => {
      const resultado = buscarPropiedad(p, ['resultado', 'Resultado', 'res', 'goles']) || '';
      
      if (resultado && resultado !== 'VS' && resultado.toString().includes('-')) {
        partidosJugados++;
        const gf = getGolesFavor(resultado);
        const gc = getGolesContra(resultado);
        
        totalGolesFavor += gf;
        totalGolesContra += gc;

        if (gf > gc) victorias++;
        else if (gf < gc) derrotas++;
        else empates++;

        // Agrupación mensual para la gráfica gráfica
        const fechaRaw = buscarPropiedad(p, ['fecha', 'Fecha']);
        if (fechaRaw) {
          let fechaObj = (typeof fechaRaw === 'string') ? new Date(fechaRaw) : fechaRaw;
          if (fechaObj instanceof Date && !isNaN(fechaObj.getTime())) {
            const mes = fechaObj.toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
            golesPorMes[mes] = (golesPorMes[mes] || 0) + gf;
          }
        }
      }
    });

    // Procesar lista de goleadores e inyectar avatares dinámicos basados en la cédula
    const topGoleadores = [...jugadores]
      .map(j => {
        const golesNum = parseInt(buscarPropiedad(j, ['goles', 'Goles', 'golesTotales', 'g']), 10) || 0;
        const dorsalNum = buscarPropiedad(j, ['dorsal', 'Dorsal', 'numero', 'd']);
        const cedulaNum = buscarPropiedad(j, ['cedula', 'Cedula', 'ci', 'identificacion', 'id']);
        
        // Generar la ruta exacta solicitada: NAPOLES-FC/imagen/avatar/[CEDULA].png
        const avatarUrl = cedulaNum ? `NAPOLES-FC/imagen/avatar/${cedulaNum.toString().trim()}.png` : null;

        return { 
          ...j, 
          golesCalculados: golesNum, 
          dorsalCalculado: dorsalNum,
          avatarCalculado: avatarUrl
        };
      })
      // Muestra a todos si no hay goles para que la lista no salga vacía por error de mapeo
      .sort((a, b) => b.golesCalculados - a.golesCalculados)
      .slice(0, 5);

    // Configuración del eje de tiempo de la gráfica
    const mesesOrden = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    let mesesConDatos = Object.keys(golesPorMes);
    if (mesesConDatos.length === 0) {
      const mesActual = new Date().toLocaleString('es-ES', { month: 'short' }).toUpperCase().replace('.', '');
      golesPorMes[mesActual] = totalGolesFavor;
      mesesConDatos = [mesActual];
    }
    
    const mesesMostrar = mesesOrden.filter(m => mesesConDatos.includes(m));
    if(mesesMostrar.length === 0) mesesMostrar.push('JUN');

    const maxGoles = Math.max(...mesesMostrar.map(m => golesPorMes[m] || 0), 1);
    const alturaMaxima = 240;

    container.innerHTML = `
      <!-- Fila Superior de Tarjetas Integrales -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-md">
        <!-- Goles a Favor -->
        <div class="custom-card p-md rounded-xl relative overflow-hidden group bg-white">
          <div class="absolute -right-4 -top-4 opacity-5">
            <span class="material-symbols-outlined text-8xl text-primary">sports_soccer</span>
          </div>
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Goles a Favor</p>
          <p class="font-display-lg text-4xl font-extrabold text-primary">${totalGolesFavor}</p>
          <p class="text-[11px] text-emerald-600 mt-2 font-medium">⚽ Marcados en liga</p>
        </div>
        
        <!-- Goles en Contra (¡Añadido!) -->
        <div class="custom-card p-md rounded-xl relative overflow-hidden bg-white border-l-4 border-amber-500">
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Goles en Contra</p>
          <p class="font-display-lg text-4xl font-extrabold text-amber-600">${totalGolesContra}</p>
          <p class="text-[11px] text-slate-400 mt-2">Goles recibidos en arco</p>
        </div>
        
        <!-- Victorias / Balance -->
        <div class="custom-card p-md rounded-xl border-l-4 border-emerald-500 bg-white">
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Partidos Ganados</p>
          <p class="font-display-lg text-4xl font-extrabold text-emerald-600">${victorias}</p>
          <p class="text-[12px] text-slate-400 mt-2">De ${partidosJugados} disputados</p>
        </div>
        
        <!-- Derrotas / Empates -->
        <div class="custom-card p-md rounded-xl border-l-4 border-rose-500 bg-white">
          <p class="font-label-bold text-[12px] uppercase text-slate-500 mb-1 font-bold">Partidos Perdidos</p>
          <p class="font-display-lg text-4xl font-extrabold text-rose-600">${derrotas}</p>
          <p class="text-[12px] text-slate-400 mt-2">Empates registrados: ${empates}</p>
        </div>
      </section>

      <!-- Distribución Principal -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl">
        
        <!-- Panel de Goleadores con Fotos por Cédula -->
        <section class="lg:col-span-5 space-y-md">
          <div class="flex items-center justify-between px-2">
            <h2 class="font-headline-md text-slate-800 flex items-center gap-2 text-lg font-bold">
              <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">stars</span>
              Goleadores del Plantel
            </h2>
            <span class="text-xs font-label-bold text-slate-400 uppercase font-bold">Goles</span>
          </div>
          
          <div class="space-y-sm">
            ${topGoleadores.length === 0 ? '<div class="custom-card p-6 text-center text-slate-400 text-sm rounded-xl bg-white">No hay jugadores disponibles en la hoja actual.</div>' : ''}
            
            ${topGoleadores.map((j, index) => {
              const nombreCompleto = getNombreCompleto(j);
              const iniciales = getIniciales(nombreCompleto);
              const esPrimero = index === 0;
              
              return `
                <div class="custom-card p-4 rounded-xl flex items-center justify-between bg-white ${esPrimero ? 'border-l-4 border-secondary shadow-sm' : ''} hover:bg-slate-50 transition-all">
                  <div class="flex items-center gap-4">
                    <div class="relative">
                      <!-- Contenedor del Avatar -->
                      <div class="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center font-bold text-sm bg-slate-100 border ${esPrimero ? 'border-secondary' : 'border-slate-200'} text-primary shadow-inner">
                        ${j.avatarCalculado ? `
                          <img src="${j.avatarCalculado}" 
                               alt="${escapeHtml(nombreCompleto)}" 
                               class="w-full h-full object-cover"
                               onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-slate-400\'>${iniciales}</span>';">
                        ` : `<span>${iniciales}</span>`}
                      </div>
                      ${esPrimero ? `<div class="absolute -top-2 -left-2 bg-secondary text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow uppercase">PICHICHI</div>` : ''}
                    </div>
                    <div>
                      <p class="font-headline-md text-base text-slate-800 font-bold leading-tight">${escapeHtml(nombreCompleto)}</p>
                      <p class="text-xs font-label-bold text-slate-400 uppercase font-bold mt-0.5">${j.dorsalCalculado ? `Camiseta #${j.dorsalCalculado}` : 'Sin Dorsal'}</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="font-display-lg text-2xl font-black text-slate-800">${j.golesCalculados}</p>
                    <p class="text-[9px] font-label-bold text-slate-400 uppercase tracking-tighter font-bold">Anotados</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Gráfico del Rendimiento Mensual -->
        <section class="lg:col-span-7 space-y-md">
          <div class="flex items-center justify-between px-2">
            <h2 class="font-headline-md text-slate-800 text-lg font-bold flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">chart_data</span>
              Progresión Ofensiva
            </h2>
            <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-bold tracking-wider uppercase">Actualizado en vivo</span>
          </div>
          
          <div class="custom-card p-xl rounded-2xl h-[400px] flex flex-col justify-end bg-white">
            <div class="flex-grow flex items-end justify-around gap-2 md:gap-4 mb-4 border-b border-slate-100 pb-2">
              ${mesesMostrar.map(mes => {
                const goles = golesPorMes[mes] || 0;
                const altura = (goles / maxGoles) * alturaMaxima;
                return `
                  <div class="flex flex-col items-center gap-2 group w-full max-w-[48px]">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 text-white px-2 py-1 rounded text-[10px] font-bold shadow text-center min-w-[28px]">
                      ${goles}
                    </div>
                    <div class="chart-bar w-full bg-gradient-to-t from-primary to-sky-400 rounded-t-lg shadow-sm" style="height: ${altura}px;"></div>
                    <span class="text-[10px] font-label-bold text-slate-500 font-bold">${mes}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      </div>
    `;
  } catch (error) {
    console.error(error);
    container.innerHTML = `
      <div class="custom-card p-8 rounded-xl text-center max-w-md mx-auto border-rose-300 bg-white">
        <p class="text-rose-600 font-bold mb-2">❌ Error detectado al procesar la Base de Datos</p>
        <p class="text-xs text-slate-500">Asegúrate de que las columnas 'Resultado' (ej: 3-1) y 'Cedula' existan y contengan datos válidos en tu Google Sheets.</p>
      </div>`;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Ejecutar sincronización al renderizar el DOM
document.addEventListener("DOMContentLoaded", cargarEstadisticas);
</script>
</body>
</html>
