<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estadísticas - Nápoles F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f3f6fb;
    color: #111827;
    min-height: 100vh;
    overflow-x: hidden;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.admin-info h1 {
    font-size: 1.1rem;
    font-weight: 800;
}

.admin-info p {
    font-size: .85rem;
    color: #6b7280;
    margin-top: 2px;
}

.avatar {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    background: linear-gradient(135deg, #db2777, #f472b6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
}

.summary {
    padding: 20px 18px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.summary-card {
    background: #fff;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(15,23,42,.05);
}

.summary-card h3 {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 6px;
    color: #db2777;
}

.summary-card p {
    color: #6b7280;
    font-size: .88rem;
}

.players {
    padding: 14px 18px 40px;
}

.section-title {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 14px;
}

.player-card {
    background: #fff;
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(15,23,42,.05);
}

.player-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.player-avatar {
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, #db2777, #f472b6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    text-transform: uppercase;
}

.player-info h3 {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 4px;
}

.player-info p {
    color: #6b7280;
    font-size: .86rem;
}

.player-stats {
    text-align: right;
}

.player-stats h4 {
    font-size: 1.4rem;
    font-weight: 900;
    color: #db2777;
}

.player-stats p {
    color: #6b7280;
    font-size: .82rem;
}

.chart-card {
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(15,23,42,.05);
}

.chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 180px;
    margin-top: 20px;
}

.bar {
    width: 18%;
    background: linear-gradient(180deg, #f472b6, #db2777);
    border-radius: 14px 14px 6px 6px;
    position: relative;
    transition: height 0.5s ease;
}

.bar span {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .78rem;
    color: #6b7280;
    font-weight: 700;
}

.loading, .error-message {
    text-align: center;
    padding: 60px 20px;
    color: #6b7280;
    font-weight: 500;
}

@media(min-width:700px) {
    .summary, .players {
        max-width: 700px;
        margin: auto;
    }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="top-left">
        <div class="admin-info">
            <h1>Estadísticas</h1>
            <p>Nápoles F.C. · Datos reales del club</p>
        </div>
    </div>
    <div class="avatar">E</div>
</header>

<main id="mainContent">
    <div class="loading">Cargando estadísticas...</div>
</main>

<script>
// ==================== CONFIGURACIÓN ====================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby1hZoGzUNJU5qQW8nZJk3HQ7m1zzRpMC6Cwe6oPhYnCcqO_vXFJccphDoeQJpz7CEO/exec';

// Verificar admin activo
if (localStorage.getItem('admin_activo') !== 'true') {
    window.location.href = './login.html';
}

// ==================== FUNCIONES AUXILIARES ====================
async function fetchData(action) {
    const url = `${WEBAPP_URL}?action=${action}&t=${Date.now()}`;
    const resp = await fetch(url);
    return await resp.json();
}

// Extraer goles de Nápoles de un resultado (formato "3-1" -> 3)
function getGolesNapoles(resultado) {
    if (!resultado || resultado === 'VS') return 0;
    const partes = resultado.toString().split('-');
    if (partes.length === 2) {
        const goles = parseInt(partes[0], 10);
        return isNaN(goles) ? 0 : goles;
    }
    return 0;
}

// Obtener nombre completo del jugador
function getNombreCompleto(j) {
    let nombre = '';
    if (j.primerNombre) nombre += j.primerNombre;
    if (j.segundoNombre) nombre += ' ' + j.segundoNombre;
    if (j.apellidos) nombre += ' ' + j.apellidos;
    return nombre.trim() || 'Sin nombre';
}

// ==================== CARGA Y RENDERIZADO ====================
async function cargarEstadisticas() {
    const container = document.getElementById('mainContent');
    try {
        // Cargar partidos y jugadores en paralelo
        const [partidosData, jugadoresData] = await Promise.all([
            fetchData('getPartidos'),
            fetchData('getJugadores')
        ]);

        if (!partidosData.success && !jugadoresData.success) {
            throw new Error('No se pudieron cargar los datos');
        }

        const partidos = partidosData.data || [];
        const jugadores = jugadoresData.jugadores || [];

        // 1. Calcular estadísticas generales
        let totalGoles = 0;
        let partidosJugados = 0;
        let victorias = 0;
        let empates = 0;
        let derrotas = 0;

        // Para el gráfico mensual: agrupar goles por mes (últimos 5 meses o todos)
        const golesPorMes = {};

        partidos.forEach(p => {
            const resultado = p.resultado || '';
            const golesNap = getGolesNapoles(resultado);
            totalGoles += golesNap;

            // Solo contar partidos que tienen resultado y estado = FINALIZADO o cualquier con resultado válido
            if (resultado && resultado !== 'VS' && resultado.includes('-')) {
                partidosJugados++;
                const golesRival = parseInt(resultado.split('-')[1], 10) || 0;
                if (golesNap > golesRival) victorias++;
                else if (golesNap < golesRival) derrotas++;
                else empates++;
            }

            // Agrupar por mes (fecha)
            if (p.fecha && golesNap > 0) {
                let fechaObj;
                if (typeof p.fecha === 'string') {
                    fechaObj = new Date(p.fecha);
                } else if (p.fecha instanceof Date) {
                    fechaObj = p.fecha;
                } else {
                    return;
                }
                if (!isNaN(fechaObj.getTime())) {
                    const mes = fechaObj.toLocaleString('es-ES', { month: 'short' }).toUpperCase();
                    golesPorMes[mes] = (golesPorMes[mes] || 0) + golesNap;
                }
            }
        });

        // 2. Top goleadores (de la lista de jugadores, ordenar por goles)
        const topGoleadores = [...jugadores]
            .filter(j => (j.goles || 0) > 0)
            .sort((a, b) => (b.goles || 0) - (a.goles || 0))
            .slice(0, 5);

        // 3. Preparar datos para el gráfico (últimos 5 meses o los que existan)
        const mesesOrden = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
        let mesesConDatos = Object.keys(golesPorMes);
        // Si no hay datos mensuales, mostrar meses por defecto
        if (mesesConDatos.length === 0) {
            mesesConDatos = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY'];
        }
        // Tomar hasta 5 meses (los más recientes según orden de meses)
        const mesesMostrar = mesesOrden.filter(m => mesesConDatos.includes(m)).slice(-5);
        if (mesesMostrar.length === 0) mesesMostrar.push('ENE');

        const maxGoles = Math.max(...mesesMostrar.map(m => golesPorMes[m] || 0), 1);
        const alturaMaxima = 150; // altura máxima de la barra en px

        // Construir HTML
        container.innerHTML = `
            <section class="summary">
                <div class="summary-card"><h3>${totalGoles}</h3><p>⚽ Goles Totales</p></div>
                <div class="summary-card"><h3>${partidosJugados}</h3><p>📅 Partidos Jugados</p></div>
                <div class="summary-card"><h3>${victorias}</h3><p>🏆 Victorias</p></div>
                <div class="summary-card"><h3>${empates}</h3><p>🤝 Empates</p></div>
            </section>

            <section class="players">
                <h2 class="section-title">⭐ Máximos Goleadores</h2>
                ${topGoleadores.length === 0 ? '<div class="loading">Sin datos de goleadores aún.</div>' : ''}
                ${topGoleadores.map(j => `
                    <div class="player-card">
                        <div class="player-left">
                            <div class="player-avatar">${getIniciales(getNombreCompleto(j))}</div>
                            <div class="player-info">
                                <h3>${getNombreCompleto(j)}</h3>
                                <p>${j.dorsal ? `Dorsal ${j.dorsal}` : 'Jugador'}</p>
                            </div>
                        </div>
                        <div class="player-stats">
                            <h4>${j.goles || 0}</h4>
                            <p>Goles</p>
                        </div>
                    </div>
                `).join('')}

                <div class="chart-card">
                    <h2 class="section-title">📊 Goles por Mes</h2>
                    <div class="chart-bars">
                        ${mesesMostrar.map(mes => {
                            const goles = golesPorMes[mes] || 0;
                            const altura = (goles / maxGoles) * alturaMaxima;
                            return `
                                <div class="bar" style="height: ${altura}px;">
                                    <span>${mes}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${mesesMostrar.length === 1 && golesPorMes[mesesMostrar[0]] === 0 ? '<p style="text-align:center; margin-top:40px; color:#6b7280;">Aún no hay partidos finalizados con goles.</p>' : ''}
                </div>
            </section>
        `;
    } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="error-message">❌ Error al cargar estadísticas. Revisa la conexión con el servidor.</div>`;
    }
}

function getIniciales(nombre) {
    if (!nombre) return '??';
    const partes = nombre.trim().split(' ');
    if (partes.length >= 2) {
        return (partes[0][0] + partes[1][0]).toUpperCase();
    }
    return nombre.substring(0, 2).toUpperCase();
}

cargarEstadisticas();
</script>
</body>
</html>
